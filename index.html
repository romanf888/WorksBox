          const [showOnboarding, setShowOnboarding] = useState(!localStorage.getItem('wb_selected_school') || !localStorage.getItem('wb_selected_class'));

          // Gestion de l'acceptation obligatoire des conditions d'utilisation au démarrage
          const [hasAcceptedTerms, setHasAcceptedTerms] = useState(() => localStorage.getItem('wb_terms_accepted') === 'true');
          const [termsAgreementChecked, setTermsAgreementChecked] = useState(false);

          const [favorites, setFavorites] = useState(() => {
              const saved = localStorage.getItem('worksbox_favs');
              return saved ? JSON.parse(saved) : [];
          });

          const [toast, setToast] = useState(null);

          const showToast = (message, type = 'success', icon = null) => {
              setToast({ id: Date.now(), message, type, icon });
          };

          const hideToast = () => {
              setToast(null);
          };

          const copyToClipboard = async (text, label = "Lien copié dans le presse-papiers !") => {
              if (!text) return;
              try {
                  if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
                      await navigator.clipboard.writeText(text);
                  } else {
                      const textarea = document.createElement('textarea');
                      textarea.value = text;
                      textarea.style.position = 'fixed';
                      textarea.style.opacity = '0';
                      document.body.appendChild(textarea);
                      textarea.select();
                      document.execCommand('copy');
                      document.body.removeChild(textarea);
                  }
                  showToast(label, 'success', 'copy');
              } catch (err) {
                  showToast("Impossible de copier dans le presse-papiers", "warning", "warning");
              }
          };

          const shareCourse = (course) => {
              if (!course) return;
              try {
                  const url = new URL(window.location.origin + window.location.pathname);
                  url.searchParams.set('course', course.id);
                  const directUrl = url.toString();
                  copyToClipboard(directUrl, `Lien direct vers « ${course.title} » copié !`);
              } catch (e) {
                  const directUrl = `${window.location.origin}${window.location.pathname}?course=${encodeURIComponent(course.id)}`;
                  copyToClipboard(directUrl, `Lien direct vers « ${course.title} » copié !`);
              }
          };

          const copyCourseLink = (course) => {
              if (!course) return;
              shareCourse(course);
          };

          useEffect(() => { 
              localStorage.setItem('worksbox_favs', JSON.stringify(favorites)); 
          }, [favorites]);

          const toggleFav = async (courseId) => {
              // Si l'utilisateur n'est pas connecté, demander la connexion pour utiliser les favoris
              if (!activeUser) {
                  showToast("Veuillez vous connecter pour enregistrer vos favoris", "warning", "warning");
                  setShowAuthModal(true);
                  return;
              }

              const isAdding = !favorites.includes(courseId);
              const targetCourse = courses.find(c => c.id === courseId);
              const courseTitle = targetCourse?.title ? `« ${targetCourse.title} »` : "Le cours";

              const newFavs = isAdding
                  ? [...favorites, courseId]
                  : favorites.filter(id => id !== courseId);
              setFavorites(newFavs);

              if (isAdding) {
                  showToast(`${courseTitle} ajouté à vos favoris`, "success", "star");
              } else {
                  showToast(`${courseTitle} retiré de vos favoris`, "info", "info");
              }

              if (localUser) {
                  const updatedLocal = { ...localUser, favorites: newFavs };
                  setLocalUser(updatedLocal);
                  localStorage.setItem('worksbox_local_user', JSON.stringify(updatedLocal));
              }

              if (user && !user.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', user.uid);
                      await setDoc(userRef, { 
                          favorites: newFavs, 
                          updatedAt: new Date().toISOString() 
                      }, { merge: true });
                  } catch (e) {
                      handleFirestoreError(e, OperationType.UPDATE, `users/${user.uid}`);
                  }
              }
          };

          const handleLocalSignIn = (name) => {
              const cleanName = (name || '').trim() || 'Élève WorksBox';
              const newLocalProfile = {
                  uid: 'local_' + Date.now(),
                  displayName: cleanName,
                  email: cleanName.toLowerCase().replace(/[^a-z0-9]/g, '') + '@eleve.worksbox',
                  selectedSchool: selectedSchool || 'Lycée François Bazin',
                  selectedClass: selectedClass || 'Terminale STI2D',
                  favorites: favorites,
                  isLocal: true,
                  createdAt: new Date().toISOString()
              };
              localStorage.setItem('worksbox_local_user', JSON.stringify(newLocalProfile));
              localStorage.setItem('wb_student_name', cleanName);
              setLocalUser(newLocalProfile);
              setUserProfile(newLocalProfile);
              setShowAuthModal(false);
              setAuthError(null);
          };

          const handleSaveCompletedProfile = async (profileData) => {
              const targetUser = pendingSetupUser || user || activeUser;
              const targetUid = targetUser?.uid;
              const targetEmail = targetUser?.email;
              if (!targetUid) return;

              if (userDb) {
                  try {
                      const userRef = doc(userDb, 'users', targetUid);
                      const snap = await getDoc(userRef);
                      const existingData = snap.exists() ? snap.data() : {};
                      const mergedFavs = Array.from(new Set([...(existingData.favorites || []), ...favorites]));

                      const profilePayload = {
                          id: targetUid,
                          email: targetEmail || '',
                          displayName: profileData.displayName,
                          photoURL: profileData.photoURL || '',
                          selectedSchool: profileData.selectedSchool || selectedSchool || 'Lycée François Bazin',
                          selectedClass: profileData.selectedClass || selectedClass || 'Terminale STI2D',
                          favorites: mergedFavs,
                          setupCompleted: true,
                          driveLinked: true,
                          createdAt: existingData.createdAt || new Date().toISOString(),
                          updatedAt: new Date().toISOString()
                      };

                      await setDoc(userRef, profilePayload, { merge: true });

                      try {
                          const logId = `log-auth-${Date.now()}`;
                          const logRef = doc(userDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'activityLogs', logId);
                          await setDoc(logRef, {
                              id: logId,
                              type: 'AUTH',
                              action: `Connexion & Profil configuré pour « ${profileData.displayName} » (${profileData.selectedClass})`,
                              userEmail: targetEmail || '',
                              timestamp: new Date().toISOString()
                          });
                      } catch (_) {}

                      setUserProfile(profilePayload);
                      setFavorites(mergedFavs);
                      if (profileData.selectedSchool) {
                          setSelectedSchool(profileData.selectedSchool);
                          localStorage.setItem('wb_selected_school', profileData.selectedSchool);
                      }
                      if (profileData.selectedClass) {
                          setSelectedClass(profileData.selectedClass);
                          localStorage.setItem('wb_selected_class', profileData.selectedClass);
                      }
                      setShowProfileSetupModal(false);
                      setPendingSetupUser(null);
                      showToast(`Bienvenue ${profileData.displayName} ! Votre profil a été enregistré avec succès.`, "success", "check");
                  } catch (err) {
                      handleFirestoreError(err, OperationType.WRITE, `users/${targetUid}`);
                      throw err;
                  }
              }
          };

          const handleGoogleSignIn = async () => {
              if (!auth) {
                  setAuthError({ code: 'auth/not-initialized', message: 'Le service d\'authentification Firebase n\'est pas encore prêt.' });
                  return;
              }
              setAuthLoading(true);
              setAuthError(null);
              try {
                  const provider = new GoogleAuthProvider();
                  provider.addScope('https://www.googleapis.com/auth/drive.file');
                  provider.addScope('https://www.googleapis.com/auth/drive');
                  provider.setCustomParameters({ prompt: 'select_account' });
                  const cred = await signInWithPopup(auth, provider);
                  const currentUser = cred.user;
                  const token = GoogleAuthProvider.credentialFromResult(cred)?.accessToken;
                  if (token) {
                      updateDriveToken(token);
                      await loadWorksBoxCloudFiles(token, true);
                  }
                  
                  if (userDb && currentUser) {
                      try {
                          const userRef = doc(userDb, 'users', currentUser.uid);
                          const snap = await getDoc(userRef);
                          const existingData = snap.exists() ? snap.data() : {};
                          
                          if (snap.exists() && existingData.setupCompleted && existingData.displayName) {
                              // Profile setup is already completed: log in directly
                              const mergedFavs = Array.from(new Set([...(existingData.favorites || []), ...favorites]));
                              const newSchool = selectedSchool || existingData.selectedSchool || 'Lycée François Bazin';
                              const newClass = selectedClass || existingData.selectedClass || 'Terminale STI2D';
                              
                              const profilePayload = {
                                  id: currentUser.uid,
                                  email: currentUser.email || '',
                                  displayName: existingData.displayName,
                                  photoURL: existingData.photoURL || '',
                                  selectedSchool: newSchool,
                                  selectedClass: newClass,
                                  favorites: mergedFavs,
                                  setupCompleted: true,
                                  driveLinked: true,
                                  createdAt: existingData.createdAt || new Date().toISOString(),
                                  updatedAt: new Date().toISOString()
                              };
                              await setDoc(userRef, profilePayload, { merge: true });
                              setUserProfile(profilePayload);
                              setFavorites(mergedFavs);
                              if (newSchool) { setSelectedSchool(newSchool); localStorage.setItem('wb_selected_school', newSchool); }
                              if (newClass) { setSelectedClass(newClass); localStorage.setItem('wb_selected_class', newClass); }
                              setShowAuthModal(false);
                              showToast(`Bon retour ${profilePayload.displayName} !`, "success", "check");
                          } else {
                              // Account creation required: trigger Profile Setup Modal
                              setPendingSetupUser({
                                  uid: currentUser.uid,
                                  email: currentUser.email || '',
                                  displayName: currentUser.displayName || '',
                                  photoURL: currentUser.photoURL || ''
                              });
                              setShowAuthModal(false);
                              setShowProfileSetupModal(true);
                          }
                      } catch (err) {
                          handleFirestoreError(err, OperationType.WRITE, `users/${currentUser.uid}`);
                      }
                  }
                  localStorage.removeItem('worksbox_local_user');
                  setLocalUser(null);
              } catch (err) {
                  const errorCode = err?.code || '';
                  const errorMessage = err?.message || '';

                  if (errorCode === 'auth/unauthorized-domain' || errorMessage.includes('unauthorized-domain')) {
                      console.warn('Firebase Auth (auth/unauthorized-domain): Le domaine actuel n\'est pas encore dans les Domaines autorisés de la console Firebase (projet lycee-share) :', window.location.hostname);
                      setAuthError({
                          code: 'auth/unauthorized-domain',
                          domain: window.location.hostname,
                          message: `Le domaine "${window.location.hostname}" n'est pas encore autorisé dans Firebase pour la connexion Google OAuth.`
                      });
                  } else if (errorCode === 'auth/operation-not-allowed' || errorMessage.includes('operation-not-allowed')) {
                      console.warn('Firebase Auth (auth/operation-not-allowed): Le fournisseur Google n\'est pas activé dans le projet Firebase lycee-share.');
                      setAuthError({
                          code: 'auth/operation-not-allowed',
                          message: 'La connexion avec Google n\'est pas encore activée dans la console Firebase pour le projet lycee-share.'
                      });
                  } else if (errorCode === 'auth/popup-closed-by-user') {
                      console.warn('Firebase Auth: La fenêtre de connexion Google a été fermée.');
                      setAuthError({
                          code: errorCode,
                          message: 'La fenêtre de connexion Google a été fermée avant la fin.'
                      });
                  } else if (errorCode === 'auth/popup-blocked') {
                      console.warn('Firebase Auth: La popup a été bloquée par le navigateur.');
                      setAuthError({
                          code: errorCode,
                          message: 'La popup de connexion a été bloquée par votre navigateur. Autorisez les popups ou ouvrez dans un nouvel onglet.'
                      });
                  } else {
                      console.warn('Firebase Auth: Erreur lors de la tentative de connexion Google :', err);
                      setAuthError({
                          code: errorCode || 'unknown',
                          message: errorMessage || 'Impossible de se connecter avec Google.'
                      });
                  }
              } finally {
                  setAuthLoading(false);
              }
          };

          const handleSignOut = async () => {
              try {
                  if (auth && user) {
                      await signOut(auth);
                  }
                  localStorage.removeItem('worksbox_local_user');
                  updateDriveToken(null);
                  try {
                      localStorage.removeItem('worksbox_cloud_folder_id');
                      localStorage.removeItem('worksbox_cached_cloud_files');
                      localStorage.removeItem('worksbox_cached_cloud_storage_used');
                  } catch(e) {}
                  setCloudFolderId(null);
                  setCloudFiles([]);
                  setCloudStorageUsed(0);
                  setUser(null);
                  setLocalUser(null);
                  setUserProfile(null);
                  setPendingSetupUser(null);
                  setShowProfileSetupModal(false);
                  setShowAccountModal(false);
              } catch (err) {
                  console.error('Sign out error:', err);
              }
          };

          useEffect(() => {
            if (!auth) {
              setIsLoading(false);
              return;
            }
            const fallbackTimer = setTimeout(() => {
              setIsLoading(false);
            }, 2500);

            const unsubAuth = onAuthStateChanged(auth, async (u) => {
              setUser(u);
              if (u && !u.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', u.uid);
                      const snap = await getDoc(userRef);
                      if (snap.exists()) {
                          const data = snap.data();
                          setUserProfile(data);
                          if (data.favorites && Array.isArray(data.favorites)) {
                              setFavorites(data.favorites);
                          }
                          if (data.selectedSchool && !selectedSchool) {
                              setSelectedSchool(data.selectedSchool);
                              localStorage.setItem('wb_selected_school', data.selectedSchool);
                          }
                          if (data.selectedClass && !selectedClass) {
                              setSelectedClass(data.selectedClass);
                              localStorage.setItem('wb_selected_class', data.selectedClass);
                          }
                          if (!data.setupCompleted) {
                              setPendingSetupUser(u);
                              setShowProfileSetupModal(true);
                          }
                      } else {
                          setPendingSetupUser(u);
                          setShowProfileSetupModal(true);
                      }
                  } catch (err) {
                      console.warn('Could not fetch user profile:', err);
                  }
              } else if (!u) {
                  if (localUser) {
                      setUserProfile(localUser);
                  } else {
                      setUserProfile(null);
                  }
              }
              setIsLoading(false);
            });

            return () => {
              clearTimeout(fallbackTimer);
              unsubAuth();
            };
          }, [localUser]);

          useEffect(() => {
            if (!auth) return;
            return onAuthStateChanged(auth, (u) => {
              if (setDataUser) setDataUser(u);
            });
          }, []);

          // Restauration automatique et silencieuse de l'espace Google Drive sans redemander la liaison à chaque actualisation
          useEffect(() => {
            const savedToken = localStorage.getItem('worksbox_drive_token');
            if (savedToken) {
              loadWorksBoxCloudFiles(savedToken, true).catch(() => {});
            }
          }, [activeUser]);

          useEffect(() => {
            if (!dataDb) {
              return;
            }
            
            const settingsRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (docSnap) => { 
              if (docSnap.exists()) {
                const data = docSnap.data();
                setSettings(prev => ({
                    ...prev,
                    ...data,
                    schools: Array.isArray(data.schools) ? data.schools : prev.schools,
                    classes: Array.isArray(data.classes) ? data.classes : prev.classes,
                    subjects: Array.isArray(data.subjects) ? data.subjects : (Array.isArray(data.subjectOrder) ? data.subjectOrder : prev.subjects),
                    subjectOrder: Array.isArray(data.subjectOrder) ? data.subjectOrder : (Array.isArray(data.subjects) ? data.subjects : prev.subjectOrder),
                    schoolClasses: (data.schoolClasses && typeof data.schoolClasses === 'object') ? data.schoolClasses : prev.schoolClasses,
                    schoolClassSubjects: (data.schoolClassSubjects && typeof data.schoolClassSubjects === 'object') ? data.schoolClassSubjects : prev.schoolClassSubjects,
                    classSubjects: (data.classSubjects && typeof data.classSubjects === 'object') ? data.classSubjects : prev.classSubjects
                }));
              }
            }, (err) => console.warn('Settings snapshot error:', err));

            const coursesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses');
            const unsubCourses = onSnapshot(coursesRef, (snapshot) => {
              const loadedCourses = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  // Résolution intelligente de l'établissement pour les anciens cours
                  let resolvedSchool = data.school;
                  if (!resolvedSchool || resolvedSchool === 'Lycée François Bazin') {
                      if (data.classe === 'BTS SIO 1' || data.classe === 'BTS SIO 2') {
                          resolvedSchool = 'Lycée Gaspard Monge';
                      } else if (!resolvedSchool) {
                          resolvedSchool = 'Lycée François Bazin';
                      }
                  }
                  return {
                      id: docSnap.id,
                      school: resolvedSchool,
                      classe: data.classe || 'Terminale STI2D',
                      chapterOrder: typeof data.chapterOrder === 'number' ? data.chapterOrder : -new Date(data.date).getTime(),
                      courseOrder: typeof data.courseOrder === 'number' ? data.courseOrder : -new Date(data.date).getTime(),
                      viewsDigital: data.viewsDigital || 0,
                      viewsCasio: data.viewsCasio || 0,
                      isVisible: data.isVisible !== false,
                      ...data,
                      school: resolvedSchool
                  };
              });
              setCourses(loadedCourses.filter(c => c.isVisible !== false));
              setIsLoading(false);
            }, (err) => {
              console.warn('Courses snapshot error:', err);
              setIsLoading(false);
            });

            const articlesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'articles');
            const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
              const loadedArticles = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  return {
                      id: docSnap.id,
                      school: data.school || 'Lycée François Bazin',
                      classe: data.classe || 'Terminale STI2D',
                      ...data
                  };
              });
              loadedArticles.sort((a, b) => new Date(b.date) - new Date(a.date));
              setArticles(loadedArticles);
            }, (err) => console.warn('Articles snapshot error:', err));

            const sharedFilesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'sharedCloudFiles');
            const unsubSharedFiles = onSnapshot(sharedFilesRef, (snapshot) => {
              if (!snapshot.empty) {
                const loaded = snapshot.docs.map(docSnap => ({
                  id: docSnap.id,
                  ...docSnap.data()
                }));
                loaded.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                setSharedCloudFiles(loaded);
              } else {
                setSharedCloudFiles([]);
              }
            }, (err) => {
              console.warn('SharedCloudFiles snapshot error:', err);
              setSharedCloudFiles([]);
            });

            // Synchronisation en direct de la configuration du Cloud Partagé (nom, description, quota, statut)
            const sharedConfigRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'sharedCloud');
            const unsubSharedConfig = onSnapshot(sharedConfigRef, (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                setSharedCloudConfig(prev => {
                  const merged = { ...prev, ...data };
                  try {
                    localStorage.setItem('worksbox_shared_config', JSON.stringify(merged));
                  } catch(e) {}
                  return merged;
                });
              }
            }, (err) => console.warn('SharedCloudConfig snapshot error:', err));

            return () => { unsubSettings(); unsubCourses(); unsubArticles(); unsubSharedFiles(); unsubSharedConfig(); };
          }, []);

          const allSchools = useMemo(() => {
              const base = Array.isArray(settings.schools) ? settings.schools : DEFAULT_SCHOOLS;
              const list = new Set([...base, ...courses.map(c => c.school), ...articles.map(a => a.school)]);
              return Array.from(list).filter(Boolean);
          }, [settings.schools, courses, articles]);

          const allClasses = useMemo(() => {
              const base = Array.isArray(settings.classes) ? settings.classes : DEFAULT_CLASSES;
              const list = new Set([...base, ...courses.map(c => c.classe), ...articles.map(a => a.classe)]);
              return Array.from(list).filter(Boolean);
          }, [settings.classes, courses, articles]);

          const getClassesForSchool = (schoolName) => {
              if (!schoolName) return allClasses;
              if (settings.schoolClasses && Array.isArray(settings.schoolClasses[schoolName]) && settings.schoolClasses[schoolName].length > 0) {
                  return settings.schoolClasses[schoolName];
              }
              if (DEFAULT_SCHOOL_CLASSES[schoolName]) {
                  return DEFAULT_SCHOOL_CLASSES[schoolName];
              }
              const inCourses = Array.from(new Set(courses.filter(c => c.school === schoolName).map(c => c.classe).filter(Boolean)));
              if (inCourses.length > 0) return inCourses;
              return allClasses;
          };

          const availableClassesForSchool = useMemo(() => {
              return getClassesForSchool(selectedSchool);
          }, [selectedSchool, settings.schoolClasses, courses, allClasses]);

          useEffect(() => {
              if (allSchools.length > 0 && (!selectedSchool || !allSchools.includes(selectedSchool))) {
                  const defSchool = allSchools.includes('Lycée François Bazin') ? 'Lycée François Bazin' : allSchools[0];
                  setSelectedSchool(defSchool);
                  localStorage.setItem('wb_selected_school', defSchool);
              }
              const validClasses = getClassesForSchool(selectedSchool);
              if (validClasses.length > 0 && (!selectedClass || !validClasses.includes(selectedClass))) {
                  const defClass = validClasses.includes('Terminale STI2D') ? 'Terminale STI2D' : validClasses[0];
                  setSelectedClass(defClass);
                  localStorage.setItem('wb_selected_class', defClass);
              }
          }, [allSchools, selectedSchool, settings.schoolClasses]);

          const getSubjectsForClass = (schoolName, className) => {
              if (!className) return [];
              const pairKey = `${schoolName}__${className}`;
              // 1. Spécifique Lycée + Classe défini dans les réglages
              if (settings.schoolClassSubjects && settings.schoolClassSubjects[pairKey] !== undefined && Array.isArray(settings.schoolClassSubjects[pairKey])) {
                  return settings.schoolClassSubjects[pairKey];
              }
              // 2. Spécifique Lycée + Classe par défaut
              if (DEFAULT_SCHOOL_CLASS_SUBJECTS && DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey]) {
                  return DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey];
              }
              // 3. Spécifique Classe défini dans les réglages
              if (settings.classSubjects && settings.classSubjects[className] !== undefined && Array.isArray(settings.classSubjects[className])) {
                  return settings.classSubjects[className];
              }
              // 4. Spécifique Classe par défaut
              if (DEFAULT_CLASS_SUBJECTS && DEFAULT_CLASS_SUBJECTS[className]) {
                  return DEFAULT_CLASS_SUBJECTS[className];
              }
              // 5. Aucune matière associée à cette classe : on ne renvoie rien (seules les matières associées s'affichent)
              return [];
          };

          const activeSubjects = useMemo(() => {
              const configured = getSubjectsForClass(selectedSchool, selectedClass);
              // Détection automatique des matières des cours existants pour cette classe et cet établissement
              const fromCourses = courses
                  .filter(c => {
                      const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim();
                      const cClass = (c.classe || 'Terminale STI2D').trim();
                      return cSchool.toLowerCase() === (selectedSchool || '').trim().toLowerCase() &&
                             cClass.toLowerCase() === (selectedClass || '').trim().toLowerCase() &&
                             c.subject;
                  })
                  .map(c => c.subject.trim())
                  .filter(Boolean);
              
              const combined = Array.from(new Set([...configured, ...fromCourses]));
              return combined;
          }, [selectedSchool, selectedClass, settings.schoolClassSubjects, settings.classSubjects, courses]);

          // Filtrage par établissement et classe sélectionnés avec restriction stricte aux matières associées
          const filteredCourses = useMemo(() => {
              const assocSet = new Set(activeSubjects.map(s => s.toLowerCase().trim()));
              return courses.filter(c => {
                  const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim();
                  const cClass = (c.classe || 'Terminale STI2D').trim();
                  const matchSchool = cSchool.toLowerCase() === (selectedSchool || '').trim().toLowerCase();
                  const matchClass = cClass.toLowerCase() === (selectedClass || '').trim().toLowerCase();
                  const cSubject = (c.subject || '').trim().toLowerCase();
                  const matchAssociated = cSubject ? assocSet.has(cSubject) : false;
                  return matchSchool && matchClass && matchAssociated;
              });
          }, [courses, selectedSchool, selectedClass, activeSubjects]);

          const filteredArticles = useMemo(() => {
              return articles.filter(a => (a.school || 'Lycée François Bazin') === selectedSchool && (a.classe || 'Terminale STI2D') === selectedClass);
          }, [articles, selectedSchool, selectedClass]);

          // Réinitialiser la matière sélectionnée si elle n'est plus associée à la classe courante
          useEffect(() => {
              if (selectedSubject && !activeSubjects.includes(selectedSubject)) {
                  setSelectedSubject(null);
                  if (currentView === 'subject') {
                      setCurrentView('home');
                  }
              }
          }, [selectedSubject, activeSubjects, currentView]);

          const sortedSubjects = useMemo(() => {
              const ordered = Array.isArray(settings.subjects)
                  ? settings.subjects
                  : (Array.isArray(settings.subjectOrder) ? settings.subjectOrder : DEFAULT_SUBJECTS);
              const assocSet = new Set(activeSubjects);
              const known = ordered.filter(s => assocSet.has(s));
              const unknown = activeSubjects.filter(s => !ordered.includes(s)).sort();
              return [...known, ...unknown];
          }, [activeSubjects, settings.subjects, settings.subjectOrder]);

          const latestCourses = useMemo(() => filteredCourses.slice(0, 4), [filteredCourses]);
          const favoriteCourses = useMemo(() => filteredCourses.filter(c => favorites.includes(c.id)), [filteredCourses, favorites]);

          const searchedCourses = useMemo(() => {
              if (!searchQuery || searchQuery.length < 2) return [];
              const q = searchQuery.toLowerCase();
              return filteredCourses.filter(c => c.title.toLowerCase().includes(q) || c.chapter.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q));
          }, [filteredCourses, searchQuery]);

          const filteredSubjectsList = sortedSubjects.filter(subject => subject.toLowerCase().includes(searchQuery.toLowerCase()));
          const goHome = () => { setSelectedSubject(null); setCurrentView('home'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openSoftwareHub = () => { setSelectedSubject(null); setCurrentView('software'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openSubject = (subject) => { setSelectedSubject(subject); setCurrentView('subject'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openTerms = () => { setSelectedSubject(null); setCurrentView('terms'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openCasioGuide = () => { setSelectedSubject(null); setCurrentView('casioGuide'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          
          const openProfile = (tab = 'favorites') => {
              if (!activeUser) {
                  setShowAuthModal(true);
                  return;
              }
              setSelectedSubject(null);
              setProfileTab(tab);
              setCurrentView('profile');
              window.scrollTo({top: 0, behavior: 'smooth'});
          };
          const openFavorites = () => openProfile('favorites');
          const openCloud = () => openProfile('cloud');
          const openSharedCloud = () => openProfile('sharedCloud');
          const openAccount = () => openProfile('account');

          const handleView = async (course, type) => {
              if (type === 'Numérique') setPreviewData({ link: course.digitalLink, title: course.title, type: 'Numérique', course });
              else if (type === 'Casio') setPreviewData({ link: course.casioLink, title: course.title, type: 'Casio', course });
              else if (type === 'Vidéo') setPreviewData({ link: course.videoLink, title: course.title, type: 'Vidéo', course });
              else if (type === 'Image') setPreviewData({ link: course.imageLink, title: course.title, type: 'Image', course });
              else if (type === 'Audio') setPreviewData({ link: course.audioLink, title: course.title, type: 'Audio', course });

              if (dataDb) {
                  try {
                      const docRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', course.id.toString());
                      const updates = {};
                      if (type === 'Numérique') updates.viewsDigital = (course.viewsDigital || 0) + 1;
                      if (type === 'Casio') updates.viewsCasio = (course.viewsCasio || 0) + 1;
                      if (Object.keys(updates).length > 0) await updateDoc(docRef, updates);
                  } catch(e) {
                      console.warn('Erreur incrément vue :', e);
                  }
              }
          };

          // Détection d'un lien direct vers un cours dans l'URL (?course=... ou ?c=...)
          const [deepLinkHandled, setDeepLinkHandled] = useState(false);
          useEffect(() => {
              if (deepLinkHandled || !courses || courses.length === 0) return;
              try {
                  const params = new URLSearchParams(window.location.search);
                  const targetCourseId = params.get('course') || params.get('c');
                  if (targetCourseId) {
                      const target = courses.find(c => String(c.id) === String(targetCourseId));
                      if (target) {
                          setDeepLinkHandled(true);
                          if (target.school) {
                              setSelectedSchool(target.school);
                              localStorage.setItem('wb_selected_school', target.school);
                          }
                          if (target.classe) {
                              setSelectedClass(target.classe);
                              localStorage.setItem('wb_selected_class', target.classe);
                          }
                          if (target.subject) {
                              setSelectedSubject(target.subject);
                              setCurrentView('subject');
                          }
                          const link = target.digitalLink || target.casioLink || target.videoLink || target.imageLink || target.audioLink;
                          const type = target.digitalLink ? 'Numérique' : (target.casioLink ? 'Casio' : (target.videoLink ? 'Vidéo' : (target.imageLink ? 'Image' : 'Audio')));
                          if (link) {
                              setPreviewData({
                                  link,
                                  type,
                                  title: target.title,
                                  course: target
                              });
                          }
                          showToast(`Affichage du cours « ${target.title} »`, 'info', 'info');
                      }
                  }
              } catch (err) {
                  console.warn('Erreur lecture lien direct cours :', err);
              }
          }, [courses, deepLinkHandled]);

          const chaptersData = useMemo(() => {
            if (!selectedSubject) return [];
            const targetSubjLower = selectedSubject.trim().toLowerCase();
            const filtered = filteredCourses.filter(c => (c.subject || '').trim().toLowerCase() === targetSubjLower);
            const groups = {};
            filtered.forEach(course => {
                if (!groups[course.chapter]) groups[course.chapter] = { name: course.chapter, courses: [] };
                groups[course.chapter].courses.push(course);
            });
            Object.values(groups).forEach(group => {
                group.chapterOrder = Math.min(...group.courses.map(c => c.chapterOrder || 0));
                group.courses.sort((a, b) => (a.courseOrder||0) - (b.courseOrder||0));
            });
            return Object.values(groups).sort((a, b) => a.chapterOrder - b.chapterOrder);
          }, [filteredCourses, selectedSubject]);

          const handleSaveOnboarding = async (e) => {
              e.preventDefault();
              if (!selectedSchool || !selectedClass) return;
              localStorage.setItem('wb_selected_school', selectedSchool);
              localStorage.setItem('wb_selected_class', selectedClass);
              setShowOnboarding(false);

              if (user && !user.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', user.uid);
                      await setDoc(userRef, {
                          selectedSchool: selectedSchool,
                          selectedClass: selectedClass,
                          updatedAt: new Date().toISOString()
                      }, { merge: true });
                  } catch (err) {
                      console.warn('Erreur sauvegarde profil utilisateur :', err);
                  }
              }
          };

          const handleAcceptTerms = () => {
              if (!termsAgreementChecked) return;
              localStorage.setItem('wb_terms_accepted', 'true');
              setHasAcceptedTerms(true);
          };

          const getYouTubeEmbedUrl = (url) => {
              if (!url) return null;
              if (url.includes('embed/')) return url;
              let videoId = '';
              if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
              else if (url.includes('watch?v=')) videoId = new URLSearchParams(new URL(url).search).get('v');
              return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
          };

          return (
            <div className="min-h-screen relative font-sans text-slate-800 dark:text-slate-100 pb-20 transition-colors duration-200">
              {/* LIQUID AMBIENT BACKGROUND ORBS */}
              <div className="fixed inset-0 pointer-events-none overflow-hidden -z-10 select-none">
                  <div className="absolute -top-40 -left-40 w-[450px] h-[450px] sm:w-[650px] sm:h-[650px] bg-gradient-to-tr from-blue-500/15 via-sky-400/20 to-indigo-500/15 dark:from-blue-600/25 dark:via-cyan-500/20 dark:to-indigo-600/20 rounded-full blur-[110px] animate-pulse" style={{ animationDuration: '8s' }} />
                  <div className="absolute top-1/4 -right-40 w-[400px] h-[400px] sm:w-[550px] sm:h-[550px] bg-gradient-to-br from-indigo-500/15 via-purple-500/15 to-pink-500/10 dark:from-indigo-600/25 dark:via-purple-600/20 dark:to-cyan-600/15 rounded-full blur-[120px] animate-pulse" style={{ animationDuration: '10s', animationDelay: '2s' }} />
                  <div className="absolute -bottom-40 left-1/3 w-[450px] h-[450px] sm:w-[700px] sm:h-[700px] bg-gradient-to-tl from-sky-400/15 via-blue-600/15 to-teal-400/10 dark:from-sky-500/20 dark:via-blue-800/25 dark:to-indigo-900/30 rounded-full blur-[130px]" />
              </div>

              {/* MODALE D'ACCEPTATION OBLIGATOIRE DES CONDITIONS D'UTILISATION */}
              {!hasAcceptedTerms && (
                  <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xl animate-in fade-in duration-300">
                      <div className="liquid-glass rounded-3xl shadow-2xl w-full max-w-2xl p-6 sm:p-8 flex flex-col max-h-[90vh]">
                          <div className="flex items-center space-x-3 mb-4 pb-4 border-b border-slate-200/60 dark:border-white/10 flex-shrink-0">
                              <div className="bg-blue-500/20 text-blue-600 dark:text-blue-400 p-2.5 rounded-2xl border border-blue-400/30 shadow-xs">
                                  <Shield className="w-6 h-6" />
                              </div>
                              <div>
                                  <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">Conditions d'utilisations de WorksBox</h2>
                                  <p className="text-xs text-slate-500 dark:text-slate-400">Veuillez prendre connaissance du règlement et l'accepter pour accéder au site.</p>
                              </div>
                          </div>

                          <div 
                              className="flex-1 overflow-y-auto pr-2 mb-6 bg-white/40 dark:bg-slate-950/50 rounded-2xl p-5 border border-white/60 dark:border-white/10 text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line space-y-4"
                              dangerouslySetInnerHTML={{ __html: settings.termsContent || DEFAULT_TERMS_FALLBACK }}
                          />

                          <div className="flex-shrink-0 pt-2 border-t border-slate-200/60 dark:border-white/10 space-y-4">
                              <label className="flex items-start space-x-3 cursor-pointer select-none">
                                  <input 
                                      type="checkbox" 
                                      checked={termsAgreementChecked} 
                                      onChange={(e) => setTermsAgreementChecked(e.target.checked)} 
                                      className="mt-1 w-4 h-4 text-blue-600 rounded border-slate-300 dark:border-slate-700 focus:ring-blue-500 cursor-pointer" 
                                  />
                                  <span className="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-200">
                                      J'ai lu et j'accepte les conditions d'utilisation de WorksBox.
                                  </span>
                              </label>

                              <button 
                                  onClick={handleAcceptTerms} 
                                  disabled={!termsAgreementChecked} 
                                  className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-2 cursor-pointer"
                              >
                                  <span>Accepter et continuer</span>
                              </button>
                          </div>
                      </div>
                  </div>
              )}

              {/* MODALE DE CHOIX D'ÉTABLISSEMENT / CLASSE */}
              {hasAcceptedTerms && showOnboarding && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xl animate-in fade-in duration-300">
                      <div className="liquid-glass rounded-3xl shadow-2xl w-full max-w-lg p-8 sm:p-10 relative">
                          {selectedSchool && selectedClass && (
                              <button 
                                  type="button" 
                                  onClick={() => setShowOnboarding(false)} 
                                  className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-white/50 dark:hover:bg-white/10 rounded-xl transition-colors cursor-pointer"
                                  title="Fermer"
                              >
                                  <X className="w-5 h-5" />
                              </button>
                          )}
                          <div className="text-center mb-8">
                              <WorksBoxLogo className="w-16 h-16 rounded-2xl mx-auto mb-4 shadow-lg shadow-blue-500/20" />
                              <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">Bienvenue sur WorksBox</h1>
                              <p className="text-sm text-slate-500 dark:text-slate-400 mt-2">Veuillez indiquer votre établissement et votre classe pour accéder aux cours.</p>
                          </div>
                          <form onSubmit={handleSaveOnboarding} className="space-y-6">
                              <div>
                                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-2">Sélectionnez votre Lycée</label>
                                  <select 
                                      value={selectedSchool} 
                                      onChange={(e) => {
                                          const sch = e.target.value;
                                          setSelectedSchool(sch);
                                          const avail = getClassesForSchool(sch);
                                          if (avail && avail.length > 0 && !avail.includes(selectedClass)) {
                                              setSelectedClass(avail[0]);
                                          }
                                      }} 
                                      required 
                                      className="w-full liquid-glass-input rounded-xl px-4 py-3 text-sm font-bold text-slate-800 dark:text-slate-100 outline-none cursor-pointer"
                                  >
                                      <option value="" disabled>-- Choisir un lycée --</option>
                                      {allSchools.map(s => <option key={s} value={s}>{s}</option>)}
                                  </select>
                              </div>
                              <div>
                                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-2">Sélectionnez votre Classe</label>
                                  <select 
                                      value={selectedClass} 
                                      onChange={(e) => setSelectedClass(e.target.value)} 
                                      required 
                                      className="w-full liquid-glass-input rounded-xl px-4 py-3 text-sm font-bold text-slate-800 dark:text-slate-100 outline-none cursor-pointer"
                                  >
                                      <option value="" disabled>-- Choisir une classe --</option>
                                      {availableClassesForSchool.map(c => <option key={c} value={c}>{c}</option>)}
                                  </select>
                              </div>
                              <button type="submit" disabled={!selectedSchool || !selectedClass} className="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all cursor-pointer">Accéder aux cours</button>
                          </form>
                      </div>
                  </div>
              )}

              {settings.announcement && (
                  <div className="bg-gradient-to-r from-amber-500/90 to-orange-500/90 backdrop-blur-md text-white text-xs sm:text-sm font-bold py-2 sm:py-2.5 px-3 sm:px-4 flex justify-center items-center shadow-sm border-b border-amber-400/40 text-center leading-snug">
                      <Megaphone className="w-3.5 h-3.5 sm:w-4 sm:h-4 mr-1.5 shrink-0 animate-bounce" />
                      <span className="line-clamp-2">{settings.announcement}</span>
                  </div>
              )}

              {/* NAVIGATION PRINCIPALE LIQUID GLASS OPTIMISÉE MOBILE & DESKTOP */}
              <nav className="liquid-glass-nav sticky top-0 z-30 transition-all duration-200">
                <div className={`${currentView === 'noteEditor' ? 'w-full px-3 sm:px-6 lg:px-8' : 'max-w-7xl mx-auto px-3 sm:px-6 lg:px-8'} transition-all duration-300`}>
                  <div className="flex justify-between items-center h-14 sm:h-16">
                    {/* Brand / Logo */}
                    <div className="flex items-center space-x-6 sm:space-x-8">
                        <div className="flex items-center space-x-2.5 sm:space-x-3 cursor-pointer group active:scale-95 transition-all" onClick={goHome}>
                            <div className="relative">
                                <WorksBoxLogo className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl shadow-md group-hover:scale-105 transition-transform" />
                                <div className="absolute inset-0 rounded-xl bg-blue-500/20 blur-sm -z-10 group-hover:bg-blue-400/30 transition-colors" />
                            </div>
                            <span className="font-extrabold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-300 bg-clip-text text-transparent">WorksBox</span>
                        </div>
                        {/* Liens desktop */}
                        <div className="hidden lg:flex items-center space-x-1.5">
                            <button onClick={goHome} className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-all flex items-center cursor-pointer ${(currentView === 'home' || currentView === 'subject') ? 'bg-blue-500/15 dark:bg-blue-400/20 text-blue-600 dark:text-blue-300 border border-blue-400/30 shadow-xs' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-white/5'}`}><HomeIcon className="w-4 h-4 mr-1.5" /> Accueil</button>
                            <button onClick={openSoftwareHub} className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-all flex items-center cursor-pointer ${currentView === 'software' ? 'bg-blue-500/15 dark:bg-blue-400/20 text-blue-600 dark:text-blue-300 border border-blue-400/30 shadow-xs' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-white/5'}`}><Layers className="w-4 h-4 mr-1.5 text-blue-500 dark:text-blue-400" /> Logiciels</button>
                            <button onClick={openTerms} className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-all flex items-center cursor-pointer ${currentView === 'terms' ? 'bg-blue-500/15 dark:bg-blue-400/20 text-blue-600 dark:text-blue-300 border border-blue-400/30 shadow-xs' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-white/5'}`}><Shield className="w-4 h-4 mr-1.5" /> Conditions</button>
                            <button onClick={openCasioGuide} className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-all flex items-center cursor-pointer ${currentView === 'casioGuide' ? 'bg-blue-500/15 dark:bg-blue-400/20 text-blue-600 dark:text-blue-300 border border-blue-400/30 shadow-xs' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-white/5'}`}><HelpCircle className="w-4 h-4 mr-1.5" /> Tuto Casio</button>
                        </div>
                    </div>

                    {/* Actions de droite (Adaptées mobile : badge classe, thème, menu compact) */}
                    <div className="flex items-center space-x-1.5 sm:space-x-2.5">
                        {/* Bouton de basculement Mode Clair / Sombre */}
                        <button 
                            id="nav-btn-theme-toggle" 
                            onClick={toggleTheme} 
                            className="p-2 sm:p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white liquid-glass-btn transition-all active:scale-95 flex items-center justify-center cursor-pointer shrink-0"
                            title={isDark ? "Passer en mode clair" : "Passer en mode sombre"}
                            aria-label={isDark ? "Passer en mode clair" : "Passer en mode sombre"}
                        >
                            {isDark ? (
                                <Sun className="w-4 h-4 text-amber-400" />
                            ) : (
                                <Moon className="w-4 h-4 text-sky-500" />
                            )}
                        </button>

                        {/* Établissement & Classe : Bouton interactif lisible sur mobile */}
                        <button 
                            id="nav-btn-school-class" 
                            onClick={() => setShowOnboarding(true)} 
                            className="hidden sm:flex items-center space-x-2 text-xs font-bold liquid-glass-btn text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl transition-all active:scale-95 cursor-pointer"
                            title="Changer de lycée ou de classe"
                        >
                            <SchoolIcon className="w-4 h-4 text-blue-500 dark:text-blue-400" />
                            <span className="truncate max-w-[130px]">{selectedSchool} • {selectedClass}</span>
                        </button>

                        {/* Raccourci classe sur mobile très épuré */}
                        <button 
                            onClick={() => setShowOnboarding(true)} 
                            className="sm:hidden flex items-center space-x-1 text-[11px] font-bold liquid-glass-btn text-blue-600 dark:text-blue-400 px-2.5 py-1.5 rounded-xl transition-all active:scale-95 cursor-pointer max-w-[110px]"
                            title="Changer de classe"
                        >

                            <button 
                                id="nav-btn-login"

                                <UserIcon className="w-3.5 h-3.5" />

                                        <span>{selectedClass || 'Choisir une classe'}</span>

                                                    </ul>

                                        </div>

                                                                        <Share2 className="w-3.5 h-3.5" />

                                                                        onClick={() => toggleFav(course.id)}

                                                                        <Eye className="w-3.5 h-3.5 mr-1" /> PDF

                                                                        <Calculator className="w-3.5 h-3.5 mr-1" /> Casio

                                                                        <VideoIcon className="w-3.5 h-3.5 mr-1" /> Vidéo

                                                                        <MusicIcon className="w-3.5 h-3.5 mr-1" /> Audio

                                                                </button>

                                                                >
                                                                    <Share2 className="w-3 h-3 text-blue-500" />
                                                                </button>
                                                            </div>

                                                const courseCount = filteredCourses.filter(c => (c.subject || '').trim().toLowerCase() === sLower).length;
                                                // Dynamic colorful liquid glass gradients for each subject
                                                const iconGradients = [
                                                    'from-blue-600 to-cyan-500 text-white shadow-blue-500/25',
                                                    'from-indigo-600 to-purple-600 text-white shadow-indigo-500/25',
                                                    'from-emerald-600 to-teal-500 text-white shadow-emerald-500/25',
                                                    'from-amber-500 to-orange-500 text-white shadow-amber-500/25',
                                                    'from-rose-500 to-pink-500 text-white shadow-rose-500/25',
                                                    'from-sky-500 to-blue-600 text-white shadow-sky-500/25'

                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-1 mb-1">

                                                </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </>
                            )}

                                    onClick={goHome} 
                                    id="btn-profile-back-to-site" 
                                    className="inline-flex items-center space-x-2 px-4 py-2.5 liquid-glass-btn text-slate-700 dark:text-slate-200 rounded-2xl font-bold text-xs sm:text-sm transition-all shadow-xs active:scale-95 cursor-pointer group"

                                >

                                    <span className="text-blue-600 dark:text-blue-400 font-bold">Mon Espace Profil</span>
                                </div>

                                            {(activeUser?.displayName || activeUser?.email || 'E')[0].toUpperCase()}

                                            {activeUser?.isLocal ? (
                                                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-400/30">
                                                    <UserIcon className="w-3 h-3 mr-1" /> Profil Élève

                                                                className="px-4 py-2 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition inline-flex items-center space-x-2 shadow-xs"
                                                            >
                                                                {cloudLoading ? (
                                                                    <span>Synchronisation...</span>
                                                                ) : (
                                                                    <>
                                                                        <RefreshCw className="w-3.5 h-3.5 mr-1" />
                                                                        <span>Réessayer la synchronisation</span>
                                                                    </>
                                                                )}
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {(!activeUser || activeUser.isLocal) ? (
                                            <div className="border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center space-y-4">
                                                <div className="w-16 h-16 bg-sky-50 dark:bg-sky-950 text-sky-600 dark:text-sky-400 rounded-2xl flex items-center justify-center mx-auto shadow-xs">
                                                    <Cloud className="w-8 h-8" />
                                                </div>
                                                <h4 className="text-base font-bold text-slate-800 dark:text-slate-200">
                                                    Connectez-vous avec Google pour accéder à votre espace WorksBox Cloud (1 Go)
                                                </h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 max-w-md mx-auto">
                                                    Créez des dossiers, rédigez vos cours avec <strong>WorksBox Note</strong> et synchronisez vos fichiers en toute sécurité dans votre quota de 1 Go.
                                                </p>
                                                <button 
                                                    onClick={() => setShowAuthModal(true)}
                                                    className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow-sm transition active:scale-95 inline-flex items-center space-x-2 cursor-pointer"
                                                >
                                                    <GoogleIcon className="w-4 h-4" />
                                                    <span>Se connecter avec Google (Drive 1 Go inclus)</span>
                                                </button>
                                            </div>

                                            <div className="py-12 flex flex-col items-center justify-center space-y-3">
                                                <div className="w-8 h-8 border-3 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
                                                <p className="text-xs font-bold text-slate-500">Chargement de vos fichiers et dossiers Google Drive...</p>
                                            </div>
                                        ) : cloudFiles.length === 0 ? (
                                            <div className="border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center space-y-4">
                                                <FolderPlus className="w-12 h-12 text-slate-300 dark:text-slate-600 mx-auto" />
                                                <h4 className="text-base font-bold text-slate-800 dark:text-slate-200">Dossier vide pour l'instant</h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 max-w-md mx-auto">
                                                    Créez un sous-dossier, commencez à rédiger une note ou téléversez un document.
                                                </p>
                                                <div className="flex flex-wrap items-center justify-center gap-3 pt-2">
                                                    <button 
                                                        onClick={() => setShowNewFolderModal(true)}
                                                        className="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition flex items-center space-x-1.5"

                                                        <FolderPlus className="w-3.5 h-3.5 text-sky-500" />

                                                    </button>

                                                        onClick={() => createNewNote('Nouvelle note', activeSubjects?.[0]?.name || 'Général', '', '', cloudCurrentFolderId, cloudBreadcrumbs[cloudBreadcrumbs.length - 1]?.name)}

                                                    >
                                                        <PenTool className="w-3.5 h-3.5" />
                                                        <span>Rédiger une note</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => document.getElementById('cloud-file-uploader')?.click()}
                                                        className="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition flex items-center space-x-1.5"
                                                    >
                                                        <UploadCloud className="w-3.5 h-3.5" />
                                                        <span>Téléverser un document</span>
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-6">
                                                {/* Dossiers */}
                                                {cloudFiles.filter(f => f.mimeType === 'application/vnd.google-apps.folder' && (!cloudSearchQuery.trim() || f.name.toLowerCase().includes(cloudSearchQuery.toLowerCase()))).length > 0 && (
                                                    <div className="space-y-3">
                                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center">
                                                            <Folder className="w-3.5 h-3.5 mr-1.5 text-sky-500" />
                                                            Dossiers
                                                        </h4>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                                            {cloudFiles
                                                                .filter(f => f.mimeType === 'application/vnd.google-apps.folder' && (!cloudSearchQuery.trim() || f.name.toLowerCase().includes(cloudSearchQuery.toLowerCase())))
                                                                .map(folder => (
                                                                    <div 
                                                                        key={folder.id} 
                                                                        onClick={() => openCloudFolder(folder)}
                                                                        className="p-4 bg-slate-50 dark:bg-slate-800/60 hover:bg-sky-50 dark:hover:bg-sky-950/40 border border-slate-200/80 dark:border-slate-700/80 hover:border-sky-300 dark:hover:border-sky-800 rounded-2xl flex items-center justify-between transition cursor-pointer group shadow-2xs"
                                                                    >
                                                                        <div className="flex items-center space-x-3 min-w-0">
                                                                            <div className="p-2.5 bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-400 rounded-xl group-hover:scale-110 transition-transform">
                                                                                <Folder className="w-5 h-5" />
                                                                            </div>
                                                                            <div className="min-w-0">
                                                                                <h5 className="text-xs font-bold text-slate-800 dark:text-slate-100 truncate">{folder.name}</h5>
                                                                                <span className="text-[10px] text-slate-400">Dossier</span>
                                                                            </div>
                                                                        </div>
                                                                        <button
                                                                            onClick={(e) => { e.stopPropagation(); deleteCloudFile(folder.id, folder.name); }}
                                                                            className="p-1.5 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/50 transition opacity-0 group-hover:opacity-100"
                                                                            title="Supprimer ce dossier"
                                                                        >
                                                                            <Trash2 className="w-4 h-4" />
                                                                        </button>
                                                                    </div>
                                                                ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {/* Fichiers et Notes */}
                                                <div className="space-y-3">
                                                    {cloudFiles.filter(f => f.mimeType !== 'application/vnd.google-apps.folder').length > 0 && (
                                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center">
                                                            <FileText className="w-3.5 h-3.5 mr-1.5 text-blue-500" />
                                                            Fichiers & Notes
                                                        </h4>
                                                    )}
                                                    <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                                        {cloudFiles
                                                            .filter(f => f.mimeType !== 'application/vnd.google-apps.folder' && (!cloudSearchQuery.trim() || f.name.toLowerCase().includes(cloudSearchQuery.toLowerCase())))
                                                            .map(file => {
                                                                const sizeMb = ((parseInt(file.size, 10) || 0) / (1024 * 1024)).toFixed(2);
                                                                const dateFormatted = file.modifiedTime ? new Date(file.modifiedTime).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
                                                                const isNoteFile = file.name.startsWith('[Note]') || file.name.endsWith('.html');
                                                                const matchedLocalNote = notesList.find(n => n.driveFileId === file.id || file.name.includes(n.title));

                                                                return (
                                                                    <div key={file.id} className="py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/50 px-3 rounded-xl transition-colors">
