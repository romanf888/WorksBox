        function SuggestDocumentModal({ subject, school, classe, activeUser, onClose, onToast }) {
            const [documentTitle, setDocumentTitle] = useState('');
            const [chapter, setChapter] = useState('');
            const [file, setFile] = useState(null);
            const [userName, setUserName] = useState(activeUser?.displayName || '');
            const [userEmail, setUserEmail] = useState(activeUser?.email || '');
            const [notes, setNotes] = useState('');
            const [isSending, setIsSending] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [successMsg, setSuccessMsg] = useState('');

            const handleFileChange = (e) => {
                const selected = e.target.files?.[0];
                if (selected) {
                    setFile(selected);
                    if (!documentTitle) {
                        const cleanName = selected.name.replace(/\.[^/.]+$/, '').replace(/[_.-]+/g, ' ');
                        setDocumentTitle(cleanName.charAt(0).toUpperCase() + cleanName.slice(1));
                    }
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const cleanTitle = documentTitle.trim();
                const cleanNotes = notes.trim();
                if (!file && !cleanTitle && !cleanNotes) {
                    if (onToast) onToast("Veuillez remplir au moins le titre, un message ou choisir un fichier.", "warning");
                    return;
                }
                setIsSending(true);

                const processAndSave = async (fileDataUrl = '', fileNameStr = '') => {
                    const suggestionId = `suggest-${Date.now()}`;
                    const senderName = userName.trim() || activeUser?.displayName || 'Un élève';
                    const docName = fileNameStr || cleanTitle || 'Demande de cours';
                    const formattedNotification = `${senderName} à suggérer le document [${docName}] pour l'ajouter au cours`;

                    if (dataDb) {
                        try {
                            const sugRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'documentSuggestions', suggestionId);
                            await setDoc(sugRef, {
                                id: suggestionId,
                                senderName,
                                senderEmail: userEmail || activeUser?.email || '',
                                subject: subject || 'Général',
                                school: school || 'Lycée François Bazin',
                                classe: classe || 'Terminale STI2D',
                                documentTitle: cleanTitle || docName,
                                fileName: fileNameStr || cleanTitle || 'Demande de cours',
                                fileSize: file ? file.size : 0,
                                fileType: file ? file.type : 'text/plain',
                                fileDataUrl: fileDataUrl,
                                chapter: chapter.trim() || 'Suggestions d\'élèves',
                                notes: cleanNotes,
                                createdAt: new Date().toISOString(),
                                status: 'pending'
                            });

                            const logId = `log-sug-${Date.now()}`;
                            const logRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'activityLogs', logId);
                            await setDoc(logRef, {
                                id: logId,
                                type: 'SUGGESTION',
                                action: `Document suggéré : « ${cleanTitle || docName} » (${subject || 'Général'} - ${classe || 'STI2D'})`,
                                userEmail: userEmail || activeUser?.email || '',
                                timestamp: new Date().toISOString()
                            });
                        } catch (fsErr) {
                            console.warn('Firestore suggestion save note:', fsErr);
                        }
                    }

                    try {
                        await fetch('/api/suggest-document', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userName: senderName,
                                userEmail: userEmail || activeUser?.email || '',
                                subject: subject || 'Général',
                                school: school || 'Lycée François Bazin',
                                classe: classe || 'Terminale STI2D',
                                documentTitle: cleanTitle || docName,
                                fileName: fileNameStr || cleanTitle || 'Demande de cours',
                                notes: cleanNotes
                            })
                        });
                    } catch (apiErr) {
                        console.warn('Backend notification call:', apiErr);
                    }

                    setIsSending(false);
                    setIsSuccess(true);
                    setSuccessMsg(formattedNotification);
                    if (onToast) onToast(`Merci ! Demande transmise à l'administrateur.`, "success", "check");
                };

                if (file) {
                    try {
                        const fileReader = new FileReader();
                        fileReader.onload = (evt) => {
                            const dataUrl = evt.target.result;
                            processAndSave(dataUrl.length < 5000000 ? dataUrl : '', file.name);
                        };
                        fileReader.readAsDataURL(file);
                    } catch (err) {
                        setIsSending(false);
                        if (onToast) onToast("Erreur lors de la lecture du fichier.", "error");
                    }
                } else {
                    processAndSave('', '');
                }
            };

            return (
                <div id="suggest-document-modal" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-lg p-6 sm:p-8 border border-slate-200 dark:border-slate-800 flex flex-col relative max-h-[92vh] overflow-y-auto animate-in zoom-in-95 duration-200">
                        <button 
                            onClick={onClose} 
                            className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer"
                        >
                            <X className="w-5 h-5" />
                        </button>

                        <div className="text-center mb-5">
                            <div className="w-14 h-14 bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner border border-blue-200 dark:border-blue-800">
                                <UploadCloud className="w-7 h-7" />
                            </div>
                            <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">
                                Suggérer un document / demander un cours
                            </h2>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">
                                Matière : <strong className="text-blue-600 dark:text-blue-400">{subject}</strong> • {classe}
                            </p>
                        </div>

                        {isSuccess ? (
                            <div className="p-6 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 rounded-2xl text-center space-y-4 my-2">
                                <div className="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto shadow-md">
                                    <Check className="w-6 h-6" />
                                </div>
                                <h3 className="text-base font-extrabold text-emerald-900 dark:text-emerald-200">
                                    Demande transmise avec succès !
                                </h3>
                                <p className="text-xs font-semibold text-emerald-800 dark:text-emerald-300 leading-relaxed bg-white/60 dark:bg-slate-900/60 p-3 rounded-xl border border-emerald-200 dark:border-emerald-800">
                                    "{successMsg}"
                                </p>
                                <p className="text-[11px] text-emerald-700 dark:text-emerald-400">
                                    L'administrateur Roman Ferrière a bien reçu votre demande sur son panel d'administration WorksBox. Merci pour votre aide !
                                </p>
                                <button
                                    onClick={onClose}
                                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-md transition cursor-pointer"
                                >
                                    Fermer
                                </button>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-1.5">
                                        Fichier à téléverser (PDF, Word, Casio, Image...) <span className="text-red-500">*</span>
                                    </label>
                                    <label className="flex flex-col items-center justify-center p-4 border-2 border-dashed border-blue-300 dark:border-blue-700 hover:border-blue-500 bg-blue-50/50 dark:bg-blue-950/30 rounded-2xl cursor-pointer transition-all text-center">
                                        <UploadCloud className="w-8 h-8 text-blue-500 mb-2" />
                                        {file ? (
                                            <div className="text-xs font-bold text-slate-900 dark:text-white truncate max-w-xs">
                                                <span className="text-emerald-600 dark:text-emerald-400">✓ Fichier sélectionné :</span> {file.name} ({(file.size / 1024).toFixed(0)} Ko)
                                            </div>
                                        ) : (
                                            <div>
                                                <span className="text-xs font-bold text-blue-600 dark:text-blue-400 block">Cliquez ici pour choisir un fichier</span>
                                                <span className="text-[10px] text-slate-400 block mt-0.5">Formats acceptés : .pdf, .docx, .g1m, .txt, .png, .jpg, .mp4, etc.</span>
                                            </div>
                                        )}
                                        <input type="file" onChange={handleFileChange} className="hidden" required />
                                    </label>
                                </div>

                                <div>
                                    <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-1">
                                        Titre proposé pour le cours
                                    </label>
                                    <input 
                                        type="text"
                                        value={documentTitle}
                                        onChange={(e) => setDocumentTitle(e.target.value)}
                                        placeholder="Ex: Chapitre 4 - Formulaire de thermodynamique"
                                        className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-900 dark:text-white outline-none focus:border-blue-500"
                                    />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-1">
                                            Votre nom / pseudo
                                        </label>
                                        <input 
                                            type="text"
                                            value={userName}
                                            onChange={(e) => setUserName(e.target.value)}
                                            placeholder="Votre nom"
                                            className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-900 dark:text-white outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-1">
                                            Email de contact (optionnel)
                                        </label>
                                        <input 
                                            type="email"
                                            value={userEmail}
                                            onChange={(e) => setUserEmail(e.target.value)}
                                            placeholder="votre.email@gmail.com"
                                            className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium text-slate-900 dark:text-white outline-none"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-1">
                                        Message / Remarques pour l'admin (optionnel)
                                    </label>
                                    <textarea 
                                        value={notes}
                                        onChange={(e) => setNotes(e.target.value)}
                                        rows="2"
                                        placeholder="Précisions sur le chapitre, la classe, la source du document..."
                                        className="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium text-slate-900 dark:text-white outline-none"
                                    ></textarea>
                                </div>

                                <button
                                    type="submit"
                                    disabled={isSending || !file}
                                    className="w-full py-3.5 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-[0.99] transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer flex items-center justify-center space-x-2"
                                >
                                    {isSending ? (
                                        <>
                                            <RefreshCw className="w-4 h-4 animate-spin" />
                                            <span>Envoi en cours à WorksBox...</span>
                                        </>
                                    ) : (
                                        <>
                                            <UploadCloud className="w-5 h-5" />
                                            <span>Envoyer le document à l'administrateur</span>
                                        </>
                                    )}
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        function ProfileCompletionModal({ user, initialProfile, schools = [], classes = [], onSaveProfile, onClose }) {
            const [displayName, setDisplayName] = useState(() => {
                return initialProfile?.displayName || user?.displayName || '';
            });
            const [photoURL, setPhotoURL] = useState(() => {
                return initialProfile?.photoURL || user?.photoURL || '';
            });
            const [selectedSchool, setSelectedSchool] = useState(() => {
                return initialProfile?.selectedSchool || schools[0] || 'Lycée François Bazin';
            });
            const [selectedClass, setSelectedClass] = useState(() => {
                return initialProfile?.selectedClass || classes[0] || 'Terminale STI2D';
            });
            const [photoSource, setPhotoSource] = useState(() => {
                if (photoURL && user?.photoURL && photoURL === user.photoURL) return 'google';
                if (photoURL && photoURL.startsWith('data:image/svg+xml')) return 'preset';
                if (photoURL) return 'custom';
                return 'none';
            });
            const [isSaving, setIsSaving] = useState(false);
            const [validationError, setValidationError] = useState(null);

            const AVATAR_PRESETS = [
                { id: 'grad', name: 'Élève', emoji: '🎓', bg1: '#2563eb', bg2: '#1d4ed8' },
                { id: 'lightning', name: 'Techno', emoji: '⚡', bg1: '#f59e0b', bg2: '#ea580c' },
                { id: 'fox', name: 'Renard', emoji: '🦊', bg1: '#f97316', bg2: '#dc2626' },
                { id: 'code', name: 'Codeur', emoji: '💻', bg1: '#9333ea', bg2: '#db2777' },
                { id: 'math', name: 'Sci & Math', emoji: '📐', bg1: '#10b981', bg2: '#0f766e' },
                { id: 'creative', name: 'Créatif', emoji: '🎨', bg1: '#ec4899', bg2: '#7c3aed' },
                { id: 'star', name: 'Étoile', emoji: '🌟', bg1: '#eab308', bg2: '#d97706' },
                { id: 'rocket', name: 'Fusée', emoji: '🚀', bg1: '#0ea5e9', bg2: '#2563eb' }
            ];

            const generateSvgAvatar = (emoji, bg1, bg2) => {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="${bg1}"/>
                            <stop offset="100%" stop-color="${bg2}"/>
                        </linearGradient>
                    </defs>
                    <rect width="200" height="200" rx="40" fill="url(#g)"/>
                    <text x="50%" y="58%" font-size="96" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
                </svg>`;
                return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    setValidationError('Veuillez sélectionner un fichier image valide (PNG, JPG, WEBP).');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_SIZE = 256;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height = Math.round((height * MAX_SIZE) / width);
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width = Math.round((width * MAX_SIZE) / height);
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                        setPhotoURL(compressedDataUrl);
                        setPhotoSource('custom');
                        setValidationError(null);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const cleanName = displayName.trim();
                if (!cleanName) {
                    setValidationError('Le nom d\'affichage est obligatoire.');
                    return;
                }
                setIsSaving(true);
                setValidationError(null);
                try {
                    await onSaveProfile({
                        displayName: cleanName,
                        photoURL: photoURL || '',
                        selectedSchool,
                        selectedClass
                    });
                } catch (err) {
                    setValidationError('Erreur lors de l\'enregistrement du profil.');
                    setIsSaving(false);
                }
            };

            return (
                <div id="profile-setup-modal" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-lg p-6 sm:p-8 border border-slate-200 dark:border-slate-800 flex flex-col relative max-h-[92vh] overflow-y-auto animate-in zoom-in-95 duration-200">
                        
                        {onClose && (
                            <button 
                                onClick={onClose} 
                                className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer"
                            >
                                <X className="w-5 h-5" />
                            </button>
                        )}

                        <div className="text-center mb-5">
                            <div className="w-16 h-16 bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner border border-blue-200 dark:border-blue-800">
                                <UserIcon className="w-8 h-8" />
                            </div>
                            <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">
                                {initialProfile?.setupCompleted ? 'Modifier votre Profil' : 'Création de votre compte WorksBox'}
                            </h2>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">
                                Indiquez votre nom d'affichage public et choisissez votre photo de profil.
                            </p>
                        </div>

                        <div className="bg-slate-50 dark:bg-slate-800/80 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 mb-5 flex items-center justify-between">
                            <div className="flex items-center space-x-3 min-w-0">
                                <GoogleIcon className="w-5 h-5 shrink-0" />
                                <div className="min-w-0">
                                    <span className="text-[10px] font-bold uppercase text-slate-400 dark:text-slate-500 block">Compte Google</span>
                                    <span className="text-xs font-bold text-slate-800 dark:text-slate-200 truncate block">{user?.email}</span>
                                </div>
                            </div>
                            <span className="px-2.5 py-1 bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 rounded-full text-[10px] font-extrabold shrink-0 border border-emerald-300 dark:border-emerald-800">
                                ✓ Authentifié
                            </span>
                        </div>

                        {validationError && (
                            <div className="mb-4 p-3 bg-red-50 dark:bg-red-950/80 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-300 text-xs font-medium rounded-xl flex items-center space-x-2">
                                <AlertCircle className="w-4 h-4 shrink-0 text-red-500" />
                                <span>{validationError}</span>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-5">
                            
                            <div>
                                <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-1.5 flex items-center justify-between">
                                    <span>Nom d'affichage <span className="text-red-500">*</span></span>
                                    <span className="text-[10px] font-normal text-slate-400">Requis</span>
                                </label>
                                <input 
                                    type="text"
                                    value={displayName}
                                    onChange={(e) => { setDisplayName(e.target.value); setValidationError(null); }}
                                    placeholder="Ex: Roman, Lucas_STI2D, Alex..."
                                    required
                                    className="w-full px-4 py-3 text-sm bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-2xl focus:border-blue-500 focus:bg-white dark:focus:bg-slate-900 outline-none transition-all font-bold text-slate-900 dark:text-white"
                                />
                                <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">
                                    Ce nom sera affiché sur votre profil, vos notes et vos commentaires.
                                </p>
                            </div>

                            <div>
                                <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-2 flex items-center justify-between">
                                    <span>Photo de profil <span className="text-slate-400 font-normal">(Optionnel)</span></span>
                                </label>

                                <div className="flex items-center space-x-4 p-3.5 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700 mb-3">
                                    <div className="relative shrink-0">
                                        {photoURL ? (
                                            <img src={photoURL} alt="Aperçu Avatar" className="w-16 h-16 rounded-2xl object-cover border-2 border-blue-500 shadow-md" />
                                        ) : (
                                            <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center text-2xl font-black shadow-md">
                                                {(displayName || user?.displayName || 'E')[0].toUpperCase()}
                                            </div>
                                        )}
                                    </div>
                                    <div className="text-xs space-y-1">
                                        <span className="font-bold text-slate-800 dark:text-slate-200 block">Aperçu de votre photo</span>
                                        <span className="text-[11px] text-slate-500 dark:text-slate-400 block">
                                            {photoURL ? "Photo personnalisée sélectionnée" : "Aucune photo choisie (initiale de votre prénom par défaut)"}
                                        </span>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {user?.photoURL && (
                                        <button
                                            type="button"
                                            onClick={() => { setPhotoURL(user.photoURL); setPhotoSource('google'); }}
                                            className={`w-full p-2.5 rounded-xl border text-xs font-bold transition flex items-center justify-between ${
                                                photoSource === 'google' && photoURL === user.photoURL
                                                    ? 'bg-blue-50 dark:bg-blue-950/80 border-blue-500 text-blue-700 dark:text-blue-300'
                                                    : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-750'
                                            }`}
                                        >
                                            <span className="flex items-center space-x-2">
                                                <GoogleIcon className="w-4 h-4" />
                                                <span>Utiliser ma photo Google</span>
                                            </span>
                                            {photoSource === 'google' && photoURL === user.photoURL && <Check className="w-4 h-4 text-blue-600" />}
                                        </button>
                                    )}

                                    <div>
                                        <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 block mb-1.5">
                                            Ou choisir un avatar illustré :
                                        </span>
                                        <div className="grid grid-cols-4 gap-2">
                                            {AVATAR_PRESETS.map((preset) => {
                                                const presetUrl = generateSvgAvatar(preset.emoji, preset.bg1, preset.bg2);
                                                const isSelected = photoURL === presetUrl;
                                                return (
                                                    <button
                                                        key={preset.id}
                                                        type="button"
                                                        onClick={() => { setPhotoURL(presetUrl); setPhotoSource('preset'); }}
                                                        className={`p-2 rounded-xl border flex flex-col items-center justify-center transition-all cursor-pointer ${
                                                            isSelected
                                                                ? 'bg-blue-100 dark:bg-blue-950 border-blue-500 ring-2 ring-blue-500/50 scale-105'
                                                                : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-750'
                                                        }`}
                                                    >
                                                        <span className="text-2xl mb-0.5">{preset.emoji}</span>
                                                        <span className="text-[9px] font-bold text-slate-600 dark:text-slate-300 truncate w-full text-center">{preset.name}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="flex items-center space-x-2 pt-1">
                                        <label className="flex-1 cursor-pointer py-2.5 px-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 rounded-xl text-xs font-bold transition text-center flex items-center justify-center space-x-2">
                                            <UploadCloud className="w-4 h-4 text-blue-500" />
                                            <span>Importer une photo...</span>
                                            <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                                        </label>
                                        {photoURL && (
                                            <button
                                                type="button"
                                                onClick={() => { setPhotoURL(''); setPhotoSource('none'); }}
                                                className="py-2.5 px-3 bg-red-50 dark:bg-red-950/60 hover:bg-red-100 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900 rounded-xl text-xs font-bold transition flex items-center space-x-1 cursor-pointer"
                                                title="Effacer la photo"
                                            >
                                                <Trash2 className="w-4 h-4" />
                                                <span>Effacer</span>
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                                <div>
                                    <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-1">
                                        Établissement
                                    </label>
                                    <select 
                                        value={selectedSchool}
                                        onChange={(e) => setSelectedSchool(e.target.value)}
                                        className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 outline-none cursor-pointer"
                                    >
                                        {(schools.length > 0 ? schools : ["Lycée François Bazin", "Lycée Gaspard Monge"]).map(s => (
                                            <option key={s} value={s}>{s}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wide mb-1">
                                        Classe
                                    </label>
                                    <select 
                                        value={selectedClass}
                                        onChange={(e) => setSelectedClass(e.target.value)}
                                        className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 outline-none cursor-pointer"
                                    >
                                        {(classes.length > 0 ? classes : ["Terminale STI2D", "Première STI2D", "BTS SIO 1", "BTS CPRP", "Seconde Générale/Technologique"]).map(c => (
                                            <option key={c} value={c}>{c}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <button
                                type="submit"
                                disabled={isSaving || !displayName.trim()}
                                className="w-full py-3.5 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-[0.99] transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer flex items-center justify-center space-x-2"
                            >
                                {isSaving ? (
                                    <>
                                        <RefreshCw className="w-4 h-4 animate-spin" />
                                        <span>Enregistrement du profil...</span>
                                    </>
                                ) : (
                                    <>
                                        <Check className="w-5 h-5" />
                                        <span>{initialProfile?.setupCompleted ? 'Enregistrer les modifications' : 'Créer mon profil et démarrer'}</span>
                                    </>
                                )}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function AuthModal({ onClose, onGoogleSignIn, onLocalSignIn, isLoading, error, onToast }) {
            const [studentName, setStudentName] = useState(() => {
                const saved = localStorage.getItem('wb_student_name');
                return saved || '';
            });
            const [copiedDomain, setCopiedDomain] = useState(false);
            const isUnauthorizedDomain = error && (
                (typeof error === 'object' && error.code === 'auth/unauthorized-domain') ||
                (typeof error === 'string' && error.includes('unauthorized-domain'))
            );
            const isOperationNotAllowed = error && (
                (typeof error === 'object' && error.code === 'auth/operation-not-allowed') ||
                (typeof error === 'string' && error.includes('operation-not-allowed'))
            );
            const currentHost = window.location.hostname;
            const isInIframe = window.self !== window.top;

            const handleLocalSubmit = (e) => {
                e.preventDefault();
                const nameToUse = studentName.trim() || 'Élève';
                localStorage.setItem('wb_student_name', nameToUse);
                onLocalSignIn(nameToUse);
            };

            return (
                <div id="auth-modal" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 border border-slate-100 dark:border-slate-800 flex flex-col relative animate-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto">
                        <button 
                            id="btn-close-auth"
                            onClick={onClose} 
                            className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors"
                        >
                            <X className="w-5 h-5" />
                        </button>

                        <div className="text-center mb-5 pt-1">
                            <div className="w-14 h-14 bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-sm">
                                <UserIcon className="w-7 h-7" />
                            </div>
                            <h2 className="text-2xl font-black text-slate-900 dark:text-white">Connexion</h2>
                            <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Connectez-vous pour vos cours favoris et votre Cloud Google Drive (1 Go inclus).</p>
                        </div>

                        {/* Erreur spécifique Fournisseur Google non activé dans Firebase */}
                        {isOperationNotAllowed ? (
                            <div className="mb-5 p-4 bg-amber-50/90 dark:bg-amber-950/70 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200 text-xs rounded-2xl space-y-3 animate-in fade-in">
                                <div className="flex items-start space-x-2.5">
                                    <AlertCircle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                                    <div>
                                        <p className="font-bold text-slate-900 dark:text-white text-sm">Fournisseur Google non activé</p>
                                        <p className="mt-1 text-slate-600 dark:text-slate-300 leading-relaxed">
                                            La connexion avec Google n'est pas encore activée dans la console Firebase pour le projet <strong>lycee-share</strong>.
                                        </p>
                                        <ol className="list-decimal list-inside mt-2 space-y-1 text-slate-700 dark:text-slate-300 font-medium">
                                            <li>Ouvrez la console Firebase (lien ci-dessous).</li>
                                            <li>Allez dans <em>Authentication</em> &gt; <em>Sign-in method</em>.</li>
                                            <li>Cliquez sur <strong>Google</strong>, activez le bouton et validez.</li>
                                        </ol>
                                    </div>
                                </div>
                                <div className="pt-1">
                                    <a 
                                        href="https://console.firebase.google.com/project/lycee-share/authentication/providers" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center justify-center px-3.5 py-2 bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white rounded-xl font-bold text-[11px] transition-colors shadow-sm"
                                    >
                                        <span>Activer Google dans Firebase Console</span>
                                        <ExternalLink className="w-3.5 h-3.5 ml-1.5" />
                                    </a>
                                </div>
                            </div>
                        ) : isUnauthorizedDomain ? (
                            <div className="mb-5 p-4 bg-amber-50/90 dark:bg-amber-950/70 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200 text-xs rounded-2xl space-y-3 animate-in fade-in">
                                <div className="flex items-start space-x-2.5">
                                    <AlertCircle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                                    <div>
                                        <p className="font-bold text-slate-900 dark:text-white text-sm">Domaine à autoriser dans Firebase</p>
                                        <p className="mt-1 text-slate-600 dark:text-slate-300 leading-relaxed">
                                            Pour activer la connexion Google, ce domaine doit être ajouté aux <strong>Domaines autorisés</strong> de Firebase (projet <code>lycee-share</code>).
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="bg-white/95 dark:bg-slate-800/95 p-2.5 rounded-xl border border-amber-200 dark:border-amber-800 space-y-2">
                                    <div className="flex items-center justify-between">
                                        <span className="font-mono font-semibold text-slate-800 dark:text-slate-200 text-[11px] truncate mr-2">{currentHost}</span>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                 navigator.clipboard.writeText(currentHost);
                                                 setCopiedDomain(true);
                                                 setTimeout(() => setCopiedDomain(false), 2000);
                                                 if (onToast) onToast("Domaine copié dans le presse-papiers !", "success", "copy");
                                            }}
                                            className="flex items-center space-x-1 px-2.5 py-1 bg-amber-100 dark:bg-amber-900 hover:bg-amber-200 dark:hover:bg-amber-800 text-amber-800 dark:text-amber-200 font-bold rounded-lg text-[10px] transition-colors whitespace-nowrap"
                                        >
                                            <span>{copiedDomain ? '✓ Copié !' : 'Copier le domaine'}</span>
                                        </button>
                                    </div>
                                    {currentHost.includes('-dev-') && (
                                        <div className="flex items-center justify-between pt-1 border-t border-slate-100 dark:border-slate-750">
                                            <span className="font-mono text-slate-500 dark:text-slate-400 text-[10px] truncate mr-2">
                                                {currentHost.replace('-dev-', '-pre-')} (domaine partagé)
                                            </span>
                                            <button
                                                type="button"
                                                onClick={() => {
                                                     const preDomain = currentHost.replace('-dev-', '-pre-');
                                                     navigator.clipboard.writeText(preDomain);
                                                     if (onToast) onToast("Domaine partagé (-pre-) copié !", "success", "copy");
                                                }}
                                                className="text-[10px] font-bold text-amber-700 dark:text-amber-300 hover:underline"
                                            >
                                                Copier
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <ol className="list-decimal list-inside space-y-1 text-[11px] text-slate-600 dark:text-slate-300 bg-white/60 dark:bg-slate-900/50 p-2.5 rounded-xl border border-amber-200/50 dark:border-amber-800/50">
                                    <li>Copiez le domaine ci-dessus.</li>
                                    <li>Cliquez sur <strong>Ouvrir la Console Firebase</strong> ci-dessous.</li>
                                    <li>Dans <em>Paramètres</em> &gt; <em>Domaines autorisés</em>, cliquez sur <strong>Ajouter un domaine</strong> et collez l'adresse.</li>
                                </ol>

                                <div className="pt-1 flex flex-col sm:flex-row gap-2">
                                    <a 
                                        href="https://console.firebase.google.com/project/lycee-share/authentication/settings" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center justify-center px-3 py-2 bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white rounded-xl font-bold text-[11px] transition-colors"
                                    >
                                        <span>Ouvrir la Console Firebase</span>
                                        <ExternalLink className="w-3.5 h-3.5 ml-1.5" />
                                    </a>
                                    {isInIframe && (
                                        <a
                                            href={window.location.href}

        function FileTypeBadge({ fileType, mediaType }) {
            const ext = (fileType || '').toLowerCase().replace(/^\./, '');
            const media = mediaType || '';

            if (media === 'video' || ext === 'mp4' || ext === 'webm' || ext === 'mkv') {
                return (

                    </span>
                );
            }
            if (media === 'audio' || ext === 'mp3' || ext === 'wav' || ext === 'm4a') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-purple-100 text-purple-700 border border-purple-200 uppercase tracking-wider">
                        <MusicIcon className="w-2.5 h-2.5 mr-1" /> {ext ? ext.toUpperCase() : 'AUDIO'}
                    </span>
                );
            }
            if (media === 'casio' || ext === 'g1m' || ext === 'txt') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-emerald-100 text-emerald-800 border border-emerald-200 uppercase tracking-wider">
                        <Calculator className="w-2.5 h-2.5 mr-1" /> {ext ? ext.toUpperCase() : 'CASIO'}
                    </span>
                );
            }
            if (media === 'presentation' || ext === 'pptx' || ext === 'ppt') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-orange-100 text-orange-700 border border-orange-200 uppercase tracking-wider">
                        <FileText className="w-2.5 h-2.5 mr-1" /> PPTX
                    </span>
                );
            }
            if (media === 'spreadsheet' || ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-green-100 text-green-700 border border-green-200 uppercase tracking-wider">
                        <FileText className="w-2.5 h-2.5 mr-1" /> XLSX
                    </span>
                );
            }
            if (media === 'image' || ['png', 'jpg', 'jpeg', 'webp', 'svg'].includes(ext)) {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-amber-100 text-amber-700 border border-amber-200 uppercase tracking-wider">
                        <ImageIcon className="w-2.5 h-2.5 mr-1" /> {ext ? ext.toUpperCase() : 'IMAGE'}
                    </span>
                );
            }
            if (ext === 'pdf') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-blue-100 text-blue-700 border border-blue-200 uppercase tracking-wider">
                        <FileText className="w-2.5 h-2.5 mr-1" /> PDF
                    </span>
                );
            }
            if (ext) {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 uppercase tracking-wider">
                        {ext.toUpperCase()}
                    </span>
                );
            }
            return null;
        }

        // === ÉDITEUR DE COURS & NOTES WORKSBOX NOTE (Style Word 365 avec Ruban & Backstage Fichier) ===
        function WorksBoxNoteEditor({ 
            note, 
            activeSubjects = [], 
            cloudBreadcrumbs = [], 
            cloudFiles = [],
            onCreateCloudFolder,
            driveToken, 
            activeUser, 
            autosaveStatus, 
            lastSavedTime, 
            notesList = [], 
            onSave, 
            onClose, 
            onDelete, 
            onCreateNew, 
            onOpenNote, 
            onExportPDF, 
            onExportFile,
            showToast 
        }) {
            const [activeTab, setActiveTab] = useState('Accueil');
            const [title, setTitle] = useState(note?.title || 'Nouvelle note');
            const [subject, setSubject] = useState(note?.subject || (activeSubjects[0]?.name || 'Général'));
            const [chapter, setChapter] = useState(note?.chapter || '');
            const [selectedFolder, setSelectedFolder] = useState(note?.folderName || 'WorksBox Cloud');
            const [newFolderNameInput, setNewFolderNameInput] = useState('');
            const [wordCount, setWordCount] = useState(0);
            const [charCount, setCharCount] = useState(0);
            const [editorMode, setEditorMode] = useState('edit'); // 'edit', 'read', 'review'
            const [showComments, setShowComments] = useState(false);
            const [comments, setComments] = useState(() => note?.comments || []);
            const [newCommentText, setNewCommentText] = useState('');
            const [showShareModal, setShowShareModal] = useState(false);
            const [showSearchModal, setShowSearchModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [replaceQuery, setReplaceQuery] = useState('');
            const [isListening, setIsListening] = useState(false);
            const [fontFamily, setFontFamily] = useState('Aptos');
            const [fontSize, setFontSize] = useState('12');
            const [pageZoom, setPageZoom] = useState(100);
            const [pageColor, setPageColor] = useState('#ffffff');
            const [pageWatermark, setPageWatermark] = useState('');
            const [showNotesDrawer, setShowNotesDrawer] = useState(false);
            const [pageWidthMode, setPageWidthMode] = useState(() => {
                try {
                    return localStorage.getItem('worksbox_note_width_mode') || 'full';
                } catch(e) {
                    return 'full';
                }
            });
            const [pageMargins, setPageMargins] = useState('normal'); // 'compact', 'normal', 'wide'
            const [isFullscreen, setIsFullscreen] = useState(false);

            useEffect(() => {
                const handleFsChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);
                };
                document.addEventListener('fullscreenchange', handleFsChange);
                return () => document.removeEventListener('fullscreenchange', handleFsChange);
            }, []);

            const toggleBrowserFullscreen = () => {
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        document.exitFullscreen().catch(() => {});
                    }
                } catch(e) {}
            };

            const changePageWidthMode = (mode) => {
                setPageWidthMode(mode);
                try {
                    localStorage.setItem('worksbox_note_width_mode', mode);
                } catch(e) {}
            };
            const editorRef = React.useRef(null);
            const saveDebounceRef = React.useRef(null);
            const recognitionRef = React.useRef(null);

            const noteContentRef = React.useRef(note?.content || '<p>Commencez à rédiger vos notes ici...</p>');

            useEffect(() => {
                if (note) {
                    setTitle(note.title || 'Nouvelle note');
                    setSubject(note.subject || (activeSubjects[0]?.name || 'Général'));
                    setChapter(note.chapter || '');
                    setSelectedFolder(note.folderName || 'WorksBox Cloud');
                    setComments(note.comments || []);
                    noteContentRef.current = note.content || '<p>Commencez à rédiger vos notes ici...</p>';
                }
            }, [note?.id]);

            // Synchronisation et initialisation garantie du contenu et du curseur
            useEffect(() => {
                if (activeTab !== 'Fichier' && editorRef.current) {
                    if (!editorRef.current.innerHTML || editorRef.current.innerHTML.trim() === '') {
                        editorRef.current.innerHTML = noteContentRef.current;
                    }
                    calculateCounts(editorRef.current.innerHTML);
                    // Focus automatique pour faire apparaître le curseur noir clignotant immédiatement
                    if (editorMode !== 'read') {
                        setTimeout(() => {
                            try {
                                editorRef.current?.focus();
                            } catch (e) {}
                        }, 50);
                    }
                }
            }, [activeTab, note?.id, editorMode]);

            const calculateCounts = (html) => {
                const text = (html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
                setCharCount(text.length);
                setWordCount(text ? text.split(/\s+/).length : 0);
            };

            const triggerAutoSave = (updatedHtml, customTitle = title, customSubj = subject, customChap = chapter, customFolder = selectedFolder, customComments = comments) => {
                calculateCounts(updatedHtml);
                if (saveDebounceRef.current) clearTimeout(saveDebounceRef.current);
                saveDebounceRef.current = setTimeout(() => {
                    const payload = {
                        ...note,
                        title: customTitle,
                        subject: customSubj,
                        chapter: customChap,
                        content: updatedHtml,
                        folderName: customFolder,
                        comments: customComments,
                        updatedAt: new Date().toISOString()
                    };
                    onSave(payload, true);
                }, 1000);
            };

            const handleEditorInput = () => {
                if (!editorRef.current) return;
                triggerAutoSave(editorRef.current.innerHTML);
            };

            const exec = (cmd, val = null) => {
                document.execCommand(cmd, false, val);
                if (editorRef.current) {
                    editorRef.current.focus();
                    triggerAutoSave(editorRef.current.innerHTML);
                }
            };

            const applyStyleBlock = (tag, color = null, fontSizeStyle = null, weight = null) => {
                if (tag === 'p') {
                    exec('formatBlock', '<p>');
                } else if (tag.startsWith('h')) {
                    exec('formatBlock', `<${tag}>`);
                } else if (tag === 'blockquote') {
                    exec('formatBlock', '<blockquote>');
                }
                if (color) exec('foreColor', color);
            };

            const insertHtmlSnippet = (snippet) => {
                if (window.getSelection) {
                    const sel = window.getSelection();
                    if (sel.getRangeAt && sel.rangeCount) {
                        let range = sel.getRangeAt(0);
                        range.deleteContents();
                        const el = document.createElement("div");
                        el.innerHTML = snippet;
                        const frag = document.createDocumentFragment();
                        let node, lastNode;
                        while ((node = el.firstChild)) {
                            lastNode = frag.appendChild(node);
                        }
                        range.insertNode(frag);
                        if (lastNode) {
                            range = range.cloneRange();
                            range.setStartAfter(lastNode);
                            range.collapse(true);
                            sel.removeAllRanges();
                            sel.addRange(range);
                        }
                    }
                } else {
                    document.execCommand('insertHTML', false, snippet);
                }
                if (editorRef.current) {
                    editorRef.current.focus();
                    triggerAutoSave(editorRef.current.innerHTML);
                }
            };

            const insertTable = (rows = 3, cols = 3) => {
                let tbl = `<table style="width:100%; border-collapse:collapse; margin:16px 0; font-size:13px;"><thead><tr>`;
                for (let j = 0; j < cols; j++) {
                    tbl += `<th style="border:1px solid #cbd5e1; padding:8px 12px; background:#f1f5f9; text-align:left; font-weight:bold; color:#1e293b;">En-tête ${j + 1}</th>`;
                }
                tbl += `</tr></thead><tbody>`;
                for (let i = 0; i < rows - 1; i++) {
                    tbl += `<tr>`;
                    for (let j = 0; j < cols; j++) {
                        tbl += `<td style="border:1px solid #cbd5e1; padding:8px 12px; color:#334155;">Donnée</td>`;
                    }
                    tbl += `</tr>`;
                }
                tbl += `</tbody></table><p><br></p>`;
                insertHtmlSnippet(tbl);
            };

            const insertCallout = (type) => {
                let html = '';
                if (type === 'def') {
                    html = `<div style="background:#eff6ff; border-left:4px solid #3b82f6; padding:12px 16px; border-radius:8px; margin:14px 0; color:#1e3a8a;"><strong style="font-size:13px;">📘 Définition :</strong> <p style="margin:4px 0 0 0;">Saisissez la définition ici...</p></div><p><br></p>`;
                } else if (type === 'tip') {
                    html = `<div style="background:#ecfdf5; border-left:4px solid #10b981; padding:12px 16px; border-radius:8px; margin:14px 0; color:#064e3b;"><strong style="font-size:13px;">💡 À retenir :</strong> <p style="margin:4px 0 0 0;">Propriété clé du cours...</p></div><p><br></p>`;
                } else if (type === 'key') {
                    html = `<div style="background:#fef3c7; border-left:4px solid #f59e0b; padding:12px 16px; border-radius:8px; margin:14px 0; color:#78350f;"><strong style="font-size:13px;">⚡ Formule clé :</strong> <p style="margin:4px 0 0 0;">Ex: f'(x) = 2ax + b ou E = ½ m v²</p></div><p><br></p>`;
                } else if (type === 'warn') {
                    html = `<div style="background:#fff1f2; border-left:4px solid #f43f5e; padding:12px 16px; border-radius:8px; margin:14px 0; color:#881337;"><strong style="font-size:13px;">⚠️ Attention :</strong> <p style="margin:4px 0 0 0;">Attention aux cas particuliers et unités...</p></div><p><br></p>`;
                }
                insertHtmlSnippet(html);
            };

            const generateTableOfContents = () => {
                if (!editorRef.current) return;
                const headings = editorRef.current.querySelectorAll('h1, h2, h3');
                if (headings.length === 0) {
                    if (showToast) showToast('Aucun titre (Titre 1, Titre 2) détecté dans la note pour générer un sommaire.', 'info');
                    return;
                }
                let tocHtml = `<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px 20px; margin:16px 0;"><h3 style="margin:0 0 10px 0; font-size:15px; color:#1e40af; font-weight:bold;">📑 Sommaire du document</h3><ul style="list-style:none; padding-left:0; margin:0;">`;
                headings.forEach((h, idx) => {
                    const level = h.tagName.toLowerCase();
                    const indent = level === 'h1' ? '0px' : (level === 'h2' ? '18px' : '36px');
                    const num = level === 'h1' ? `${idx + 1}. ` : '';
                    tocHtml += `<li style="padding:4px 0; margin-left:${indent}; font-size:13px; color:#334155; border-bottom:1px dotted #cbd5e1;">${num}<strong>${h.innerText}</strong></li>`;
                });
                tocHtml += `</ul></div><p><br></p>`;
                insertHtmlSnippet(tocHtml);
                if (showToast) showToast('Sommaire inséré avec succès !', 'success');
            };

            const toggleSpeechRecognition = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    if (showToast) showToast('La reconnaissance vocale n\'est pas supportée par votre navigateur.', 'error');
                    return;
                }
                if (isListening) {
                    if (recognitionRef.current) recognitionRef.current.stop();
                    setIsListening(false);
                } else {
                    try {
                        const rec = new SpeechRecognition();
                        rec.lang = 'fr-FR';
                        rec.continuous = true;
                        rec.interimResults = false;
                        rec.onresult = (e) => {
                            const transcript = e.results[e.results.length - 1][0].transcript;
                            insertHtmlSnippet(`<span>${transcript} </span>`);
                        };
                        rec.onerror = (err) => {
                            console.warn('Speech error:', err);
                            setIsListening(false);
                        };
                        rec.onend = () => setIsListening(false);
                        rec.start();
                        recognitionRef.current = rec;
                        setIsListening(true);
                        if (showToast) showToast('Dictée vocale active : Parlez distinctement...', 'info');
                    } catch (e) {
                        setIsListening(false);
                    }
                }
            };

            const handleSearchReplace = () => {
                if (!searchQuery || !editorRef.current) return;
                const html = editorRef.current.innerHTML;
                const reg = new RegExp(searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                const newHtml = html.replace(reg, replaceQuery);
                editorRef.current.innerHTML = newHtml;
                triggerAutoSave(newHtml);
                if (showToast) showToast(`Remplacement effectué pour "${searchQuery}"`, 'success');
                setShowSearchModal(false);
            };

            const handleAddComment = () => {
                if (!newCommentText.trim()) return;
                const newC = {
                    id: Date.now().toString(),
                    author: activeUser?.displayName || 'Élève',
                    text: newCommentText.trim(),
                    createdAt: new Date().toISOString(),
                    resolved: false
                };
                const updated = [...comments, newC];
                setComments(updated);
                setNewCommentText('');
                if (editorRef.current) triggerAutoSave(editorRef.current.innerHTML, title, subject, chapter, selectedFolder, updated);
            };

            const availableFolders = useMemo(() => {
                const set = new Set(['WorksBox Cloud (Racine)', 'Mathématiques', 'Physique-Chimie', 'NSI', 'SVT', 'Histoire-Géographie', 'Français', 'Philosophie', 'Langues']);
                (cloudFiles || []).filter(f => f.mimeType === 'application/vnd.google-apps.folder').forEach(f => set.add(f.name));
                return Array.from(set);
            }, [cloudFiles]);

            const tabs = ['Accueil', 'Insertion', 'Conception', 'Mise en page', 'Références', 'Publipostage', 'Révision', 'Affichage', 'Aide'];

            return (
                <div className="space-y-3 view-transition pb-16 font-sans w-full">
                    {/* BARRE SUPÉRIEURE WORD 365 (Nom du document & État de sauvegarde au-dessus) */}
                    <div className="bg-slate-900 text-white rounded-2xl sm:rounded-3xl p-3 sm:px-6 sm:py-3 shadow-md border border-slate-800 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 w-full">
                        <div className="flex items-center space-x-3 min-w-0">
                            <button 
                                onClick={onClose}
                                className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition cursor-pointer flex-shrink-0"
                                title="Retour à WorksBox"
                            >
                                <ChevronLeft className="w-5 h-5" />
                            </button>
                            
                            <div className="p-2 bg-blue-600 text-white rounded-xl shadow-sm flex-shrink-0">
                                <FileText className="w-5 h-5" />
                            </div>

                            <div className="min-w-0 flex-1">
                                <div className="flex items-center space-x-2">
                                    <input 
                                        type="text" 
                                        value={title}
                                        onChange={(e) => {
                                            setTitle(e.target.value);
                                            if (editorRef.current) triggerAutoSave(editorRef.current.innerHTML, e.target.value);
                                        }}
                                        placeholder="Nom du document (ex: Cours de Dérivées...)"
                                        className="text-sm sm:text-base font-extrabold text-white bg-transparent outline-none border-b border-transparent focus:border-sky-400 transition-colors w-full max-w-sm sm:max-w-md truncate"
                                    />
                                </div>
                                <div className="flex items-center space-x-2 mt-0.5 text-xs text-slate-400">
                                    {/* Statut de sauvegarde Cloud dynamique */}
                                    <span className={`inline-flex items-center space-x-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                        autosaveStatus === 'saving'
                                            ? 'bg-amber-500/20 text-amber-300'
                                            : driveToken && activeUser && !activeUser.isLocal
                                                ? 'bg-emerald-500/20 text-emerald-300'
                                                : 'bg-sky-500/20 text-sky-300'
                                    }`}>
                                        {autosaveStatus === 'saving' ? (
                                            <>
                                                <RefreshCw className="w-2.5 h-2.5 animate-spin" />
                                                <span>Enregistrement en cours...</span>
                                            </>
                                        ) : driveToken && activeUser && !activeUser.isLocal ? (
                                            <>
                                                <Cloud className="w-2.5 h-2.5 text-emerald-400" />
                                                <span>Enregistré sur WorksBox Cloud ({lastSavedTime ? new Date(lastSavedTime).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : 'Synchronisé'})</span>
                                            </>
                                        ) : (
                                            <>
                                                <Check className="w-2.5 h-2.5 text-sky-400" />
                                                <span>Enregistré localement</span>
                                            </>
                                        )}
                                    </span>
                                    <span className="hidden sm:inline">•</span>
                                    <button 
                                        onClick={() => setActiveTab('Fichier')}
                                        className="hidden sm:inline-flex items-center text-[11px] text-slate-300 hover:text-sky-300 transition"
                                        title="Changer de dossier dans l'onglet Fichier"
                                    >
                                        <Folder className="w-3 h-3 mr-1 text-indigo-400" />
                                        <span>Dossier : <strong>{selectedFolder}</strong></span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Actions Rapides Supérieures (Pleine page, Plein écran, Commentaires, Mode, Partager) */}
                        <div className="flex items-center justify-end space-x-2 flex-shrink-0 flex-wrap gap-y-1.5">
                            {/* Sélecteur de largeur d'affichage Pleine Page / Large / A4 */}
                            <div className="bg-slate-800/90 border border-slate-700/80 rounded-xl p-0.5 flex items-center space-x-0.5" title="Changer la disposition de page">
                                <button
                                    onClick={() => changePageWidthMode('full')}
                                    className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 cursor-pointer ${
                                        pageWidthMode === 'full' 
                                            ? 'bg-blue-600 text-white shadow-sm ring-1 ring-blue-400/40' 
                                            : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                                    }`}
                                    title="Pleine page (100% de la largeur - Idéal pour travailler à l'aise)"
                                >
                                    <Maximize2 className="w-3.5 h-3.5" />
                                    <span className="hidden sm:inline">Pleine page</span>
                                </button>
                                <button
                                    onClick={() => changePageWidthMode('wide')}
                                    className={`px-2 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 cursor-pointer ${
                                        pageWidthMode === 'wide' 
                                            ? 'bg-blue-600 text-white shadow-sm ring-1 ring-blue-400/40' 
                                            : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                                    }`}
                                    title="Largeur confort (Centré large)"
                                >
                                    <span className="hidden sm:inline">Large</span>
                                    <span className="sm:hidden">L</span>
                                </button>
                                <button
                                    onClick={() => changePageWidthMode('a4')}
                                    className={`px-2 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 cursor-pointer ${
                                        pageWidthMode === 'a4' 
                                            ? 'bg-blue-600 text-white shadow-sm ring-1 ring-blue-400/40' 
                                            : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                                    }`}
                                    title="Format feuille A4 classique"
                                >
                                    <span>A4</span>
                                </button>
                            </div>

                            {/* Bouton Plein Écran Navigateur */}
                            <button
                                onClick={toggleBrowserFullscreen}
                                className={`p-1.5 sm:px-2.5 sm:py-1.5 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 cursor-pointer ${
                                    isFullscreen ? 'bg-sky-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'
                                }`}
