                                        <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-600 to-blue-800 text-white flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition-transform shrink-0">
                                            <FileText className="w-8 h-8" />
                                        </div>
                                        <span className="text-[11px] font-black uppercase tracking-wider px-2.5 py-1 bg-blue-500/15 text-blue-700 dark:text-blue-300 rounded-full border border-blue-400/30">
                                            Traitement de texte
                                        </span>
                                    </div>
                                    <h3 className="text-xl font-black text-slate-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                                        WorksBox Note
                                    </h3>
                                    <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mt-2.5 leading-relaxed min-h-[3.5rem]">
                                        Éditeur de documents et de cours complet avec ruban d'outils, formules mathématiques, dictée vocale, sommaire automatique et exportations PDF/Casio.
                                    </p>
                                </div>
                                <div className="mt-6 pt-4 border-t border-slate-200/50 dark:border-white/10 space-y-3">
                                    <div className="flex items-center justify-between text-xs text-slate-400">
                                        <span className="flex items-center"><span className="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1.5 animate-pulse"></span>Auto-Save Cloud</span>
                                        <span className="font-semibold">{notesList.length} note(s)</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 pt-0.5">
                                        <button 
                                            onClick={() => {
                                                if (notesList.length > 0) onOpenNote(notesList[0]);
                                                else onCreateNewNote();
                                            }}

                                    <div className="flex items-start justify-between mb-4">
                                        <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-rose-500 to-pink-600 text-white flex items-center justify-center shadow-lg shadow-rose-500/30 group-hover:scale-105 transition-transform shrink-0">
                                            <Sigma className="w-8 h-8" />
                                        </div>
                                        <span className="text-[11px] font-black uppercase tracking-wider px-2.5 py-1 bg-rose-500/15 text-rose-700 dark:text-rose-300 rounded-full border border-rose-400/30">

                                        onClick={onCreateNewNote}
                                        className="w-full py-2.5 px-3 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white font-bold rounded-xl text-xs transition text-center shadow-md shadow-rose-500/20 active:scale-95 cursor-pointer"
                                    >
                                        Créer une fiche mémo

                                </div>
                            </div>
                        </div>
                    </div>

                    {/* SECTION : DOCUMENTS ET ACTIVITÉS RÉCENTES (STYLE HUB OFFICE 365) */}
                    <div className="liquid-glass rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-white/40 dark:border-white/10">
                            <div>
                                <h3 className="text-lg sm:text-xl font-black text-slate-900 dark:text-white flex items-center">
                                    <Clock className="w-5 h-5 mr-2 text-blue-500" />
                                    Documents & Fichiers récents
                                </h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Retrouvez rapidement vos notes rédigées, fichiers Google Drive et cours consultés.</p>
                            </div>

                            {/* Filtres par onglet style Office 365 */}
                            <div className="flex items-center liquid-glass-pill p-1 rounded-2xl text-xs font-bold">
                                <button 
                                    onClick={() => setRecentFilter('all')}
                                    className={`px-3.5 py-1.5 rounded-xl transition cursor-pointer ${recentFilter === 'all' ? 'bg-blue-600 text-white shadow-xs font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}`}
                                >
                                    Tous ({recentItems.length})
                                </button>
                                <button 
                                    onClick={() => setRecentFilter('notes')}
                                    className={`px-3.5 py-1.5 rounded-xl transition cursor-pointer ${recentFilter === 'notes' ? 'bg-blue-600 text-white shadow-xs font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}`}
                                >
                                    Notes ({notesList.length})
                                </button>
                                <button 
                                    onClick={() => setRecentFilter('cloud')}
                                    className={`px-3.5 py-1.5 rounded-xl transition cursor-pointer ${recentFilter === 'cloud' ? 'bg-blue-600 text-white shadow-xs font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}`}
                                >
                                    Cloud ({cloudFiles.length})
                                </button>
                                <button 
                                    onClick={() => setRecentFilter('favorites')}
                                    className={`px-3.5 py-1.5 rounded-xl transition cursor-pointer ${recentFilter === 'favorites' ? 'bg-blue-600 text-white shadow-xs font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}`}
                                >
                                    Favoris ({favorites.length})
                                </button>
                            </div>
                        </div>

                        {/* Liste des fichiers récents */}
                        {filteredRecents.length === 0 ? (
                            <div className="py-12 text-center text-slate-400 space-y-3">
                                <FileText className="w-12 h-12 mx-auto text-slate-300 dark:text-slate-700 opacity-60" />
                                <p className="text-sm font-medium">Aucun document récent dans cette catégorie.</p>
                                <button 
                                    onClick={onCreateNewNote}
                                    className="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold transition inline-flex items-center space-x-1.5 cursor-pointer shadow-md shadow-blue-500/20"
                                >
                                    <FilePlus className="w-4 h-4" />
                                    <span>Créer un premier document</span>
                                </button>
                            </div>
                        ) : (
                            <div className="divide-y divide-white/60 dark:divide-white/10">
                                {filteredRecents.map(item => (
                                    <div 
                                        key={item.id}
                                        onClick={() => {
                                            if (item.type === 'note') onOpenNote(item.raw);
                                            else if (item.type === 'cloud') onOpenCloud();
                                            else if (item.type === 'course') onOpenFavorites();
                                        }}
                                        className="py-3.5 px-3 -mx-3 hover:bg-white/50 dark:hover:bg-white/5 rounded-2xl transition cursor-pointer flex items-center justify-between gap-4 group"
                                    >
                                        <div className="flex items-center space-x-3.5 min-w-0 flex-1">
                                            <div className={`p-2.5 rounded-xl flex-shrink-0 border ${
                                                item.type === 'note' 
                                                    ? 'bg-blue-500/15 text-blue-600 dark:text-blue-400 border-blue-400/30' 
                                                    : item.type === 'cloud'
                                                        ? 'bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 border-indigo-400/30'
                                                        : 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-400/30'
                                            }`}>
                                                {item.type === 'note' && <FileText className="w-5 h-5" />}
                                                {item.type === 'cloud' && <CloudIcon className="w-5 h-5" />}
                                                {item.type === 'course' && <Star className="w-5 h-5" />}
                                            </div>
                                            <div className="min-w-0 flex-1">
                                                <h4 className="text-sm font-bold text-slate-900 dark:text-white truncate group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                                                    {item.title}

                                                    <span className="font-semibold text-blue-600 dark:text-blue-400">{item.subject}</span>
                                                    <span>•</span>
                                                    <span>📁 {item.folder}</span>
                                                    <span>•</span>
                                                    <span>Modifié le {new Date(item.updatedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-center space-x-2 flex-shrink-0">
                                            <span className="text-xs font-bold text-blue-600 dark:text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity hidden sm:inline">
                                                Ouvrir &rarr;
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function CourseListItem({ course, handleView, tagColors, isFav, toggleFav, showSubject = false, onCopy, onShare, onSaveToCloud, onTakeNotes }) {
            const courseTag = course.tag || 'Cours';
            const style = COLOR_PALETTES[tagColors?.[courseTag]] || COLOR_PALETTES.slate;
            return (
                <li className="p-4 sm:p-5 hover:bg-white/60 dark:hover:bg-white/5 transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-4 group">
                    <div className="flex items-start sm:items-center space-x-3.5 flex-1 min-w-0">
                        <button 
                            onClick={toggleFav} 
                            className="text-slate-400 dark:text-slate-400 hover:text-amber-400 transition-colors p-2 rounded-2xl hover:bg-white/80 dark:hover:bg-white/10 cursor-pointer shrink-0"
                            title={isFav ? "Retirer des favoris" : "Ajouter aux favoris"}
                        >
                            <Star className="w-5 h-5" filled={isFav} />
                        </button>
                        <div className="min-w-0 flex-1">
                            <div className="flex items-center space-x-2 mb-1 flex-wrap gap-1">
                                {showSubject && (
                                    <span className="text-[10px] font-black px-2.5 py-0.5 rounded-full liquid-glass-pill text-blue-700 dark:text-blue-300 border border-blue-400/30">
                                        {course.subject}
                                    </span>
                                )}
                                <span className={`text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider ${style}`}>{courseTag}</span>
                                <FileTypeBadge fileType={course.fileType} mediaType={course.mediaType} />
                            </div>
                            <h4 className="text-sm sm:text-base font-bold text-slate-900 dark:text-white leading-snug break-words group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                                {course.title}
                            </h4>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2 flex-wrap gap-1.5 shrink-0 pl-10 md:pl-0">
                        {course.digitalLink && (
                            <button 
                                onClick={() => handleView(course, 'Numérique')} 
                                className="px-3 py-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold flex items-center shadow-xs transition active:scale-95 cursor-pointer"
                            >
                                <Eye className="w-3.5 h-3.5 mr-1"/> PDF
                            </button>
                        )}
                        {course.casioLink && (
                            <button 
                                onClick={() => handleView(course, 'Casio')} 
                                className="px-3 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-bold flex items-center shadow-xs transition active:scale-95 cursor-pointer"
                            >
                                <Calculator className="w-3.5 h-3.5 mr-1"/> Casio
                            </button>
                        )}
                        {course.videoLink && (
                            <button 
                                onClick={() => handleView(course, 'Vidéo')} 
                                className="px-3 py-1.5 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white rounded-xl text-xs font-bold flex items-center shadow-xs transition active:scale-95 cursor-pointer"
                            >
                                <VideoIcon className="w-3.5 h-3.5 mr-1"/> Vidéo
                            </button>
                        )}
                        {course.imageLink && (
                            <button 
                                onClick={() => handleView(course, 'Image')} 
                                className="px-3 py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white rounded-xl text-xs font-bold flex items-center shadow-xs transition active:scale-95 cursor-pointer"
                            >
                                <ImageIcon className="w-3.5 h-3.5 mr-1"/> Image
                            </button>
                        )}
                        {course.audioLink && (
                            <button 
                                onClick={() => handleView(course, 'Audio')} 
                                className="px-3 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold flex items-center shadow-xs transition active:scale-95 cursor-pointer"
                            >
                                <MusicIcon className="w-3.5 h-3.5 mr-1"/> Audio
                            </button>
                        )}
                        {onTakeNotes && (
                            <button 
                                type="button"
                                onClick={() => onTakeNotes(course)}
                                className="px-2.5 py-1.5 liquid-glass-btn text-sky-600 dark:text-sky-300 rounded-xl text-xs font-bold flex items-center cursor-pointer transition active:scale-95"
                                title="Prendre des notes sur ce cours dans WorksBox Note"
                            >
                                <PenTool className="w-3.5 h-3.5 mr-1 text-sky-500" />
                                <span>Note</span>
                            </button>
                        )}
                        {onSaveToCloud && (
                            <button 
                                type="button"
                                onClick={onSaveToCloud}
                                className="px-2.5 py-1.5 liquid-glass-btn text-indigo-600 dark:text-indigo-300 rounded-xl text-xs font-bold flex items-center cursor-pointer transition active:scale-95"
                                title="Sauvegarder ce cours dans mon Google Drive (1 Go)"
                            >
                                <Cloud className="w-3.5 h-3.5 mr-1 text-indigo-500" />
                                <span>Drive</span>
                            </button>
                        )}
                        <button 
                            type="button"
                            onClick={() => onShare ? onShare(course) : (onCopy ? onCopy(course) : null)} 
                            className="px-3 py-1.5 liquid-glass-btn text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-300 rounded-xl text-xs font-bold flex items-center cursor-pointer transition active:scale-95"
                            title="Partager ce cours (copier le lien direct)"
                        >
                            <Share2 className="w-3.5 h-3.5 mr-1.5 text-blue-500" />
                            <span>Partager</span>
                        </button>
                    </div>
                </li>
            );
        }

        function ChapterBlock({ chapter, chapterCourses, handleView, tagColors, favorites, toggleFav, onCopyCourse, onShareCourse, onSaveCourseToCloud, onTakeNotesCourse }) {
            const [isExpanded, setIsExpanded] = useState(chapterCourses.length <= 1);
            return (
                <div className="liquid-glass-card rounded-3xl overflow-hidden shadow-md transition-all duration-200">
                    <button
                        type="button"
                        id={`chapter-header-${chapter.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase()}`}
                        aria-expanded={isExpanded}
                        className="w-full text-left bg-white/40 dark:bg-slate-900/40 border-b border-white/60 dark:border-white/10 px-5 sm:px-6 py-4 cursor-pointer hover:bg-white/60 dark:hover:bg-white/10 flex justify-between items-center transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" 
                        onClick={() => setIsExpanded(!isExpanded)}
                    >
                        <div className="flex items-center space-x-3 pr-4 min-w-0">
                            <h2 className="text-base sm:text-lg font-black text-slate-900 dark:text-white transition-colors truncate">{chapter}</h2>
                            <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full liquid-glass-pill text-slate-700 dark:text-slate-300 whitespace-nowrap shrink-0">
                                {chapterCourses.length} {chapterCourses.length > 1 ? 'fiches' : 'fiche'}
                            </span>
                        </div>
                        <div className="p-1.5 rounded-xl text-slate-500 dark:text-slate-400 liquid-glass-btn transition-colors shrink-0">
                            <ChevronDown className={`w-4 h-4 sm:w-5 sm:h-5 transition-transform duration-300 ease-out ${isExpanded ? 'rotate-180 text-blue-600 dark:text-blue-400' : 'rotate-0'}`} />
                        </div>
                    </button>
                    <div className={`chapter-accordion-grid ${isExpanded ? 'expanded' : ''}`}>
                        <div className="chapter-accordion-inner">
                            <ul className="divide-y divide-white/60 dark:divide-white/10">
                                {chapterCourses.map(course => (
                                    <CourseListItem 
                                        key={course.id} 
                                        course={course} 
                                        handleView={handleView} 
                                        tagColors={tagColors} 
                                        isFav={favorites.includes(course.id)} 
                                        toggleFav={() => toggleFav(course.id)} 
                                        onCopy={onCopyCourse ? () => onCopyCourse(course) : undefined}
                                        onShare={onShareCourse ? () => onShareCourse(course) : (onCopyCourse ? () => onCopyCourse(course) : undefined)}
                                        onSaveToCloud={onSaveCourseToCloud ? () => onSaveCourseToCloud(course) : undefined}
                                        onTakeNotes={onTakeNotesCourse ? () => onTakeNotesCourse(course) : undefined}
                                    />
                                ))}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        function CourseCardSkeleton() {
            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm relative">
                    <div className="flex justify-between items-start mb-3">
                        <div className="skeleton-shimmer-box h-3 w-20 rounded-md"></div>
                        <div className="skeleton-shimmer-box w-5 h-5 rounded-md"></div>
                    </div>
                    <div className="skeleton-shimmer-box h-4 w-5/6 rounded-md mb-2"></div>
                    <div className="skeleton-shimmer-box h-4 w-3/5 rounded-md mb-4"></div>
                    <div className="flex gap-2 mt-4 pt-1">
                        <div className="skeleton-shimmer-box h-7 flex-1 rounded-lg"></div>
                        <div className="skeleton-shimmer-box h-7 flex-1 rounded-lg"></div>
                    </div>
                </div>
            );
        }

        function SubjectCardSkeleton() {
            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm flex items-center justify-between">
                    <div className="flex items-center space-x-4 flex-1">
                        <div className="skeleton-shimmer-box w-12 h-12 rounded-2xl flex-shrink-0"></div>
                        <div className="flex-1 min-w-0">
                            <div className="skeleton-shimmer-box h-5 w-32 rounded-md mb-2"></div>
                            <div className="skeleton-shimmer-box h-3.5 w-16 rounded-md"></div>
                        </div>
                    </div>
                    <div className="skeleton-shimmer-box w-6 h-6 rounded-full flex-shrink-0"></div>
                </div>
            );
        }

        function CourseListItemSkeleton() {
            return (
                <li className="p-4 sm:p-6 flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 flex-1 min-w-0">
                        <div className="skeleton-shimmer-box w-6 h-6 rounded-lg mt-1 flex-shrink-0"></div>
                        <div className="flex-1 min-w-0">
                            <div className="flex items-center space-x-2 mb-2">
                                <div className="skeleton-shimmer-box h-4 w-16 rounded"></div>
                                <div className="skeleton-shimmer-box h-4 w-14 rounded"></div>
                            </div>
                            <div className="skeleton-shimmer-box h-5 w-3/4 sm:w-2/3 rounded-md"></div>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2 flex-wrap gap-2">
                        <div className="skeleton-shimmer-box h-8 w-20 rounded-lg"></div>
                        <div className="skeleton-shimmer-box h-8 w-20 rounded-lg"></div>
                        <div className="skeleton-shimmer-box h-8 w-20 rounded-lg"></div>
                    </div>
                </li>
            );
        }

        function CourseListSkeleton({ view = 'home', selectedSubject = '' }) {
            if (view === 'subject') {
                return (
                    <div className="space-y-6 animate-in fade-in duration-200" id="skeleton-subject-view">
                        <div className="flex items-center space-x-4 mb-8">
                            <div className="skeleton-shimmer-box w-9 h-9 rounded-full"></div>
                            <div className="skeleton-shimmer-box h-8 w-52 rounded-xl"></div>
                        </div>
                        <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                            <div className="bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex justify-between items-center">
                                <div className="skeleton-shimmer-box h-6 w-56 rounded-md"></div>
                                <div className="skeleton-shimmer-box w-5 h-5 rounded-md"></div>
                            </div>
                            <ul className="divide-y divide-slate-100 dark:divide-slate-800">
                                <CourseListItemSkeleton />
                                <CourseListItemSkeleton />
                                <CourseListItemSkeleton />
                                <CourseListItemSkeleton />
                            </ul>
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-12 animate-in fade-in duration-200" id="skeleton-home-view">
                    {/* Header / Search Skeleton */}
                    <div className="text-center max-w-2xl mx-auto">
                        <div className="flex items-center justify-center space-x-3 mb-3">
                            <div className="skeleton-shimmer-box w-10 h-10 sm:w-11 sm:h-11 rounded-2xl"></div>
                            <div className="skeleton-shimmer-box h-9 w-64 rounded-xl"></div>
                        </div>
                        <div className="flex items-center justify-center mb-6">
                            <div className="skeleton-shimmer-box h-8 w-60 rounded-full"></div>
                        </div>
                        <div className="max-w-xl mx-auto">
                            <div className="skeleton-shimmer-box h-14 w-full rounded-2xl"></div>
                        </div>
                    </div>

                    {/* Section: Derniers ajouts Skeleton */}
                    <div>
                        <div className="flex items-center mb-4 space-x-2">
                            <div className="skeleton-shimmer-box w-5 h-5 rounded-md"></div>
                            <div className="skeleton-shimmer-box h-6 w-36 rounded-md"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <CourseCardSkeleton />
                            <CourseCardSkeleton />
                            <CourseCardSkeleton />
                            <CourseCardSkeleton />
                        </div>
                    </div>

                    {/* Section: Explorer par matière Skeleton */}
                    <div>
                        <div className="flex items-center mb-4 space-x-2">
                            <div className="skeleton-shimmer-box w-5 h-5 rounded-md"></div>
                            <div className="skeleton-shimmer-box h-6 w-48 rounded-md"></div>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                        </div>
                    </div>
                </div>
            );
        }

        function PreviewModal({ data, onClose, onCopy, onShare, onSaveToCloud, onTakeNotes }) {
            let previewUrl = data.link;
            const isGoogleDrive = previewUrl.includes('drive.google.com/file/d/');
            if (isGoogleDrive) {
                previewUrl = previewUrl.replace(/\/view.*$/, '/preview');
            }

            const getYouTubeUrl = (url) => {
                if (!url) return null;
                if (url.includes('youtube.com/embed/')) return url;
                let id = '';
                if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
                else if (url.includes('watch?v=')) id = new URLSearchParams(new URL(url).search).get('v');
                return id ? `https://www.youtube.com/embed/${id}` : null;
            };

            const ytEmbed = data.type === 'Vidéo' ? getYouTubeUrl(data.link) : null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full h-full max-w-6xl flex flex-col overflow-hidden border border-slate-200 dark:border-slate-800 animate-in zoom-in-95 duration-200">
                        <div className="flex justify-between items-center px-4 sm:px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 flex-shrink-0">
                            <div className="min-w-0 pr-4">
                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">{data.type}</span>
                                <h2 className="font-bold text-slate-800 dark:text-white text-base sm:text-lg truncate">{data.title}</h2>
                            </div>
                            <div className="flex items-center space-x-2 flex-shrink-0">
                                {onTakeNotes && (
                                    <button 
                                        id="btn-take-notes-preview"
                                        onClick={onTakeNotes} 
                                        className="text-xs font-bold bg-sky-50 dark:bg-sky-950/60 hover:bg-sky-100 dark:hover:bg-sky-900 border border-sky-200 dark:border-sky-800 px-3 py-2 rounded-xl text-sky-700 dark:text-sky-300 flex items-center shadow-sm transition-colors active:scale-95 cursor-pointer"
                                        title="Prendre des notes sur ce cours dans WorksBox Note"
                                    >
                                        <PenTool className="w-3.5 h-3.5 mr-1.5 text-sky-600 dark:text-sky-400" />
                                        <span>Prendre des notes</span>
                                    </button>
                                )}
                                {onSaveToCloud && (
                                    <button 
                                        id="btn-save-cloud-preview"
                                        onClick={onSaveToCloud} 
                                        className="text-xs font-bold bg-blue-50 dark:bg-blue-950/60 hover:bg-blue-100 dark:hover:bg-blue-900 border border-blue-200 dark:border-blue-800 px-3 py-2 rounded-xl text-blue-700 dark:text-blue-300 flex items-center shadow-sm transition-colors active:scale-95"
                                        title="Sauvegarder dans mon espace Google Drive (1 Go)"
                                    >
                                        <Cloud className="w-3.5 h-3.5 mr-1.5 text-blue-600 dark:text-blue-400" />
                                        <span>Sauvegarder Drive</span>
                                    </button>
                                )}
                                {onShare && (
                                    <button 
                                        id="btn-share-preview-link"
                                        onClick={onShare} 
                                        className="text-xs font-bold bg-blue-50 dark:bg-blue-950/60 hover:bg-blue-100 dark:hover:bg-blue-900 border border-blue-200 dark:border-blue-800 px-3 py-2 rounded-xl text-blue-700 dark:text-blue-300 flex items-center shadow-sm transition-colors active:scale-95"
                                        title="Partager ce cours (copier le lien direct)"
                                    >
                                        <Share2 className="w-3.5 h-3.5 mr-1.5 text-blue-600 dark:text-blue-400" />
                                        <span>Partager</span>
                                    </button>
                                )}
                                {onCopy && (
                                    <button 
                                        id="btn-copy-preview-link"
                                        onClick={() => onCopy(data.link, data.title)} 
                                        className="text-xs font-bold bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-200 flex items-center shadow-sm transition-colors active:scale-95"
                                        title="Copier le lien"
                                    >
                                        <Copy className="w-3.5 h-3.5 mr-1.5 text-slate-500 dark:text-slate-400" />
                                        <span>Copier</span>
                                    </button>
                                )}
                                <a href={data.link} target="_blank" rel="noopener noreferrer" className="text-xs font-bold bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-200 flex items-center shadow-sm transition-colors">
                                    <ExternalLink className="w-3.5 h-3.5 mr-1" /> Ouvrir le lien
                                </a>
                                <button onClick={onClose} className="p-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl transition-colors"><X className="w-5 h-5"/></button>
                            </div>
                        </div>

                        <div className="flex-1 bg-slate-100 dark:bg-slate-950 flex items-center justify-center overflow-auto p-4 relative">
                            {data.type === 'Vidéo' && (
                                ytEmbed ? (
                                    <iframe src={ytEmbed} className="w-full h-full max-w-4xl aspect-video rounded-xl shadow-lg border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen title="Vidéo"></iframe>
                                ) : isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full border-0 rounded-xl" allow="autoplay" title="Vidéo Drive"></iframe>
                                ) : (
                                    <video src={data.link} controls className="max-w-full max-h-[80vh] rounded-xl shadow-lg bg-black">Votre navigateur ne prend pas en charge la balise vidéo.</video>
                                )
                            )}

                            {data.type === 'Image' && (
                                isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full border-0 rounded-xl" title="Image Drive"></iframe>
                                ) : (
                                    <div className="flex items-center justify-center w-full h-full">
                                        <img src={data.link} alt={data.title} className="max-w-full max-h-[82vh] object-contain rounded-xl shadow-lg bg-white dark:bg-slate-900 p-2 border border-slate-200 dark:border-slate-800" onError={(e) => { e.target.outerHTML = '<p class="text-slate-500 text-sm">Impossible d\'afficher directement l\'image. Utilisez le bouton "Ouvrir le lien" en haut.</p>'; }} />
                                    </div>
                                )
                            )}

                            {data.type === 'Audio' && (
                                isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full max-w-xl max-h-52 border-0 rounded-xl shadow" title="Audio Drive"></iframe>
                                ) : (
                                    <div className="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-800 flex flex-col items-center max-w-md w-full text-center">
                                        <div className="w-16 h-16 bg-purple-100 dark:bg-purple-950/80 text-purple-600 dark:text-purple-400 rounded-2xl flex items-center justify-center mb-4 shadow-sm">
                                            <MusicIcon className="w-8 h-8" />
                                        </div>
                                        <h3 className="font-bold text-slate-800 dark:text-white text-base mb-1 truncate w-full">{data.title}</h3>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">Écoute du fichier audio</p>
                                        <audio src={data.link} controls className="w-full outline-none">Votre navigateur ne supporte pas la lecture audio directe.</audio>
                                    </div>
                                )
                            )}

                            {(data.type === 'Numérique' || data.type === 'Casio') && (
                                <iframe src={previewUrl} className="absolute inset-0 w-full h-full border-0" title="Aperçu" allow="autoplay"></iframe>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function UploadProgressWidget({ progress, onDismiss }) {
            if (!progress || !progress.active) return null;

            const isDone = progress.stage === 'success';
            const isError = progress.stage === 'error';
            const isProcessing = progress.stage === 'processing';
            const percentValue = Math.round(progress.percent !== undefined ? progress.percent : (progress.percentage || 0));
            const loadedMb = ((progress.loadedBytes || 0) / (1024 * 1024)).toFixed(1);
            const totalMb = ((progress.totalBytes || 0) / (1024 * 1024)).toFixed(1);
            const errorText = progress.errorMsg || progress.errorMessage || 'Une erreur est survenue';

            return (
                <div 
                    id="upload-progress-widget"
                    className="fixed bottom-6 right-6 z-[120] max-w-sm w-full p-4 bg-slate-900/95 dark:bg-slate-900/95 text-white border border-slate-700/80 rounded-3xl shadow-2xl backdrop-blur-md animate-in fade-in slide-in-from-bottom-6 duration-300"
                >
                    <div className="space-y-3">
                        <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center space-x-2.5 min-w-0">
                                <div className={`p-2 rounded-xl flex-shrink-0 ${
                                    isDone 
                                        ? 'bg-emerald-500/20 text-emerald-400' 
                                        : isError 
                                            ? 'bg-rose-500/20 text-rose-400' 
                                            : 'bg-indigo-500/20 text-indigo-400 animate-pulse'
                                }`}>
                                    {isDone ? (
                                        <Check className="w-5 h-5" />
                                    ) : isError ? (
                                        <AlertCircle className="w-5 h-5" />
                                    ) : (
                                        <UploadCloud className="w-5 h-5 animate-bounce" />
                                    )}
                                </div>
                                <div className="min-w-0">
                                    <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 block">
                                        {progress.target === 'shared' ? 'Cloud Partagé' : 'Mon Cloud Personnel'}
                                    </span>
                                    <h4 className="text-xs sm:text-sm font-bold text-slate-100 truncate">
                                        {progress.fileName || 'Fichier en cours...'}
                                    </h4>
                                </div>
                            </div>

                            {(isDone || isError) && (
                                <button 
                                    onClick={onDismiss}
                                    className="p-1 text-slate-400 hover:text-white hover:bg-white/10 rounded-lg transition"
                                >
                                    <X className="w-4 h-4" />
                                </button>
                            )}
                        </div>

                        {/* Barre de chargement avec animation */}
                        <div className="space-y-1.5">
                            <div className="flex justify-between items-center text-xs">
                                <span className="font-semibold text-slate-300">
                                    {isDone 
                                        ? 'Importation terminée !' 
                                        : isError 
                                            ? 'Échec de l\'envoi' 
                                            : isProcessing 
                                                ? 'Finalisation & Indexation...' 
                                                : 'Téléversement en cours...'}
                                </span>
                                <span className="font-black text-indigo-400">
                                    {percentValue} %
                                </span>
                            </div>

                            <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700">
                                <div 
                                    className={`h-full rounded-full transition-all duration-300 ${
                                        isDone 
                                            ? 'bg-gradient-to-r from-emerald-500 to-teal-400' 
                                            : isError 
                                                ? 'bg-rose-500' 
                                                : 'bg-gradient-to-r from-indigo-500 via-sky-400 to-emerald-400'
                                    }`}
                                    style={{ width: `${Math.max(4, Math.min(100, percentValue))}%` }}
                                ></div>
                            </div>
                        </div>

                        {/* Détail du poids téléversé */}
                        <div className="flex items-center justify-between text-[11px] text-slate-400 pt-0.5">
                            <span>
                                {progress.totalBytes > 0 ? `${loadedMb} Mo / ${totalMb} Mo` : 'Calcul de la taille...'}
                            </span>
                            {isProcessing && (
                                <span className="text-sky-400 font-bold flex items-center">
                                    <RefreshCw className="w-3 h-3 mr-1 animate-spin" />
                                    Synchronisation Drive
                                </span>
                            )}
                        </div>

                        {isError && (
                            <p className="text-[11px] text-rose-300 bg-rose-950/60 p-2 rounded-xl border border-rose-800/60">
                                {errorText}
                            </p>
                        )}
                    </div>
                </div>
            );
        }

        function Toast({ toast, onClose }) {
            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => {
                    onClose();
                }, 3200);
                return () => clearTimeout(timer);
            }, [toast?.id, onClose]);

            if (!toast) return null;

            return (
                <div 
                    id="toast-notification"
                    role="status"
                    aria-live="polite"
                    className="fixed bottom-6 inset-x-0 z-[100] flex justify-center px-4 pointer-events-none"
                >
                    <div className="pointer-events-auto max-w-md w-full sm:w-auto flex items-center space-x-3 px-4 py-3 sm:px-5 sm:py-3.5 bg-slate-900/95 dark:bg-slate-800/95 text-white border border-slate-700/80 dark:border-slate-600/80 rounded-2xl shadow-2xl backdrop-blur-md transition-all animate-in fade-in slide-in-from-bottom-5 duration-300">
                        <div className="flex-shrink-0">
                            {toast.icon === 'star' && (
                                <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
                                    <Star className="w-4 h-4" filled={true} />
                                </div>
                            )}
                            {toast.icon === 'copy' && (
                                <div className="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center">
                                    <Copy className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'check' && (
                                <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                    <Check className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'warning' && (
                                <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
                                    <AlertCircle className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'info' && (
                                <div className="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center">
                                    <FileText className="w-4 h-4" />
                                </div>
                            )}
                            {!toast.icon && (
                                <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                    <Check className="w-4 h-4" />
                                </div>
                            )}
                        </div>
                        <div className="flex-1 min-w-0 pr-1">
                            <p className="text-xs sm:text-sm font-semibold leading-tight break-words text-slate-100">
                                {toast.message}
                            </p>
                        </div>
                        <button
                            id="btn-toast-close"
                            onClick={onClose}
                            className="flex-shrink-0 p-1 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
                            title="Fermer la notification"
                        >
                            <X className="w-4 h-4" />
                        </button>
                    </div>
                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.warn("WorksBox ErrorBoundary caught error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
                            <div className="max-w-md w-full bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 text-center space-y-4">
                                <div className="w-14 h-14 bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 rounded-2xl flex items-center justify-center mx-auto">
                                    <AlertCircle className="w-8 h-8" />
                                </div>
                                <h2 className="text-xl font-black">Une interruption temporaire est survenue</h2>
                                <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                                    L'application a rencontré une anomalie d'affichage. Vous pouvez recharger la page pour continuer votre navigation.
                                </p>
                                <button
                                    onClick={() => {
                                        this.setState({ hasError: false, error: null });
                                        window.location.reload();
                                    }}
                                    className="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition shadow-sm"
                                >
                                    Actualiser la page
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
