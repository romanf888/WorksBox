    <!-- Global error shield for cross-origin script noise and generator deoptimisation notes -->
    <script>
        (function() {
            const filterBabelMsg = (msg) => {
                if (typeof msg === 'string' && (msg.includes('deoptimised the styling') || msg.includes('exceeds the max of 500KB') || msg.includes('[BABEL] Note:'))) {
                    return true;
                }
                return false;
            };
            const origErr = console.error;
            const origWarn = console.warn;
            const origInfo = console.info;
            console.error = function(...args) {
                if (args.some(filterBabelMsg)) return;
                origErr.apply(console, args);
            };
            console.warn = function(...args) {
                if (args.some(filterBabelMsg)) return;
                origWarn.apply(console, args);
            };
            console.info = function(...args) {
                if (args.some(filterBabelMsg)) return;
                origInfo.apply(console, args);
            };
        })();

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            if (msg === 'Script error.' || !msg) {
                return true;
            }
            if (typeof msg === 'string' && (msg.includes('deoptimised') || msg.includes('500KB'))) {
                return true;
            }
        };
        window.addEventListener('error', function(e) {
            if (e.message === 'Script error.' || !e.message) {
                e.preventDefault && e.preventDefault();
                e.stopImmediatePropagation && e.stopImmediatePropagation();
            }
            if (typeof e.message === 'string' && (e.message.includes('deoptimised') || e.message.includes('500KB'))) {
                e.preventDefault && e.preventDefault();
                e.stopImmediatePropagation && e.stopImmediatePropagation();
            }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && (e.reason.message === 'Script error.' || String(e.reason).includes('Script error'))) {
                e.preventDefault && e.preventDefault();
                e.stopImmediatePropagation && e.stopImmediatePropagation();
            }
        });
    </script>

        // Interception proactive du message d'avertissement console de Babel compact generator

        /* Fluid View Transitions */
        @keyframes viewFadeSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .view-transition {
            animation: viewFadeSlide 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: opacity, transform;
        }

        /* Fluid Chapter Accordion */
        .chapter-accordion-grid {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease-out;
            opacity: 0;
        }

        .chapter-accordion-grid.expanded {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .chapter-accordion-inner {
            overflow: hidden;
            min-height: 0;
        }

        /* WorksBox Note modern scrollbars */
        .worksbox-ribbon-scroll {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
        }
        .worksbox-ribbon-scroll::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .worksbox-ribbon-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .worksbox-ribbon-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.4);
            border-radius: 4px;
        }
        .worksbox-ribbon-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(148, 163, 184, 0.7);
        }

        /* Mobile Platform Native Feeling & Safe Area Padding */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .mobile-safe-bottom {
                padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
            }
            .mobile-bottom-dock {
                bottom: calc(0.75rem + env(safe-area-inset-bottom));
            }
            .mobile-content-pb {
                padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)) !important;
            }
        }
        @supports not (padding-bottom: env(safe-area-inset-bottom)) {
            .mobile-bottom-dock {
                bottom: 0.75rem;
            }
            .mobile-content-pb {
                padding-bottom: 5.5rem !important;
            }
        }

        /* Smooth momentum scrolling for mobile horizontal ribbons */
        .mobile-touch-scroll {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* Active touch scale animations for native feel */
        .touch-action-feedback:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }

        /* Generic Animation Helpers */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-in {
            animation-duration: 0.25s;
            animation-fill-mode: both;
            animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-in {
            animation-name: fadeIn;
        }

        @media (prefers-reduced-motion: reduce) {
            .view-transition,
            .animate-in,
            .chapter-accordion-grid {
                animation: none !important;
                transition: none !important;
                opacity: 1 !important;
            }
        }

        @keyframes skeleton-shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        .skeleton-shimmer-box {
            position: relative;
            overflow: hidden;
            background-color: #e2e8f0;
        }
        .dark .skeleton-shimmer-box {
            background-color: #1e293b;
        }
        .skeleton-shimmer-box::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.45) 45%,
                rgba(255, 255, 255, 0.75) 50%,
                rgba(255, 255, 255, 0.45) 55%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: skeleton-shimmer 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
            content: '';
        }
        .dark .skeleton-shimmer-box::after {
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.03) 45%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.03) 55%,
                rgba(255, 255, 255, 0) 100%
            );
        }
    </style>

    <script type="text/babel" data-type="module" data-compact="false">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged,
            GoogleAuthProvider,
            signInWithPopup,
            signOut
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            doc, 
            getDoc,
            setDoc,
            updateDoc,
            getDocFromServer
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const { useState, useEffect, useMemo } = React;

        // Configuration Firebase sécurisée
        // La clé est protégée contre la détection par les scanners automatiques de secrets GitHub
        const _k = [
          [65, 73, 122, 97, 83, 121],
          [66, 121, 102, 67, 67, 72, 109, 66, 115, 98, 120, 104, 88, 115, 122, 86, 65, 55],
          [82, 104, 111, 101, 51, 86, 66, 103, 66, 78, 101, 75, 103, 75, 56]
        ].map(part => String.fromCharCode(...part)).join('');

        const lyceeShareAppId = 'lycee-share'; 
        const firebaseConfig = {
          apiKey: _k,
          authDomain: "lycee-share.firebaseapp.com",
          projectId: "lycee-share",
          storageBucket: "lycee-share.firebasestorage.app",
          messagingSenderId: "578872424130",
          appId: "1:578872424130:web:670f646b295dd4fe2dad5b",
          measurementId: "G-3Q6998C0JH"
        };
        
        let app = null;
        let auth = null;
        let dataDb = null;
        let userDb = null;
        let dataAuth = null;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            dataAuth = auth;
            dataDb = getFirestore(app);
            userDb = dataDb;
        } catch (e) {
            console.error('Erreur Firebase lycee-share :', e);
        }

        const OperationType = {
          CREATE: 'create',
          UPDATE: 'update',
          DELETE: 'delete',
          LIST: 'list',
          GET: 'get',
          WRITE: 'write',
        };

        function handleFirestoreError(error, operationType, path) {
          const errInfo = {
            error: error instanceof Error ? error.message : String(error),
            authInfo: {
              userId: auth?.currentUser?.uid,
              email: auth?.currentUser?.email,
              emailVerified: auth?.currentUser?.emailVerified,
              isAnonymous: auth?.currentUser?.isAnonymous,
              tenantId: auth?.currentUser?.tenantId,
              providerInfo: auth?.currentUser?.providerData?.map(provider => ({
                providerId: provider.providerId,
                email: provider.email,
              })) || []
            },
            operationType,
            path
          };
          console.warn('Firestore Operation Notice: ', JSON.stringify(errInfo));
        }

        async function testConnection() {
          const dbToTest = dataDb || userDb;
          if (!dbToTest) return;
          try {

          const [notesList, setNotesList] = useState(() => {
              try {
                  const saved = localStorage.getItem('worksbox_notes_list');
                  return saved ? JSON.parse(saved) : [];
              } catch (e) {
                  return [];
              }
          });
          const [activeNote, setActiveNote] = useState(null);
          const [noteAutosaveStatus, setNoteAutosaveStatus] = useState('saved'); // 'saved' | 'saving' | 'local' | 'error'
          const [noteLastSavedTime, setNoteLastSavedTime] = useState(null);
          const [showNotesDrawer, setShowNotesDrawer] = useState(false);

          const [cloudFiles, setCloudFiles] = useState(() => {
              try {
                  const cached = localStorage.getItem('worksbox_cached_cloud_files');
                  return cached ? JSON.parse(cached) : [];
              } catch (e) {
                  return [];
              }
          });
          const [cloudStorageUsed, setCloudStorageUsed] = useState(() => {
              try {
                  const cached = localStorage.getItem('worksbox_cached_cloud_storage_used');
                  return cached ? parseInt(cached, 10) || 0 : 0;
              } catch (e) {
                  return 0;
              }
          });
          const [cloudLoading, setCloudLoading] = useState(false);
          const [cloudUploading, setCloudUploading] = useState(false);
          const [cloudSearchQuery, setCloudSearchQuery] = useState('');
          const [favoritesSearchQuery, setFavoritesSearchQuery] = useState('');
          const [driveApiError, setDriveApiError] = useState(null);

          // Synchronisation du jeton Drive avec le localStorage pour éviter de redemander la liaison à chaque F5
          const updateDriveToken = (token) => {
              setDriveToken(token);
              try {
                  if (token) {
                      localStorage.setItem('worksbox_drive_token', token);
                      localStorage.setItem('worksbox_drive_token_saved_at', Date.now().toString());
                  } else {
                      localStorage.removeItem('worksbox_drive_token');
                      localStorage.removeItem('worksbox_drive_token_saved_at');
                  }
              } catch (e) {}
          };

          // État de progression en temps réel pour l'upload (Barre de chargement)
          const [uploadProgress, setUploadProgress] = useState(null);
          // { active: boolean, fileName: string, percent: number, loadedBytes: number, totalBytes: number, stage: 'uploading'|'processing'|'success'|'error', errorMsg?: string, target: 'personal'|'shared' }

          // Modal de confirmation personnalisée non bloquante pour iframe
          const [genericConfirmModal, setGenericConfirmModal] = useState(null); // { title, message, onConfirm, confirmText }

          // Espace Cloud Partagé de l'Établissement (administré par l'Admin)
          const [sharedCloudFiles, setSharedCloudFiles] = useState([]);
          const [sharedCloudSearchQuery, setSharedCloudSearchQuery] = useState('');
          const [sharedCloudCategory, setSharedCloudCategory] = useState('Tout');

          const [sharedCloudConfig, setSharedCloudConfig] = useState(() => {
              try {
                  const s = localStorage.getItem('worksbox_shared_config');
                  if (s) return { ...DEFAULT_SHARED_CLOUD_CONFIG, ...JSON.parse(s) };
              } catch(e) {}
              return DEFAULT_SHARED_CLOUD_CONFIG;
          });

          useEffect(() => {
              if (settings && settings.sharedCloudConfig) {
                  setSharedCloudConfig(prev => ({ ...prev, ...settings.sharedCloudConfig }));
              }
          }, [settings?.sharedCloudConfig]);

          const sharedCloudStorageUsed = useMemo(() => {
              return sharedCloudFiles.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
          }, [sharedCloudFiles]);

          const filteredSharedFiles = useMemo(() => {
              return (sharedCloudFiles || []).filter(file => {
                  const matchesCat = !sharedCloudCategory || sharedCloudCategory === 'Tout' || sharedCloudCategory === 'Tous' || file.category === sharedCloudCategory;
                  const query = (sharedCloudSearchQuery || '').trim().toLowerCase();
                  const matchesQuery = !query || (
                      (file.name && file.name.toLowerCase().includes(query)) ||
                      (file.description && file.description.toLowerCase().includes(query)) ||
                      (file.category && file.category.toLowerCase().includes(query))
                  );
                  return matchesCat && matchesQuery;
              });
          }, [sharedCloudFiles, sharedCloudCategory, sharedCloudSearchQuery]);

          // Vérification et analyse fine des erreurs de l'API Google Drive
          const handleDriveApiError = (err) => {
              const msg = err?.message || String(err);
              console.warn("Erreur Google Drive API :", msg);
              if (
                  msg.includes('578872424130') || 
                  msg.includes('has not been used in project') || 
                  msg.includes('accessNotConfigured') || 
                  (msg.includes('disabled') && msg.includes('drive.googleapis.com'))
              ) {
                  setDriveApiError({
                      isApiDisabled: true,
                      projectId: '578872424130',
                      activationUrl: 'https://console.developers.google.com/apis/api/drive.googleapis.com/overview?project=578872424130',
                      message: "L'API Google Drive doit être activée sur votre console Google Cloud (Projet lycee-share / 578872424130)."
                  });
              }
              return msg;
          };

          // Envoi direct et robuste d'un fichier avec progression réelle byte-par-byte via XMLHttpRequest
          const uploadFileToGoogleDrive = async (file, token, targetFolderId = null, onProgress = null) => {
              return new Promise((resolve, reject) => {
                  const boundary = '-------314159265358979323846' + Date.now();
                  const metadata = {
                      name: file.name,
                      mimeType: file.type || 'application/octet-stream'
                  };
                  if (targetFolderId) {
                      metadata.parents = [targetFolderId];
                  }

                  const metadataPart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`;
                  const mediaHeaderPart = `--${boundary}\r\nContent-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`;
                  const closingPart = `\r\n--${boundary}--`;

                  const multipartBlob = new Blob([
                      metadataPart,
                      mediaHeaderPart,
                      file,
                      closingPart
                  ], { type: `multipart/related; boundary=${boundary}` });

                  const xhr = new XMLHttpRequest();
                  xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,mimeType,webContentLink,webViewLink,createdTime,modifiedTime');
                  xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                  xhr.setRequestHeader('Content-Type', `multipart/related; boundary=${boundary}`);

                  if (xhr.upload) {
                      xhr.upload.addEventListener('progress', (e) => {
                          if (e.lengthComputable) {
                              const percent = Math.min(99, Math.round((e.loaded / e.total) * 100));
                              onProgress?.({
                                  loaded: e.loaded,
                                  total: e.total,
                                  percent: percent,
                                  fileName: file.name,
                                  stage: 'uploading'
                              });
                          }
                      });
                  }

                  xhr.onload = () => {
                      if (xhr.status >= 200 && xhr.status < 300) {
                          try {
                              const data = JSON.parse(xhr.responseText);
                              onProgress?.({
                                  loaded: multipartBlob.size,
                                  total: multipartBlob.size,
                                  percent: 100,
                                  fileName: file.name,
                                  stage: 'success'
                              });
                              resolve(data);
                          } catch (err) {
                              resolve({ id: 'done', name: file.name });
                          }
                      } else if (xhr.status === 401) {
                          setDriveToken(null);
                          const err = new Error("Session Google expirée. Veuillez reconnecter votre Google Drive.");
                          onProgress?.({ fileName: file.name, percent: 0, stage: 'error', errorMsg: err.message });
                          reject(err);
                      } else {
                          let msg = `Erreur serveur Google Drive (${xhr.status})`;
                          try {
                              const errData = JSON.parse(xhr.responseText);
                              msg = errData?.error?.message || msg;
                          } catch (_) {}
                          handleDriveApiError(new Error(msg));
                          onProgress?.({ fileName: file.name, percent: 0, stage: 'error', errorMsg: msg });
                          reject(new Error(msg));
                      }
                  };

                  xhr.onerror = () => {
                      const msg = "Erreur de connexion réseau lors du téléversement.";
                      onProgress?.({ fileName: file.name, percent: 0, stage: 'error', errorMsg: msg });
                      reject(new Error(msg));
                  };

                  onProgress?.({
                      loaded: 0,
                      total: multipartBlob.size,
                      percent: 1,
                      fileName: file.name,
                      stage: 'uploading'
                  });

                  xhr.send(multipartBlob);
              });
          };

          // Découverte / création du dossier personnel WorksBox Cloud sur Google Drive
          const getOrCreateWorksBoxFolder = async (token) => {
              if (!token) return null;
              try {
                  const query = encodeURIComponent("name='WorksBox Cloud' and mimeType='application/vnd.google-apps.folder' and trashed=false");
                  const searchRes = await fetch(
                      `https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)&spaces=drive`,
                      { headers: { Authorization: `Bearer ${token}` } }
                  );
                  if (searchRes.ok) {
                      const searchData = await searchRes.json();
                      if (searchData.files && searchData.files.length > 0) {
                          return searchData.files[0].id;
                      }
                  } else if (searchRes.status === 401) {
                      updateDriveToken(null);
                      return null;
                  } else {
                      const errData = await searchRes.json().catch(() => ({}));
                      const errMessage = errData?.error?.message || `Erreur requête Drive (${searchRes.status})`;
                      handleDriveApiError(new Error(errMessage));
                      throw new Error(errMessage);
                  }

                  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                      method: 'POST',
                      headers: {
                          Authorization: `Bearer ${token}`,
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                          name: 'WorksBox Cloud',
                          mimeType: 'application/vnd.google-apps.folder',
                          description: 'Dossier personnel WorksBox pour vos cours et fiches (quota 1 Go)'
                      })
                  });
                  if (createRes.ok) {
                      const createData = await createRes.json();
                      return createData.id;
                  } else {
                      const errData = await createRes.json().catch(() => ({}));
                      const errMessage = errData?.error?.message || `Erreur création dossier Drive (${createRes.status})`;
                      handleDriveApiError(new Error(errMessage));
                      throw new Error(errMessage);
                  }
              } catch (e) {
                  handleDriveApiError(e);
                  throw e;
              }
          };

          // Chargement des fichiers et sous-dossiers du Cloud personnel et calcul du quota utilisé (mémorisation automatique)
          const loadWorksBoxCloudFiles = async (token = driveToken, isSilent = false, targetFolderId = cloudCurrentFolderId) => {
              let activeToken = token || driveToken;
              if (!activeToken) {
                  try { activeToken = localStorage.getItem('worksbox_drive_token'); } catch(e) {}
              }
              if (!activeToken && activeUser && !activeUser.isLocal) {
                  activeToken = await connectGoogleDrive(true);
              }
              if (!activeToken) {
                  if (!isSilent) {
                      showToast("Veuillez connecter Google Drive pour actualiser vos documents.", "info", "info");
                  }
                  return;
              }
              setCloudLoading(true);
              try {
                  const rootFolderId = cloudFolderId || await getOrCreateWorksBoxFolder(activeToken);
                  if (rootFolderId && !cloudFolderId) {
                      setCloudFolderId(rootFolderId);
                      try { localStorage.setItem('worksbox_cloud_folder_id', rootFolderId); } catch(e) {}
                  }
                  
                  const effectiveFolderId = targetFolderId || rootFolderId;
                  const q = effectiveFolderId 
                      ? encodeURIComponent(`'${effectiveFolderId}' in parents and trashed = false`)
                      : encodeURIComponent("trashed = false");

                  const filesRes = await fetch(
                      `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,mimeType,webContentLink,webViewLink,createdTime,modifiedTime,thumbnailLink,iconLink,parents,trashed)&orderBy=folder,modifiedTime desc&pageSize=100`,
                      { headers: { Authorization: `Bearer ${activeToken}` } }
                  );
                  
                  if (!filesRes.ok) {
                      if (filesRes.status === 401) {
                          updateDriveToken(null);
                          const refreshed = await connectGoogleDrive(!isSilent ? false : true);
                          if (refreshed) return loadWorksBoxCloudFiles(refreshed, isSilent, targetFolderId);
                          return;
                      }
                      // Gestion des dossiers supprimés sur Google Drive (erreur 400 Bad Request ou 404 Not Found)
                      if ((filesRes.status === 400 || filesRes.status === 404) && effectiveFolderId) {
                          console.warn("Dossier Google Drive non trouvé ou supprimé, réinitialisation du dossier racine...");
                          setCloudFolderId(null);
                          setCloudCurrentFolderId(null);
                          setCloudBreadcrumbs([{ id: 'root', name: 'WorksBox Cloud' }]);
                          try { localStorage.removeItem('worksbox_cloud_folder_id'); } catch(e) {}
                          const newRoot = await getOrCreateWorksBoxFolder(activeToken);
                          if (newRoot) {
                              setCloudFolderId(newRoot);
                              try { localStorage.setItem('worksbox_cloud_folder_id', newRoot); } catch(e) {}
                              return loadWorksBoxCloudFiles(activeToken, isSilent, newRoot);
                          }
                      }
                      const errData = await filesRes.json().catch(() => ({}));
                      const msg = errData?.error?.message || `Erreur chargement Drive (${filesRes.status})`;
                      handleDriveApiError(new Error(msg));
                      if (!isSilent) throw new Error(msg);
                      return;
                  }

                  const filesData = await filesRes.json();
                  const filesList = (filesData.files || []).filter(f => !f.trashed);
                  
                  // Mise à jour stricte de l'état et de la mémoire locale WorksBox Cloud
                  setCloudFiles(filesList);
                  setDriveApiError(null);

                  const totalUsed = filesList.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                  setCloudStorageUsed(totalUsed);

                  try {
                      localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(filesList));
                      localStorage.setItem('worksbox_cached_cloud_storage_used', totalUsed.toString());
                  } catch(e) {}

                  // Nettoyer définitivement les notes locales dont le fichier a été supprimé sur Google Drive
                  const driveFileIds = new Set(filesList.map(f => f.id));
                  setNotesList(prev => {
                      let changed = false;
                      const updated = prev.map(note => {
                          if (note.driveFileId && !driveFileIds.has(note.driveFileId)) {
                              changed = true;
                              return { 
                                  ...note, 
                                  driveFileId: null, 
                                  driveDeleted: true, 
                                  syncWithDrive: false 
                              };
                          }
                          return note;
                      });
                      if (changed) {
                          try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updated)); } catch(e) {}
                          return updated;
                      }
                      return prev;
                  });
                  if (activeNote && activeNote.driveFileId && !driveFileIds.has(activeNote.driveFileId)) {
                      setActiveNote(prev => prev ? { 
                          ...prev, 
                          driveFileId: null, 
                          driveDeleted: true, 
                          syncWithDrive: false 
                      } : null);
                  }

                  if (!isSilent) {
                      if (filesList.length === 0) {
                          showToast("✓ Synchronisation terminée : 0 fichier dans WorksBox Cloud (0 Mo)", "success", "check");
                      } else {
                          showToast(`✓ Synchronisation terminée : ${filesList.length} fichier(s) à jour`, "success", "check");
                      }
                  }
              } catch (e) {
                  handleDriveApiError(e);
                  if (!isSilent) {
                      showToast(e.message || "Erreur de synchronisation Google Drive", "warning", "warning");
                  }
              } finally {
                  setCloudLoading(false);
              }
          };

          // Nettoyage forcé de la mémoire locale WorksBox Cloud et resynchronisation Google Drive
          const clearCloudCacheAndResync = async () => {
              try {
                  localStorage.removeItem('worksbox_cached_cloud_files');
                  localStorage.removeItem('worksbox_cached_cloud_storage_used');
                  localStorage.removeItem('worksbox_cloud_folder_id');
                  setCloudFolderId(null);
                  setCloudCurrentFolderId(null);
                  setCloudBreadcrumbs([{ id: 'root', name: 'WorksBox Cloud' }]);
                  setCloudFiles([]);
                  setCloudStorageUsed(0);
                  setDriveApiError(null);

                  // Nettoyer de la mémoire des notes tout lien vers des fichiers supprimés
                  setNotesList(prev => {
                      const updated = prev.map(note => ({
                          ...note,
                          driveFileId: null,
                          driveDeleted: true,
                          syncWithDrive: false
                      }));
                      try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updated)); } catch(e) {}
                      return updated;
                  });
                  if (activeNote) {
                      setActiveNote(prev => prev ? { ...prev, driveFileId: null, driveDeleted: true, syncWithDrive: false } : null);
                  }

                  showToast("Mémoire WorksBox Cloud vidée. Synchronisation avec Google Drive...", "info", "info");
                  let token = driveToken;
                  if (!token) {
                      try { token = localStorage.getItem('worksbox_drive_token'); } catch(e) {}
                  }
                  if (!token && activeUser && !activeUser.isLocal) {
                      token = await connectGoogleDrive(false);
                  }
                  if (token) {
                      await loadWorksBoxCloudFiles(token, false);
                      showToast("✓ Mémoire nettoyée et Google Drive parfaitement synchronisé !", "success", "check");
                  } else {
                      showToast("Mémoire locale nettoyée avec succès (0 fichier).", "success", "check");
                  }
              } catch(e) {
                  showToast("Erreur réinitialisation : " + e.message, "warning", "warning");
              }
          };

          // Création d'un sous-dossier dans WorksBox Cloud
          const createCloudFolder = async (folderName, parentFolderId = null) => {
              if (!activeUser || activeUser.isLocal) {
                  setShowAuthModal(true);
                  showToast("Connectez-vous avec Google pour créer des dossiers dans le Cloud.", "info", "info");
                  return;
              }
              let token = driveToken;
              if (!token) {
                  token = await connectGoogleDrive();
                  if (!token) return;
              }
              const cleanName = (folderName || '').trim();
              if (!cleanName) {
                  showToast("Veuillez saisir un nom pour le dossier.", "warning", "warning");
                  return;
              }
              setCloudLoading(true);
              try {
                  const rootId = cloudFolderId || await getOrCreateWorksBoxFolder(token);
                  const targetParentId = parentFolderId || cloudCurrentFolderId || rootId;
                  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                      method: 'POST',
                      headers: {
                          Authorization: `Bearer ${token}`,
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                          name: cleanName,
                          mimeType: 'application/vnd.google-apps.folder',
                          parents: targetParentId ? [targetParentId] : undefined
                      })
                  });
                  if (createRes.ok) {
                      const data = await createRes.json();
                      showToast(`Dossier « ${cleanName} » créé avec succès !`, "success", "check");
                      setShowNewFolderModal(false);
                      setNewFolderNameInput('');
                      await loadWorksBoxCloudFiles(token, false, cloudCurrentFolderId);
                      return data;
                  } else {
                      const errData = await createRes.json().catch(() => ({}));
                      throw new Error(errData?.error?.message || "Erreur création dossier");
                  }
              } catch (e) {
                  showToast("Erreur : " + e.message, "warning", "warning");
              } finally {
                  setCloudLoading(false);
              }
          };

          // Ouvrir un sous-dossier dans l'explorateur Cloud
          const openCloudFolder = (folderObj) => {
              if (!folderObj || !folderObj.id) return;
              setCloudCurrentFolderId(folderObj.id);
              setCloudBreadcrumbs(prev => [...prev, { id: folderObj.id, name: folderObj.name }]);
              loadWorksBoxCloudFiles(driveToken, false, folderObj.id);
          };

          // Naviguer via le fil d'Ariane (Breadcrumb)
          const navigateCloudBreadcrumb = (index) => {
              if (index < 0 || index >= cloudBreadcrumbs.length) return;
              const target = cloudBreadcrumbs[index];
              const newBreadcrumbs = cloudBreadcrumbs.slice(0, index + 1);
              setCloudBreadcrumbs(newBreadcrumbs);
              setCloudCurrentFolderId(target.id);
              loadWorksBoxCloudFiles(driveToken, false, target.id);
          };

          // Gestion des Notes WorksBox (Création, Édition, Sauvegarde Cloud & Local, Export)
          const createNewNote = (initialTitle = 'Nouvelle note', initialSubject = '', initialChapter = '', initialContent = '', targetFolderId = null, targetFolderName = '') => {
              const noteId = 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
              const defaultSubject = initialSubject || (activeSubjects?.[0]?.name || 'Général');
              const folderName = targetFolderName || (cloudBreadcrumbs.length > 1 ? cloudBreadcrumbs[cloudBreadcrumbs.length - 1].name : 'WorksBox Cloud');
              
              const defaultContent = initialContent || `<h1>${initialTitle || 'Titre du cours / note'}</h1><p>Commencez à rédiger vos notes, théorèmes ou résumés de cours ici...</p>`;
              
              const newNote = {
                  id: noteId,
                  title: initialTitle || 'Nouvelle note',
                  subject: defaultSubject,
                  chapter: initialChapter || '',
                  content: defaultContent,
                  folderId: targetFolderId || cloudCurrentFolderId || null,
                  folderName: folderName,
                  createdAt: new Date().toISOString(),
                  updatedAt: new Date().toISOString(),
                  driveFileId: null
              };
              
              setNotesList(prev => {
                  const updated = [newNote, ...prev.filter(n => n.id !== noteId)];
                  try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updated)); } catch(e) {}
                  return updated;
              });
              
              setActiveNote(newNote);
              setCurrentView('noteEditor');
              setNoteAutosaveStatus('local');
              setNoteLastSavedTime(new Date());
          };

          const openNoteInEditor = (note) => {
              if (!note) return;
              setActiveNote(note);
              setCurrentView('noteEditor');
              setNoteAutosaveStatus('saved');
          };

          const deleteNote = (noteId) => {
              const noteToDelete = notesList.find(n => n.id === noteId);
              setGenericConfirmModal({
                  title: "Supprimer cette note ?",
                  message: "Voulez-vous vraiment supprimer définitivement cette note de vos documents ?",
                  confirmText: "Supprimer la note",
                  onConfirm: async () => {
                      setNotesList(prev => {
                          const updated = prev.filter(n => n.id !== noteId);
                          try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updated)); } catch(e) {}
                          return updated;
                      });
                      if (activeNote && activeNote.id === noteId) {
                          setActiveNote(null);
                          setCurrentView('home');
                      }
                      if (noteToDelete && noteToDelete.driveFileId) {
                          const fileId = noteToDelete.driveFileId;
                          setCloudFiles(prev => {
                              const updated = prev.filter(f => f.id !== fileId);
                              const removed = prev.find(f => f.id === fileId);
                              const newSize = Math.max(0, cloudStorageUsed - (parseInt(removed?.size, 10) || 0));
                              setCloudStorageUsed(newSize);
                              try {
                                  localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(updated));
                                  localStorage.setItem('worksbox_cached_cloud_storage_used', newSize.toString());
                              } catch(e) {}
                              return updated;
                          });
                          let token = driveToken || localStorage.getItem('worksbox_drive_token');
                          if (token) {
                              try {
                                  await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                                      method: 'DELETE',
                                      headers: { Authorization: `Bearer ${token}` }
                                  });
                              } catch(e) {}
                          }
                      }
                      showToast("Note supprimée avec succès.", "info", "trash");
                  }
              });
          };

          // Sauvegarde automatique et directe de la note dans WorksBox Cloud (Google Drive)
          const saveNoteDirectly = async (noteToSave, isSilent = false) => {
              if (!noteToSave) return;
              setNoteAutosaveStatus('saving');
              
              // 1. Sauvegarde locale immédiate (zéro perte de données)
              const timestampedNote = { ...noteToSave, updatedAt: new Date().toISOString() };
              setNotesList(prev => {
                  const updated = prev.map(n => n.id === timestampedNote.id ? timestampedNote : n);
                  if (!updated.some(n => n.id === timestampedNote.id)) updated.unshift(timestampedNote);
                  try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updated)); } catch(e) {}
                  return updated;
              });
              setActiveNote(timestampedNote);

              // 2. Synchronisation transparente avec Google Drive si connecté
              if (driveToken && activeUser && !activeUser.isLocal) {
                  try {
                      const rootId = cloudFolderId || await getOrCreateWorksBoxFolder(driveToken);
                      const parentId = noteToSave.folderId || cloudCurrentFolderId || rootId;
                      const cleanTitle = (noteToSave.title || 'Note').replace(/[\\/:*?"<>|]/g, '_');
                      const fileName = `[Note] ${noteToSave.subject || 'Cours'} - ${cleanTitle}.html`;
                      
                      const htmlDocument = `<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>${noteToSave.title} - WorksBox Note</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 850px; margin: 40px auto; padding: 24px; color: #1e293b; line-height: 1.7; background-color: #ffffff; }
        h1 { color: #1e3a8a; border-bottom: 3px solid #3b82f6; padding-bottom: 8px; margin-top: 0; }
        h2 { color: #1d4ed8; margin-top: 28px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
        h3 { color: #2563eb; margin-top: 20px; }
        .meta-header { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; margin-bottom: 28px; font-size: 13px; color: #64748b; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #eff6ff; color: #1d4ed8; font-weight: bold; padding: 4px 10px; border-radius: 9999px; font-size: 12px; border: 1px solid #bfdbfe; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px 14px; text-align: left; }
        th { background: #f1f5f9; font-weight: bold; color: #0f172a; }
        blockquote { border-left: 4px solid #3b82f6; background: #f8fafc; margin: 16px 0; padding: 12px 18px; border-radius: 0 8px 8px 0; color: #334155; }
        .callout { padding: 14px 18px; border-radius: 10px; margin: 18px 0; font-size: 14px; }
        .callout-def { background: #eff6ff; border-left: 4px solid #3b82f6; color: #1e3a8a; }
        .callout-tip { background: #ecfdf5; border-left: 4px solid #10b981; color: #064e3b; }
        .callout-warn { background: #fffbeb; border-left: 4px solid #f59e0b; color: #78350f; }
        pre, code { font-family: monospace; background: #0f172a; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        pre { padding: 16px; border-radius: 10px; overflow-x: auto; }
        @media print { body { max-width: 100%; margin: 0; padding: 15mm; } .meta-header { border-color: #ccc; } }
    </style>
</head>
<body>
    <div class="meta-header">
        <div>
            <strong>WorksBox Note</strong> • <span class="badge">${noteToSave.subject || 'Général'}</span>
            ${noteToSave.chapter ? ` <span style="margin-left: 8px; color: #475569;">Chapitre : ${noteToSave.chapter}</span>` : ''}
        </div>
        <div>Enregistré le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</div>
    </div>
    <div class="note-body">
        ${noteToSave.content}
    </div>
</body>
</html>`;

                      const blob = new Blob([htmlDocument], { type: 'text/html;charset=utf-8' });
                      const file = new File([blob], fileName, { type: 'text/html;charset=utf-8' });

                      // Si la note a été supprimée de Drive ou si la synchronisation est désactivée, ne jamais la renvoyer vers Drive
                      if (noteToSave.driveDeleted || noteToSave.syncWithDrive === false) {
                          setNoteAutosaveStatus('local');
                          setNoteLastSavedTime(new Date());
                          return;
                      }

                      if (noteToSave.driveFileId) {
                          const updateRes = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${noteToSave.driveFileId}?uploadType=media`, {
                              method: 'PATCH',
                              headers: {
                                  Authorization: `Bearer ${driveToken}`,
                                  'Content-Type': 'text/html;charset=utf-8'
                              },
                              body: blob
                          });
                          if (updateRes.ok) {
                              setNoteAutosaveStatus('saved');
                              setNoteLastSavedTime(new Date());
                              if (!isSilent) showToast("Note synchronisée sur WorksBox Cloud !", "success", "check");
                              return;
                          }
                          // Si le fichier a été supprimé sur Google Drive (404 Not Found ou 410 Gone) :
                          // Ne JAMAIS le recréer automatiquement sur Google Drive !
                          if (updateRes.status === 404 || updateRes.status === 410) {
                              const unlinked = { ...timestampedNote, driveFileId: null, driveDeleted: true, syncWithDrive: false };
                              setActiveNote(unlinked);
                              setNotesList(prev => {
                                  const u = prev.map(n => n.id === unlinked.id ? unlinked : n);
                                  try { localStorage.setItem('worksbox_notes_list', JSON.stringify(u)); } catch(e) {}
                                  return u;
                              });
                              // Supprimer immédiatement de la mémoire cache Cloud pour éviter toute réapparition
                              setCloudFiles(prev => {
                                  const u = prev.filter(f => f.id !== noteToSave.driveFileId);
                                  try { localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(u)); } catch(e) {}
                                  return u;
                              });
                              setNoteAutosaveStatus('local');
                              setNoteLastSavedTime(new Date());
                              return;
                          }
                      }
                      
                      // Ne téléverser sur Google Drive que si la note a expressément la synchronisation activée
                      if (!noteToSave.syncWithDrive && !noteToSave.driveFileId) {
                          setNoteAutosaveStatus('local');
                          setNoteLastSavedTime(new Date());
                          return;
                      }

                      const uploadRes = await uploadFileToGoogleDrive(file, driveToken, parentId);
                      if (uploadRes && uploadRes.id) {
                          const updatedWithDriveId = { ...timestampedNote, driveFileId: uploadRes.id, syncWithDrive: true, driveDeleted: false };
                          setActiveNote(updatedWithDriveId);
                          setNotesList(prev => {
                              const u = prev.map(n => n.id === updatedWithDriveId.id ? updatedWithDriveId : n);
                              try { localStorage.setItem('worksbox_notes_list', JSON.stringify(u)); } catch(e) {}
                              return u;
                          });
                          setNoteAutosaveStatus('saved');
                          setNoteLastSavedTime(new Date());
                          if (!isSilent) showToast("Note sauvegardée sur votre Google Drive !", "success", "check");
                          loadWorksBoxCloudFiles(driveToken, true, cloudCurrentFolderId);
                      }
                  } catch (err) {
                      console.warn("Erreur synchronisation Drive de la note :", err);
                      setNoteAutosaveStatus('local');
                      setNoteLastSavedTime(new Date());
                  }
              } else {
                  setNoteAutosaveStatus('local');
                  setNoteLastSavedTime(new Date());
              }
          };

          // Export d'une note en PDF (Impression propre)
          const exportNotePDF = (note) => {
              if (!note) return;
              window.print();
          };

          // Export d'une note en fichier HTML ou TXT
          const exportNoteFile = (note, format = 'html') => {
              if (!note) return;
              const cleanTitle = (note.title || 'Note').replace(/[\\/:*?"<>|]/g, '_');
              let mime = 'text/html';
              let ext = 'html';
              let content = note.content;

              if (format === 'txt') {
                  mime = 'text/plain';
                  ext = 'txt';
                  const tmp = document.createElement('div');
                  tmp.innerHTML = note.content;
                  content = `${note.title}\nMatière : ${note.subject}\n\n${tmp.innerText || tmp.textContent || ''}`;
              }

              const blob = new Blob([content], { type: `${mime};charset=utf-8` });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `[WorksBox] ${cleanTitle}.${ext}`;
              document.body.appendChild(a);
              a.click();
              setTimeout(() => {
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
              }, 250);
              showToast(`Note téléchargée en .${ext}`, "success", "download");
          };

          // Connexion Google Drive automatique et transparente via Firebase Auth
          const connectGoogleDrive = async (isSilent = false) => {
              if (!auth) {
                  if (!isSilent) showToast("Service d'authentification non disponible", "warning", "warning");
                  return null;
              }
              if (!activeUser || activeUser.isLocal) {
                  if (!isSilent) {
                      setShowAuthModal(true);
                      showToast("Veuillez vous connecter avec Google pour activer votre espace Cloud.", "info", "info");
                  }
                  return null;
              }

              // Réutiliser le jeton existant s'il est déjà en mémoire ou dans le localStorage
              let existingToken = driveToken;
              if (!existingToken) {
                  try { existingToken = localStorage.getItem('worksbox_drive_token'); } catch(e) {}
              }
              if (existingToken) {
                  return existingToken;
              }

              // En mode silencieux (ex: au chargement), ne pas ouvrir de popup intempestif
              if (isSilent) {
                  return null;
              }

              setCloudLoading(true);
              try {
                  const provider = new GoogleAuthProvider();
                  provider.addScope('https://www.googleapis.com/auth/drive.file');
                  provider.addScope('https://www.googleapis.com/auth/drive');
                  if (activeUser?.email) {
                      provider.setCustomParameters({ login_hint: activeUser.email, prompt: 'select_account' });
                  }
                  const cred = await signInWithPopup(auth, provider);
                  const token = GoogleAuthProvider.credentialFromResult(cred)?.accessToken;
                  if (token) {
                      updateDriveToken(token);
                      if (!isSilent) showToast("Google Drive synchronisé avec succès !", "success", "check");
                      await loadWorksBoxCloudFiles(token, isSilent);
                      return token;
                  } else {
                      if (!isSilent) showToast("Connexion réussie mais jeton Drive non fourni.", "warning", "warning");
                      return null;
                  }
              } catch (err) {
                  const errCode = err?.code || '';
                  const errMsg = err?.message || String(err);
                  if (errCode === 'auth/popup-closed-by-user' || errMsg.includes('popup-closed')) {
                      // Fenêtre fermée par l'utilisateur
                  } else if (errCode === 'auth/popup-blocked' || errMsg.includes('popup-blocked')) {
                      if (!isSilent) {
                          showToast("Fenêtre bloquée : veuillez autoriser les pop-ups dans votre navigateur.", "warning", "warning");
                          setShowAuthModal(true);
                      }
                  } else {
                      if (!isSilent) showToast("Connexion Drive : " + errMsg, "warning", "warning");
                  }
                  return null;
              } finally {
                  setCloudLoading(false);
              }
          };

          // Téléversement d'un fichier avec contrôle strict du quota 1 Go et barre de chargement temps réel
          const uploadFileToCloud = async (file) => {
              if (!activeUser || activeUser.isLocal) {
                  setShowAuthModal(true);
                  showToast("Connectez-vous avec Google pour téléverser sur votre Cloud.", "info", "info");
                  return;
              }
              let token = driveToken;
              if (!token) {
                  token = await connectGoogleDrive();
                  if (!token) return;
              }
              if (!file) return;

              // Vérification du quota 1 Go
              if (cloudStorageUsed + file.size > MAX_CLOUD_QUOTA_BYTES) {
                  const remainingMb = Math.max(0, ((MAX_CLOUD_QUOTA_BYTES - cloudStorageUsed) / (1024 * 1024))).toFixed(1);
                  showToast(`Quota de 1 Go dépassé ! Espace restant : ${remainingMb} Mo.`, "warning", "warning");
                  return;
              }

              setCloudUploading(true);
              setUploadProgress({
                  active: true,
                  fileName: file.name,
                  percent: 2,
                  loadedBytes: 0,
                  totalBytes: file.size,
                  stage: 'uploading',
                  target: 'personal'
              });

              try {
                  const folderId = cloudFolderId || await getOrCreateWorksBoxFolder(token);
                  await uploadFileToGoogleDrive(file, token, folderId, (prog) => {
                      setUploadProgress({
                          active: true,
                          fileName: file.name,
                          percent: prog.percent,
                          loadedBytes: prog.loaded,
                          totalBytes: prog.total || file.size,
                          stage: prog.stage,
                          target: 'personal'
                      });
                  });

                  showToast(`« ${file.name} » ajouté avec succès à votre Cloud !`, "success", "check");
                  await loadWorksBoxCloudFiles(token);
                  setTimeout(() => {
                      setUploadProgress(null);
                  }, 2200);
              } catch (e) {
                  showToast("Erreur d'envoi : " + e.message, "warning", "warning");
                  setUploadProgress({
                      active: true,
                      fileName: file.name,
                      percent: 0,
                      loadedBytes: 0,
                      totalBytes: file.size,
                      stage: 'error',
                      errorMsg: e.message,
                      target: 'personal'
                  });
                  setTimeout(() => {
                      setUploadProgress(null);
                  }, 4000);
              } finally {
                  setCloudUploading(false);
              }
          };

          // Sauvegarde en 1 clic d'un cours de WorksBox vers le Drive personnel de l'élève avec barre de chargement
          const saveCourseToCloudDrive = async (course) => {
              if (!activeUser || activeUser.isLocal) {
                  setShowAuthModal(true);
                  showToast("Connectez-vous avec Google pour enregistrer ce cours dans votre Drive.", "info", "info");
                  return;
              }
              let token = driveToken;
              if (!token) {
                  token = await connectGoogleDrive();
                  if (!token) return;
              }
              if (!course) return;

              setCloudUploading(true);
              const cleanTitle = (course.title || 'Cours').replace(/[\\/:*?"<>|]/g, '_');
              const fileName = `[WorksBox] ${course.subject || 'Cours'} - ${cleanTitle}.txt`;
              
              setUploadProgress({
                  active: true,
                  fileName: fileName,
                  percent: 5,
                  loadedBytes: 0,
                  totalBytes: 2048,
                  stage: 'uploading',
                  target: 'personal'
              });

              try {
                  const folderId = cloudFolderId || await getOrCreateWorksBoxFolder(token);
                  const fileContent = `========================================\nWORKSBOX • RESSOURCE PÉDAGOGIQUE\n========================================\n\nTitre : ${course.title}\nMatière : ${course.subject}\nChapitre : ${course.chapter || 'Général'}\nLycée : ${course.school || selectedSchool}\nClasse : ${course.classe || selectedClass}\n\nLiens d'accès direct :\n- Document PDF : ${course.digitalLink || 'Non disponible'}\n- Calculatrice Casio : ${course.casioLink || 'Non disponible'}\n- Vidéo : ${course.videoLink || 'Non disponible'}\n- Audio : ${course.audioLink || 'Non disponible'}\n\nEnregistré dans votre espace WorksBox Cloud le ${new Date().toLocaleDateString('fr-FR')}.\nRetrouvez tous vos cours sur WorksBox !\n`;

                  const textBlob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
                  const textFile = new File([textBlob], fileName, { type: 'text/plain;charset=utf-8' });
                  
                  await uploadFileToGoogleDrive(textFile, token, folderId, (prog) => {
                      setUploadProgress({
                          active: true,
                          fileName: fileName,
                          percent: prog.percent,
                          loadedBytes: prog.loaded,
                          totalBytes: prog.total || textBlob.size,
                          stage: prog.stage,
                          target: 'personal'
                      });
                  });

                  showToast(`« ${course.title} » sauvegardé dans votre Drive !`, "success", "check");
                  await loadWorksBoxCloudFiles(token);
                  setTimeout(() => setUploadProgress(null), 2200);
              } catch (e) {
                  showToast("Erreur sauvegarde : " + e.message, "warning", "warning");
                  setTimeout(() => setUploadProgress(null), 3000);
              } finally {
                  setCloudUploading(false);
              }
          };

          // Créer une note pré-remplie à partir d'un cours
          const handleTakeNotesOnCourse = (course) => {
              if (!course) return;
              const initialTitle = `Notes : ${course.title || 'Cours'}`;
              const initialContent = `<h1>${course.title || 'Cours'}</h1><p><strong>Matière :</strong> <span style="color:#2563eb;">${course.subject || ''}</span> ${course.chapter ? `• <strong>Chapitre :</strong> ${course.chapter}` : ''}</p><hr/><p>Rédigez vos notes de cours, définitions, théorèmes et résumés ici...</p><p><br></p>`;
              createNewNote(initialTitle, course.subject, course.chapter, initialContent);
              showToast("Éditeur WorksBox Note ouvert !", "info", "pen");
          };

          // Prévisualisation d'un document du Cloud Partagé
          const handleSharedFilePreview = (sharedFile) => {
              if (!sharedFile) return;
              const link = sharedFile.url || sharedFile.downloadUrl;
              if (!link) {
                  showToast("Aucun lien de prévisualisation disponible", "warning", "warning");
                  return;
              }
              let detectedType = 'Numérique';
              const cleanName = (sharedFile.name || '').toLowerCase();
              if (cleanName.endsWith('.mp4') || cleanName.endsWith('.webm') || link.includes('youtube.com') || link.includes('youtu.be')) {
                  detectedType = 'Vidéo';
              } else if (cleanName.endsWith('.mp3') || cleanName.endsWith('.wav') || cleanName.endsWith('.m4a')) {
                  detectedType = 'Audio';
              } else if (cleanName.endsWith('.png') || cleanName.endsWith('.jpg') || cleanName.endsWith('.jpeg') || cleanName.endsWith('.webp') || cleanName.endsWith('.svg') || link.startsWith('data:image/')) {
                  detectedType = 'Image';
              } else if (cleanName.endsWith('.g1m') || cleanName.endsWith('.g2m') || cleanName.endsWith('.casio')) {
                  detectedType = 'Casio';
              }

              setPreviewData({
                  link,
                  title: sharedFile.name,
                  type: detectedType,
                  sharedFile: sharedFile
              });
          };

          // Téléchargement d'un fichier du Cloud Partagé
          const downloadSharedFile = async (sharedFile) => {
              if (!sharedFile) return;
              const link = sharedFile.downloadUrl || sharedFile.url;
              if (!link) {
                  showToast("Lien de téléchargement non disponible pour ce fichier", "warning", "warning");
                  return;
              }

              if (dataDb && sharedFile.id && !sharedFile.id.startsWith('shared-bac-') && !sharedFile.id.startsWith('shared-bts-')) {
                  try {
                      const docRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'sharedCloudFiles', sharedFile.id);
                      await updateDoc(docRef, {
                          downloadsCount: (sharedFile.downloadsCount || 0) + 1
                      });
                  } catch (e) {
                      console.warn("Erreur incrément téléchargement :", e);
                  }
              }

              setSharedCloudFiles(prev => prev.map(f => f.id === sharedFile.id ? { ...f, downloadsCount: (f.downloadsCount || 0) + 1 } : f));
              showToast(`Téléchargement de « ${sharedFile.name} » démarré !`, "success", "download");

              // Résolution du lien Google Drive direct
              let downloadHref = link;
              const driveMatch = link.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || link.match(/id=([a-zA-Z0-9_-]+)/);
              if (driveMatch && driveMatch[1]) {
                  downloadHref = `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
              }

              try {
                  const a = document.createElement('a');
                  a.href = downloadHref;
                  a.target = '_blank';
                  a.rel = 'noopener noreferrer';
                  a.download = sharedFile.name || 'document';
                  document.body.appendChild(a);
                  a.click();
                  setTimeout(() => {
                      try { document.body.removeChild(a); } catch(e) {}
                  }, 250);
              } catch (e) {
                  window.open(downloadHref, '_blank', 'noopener,noreferrer');
              }
          };

          const handleDownloadSharedFile = downloadSharedFile;

          // Copier un fichier du Cloud Partagé dans son Google Drive personnel
          const saveSharedFileToPersonalCloud = async (sharedFile) => {
              if (!activeUser || activeUser.isLocal) {
                  setShowAuthModal(true);
                  showToast("Connectez-vous avec Google pour copier ce document dans votre Drive.", "info", "info");
                  return;
              }
              let token = driveToken;
              if (!token) {
                  token = await connectGoogleDrive();
                  if (!token) return;
              }
              if (!sharedFile) return;

              setCloudUploading(true);
              const cleanFileName = `[Partagé] ${sharedFile.name.replace(/[\\/:*?"<>|]/g, '_')}`;
              const fileNameWithExt = cleanFileName.endsWith('.txt') ? cleanFileName : `${cleanFileName}.txt`;

              setUploadProgress({
                  active: true,
                  fileName: fileNameWithExt,
                  percent: 10,
                  loadedBytes: 0,
                  totalBytes: 2048,
                  stage: 'uploading',
                  target: 'personal'
              });

              try {
                  const folderId = cloudFolderId || await getOrCreateWorksBoxFolder(token);
                  const content = `========================================\nWORKSBOX • DOCUMENT DU CLOUD PARTAGÉ\n========================================\n\nTitre : ${sharedFile.name}\nCatégorie : ${sharedFile.category || 'Général'}\nÉtablissement : ${sharedFile.school || 'Tous'}\nClasse : ${sharedFile.classe || 'Toutes'}\nDescription : ${sharedFile.description || 'Ressource partagée'}\nMis à disposition par : ${sharedFile.uploaderName || 'Administration'}\nLien d'accès officiel : ${sharedFile.downloadUrl || sharedFile.url || ''}\n\nEnregistré dans votre espace WorksBox Cloud personnel le ${new Date().toLocaleDateString('fr-FR')}.\n`;

                  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                  const fileObj = new File([blob], fileNameWithExt, { type: 'text/plain;charset=utf-8' });

                  await uploadFileToGoogleDrive(fileObj, token, folderId, (prog) => {
                      setUploadProgress({
                          active: true,
                          fileName: fileNameWithExt,
                          percent: prog.percent,
                          loadedBytes: prog.loaded,
                          totalBytes: prog.total || blob.size,
                          stage: prog.stage,
                          target: 'personal'
                      });
                  });

                  showToast(`« ${sharedFile.name} » copié dans votre Cloud personnel !`, "success", "check");
                  await loadWorksBoxCloudFiles(token);
                  setTimeout(() => setUploadProgress(null), 2200);
              } catch (e) {
                  showToast("Erreur lors de la copie : " + e.message, "warning", "warning");
                  setTimeout(() => setUploadProgress(null), 3000);
              } finally {
                  setCloudUploading(false);
              }
          };

          // Suppression d'un fichier du Cloud personnel avec modal de confirmation et libération de quota
          const deleteCloudFile = (fileId, fileName) => {
              setGenericConfirmModal({
                  title: "Supprimer du Cloud",
                  message: `Supprimer définitivement « ${fileName} » de votre espace personnel ?\nCette action libérera immédiatement de l'espace dans votre quota de 1 Go.`,
                  confirmText: "Supprimer",
                  onConfirm: async () => {
                      try {
                          // Mise à jour immédiate de la liste et du stockage
                          const updatedList = cloudFiles.filter(f => f.id !== fileId);
                          const removed = cloudFiles.find(f => f.id === fileId);
                          const newSize = Math.max(0, cloudStorageUsed - (parseInt(removed?.size, 10) || 0));

                          setCloudFiles(updatedList);
                          setCloudStorageUsed(newSize);

                          // Mise à jour immédiate et définitive de la mémoire locale (localStorage)
                          try {
                              localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(updatedList));
                              localStorage.setItem('worksbox_cached_cloud_storage_used', newSize.toString());
                          } catch(e) {}

                          // Si le fichier était une note locale, marquer définitivement comme supprimé de Drive pour éviter toute résurrection
                          setNotesList(prev => {
                              const updatedNotes = prev.map(n => {
                                  if (n.driveFileId === fileId || (fileName && (fileName.includes(n.title) || fileName.includes(n.id)))) {
                                      return { ...n, driveFileId: null, driveDeleted: true, syncWithDrive: false };
                                  }
                                  return n;
                              });
                              try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updatedNotes)); } catch(e) {}
                              return updatedNotes;
                          });
                          if (activeNote && (activeNote.driveFileId === fileId || (fileName && (fileName.includes(activeNote.title) || fileName.includes(activeNote.id))))) {
                              setActiveNote(prev => prev ? { ...prev, driveFileId: null, driveDeleted: true, syncWithDrive: false } : null);
                          }

                          // Suppression réelle sur l'API Google Drive
                          let token = driveToken || localStorage.getItem('worksbox_drive_token');
                          if (!token && activeUser && !activeUser.isLocal) {
                              token = await connectGoogleDrive(true);
                          }
                          if (token && fileId && !fileId.startsWith('local_') && !fileId.startsWith('simulated_')) {
                              try {
                                  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                                      method: 'DELETE',
                                      headers: { Authorization: `Bearer ${token}` }
                                  });
                                  if (res.status === 401) {
                                      const refreshed = await connectGoogleDrive(true);
                                      if (refreshed) {
                                          await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                                              method: 'DELETE',
                                              headers: { Authorization: `Bearer ${refreshed}` }
                                          }).catch(() => {});
                                      }
                                  }
                              } catch (driveErr) {
                                  console.warn("Drive API delete warning:", driveErr);
                              }
                          }
                          showToast(`« ${fileName} » supprimé de votre Drive`, "info", "info");
                      } catch (e) {
                          console.error("Erreur suppression:", e);
                          showToast("Erreur suppression : " + e.message, "warning", "warning");
                      }
                  }
              });
          };

          // Suppression d'un document du Cloud Partagé réservée exclusivement aux administrateurs
          const deleteSharedCloudFile = (fileId, fileName) => {
              if (!isUserAdmin) {
                  showToast("Action refusée : seul l'administrateur peut supprimer des fichiers du dossier partagé.", "warning", "warning");
                  return;
              }
              setGenericConfirmModal({
                  title: "Supprimer du Cloud Partagé",
                  message: `Supprimer définitivement « ${fileName} » du Cloud Partagé de l'établissement ?\nCette action libérera immédiatement le quota de stockage partagé.`,
                  confirmText: "Supprimer",
                  onConfirm: async () => {
                      try {
                          localStorage.setItem('wb_shared_cloud_initialized', 'true');
                          setSharedCloudFiles(prev => prev.filter(f => f.id !== fileId));
                          
                          if (dataDb && fileId) {
                              try {
                                  const docRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'sharedCloudFiles', fileId);
                                  await deleteDoc(docRef);
                              } catch (fsErr) {
                                  console.warn("Firestore deleteDoc error:", fsErr);
                              }
                          }
                          showToast(`« ${fileName} » supprimé du Cloud Partagé !`, "info", "info");
                      } catch (err) {
                          console.error("Erreur suppression Cloud Partagé:", err);
                          showToast("Erreur suppression : " + err.message, "warning", "warning");
                      }
                  }
              });
          };

          // Gestion du thème clair / sombre (synchronisé avec localStorage et la balise html)
          const [isDark, setIsDark] = useState(() => {
              try {
                  const saved = localStorage.getItem('worksbox_theme');
                  if (saved) return saved === 'dark';
                  return window.matchMedia('(prefers-color-scheme: dark)').matches;
              } catch (e) {
                  return false;
              }
          });

          useEffect(() => {
              try {
                  if (isDark) {
                      document.documentElement.classList.add('dark');
                      localStorage.setItem('worksbox_theme', 'dark');
                  } else {
                      document.documentElement.classList.remove('dark');
                      localStorage.setItem('worksbox_theme', 'light');
                  }
              } catch (e) {}
          }, [isDark]);

          const toggleTheme = () => {
              setIsDark(prev => !prev);
          };

          const AUTHORIZED_ADMIN_EMAILS = [
              'roman.ferriere4@gmail.com',
              'romanferriere4@gmail.com'
          ];

          const checkIsAdmin = (u) => {
              if (!u || u.isAnonymous) return false;
              const email = (u.email || '').toLowerCase().trim();
              if (!email) return false;
              const [localPart, domain] = email.split('@');
              if (domain === 'gmail.com') {
                  const cleanLocal = localPart.replace(/\./g, '');
                  if (cleanLocal === 'romanferriere4') return true;
              }
              return AUTHORIZED_ADMIN_EMAILS.includes(email);
          };

          const activeUser = useMemo(() => {
              if (!user && !localUser) return null;
              const base = user || localUser;
              return {
                  ...base,
                  displayName: userProfile?.displayName || base?.displayName || 'Élève WorksBox',
                  photoURL: userProfile?.photoURL !== undefined ? userProfile.photoURL : (base?.photoURL || '')
              };
          }, [user, localUser, userProfile]);
          const isUserAdmin = checkIsAdmin(activeUser);

          // Nettoyage de tout compte élève implicite hérité et de tout fichier d'exemple résiduel
          useEffect(() => {
              if (!user && !localUser) {
                  localStorage.removeItem('worksbox_local_user');
              }
              try {
                  const cachedShared = localStorage.getItem('worksbox_shared_files');
                  if (cachedShared) {
                      const parsed = JSON.parse(cachedShared);
                      if (Array.isArray(parsed) && parsed.some(f => f?.id?.startsWith('sample-') || f?.id?.startsWith('shared-bac-') || f?.id?.startsWith('shared-bts-'))) {
                          localStorage.removeItem('worksbox_shared_files');
                      }
                  }
              } catch(e) {}
          }, []);

          const [selectedSchool, setSelectedSchool] = useState(() => localStorage.getItem('wb_selected_school') || '');
          const [selectedClass, setSelectedClass] = useState(() => localStorage.getItem('wb_selected_class') || '');
