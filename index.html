        function ChapterBlock({ chapter, chapterCourses, handleView, tagColors, favorites, toggleFav, onCopyCourse, onShareCourse, onSaveCourseToCloud }) {
            const [isExpanded, setIsExpanded] = useState(chapterCourses.length <= 1);
            return (
                <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden transition-all duration-200">
                    <button
                        type="button"
                        id={`chapter-header-${chapter.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase()}`}
                        aria-expanded={isExpanded}
                        className="w-full text-left bg-slate-50/90 dark:bg-slate-800/80 border-b border-slate-200/80 dark:border-slate-800 px-6 py-4 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 flex justify-between items-center transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" 
                        onClick={() => setIsExpanded(!isExpanded)}
                    >
                        <div className="flex items-center space-x-3 pr-4">
                            <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100 transition-colors">{chapter}</h2>
                            <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-200/70 dark:bg-slate-700/80 text-slate-600 dark:text-slate-300 whitespace-nowrap">
                                {chapterCourses.length} {chapterCourses.length > 1 ? 'fiches' : 'fiche'}
                            </span>
                        </div>
                        <div className="p-1 rounded-lg text-slate-500 dark:text-slate-400 bg-white/60 dark:bg-slate-700/50 transition-colors">
                            <ChevronDown className={`w-5 h-5 transition-transform duration-300 ease-out ${isExpanded ? 'rotate-180 text-blue-600 dark:text-blue-400' : 'rotate-0'}`} />
                        </div>
                    </button>
                    <div className={`chapter-accordion-grid ${isExpanded ? 'expanded' : ''}`}>
                        <div className="chapter-accordion-inner">
                            <ul className="divide-y divide-slate-100 dark:divide-slate-800">
                                {chapterCourses.map(course => (
                                    <CourseListItem 
                                        key={course.id} 
                                        course={course} 
                                        handleView={handleView} 
                                        tagColors={tagColors} 
                                        isFav={favorites.includes(course.id)} 
                                        toggleFav={() => toggleFav(course.id)} 
                                        onCopy={onCopyCourse ? () => onCopyCourse(course) : undefined}
                                        onShare={onShareCourse ? () => onShareCourse(course) : (onCopyCourse ? () => onCopyCourse(course) : undefined)}
                                        onSaveToCloud={onSaveCourseToCloud ? () => onSaveCourseToCloud(course) : undefined}
                                    />
                                ))}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        function CourseCardSkeleton() {
            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm relative">
                    <div className="flex justify-between items-start mb-3">
                        <div className="skeleton-shimmer-box h-3 w-20 rounded-md"></div>
                        <div className="skeleton-shimmer-box w-5 h-5 rounded-md"></div>
                    </div>
                    <div className="skeleton-shimmer-box h-4 w-5/6 rounded-md mb-2"></div>
                    <div className="skeleton-shimmer-box h-4 w-3/5 rounded-md mb-4"></div>
                    <div className="flex gap-2 mt-4 pt-1">
                        <div className="skeleton-shimmer-box h-7 flex-1 rounded-lg"></div>
                        <div className="skeleton-shimmer-box h-7 flex-1 rounded-lg"></div>
                    </div>
                </div>
            );
        }

        function SubjectCardSkeleton() {
            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm flex items-center justify-between">
                    <div className="flex items-center space-x-4 flex-1">
                        <div className="skeleton-shimmer-box w-12 h-12 rounded-2xl flex-shrink-0"></div>
                        <div className="flex-1 min-w-0">
                            <div className="skeleton-shimmer-box h-5 w-32 rounded-md mb-2"></div>
                            <div className="skeleton-shimmer-box h-3.5 w-16 rounded-md"></div>
                        </div>
                    </div>
                    <div className="skeleton-shimmer-box w-6 h-6 rounded-full flex-shrink-0"></div>
                </div>
            );
        }

        function CourseListItemSkeleton() {
            return (
                <li className="p-4 sm:p-6 flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 flex-1 min-w-0">
                        <div className="skeleton-shimmer-box w-6 h-6 rounded-lg mt-1 flex-shrink-0"></div>
                        <div className="flex-1 min-w-0">
                            <div className="flex items-center space-x-2 mb-2">
                                <div className="skeleton-shimmer-box h-4 w-16 rounded"></div>
                                <div className="skeleton-shimmer-box h-4 w-14 rounded"></div>
                            </div>
                            <div className="skeleton-shimmer-box h-5 w-3/4 sm:w-2/3 rounded-md"></div>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2 flex-wrap gap-2">
                        <div className="skeleton-shimmer-box h-8 w-20 rounded-lg"></div>
                        <div className="skeleton-shimmer-box h-8 w-20 rounded-lg"></div>
                        <div className="skeleton-shimmer-box h-8 w-20 rounded-lg"></div>
                    </div>
                </li>
            );
        }

        function CourseListSkeleton({ view = 'home', selectedSubject = '' }) {
            if (view === 'subject') {
                return (
                    <div className="space-y-6 animate-in fade-in duration-200" id="skeleton-subject-view">
                        <div className="flex items-center space-x-4 mb-8">
                            <div className="skeleton-shimmer-box w-9 h-9 rounded-full"></div>
                            <div className="skeleton-shimmer-box h-8 w-52 rounded-xl"></div>
                        </div>
                        <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                            <div className="bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex justify-between items-center">
                                <div className="skeleton-shimmer-box h-6 w-56 rounded-md"></div>
                                <div className="skeleton-shimmer-box w-5 h-5 rounded-md"></div>
                            </div>
                            <ul className="divide-y divide-slate-100 dark:divide-slate-800">
                                <CourseListItemSkeleton />
                                <CourseListItemSkeleton />
                                <CourseListItemSkeleton />
                                <CourseListItemSkeleton />
                            </ul>
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-12 animate-in fade-in duration-200" id="skeleton-home-view">
                    {/* Header / Search Skeleton */}
                    <div className="text-center max-w-2xl mx-auto">
                        <div className="flex items-center justify-center space-x-3 mb-3">
                            <div className="skeleton-shimmer-box w-10 h-10 sm:w-11 sm:h-11 rounded-2xl"></div>
                            <div className="skeleton-shimmer-box h-9 w-64 rounded-xl"></div>
                        </div>
                        <div className="flex items-center justify-center mb-6">
                            <div className="skeleton-shimmer-box h-8 w-60 rounded-full"></div>
                        </div>
                        <div className="max-w-xl mx-auto">
                            <div className="skeleton-shimmer-box h-14 w-full rounded-2xl"></div>
                        </div>
                    </div>

                    {/* Section: Derniers ajouts Skeleton */}
                    <div>
                        <div className="flex items-center mb-4 space-x-2">
                            <div className="skeleton-shimmer-box w-5 h-5 rounded-md"></div>
                            <div className="skeleton-shimmer-box h-6 w-36 rounded-md"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <CourseCardSkeleton />
                            <CourseCardSkeleton />
                            <CourseCardSkeleton />
                            <CourseCardSkeleton />
                        </div>
                    </div>

                    {/* Section: Explorer par matière Skeleton */}
                    <div>
                        <div className="flex items-center mb-4 space-x-2">
                            <div className="skeleton-shimmer-box w-5 h-5 rounded-md"></div>
                            <div className="skeleton-shimmer-box h-6 w-48 rounded-md"></div>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                            <SubjectCardSkeleton />
                        </div>
                    </div>
                </div>
            );
        }

        function PreviewModal({ data, onClose, onCopy, onShare, onSaveToCloud }) {
            let previewUrl = data.link;
            const isGoogleDrive = previewUrl.includes('drive.google.com/file/d/');
            if (isGoogleDrive) {
                previewUrl = previewUrl.replace(/\/view.*$/, '/preview');
            }

            const getYouTubeUrl = (url) => {
                if (!url) return null;
                if (url.includes('youtube.com/embed/')) return url;
                let id = '';
                if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
                else if (url.includes('watch?v=')) id = new URLSearchParams(new URL(url).search).get('v');
                return id ? `https://www.youtube.com/embed/${id}` : null;
            };

            const ytEmbed = data.type === 'Vidéo' ? getYouTubeUrl(data.link) : null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full h-full max-w-6xl flex flex-col overflow-hidden border border-slate-200 dark:border-slate-800 animate-in zoom-in-95 duration-200">
                        <div className="flex justify-between items-center px-4 sm:px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 flex-shrink-0">
                            <div className="min-w-0 pr-4">
                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">{data.type}</span>
                                <h2 className="font-bold text-slate-800 dark:text-white text-base sm:text-lg truncate">{data.title}</h2>
                            </div>
                            <div className="flex items-center space-x-2 flex-shrink-0">
                                {onSaveToCloud && (
                                    <button 
                                        id="btn-save-cloud-preview"
                                        onClick={onSaveToCloud} 
                                        className="text-xs font-bold bg-sky-50 dark:bg-sky-950/60 hover:bg-sky-100 dark:hover:bg-sky-900 border border-sky-200 dark:border-sky-800 px-3 py-2 rounded-xl text-sky-700 dark:text-sky-300 flex items-center shadow-sm transition-colors active:scale-95"
                                        title="Sauvegarder dans mon espace Google Drive (1 Go)"
                                    >
                                        <Cloud className="w-3.5 h-3.5 mr-1.5 text-sky-600 dark:text-sky-400" />
                                        <span>Sauvegarder Drive</span>
                                    </button>
                                )}
                                {onShare && (
                                    <button 
                                        id="btn-share-preview-link"
                                        onClick={onShare} 
                                        className="text-xs font-bold bg-blue-50 dark:bg-blue-950/60 hover:bg-blue-100 dark:hover:bg-blue-900 border border-blue-200 dark:border-blue-800 px-3 py-2 rounded-xl text-blue-700 dark:text-blue-300 flex items-center shadow-sm transition-colors active:scale-95"
                                        title="Partager ce cours (copier le lien direct)"
                                    >
                                        <Share2 className="w-3.5 h-3.5 mr-1.5 text-blue-600 dark:text-blue-400" />
                                        <span>Partager</span>
                                    </button>
                                )}
                                {onCopy && (
                                    <button 
                                        id="btn-copy-preview-link"
                                        onClick={() => onCopy(data.link, data.title)} 
                                        className="text-xs font-bold bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-200 flex items-center shadow-sm transition-colors active:scale-95"
                                        title="Copier le lien"
                                    >
                                        <Copy className="w-3.5 h-3.5 mr-1.5 text-slate-500 dark:text-slate-400" />
                                        <span>Copier</span>
                                    </button>
                                )}
                                <a href={data.link} target="_blank" rel="noopener noreferrer" className="text-xs font-bold bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-200 flex items-center shadow-sm transition-colors">
                                    <ExternalLink className="w-3.5 h-3.5 mr-1" /> Ouvrir le lien
                                </a>
                                <button onClick={onClose} className="p-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl transition-colors"><X className="w-5 h-5"/></button>
                            </div>
                        </div>

                        <div className="flex-1 bg-slate-100 dark:bg-slate-950 flex items-center justify-center overflow-auto p-4 relative">
                            {data.type === 'Vidéo' && (
                                ytEmbed ? (
                                    <iframe src={ytEmbed} className="w-full h-full max-w-4xl aspect-video rounded-xl shadow-lg border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen title="Vidéo"></iframe>
                                ) : isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full border-0 rounded-xl" allow="autoplay" title="Vidéo Drive"></iframe>
                                ) : (
                                    <video src={data.link} controls className="max-w-full max-h-[80vh] rounded-xl shadow-lg bg-black">Votre navigateur ne prend pas en charge la balise vidéo.</video>
                                )
                            )}

                            {data.type === 'Image' && (
                                isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full border-0 rounded-xl" title="Image Drive"></iframe>
                                ) : (
                                    <div className="flex items-center justify-center w-full h-full">
                                        <img src={data.link} alt={data.title} className="max-w-full max-h-[82vh] object-contain rounded-xl shadow-lg bg-white dark:bg-slate-900 p-2 border border-slate-200 dark:border-slate-800" onError={(e) => { e.target.outerHTML = '<p class="text-slate-500 text-sm">Impossible d\'afficher directement l\'image. Utilisez le bouton "Ouvrir le lien" en haut.</p>'; }} />
                                    </div>
                                )
                            )}

                            {data.type === 'Audio' && (
                                isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full max-w-xl max-h-52 border-0 rounded-xl shadow" title="Audio Drive"></iframe>
                                ) : (
                                    <div className="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-800 flex flex-col items-center max-w-md w-full text-center">
                                        <div className="w-16 h-16 bg-purple-100 dark:bg-purple-950/80 text-purple-600 dark:text-purple-400 rounded-2xl flex items-center justify-center mb-4 shadow-sm">
                                            <MusicIcon className="w-8 h-8" />
                                        </div>
                                        <h3 className="font-bold text-slate-800 dark:text-white text-base mb-1 truncate w-full">{data.title}</h3>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">Écoute du fichier audio</p>
                                        <audio src={data.link} controls className="w-full outline-none">Votre navigateur ne supporte pas la lecture audio directe.</audio>
                                    </div>
                                )
                            )}

                            {(data.type === 'Numérique' || data.type === 'Casio') && (
                                <iframe src={previewUrl} className="absolute inset-0 w-full h-full border-0" title="Aperçu" allow="autoplay"></iframe>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Toast({ toast, onClose }) {
            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => {
                    onClose();
                }, 3200);
                return () => clearTimeout(timer);
            }, [toast?.id, onClose]);

            if (!toast) return null;

            return (
                <div 
                    id="toast-notification"
                    role="status"
                    aria-live="polite"
                    className="fixed bottom-6 inset-x-0 z-[100] flex justify-center px-4 pointer-events-none"
                >
                    <div className="pointer-events-auto max-w-md w-full sm:w-auto flex items-center space-x-3 px-4 py-3 sm:px-5 sm:py-3.5 bg-slate-900/95 dark:bg-slate-800/95 text-white border border-slate-700/80 dark:border-slate-600/80 rounded-2xl shadow-2xl backdrop-blur-md transition-all animate-in fade-in slide-in-from-bottom-5 duration-300">
                        <div className="flex-shrink-0">
                            {toast.icon === 'star' && (
                                <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
                                    <Star className="w-4 h-4" filled={true} />
                                </div>
                            )}
                            {toast.icon === 'copy' && (
                                <div className="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center">
                                    <Copy className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'check' && (
                                <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                    <Check className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'warning' && (
                                <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
                                    <AlertCircle className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'info' && (
                                <div className="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center">
                                    <FileText className="w-4 h-4" />
                                </div>
                            )}
                            {!toast.icon && (
                                <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                    <Check className="w-4 h-4" />
                                </div>
                            )}
                        </div>
                        <div className="flex-1 min-w-0 pr-1">
                            <p className="text-xs sm:text-sm font-semibold leading-tight break-words text-slate-100">
                                {toast.message}
                            </p>
                        </div>
                        <button
                            id="btn-toast-close"
                            onClick={onClose}
                            className="flex-shrink-0 p-1 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
                            title="Fermer la notification"
                        >
                            <X className="w-4 h-4" />
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
