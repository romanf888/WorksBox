                                        className="text-xs font-bold text-blue-600 hover:text-blue-700"
                                    >
                                        Modifier
                                    </button>
                                </div>
                                <p className="text-sm font-bold text-slate-800">{selectedSchool || 'Non défini'}</p>
                                <p className="text-xs text-slate-600">{selectedClass || 'Non défini'}</p>
                            </div>

                            <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 flex items-center justify-between">
                                <div>
                                    <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wide">Cours favoris</span>
                                    <p className="text-sm font-bold text-slate-800">{favoritesCount} cours enregistré{favoritesCount !== 1 ? 's' : ''}</p>
                                </div>
                                <button 
                                    onClick={onOpenFavorites}
                                    className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all"
                                >
                                    Voir les favoris
                                </button>
                            </div>

                            {isLocal && (
                                <div className="p-3.5 bg-blue-50/70 border border-blue-200/80 rounded-2xl flex items-center justify-between">
                                    <div className="text-xs text-slate-700 mr-2">
                                        <span className="font-bold block text-slate-900">Synchroniser avec Google ?</span>
                                        <span className="text-[11px] text-slate-500">Liez votre compte Google à ce profil.</span>
                                    </div>
                                    <button
                                        onClick={onUpgradeToGoogle}
                                        className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-sm"
                                    >
                                        Lier Google
                                    </button>
                                </div>
                            )}
                        </div>

                        <div className="pt-2 border-t border-slate-100 flex flex-col space-y-2">
                            <button 
                                id="btn-signout"
                                onClick={onSignOut}
                                className="w-full flex items-center justify-center space-x-2 py-2.5 px-4 bg-red-50 hover:bg-red-100 text-red-700 font-bold text-xs sm:text-sm rounded-xl border border-red-200 active:scale-[0.99] transition-all"
                            >
                                <LogOut className="w-4 h-4" />
                                <span>Se déconnecter</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function CourseListItem({ course, handleView, tagColors, isFav, toggleFav, showSubject = false }) {
            const courseTag = course.tag || 'Cours';
            const style = COLOR_PALETTES[tagColors?.[courseTag]] || COLOR_PALETTES.slate;
            return (
                <li className="p-4 sm:p-6 hover:bg-slate-50 transition-colors flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 flex-1 min-w-0">
                        <button onClick={toggleFav} className="mt-1 text-slate-300 hover:text-amber-400 transition-colors"><Star className="w-6 h-6" filled={isFav} /></button>
                        <div className="min-w-0">
                            <div className="flex items-center space-x-2 mb-1">
                                {showSubject && <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">{course.subject}</span>}
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider ${style}`}>{courseTag}</span>
                            </div>
                            <h4 className="text-lg font-semibold text-slate-900 truncate">{course.title}</h4>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2 flex-wrap gap-2">
                        {course.digitalLink && <button onClick={() => handleView(course, 'Numérique')} className="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><Eye className="w-4 h-4 mr-1"/> PDF</button>}
                        {course.casioLink && <button onClick={() => handleView(course, 'Casio')} className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><Calculator className="w-4 h-4 mr-1"/> Casio</button>}
                        {course.videoLink && <button onClick={() => handleView(course, 'Vidéo')} className="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><VideoIcon className="w-4 h-4 mr-1"/> Vidéo</button>}
                        {course.imageLink && <button onClick={() => handleView(course, 'Image')} className="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><ImageIcon className="w-4 h-4 mr-1"/> Image</button>}
                        {course.audioLink && <button onClick={() => handleView(course, 'Audio')} className="px-3 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><MusicIcon className="w-4 h-4 mr-1"/> Audio</button>}
                    </div>
                </li>
            );
        }

        function ChapterBlock({ chapter, chapterCourses, handleView, tagColors, favorites, toggleFav }) {
            const [isExpanded, setIsExpanded] = useState(chapterCourses.length <= 1);
            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-slate-50 border-b px-6 py-4 cursor-pointer hover:bg-slate-100 flex justify-between items-center" onClick={() => setIsExpanded(!isExpanded)}>
                        <h2 className="text-xl font-bold text-slate-800">{chapter}</h2>
                        <ChevronDown className={`w-5 h-5 transition-transform ${isExpanded ? 'rotate-180' : ''}`} />
                    </div>
                    {isExpanded && (
                        <ul className="divide-y divide-slate-100">
                            {chapterCourses.map(course => <CourseListItem key={course.id} course={course} handleView={handleView} tagColors={tagColors} isFav={favorites.includes(course.id)} toggleFav={() => toggleFav(course.id)} />)}
                        </ul>
                    )}
                </div>
            );
        }

        function PreviewModal({ data, onClose }) {
            let previewUrl = data.link;
            const isGoogleDrive = previewUrl.includes('drive.google.com/file/d/');
            if (isGoogleDrive) {
                previewUrl = previewUrl.replace(/\/view.*$/, '/preview');
            }

            const getYouTubeUrl = (url) => {
                if (!url) return null;
                if (url.includes('youtube.com/embed/')) return url;
                let id = '';
                if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
                else if (url.includes('watch?v=')) id = new URLSearchParams(new URL(url).search).get('v');
                return id ? `https://www.youtube.com/embed/${id}` : null;
            };

            const ytEmbed = data.type === 'Vidéo' ? getYouTubeUrl(data.link) : null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white rounded-2xl shadow-2xl w-full h-full max-w-6xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                        <div className="flex justify-between items-center px-4 sm:px-6 py-4 border-b bg-slate-50 flex-shrink-0">
                            <div className="min-w-0 pr-4">
                                <span className="text-xs font-bold text-slate-500 uppercase tracking-wide">{data.type}</span>
                                <h2 className="font-bold text-slate-800 text-base sm:text-lg truncate">{data.title}</h2>
                            </div>
                            <div className="flex items-center space-x-2 flex-shrink-0">
                                <a href={data.link} target="_blank" rel="noopener noreferrer" className="text-xs font-bold bg-white hover:bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl text-slate-700 flex items-center shadow-sm">
                                    <ExternalLink className="w-3.5 h-3.5 mr-1" /> Ouvrir le lien
                                </a>
                                <button onClick={onClose} className="p-2 bg-slate-200 hover:bg-slate-300 rounded-xl transition-colors"><X className="w-5 h-5"/></button>
                            </div>
                        </div>

                        <div className="flex-1 bg-slate-100 flex items-center justify-center overflow-auto p-4 relative">
                            {data.type === 'Vidéo' && (
                                ytEmbed ? (
                                    <iframe src={ytEmbed} className="w-full h-full max-w-4xl aspect-video rounded-xl shadow-lg border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen title="Vidéo"></iframe>
                                ) : isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full border-0 rounded-xl" allow="autoplay" title="Vidéo Drive"></iframe>
                                ) : (
                                    <video src={data.link} controls className="max-w-full max-h-[80vh] rounded-xl shadow-lg bg-black">Votre navigateur ne prend pas en charge la balise vidéo.</video>
                                )
                            )}

                            {data.type === 'Image' && (
                                isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full border-0 rounded-xl" title="Image Drive"></iframe>
                                ) : (
                                    <div className="flex items-center justify-center w-full h-full">
                                        <img src={data.link} alt={data.title} className="max-w-full max-h-[82vh] object-contain rounded-xl shadow-lg bg-white p-2 border" onError={(e) => { e.target.outerHTML = '<p class="text-slate-500 text-sm">Impossible d\'afficher directement l\'image. Utilisez le bouton "Ouvrir le lien" en haut.</p>'; }} />
                                    </div>
                                )
                            )}

                            {data.type === 'Audio' && (
                                isGoogleDrive ? (
                                    <iframe src={previewUrl} className="w-full h-full max-w-xl max-h-52 border-0 rounded-xl shadow" title="Audio Drive"></iframe>
                                ) : (
                                    <div className="bg-white p-8 rounded-2xl shadow-lg border border-slate-200 flex flex-col items-center max-w-md w-full text-center">
                                        <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mb-4 shadow-sm">
                                            <MusicIcon className="w-8 h-8" />
                                        </div>
                                        <h3 className="font-bold text-slate-800 text-base mb-1 truncate w-full">{data.title}</h3>
                                        <p className="text-xs text-slate-500 mb-6">Écoute du fichier audio</p>
                                        <audio src={data.link} controls className="w-full outline-none">Votre navigateur ne supporte pas la lecture audio directe.</audio>
                                    </div>
                                )
                            )}

                            {(data.type === 'Numérique' || data.type === 'Casio') && (
                                <iframe src={previewUrl} className="absolute inset-0 w-full h-full border-0" title="Aperçu" allow="autoplay"></iframe>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
