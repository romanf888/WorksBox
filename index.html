                  showToast(`${courseTitle} retiré de vos favoris`, "info", "info");
              }

              if (localUser) {
                  const updatedLocal = { ...localUser, favorites: newFavs };
                  setLocalUser(updatedLocal);
                  localStorage.setItem('worksbox_local_user', JSON.stringify(updatedLocal));
              }

              if (user && !user.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', user.uid);
                      await setDoc(userRef, { 
                          favorites: newFavs, 
                          updatedAt: new Date().toISOString() 
                      }, { merge: true });
                  } catch (e) {
                      handleFirestoreError(e, OperationType.UPDATE, `users/${user.uid}`);
                  }
              }
          };

          const handleLocalSignIn = (name) => {
              const cleanName = (name || '').trim() || 'Élève WorksBox';
              const newLocalProfile = {
                  uid: 'local_' + Date.now(),
                  displayName: cleanName,
                  email: cleanName.toLowerCase().replace(/[^a-z0-9]/g, '') + '@eleve.worksbox',
                  selectedSchool: selectedSchool || 'Lycée François Bazin',
                  selectedClass: selectedClass || 'Terminale STI2D',
                  favorites: favorites,
                  isLocal: true,
                  createdAt: new Date().toISOString()
              };
              localStorage.setItem('worksbox_local_user', JSON.stringify(newLocalProfile));
              localStorage.setItem('wb_student_name', cleanName);
              setLocalUser(newLocalProfile);
              setUserProfile(newLocalProfile);
              setShowAuthModal(false);
              setAuthError(null);
          };

          const handleSaveCompletedProfile = async (profileData) => {
              const targetUser = pendingSetupUser || user || activeUser;
              const targetUid = targetUser?.uid;
              const targetEmail = targetUser?.email;
              if (!targetUid) return;

              if (userDb) {
                  try {
                      const userRef = doc(userDb, 'users', targetUid);
                      const snap = await getDoc(userRef);
                      const existingData = snap.exists() ? snap.data() : {};
                      const mergedFavs = Array.from(new Set([...(existingData.favorites || []), ...favorites]));

                      const profilePayload = {
                          id: targetUid,
                          email: targetEmail || '',
                          displayName: profileData.displayName,
                          photoURL: profileData.photoURL || '',
                          selectedSchool: profileData.selectedSchool || selectedSchool || 'Lycée François Bazin',
                          selectedClass: profileData.selectedClass || selectedClass || 'Terminale STI2D',
                          favorites: mergedFavs,
                          setupCompleted: true,
                          driveLinked: true,
                          driveToken: driveToken || existingData.driveToken || null,
                          createdAt: existingData.createdAt || new Date().toISOString(),
                          updatedAt: new Date().toISOString()
                      };

                      await setDoc(userRef, profilePayload, { merge: true });

                      try {
                          const logId = `log-auth-${Date.now()}`;
                          const logRef = doc(userDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'activityLogs', logId);
                          await setDoc(logRef, {
                              id: logId,
                              type: 'AUTH',
                              action: `Connexion & Profil configuré pour « ${profileData.displayName} » (${profileData.selectedClass})`,
                              userEmail: targetEmail || '',
                              timestamp: new Date().toISOString()
                          });
                      } catch (_) {}

                      setUserProfile(profilePayload);
                      setFavorites(mergedFavs);
                      if (profileData.selectedSchool) {
                          setSelectedSchool(profileData.selectedSchool);
                          localStorage.setItem('wb_selected_school', profileData.selectedSchool);
                      }
                      if (profileData.selectedClass) {
                          setSelectedClass(profileData.selectedClass);
                          localStorage.setItem('wb_selected_class', profileData.selectedClass);
                      }
                      setShowProfileSetupModal(false);
                      setPendingSetupUser(null);
                      showToast(`Bienvenue ${profileData.displayName} ! Votre profil a été enregistré avec succès.`, "success", "check");
                  } catch (err) {
                      handleFirestoreError(err, OperationType.WRITE, `users/${targetUid}`);
                      throw err;
                  }
              }
          };

          const handleGoogleSignIn = async () => {
              if (!auth) {
                  setAuthError({ code: 'auth/not-initialized', message: 'Le service d\'authentification Firebase n\'est pas encore prêt.' });
                  return;
              }
              setAuthLoading(true);
              setAuthError(null);
              try {
                  const provider = new GoogleAuthProvider();
                  provider.addScope('profile');
                  provider.addScope('email');
                  provider.addScope('https://www.googleapis.com/auth/drive.file');
                  provider.setCustomParameters({ prompt: 'select_account' });
                  
                  let cred;
                  try {
                      cred = await signInWithPopup(auth, provider, browserPopupRedirectResolver);
                  } catch (popupErr) {
                      const pCode = popupErr?.code || '';
                      if (pCode === 'auth/popup-closed-by-user' || pCode === 'auth/popup-blocked') {
                          throw popupErr;
                      }
                      // Repli sur le profil Google standard sans scope Drive étendu en cas de restriction
                      console.warn('Tentative Google Sign-In avec profil standard...', popupErr);
                      const standardProvider = new GoogleAuthProvider();
                      standardProvider.setCustomParameters({ prompt: 'select_account' });
                      cred = await signInWithPopup(auth, standardProvider, browserPopupRedirectResolver);
                  }

                  const currentUser = cred.user;
                  const token = GoogleAuthProvider.credentialFromResult(cred)?.accessToken;
                  if (token) {
                      updateDriveToken(token);
                      await loadWorksBoxCloudFiles(token, true).catch(() => {});
                  }
                  
                  if (userDb && currentUser) {
                      try {
                          const userRef = doc(userDb, 'users', currentUser.uid);
                          const snap = await getDoc(userRef);
                          const existingData = snap.exists() ? snap.data() : {};
                          
                          if (snap.exists() && existingData.setupCompleted && existingData.displayName) {
                              // Profile setup is already completed: log in directly
                              const mergedFavs = Array.from(new Set([...(existingData.favorites || []), ...favorites]));
                              const newSchool = selectedSchool || existingData.selectedSchool || 'Lycée François Bazin';
                              const newClass = selectedClass || existingData.selectedClass || 'Terminale STI2D';
                              
                              const profilePayload = {
                                  id: currentUser.uid,
                                  email: currentUser.email || '',
                                  displayName: existingData.displayName,
                                  photoURL: existingData.photoURL || '',
                                  selectedSchool: newSchool,
                                  selectedClass: newClass,
                                  favorites: mergedFavs,
                                  setupCompleted: true,
                                  driveLinked: !!token || existingData.driveLinked,
                                  driveToken: token || existingData.driveToken || null,
                                  createdAt: existingData.createdAt || new Date().toISOString(),
                                  updatedAt: new Date().toISOString()
                              };
                              await setDoc(userRef, profilePayload, { merge: true });
                              setUserProfile(profilePayload);
                              setFavorites(mergedFavs);
                              if (newSchool) { setSelectedSchool(newSchool); localStorage.setItem('wb_selected_school', newSchool); }
                              if (newClass) { setSelectedClass(newClass); localStorage.setItem('wb_selected_class', newClass); }
                              setShowAuthModal(false);
                              showToast(`Bon retour ${profilePayload.displayName} !`, "success", "check");
                          } else {
                              // Account creation required: trigger Profile Setup Modal
                              setPendingSetupUser({
                                  uid: currentUser.uid,
                                  email: currentUser.email || '',
                                  displayName: currentUser.displayName || '',
                                  photoURL: currentUser.photoURL || ''
                              });
                              setShowAuthModal(false);
                              setShowProfileSetupModal(true);
                          }
                      } catch (err) {
                          handleFirestoreError(err, OperationType.WRITE, `users/${currentUser.uid}`);
                      }
                  }
                  localStorage.removeItem('worksbox_local_user');
                  setLocalUser(null);
              } catch (err) {
                  const errorCode = err?.code || '';
                  const errorMessage = err?.message || String(err || '');

                  console.warn('Firebase Auth Google Sign-In Error:', errorCode, errorMessage, err);

                  if (errorCode === 'auth/unauthorized-domain' || errorMessage.includes('unauthorized-domain')) {
                      setAuthError({
                          code: 'auth/unauthorized-domain',
                          domain: window.location.hostname,
                          message: `Le domaine "${window.location.hostname}" n'est pas encore autorisé dans la console Firebase pour le projet lycee-share.`
                      });
                  } else if (errorCode === 'auth/operation-not-allowed' || errorCode === 'auth/configuration-not-found' || errorMessage.includes('operation-not-allowed') || errorMessage.includes('configuration-not-found')) {
                      setAuthError({
                          code: errorCode || 'auth/operation-not-allowed',
                          message: 'La connexion Google n\'est pas finalisée dans Firebase Console. Dans le projet lycee-share > Authentication > Sign-in method > Google : cochez "Activer", choisissez l\'Email de support du projet, puis cliquez sur "Enregistrer".'
                      });
                  } else if (errorCode === 'auth/popup-closed-by-user') {
                      setAuthError({
                          code: errorCode,
                          message: 'La fenêtre de connexion Google a été fermée avant la fin de l\'authentification.'
                      });
                  } else if (errorCode === 'auth/popup-blocked') {
                      setAuthError({
                          code: errorCode,
                          message: 'La popup de connexion a été bloquée par le navigateur. Veuillez autoriser les fenêtres surgissantes ou ouvrir dans un nouvel onglet.'
                      });
                  } else {
                      setAuthError({
                          code: errorCode || 'auth/error',
                          message: errorMessage || 'Impossible de se connecter avec Google. Vérifiez la configuration dans Firebase Console.'
                      });
                  }
              } finally {
                  setAuthLoading(false);
              }
          };

          const handleSignOut = async () => {
              try {
                  if (auth && user) {
                      await signOut(auth);
                  }
                  localStorage.removeItem('worksbox_local_user');
                  updateDriveToken(null);
                  try {
                      localStorage.removeItem('worksbox_cloud_folder_id');
                      localStorage.removeItem('worksbox_cached_cloud_files');
                      localStorage.removeItem('worksbox_cached_cloud_storage_used');
                  } catch(e) {}
                  setCloudFolderId(null);
                  setCloudFiles([]);
                  setCloudStorageUsed(0);
                  setUser(null);
                  setLocalUser(null);
                  setUserProfile(null);
                  setPendingSetupUser(null);
                  setShowProfileSetupModal(false);
                  setShowAccountModal(false);
              } catch (err) {
                  console.error('Sign out error:', err);
              }
          };

          useEffect(() => {
            if (!auth) {
              setIsLoading(false);
              return;
            }
            const fallbackTimer = setTimeout(() => {
              setIsLoading(false);
            }, 2500);

            let unsubUserSnapshot = null;

            const unsubAuth = onAuthStateChanged(auth, async (u) => {
              setUser(u);
              if (unsubUserSnapshot) {
                  unsubUserSnapshot();
                  unsubUserSnapshot = null;
              }

              if (u && !u.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', u.uid);

                      // Écouteur temps réel (onSnapshot) pour synchronisation instantanée entre plusieurs navigateurs
                      unsubUserSnapshot = onSnapshot(userRef, (snap) => {
                          if (snap.exists()) {
                              const data = snap.data();
                              setUserProfile(prev => ({ ...prev, ...data }));
                              if (data.favorites && Array.isArray(data.favorites)) {
                                  setFavorites(data.favorites);
                              }
                              if (data.selectedSchool && !selectedSchool) {
                                  setSelectedSchool(data.selectedSchool);
                                  localStorage.setItem('wb_selected_school', data.selectedSchool);
                              }
                              if (data.selectedClass && !selectedClass) {
                                  setSelectedClass(data.selectedClass);
                                  localStorage.setItem('wb_selected_class', data.selectedClass);
                              }
                              if (!data.setupCompleted) {
                                  setPendingSetupUser(u);
                                  setShowProfileSetupModal(true);
                              }
                              // Synchronisation temps réel des fichiers WorksBox Cloud
                              if (Array.isArray(data.cloudFiles)) {
                                  setCloudFiles(data.cloudFiles);
                                  try { localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(data.cloudFiles)); } catch(e) {}
                              }
                              // Synchronisation temps réel du quota utilisé
                              if (typeof data.cloudStorageUsed === 'number') {
                                  setCloudStorageUsed(data.cloudStorageUsed);
                                  try { localStorage.setItem('worksbox_cached_cloud_storage_used', data.cloudStorageUsed.toString()); } catch(e) {}
                              }
                              // Synchronisation temps réel du dossier Cloud
                              if (data.cloudFolderId) {
                                  setCloudFolderId(data.cloudFolderId);
                                  try { localStorage.setItem('worksbox_cloud_folder_id', data.cloudFolderId); } catch(e) {}
                              }
                              // Synchronisation temps réel des notes
                              if (Array.isArray(data.notesList)) {
                                  setNotesList(data.notesList);
                                  try { localStorage.setItem('worksbox_notes_list', JSON.stringify(data.notesList)); } catch(e) {}
                              }
                              // Synchronisation temps réel du jeton Drive
                              if (data.driveToken) {
                                  setDriveToken(prev => prev || data.driveToken);
                                  try { localStorage.setItem('worksbox_drive_token', data.driveToken); } catch(e) {}
                              }
                          } else {
                              setPendingSetupUser(u);
                              setShowProfileSetupModal(true);
                          }
                      }, (err) => {
                          console.warn('User doc snapshot notice:', err);
                      });

                      // Migration / fusion initiale : synchroniser les fichiers locaux existants vers Firestore
                      const snap = await getDoc(userRef);
                      if (snap.exists()) {
                          const data = snap.data();
                          let firestoreFiles = Array.isArray(data.cloudFiles) ? [...data.cloudFiles] : [];
                          let needFilesUpdate = false;
                          try {
                              const localFiles = JSON.parse(localStorage.getItem('worksbox_cached_cloud_files') || '[]');
                              if (Array.isArray(localFiles) && localFiles.length > 0) {
                                  const existingIds = new Set(firestoreFiles.map(f => f.id || f.name));
                                  localFiles.forEach(lf => {
                                      if (lf && (lf.id || lf.name) && !existingIds.has(lf.id || lf.name)) {
                                          firestoreFiles.push(lf);
                                          needFilesUpdate = true;
                                      }
                                  });
                              }
                          } catch (_) {}

                          let firestoreNotes = Array.isArray(data.notesList) ? [...data.notesList] : [];
                          let needNotesUpdate = false;
                          try {
                              const localNotes = JSON.parse(localStorage.getItem('worksbox_notes_list') || '[]');
                              if (Array.isArray(localNotes) && localNotes.length > 0) {
                                  const existingIds = new Set(firestoreNotes.map(n => n.id));
                                  localNotes.forEach(ln => {
                                      if (ln && ln.id && !existingIds.has(ln.id)) {
                                          firestoreNotes.push(ln);
                                          needNotesUpdate = true;
                                      }
                                  });
                              }
                          } catch (_) {}

                          if (needFilesUpdate || needNotesUpdate) {
                              const totalStorage = firestoreFiles.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                              syncUserDataToFirestore({
                                  cloudFiles: firestoreFiles,
                                  notesList: firestoreNotes,
                                  cloudStorageUsed: totalStorage
                              });
                          }
                      }
                  } catch (err) {

          // Restauration automatique et silencieuse de l'espace WorksBox Cloud sans redemander la liaison à chaque actualisation
          useEffect(() => {
            const savedToken = driveToken || localStorage.getItem('worksbox_drive_token') || userProfile?.driveToken;

          }, [activeUser, driveToken, userProfile?.driveToken]);

          useEffect(() => {
            if (!dataDb) {

            }
            
            const settingsRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (docSnap) => { 
              if (docSnap.exists()) {

                try { localStorage.setItem('wb_outage_mode', String(outage)); } catch(e) {}
                if (outage && !window.location.pathname.includes('admin') && !window.location.pathname.includes('panne')) {

                }
                setSettings(prev => ({
                    ...prev,
                    ...data,

                    classes: Array.isArray(data.classes) ? data.classes : prev.classes,
                    subjects: Array.isArray(data.subjects) ? data.subjects : (Array.isArray(data.subjectOrder) ? data.subjectOrder : prev.subjects),
                    subjectOrder: Array.isArray(data.subjectOrder) ? data.subjectOrder : (Array.isArray(data.subjects) ? data.subjects : prev.subjectOrder),
                    schoolClasses: (data.schoolClasses && typeof data.schoolClasses === 'object') ? data.schoolClasses : prev.schoolClasses,
                    schoolClassSubjects: (data.schoolClassSubjects && typeof data.schoolClassSubjects === 'object') ? data.schoolClassSubjects : prev.schoolClassSubjects,
                    classSubjects: (data.classSubjects && typeof data.classSubjects === 'object') ? data.classSubjects : prev.classSubjects,
                    schoolClassLevels: (data.schoolClassLevels && typeof data.schoolClassLevels === 'object') ? data.schoolClassLevels : (prev.schoolClassLevels || {}),
                    classLevels: (data.classLevels && typeof data.classLevels === 'object') ? data.classLevels : (prev.classLevels || {})
                }));
              }
            }, (err) => console.warn('Settings snapshot error:', err));

            const coursesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses');
            const unsubCourses = onSnapshot(coursesRef, (snapshot) => {
              const loadedCourses = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  // Résolution intelligente de l'établissement pour les anciens cours
                  let resolvedSchool = data.school;
                  if (!resolvedSchool || resolvedSchool === 'Lycée François Bazin') {
                      if (data.classe === 'BTS SIO 1' || data.classe === 'BTS SIO 2') {
                          resolvedSchool = 'Lycée Gaspard Monge';
                      } else if (!resolvedSchool) {
                          resolvedSchool = 'Lycée François Bazin';

                  }

                      id: docSnap.id,

                      chapterOrder: typeof data.chapterOrder === 'number' ? data.chapterOrder : -new Date(data.date).getTime(),
                      courseOrder: typeof data.courseOrder === 'number' ? data.courseOrder : -new Date(data.date).getTime(),
                      viewsDigital: data.viewsDigital || 0,
                      viewsCasio: data.viewsCasio || 0,

                  };
              });
              const visibleCourses = loadedCourses.filter(c => c.isVisible !== false);
              setCourses(visibleCourses);
              try {
                  localStorage.setItem('wb_courses_offline_cache', JSON.stringify(visibleCourses));
                  localStorage.setItem('wb_courses_offline_cache_timestamp', String(Date.now()));
              } catch(e) {}
              setIsLoading(false);
            }, (err) => {
              console.warn('Courses snapshot error, using cached courses:', err);
              try {
                  const cached = localStorage.getItem('wb_courses_offline_cache');
                  if (cached) {
                      const parsed = JSON.parse(cached);
                      if (Array.isArray(parsed) && parsed.length > 0) setCourses(parsed);
                  }
              } catch(e) {}
              setIsLoading(false);
            });

            const articlesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'articles');
            const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
              const loadedArticles = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();

                      id: docSnap.id,

              setArticles(loadedArticles);
            }, (err) => console.warn('Articles snapshot error:', err));

            const sharedFilesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'sharedCloudFiles');
            const unsubSharedFiles = onSnapshot(sharedFilesRef, (snapshot) => {
              if (!snapshot.empty) {

                  id: docSnap.id,

                }));

                setSharedCloudFiles(loaded);

              }
            }, (err) => {
              console.warn('SharedCloudFiles snapshot error:', err);

            });

            // Synchronisation en direct de la configuration du Cloud Partagé (nom, description, quota, statut)
            const sharedConfigRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'sharedCloud');
            const unsubSharedConfig = onSnapshot(sharedConfigRef, (docSnap) => {
              if (docSnap.exists()) {

                  const merged = { ...prev, ...data };

                    localStorage.setItem('worksbox_shared_config', JSON.stringify(merged));

                  return merged;
                });

            }, (err) => console.warn('SharedCloudConfig snapshot error:', err));

            return () => { unsubSettings(); unsubCourses(); unsubArticles(); unsubSharedFiles(); unsubSharedConfig(); };

          const allSchools = useMemo(() => {

          }, [settings.classes, courses, articles]);

          const getClassesForSchool = (schoolName) => {
              if (!schoolName) return allClasses;
              if (settings.schoolClasses && Array.isArray(settings.schoolClasses[schoolName]) && settings.schoolClasses[schoolName].length > 0) {
                  return settings.schoolClasses[schoolName];
              }
              if (DEFAULT_SCHOOL_CLASSES[schoolName]) {
                  return DEFAULT_SCHOOL_CLASSES[schoolName];
              }
              const inCourses = Array.from(new Set(courses.filter(c => c.school === schoolName).map(c => c.classe).filter(Boolean)));
              if (inCourses.length > 0) return inCourses;
              return allClasses;
          };

          const availableClassesForSchool = useMemo(() => {
              return getClassesForSchool(selectedSchool);
          }, [selectedSchool, settings.schoolClasses, courses, allClasses]);

          useEffect(() => {
              if (allSchools.length > 0 && (!selectedSchool || !allSchools.includes(selectedSchool))) {

          }, [allSchools, selectedSchool, settings.schoolClasses]);

          const getSubjectsForClass = (schoolName, className) => {
              if (!className) return [];
              const pairKey = `${schoolName}__${className}`;
              // 1. Spécifique Lycée + Classe défini dans les réglages
              if (settings.schoolClassSubjects && settings.schoolClassSubjects[pairKey] !== undefined && Array.isArray(settings.schoolClassSubjects[pairKey])) {
                  return settings.schoolClassSubjects[pairKey];
              }
              // 2. Spécifique Lycée + Classe par défaut
              if (DEFAULT_SCHOOL_CLASS_SUBJECTS && DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey]) {
                  return DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey];
              }
              // 3. Spécifique Classe défini dans les réglages
              if (settings.classSubjects && settings.classSubjects[className] !== undefined && Array.isArray(settings.classSubjects[className])) {
                  return settings.classSubjects[className];
              }
              // 4. Spécifique Classe par défaut
              if (DEFAULT_CLASS_SUBJECTS && DEFAULT_CLASS_SUBJECTS[className]) {
                  return DEFAULT_CLASS_SUBJECTS[className];
              }
              // 5. Aucune matière associée à cette classe : on ne renvoie rien (seules les matières associées s'affichent)
              return [];
          };

          const activeSubjects = useMemo(() => {
              const configured = getSubjectsForClass(selectedSchool, selectedClass);
              
              // Si une liste de matières associées existe (que ce soit via les réglages admin ou les associations par défaut), on l'applique STRICTEMENT.
              if (configured && configured.length > 0) {
                  return configured;
              }

              // Uniquement si aucune matière n'est définie pour cette classe : détection des matières des cours existants
              const fromCourses = courses
                  .filter(c => {
                      const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim();
                      const cClass = (c.classe || 'Terminale STI2D').trim();
                      return cSchool.toLowerCase() === (selectedSchool || '').trim().toLowerCase() &&
                             cClass.toLowerCase() === (selectedClass || '').trim().toLowerCase() &&
                             c.subject;
                  })
                  .map(c => c.subject.trim())
                  .filter(Boolean);
              
              return Array.from(new Set(fromCourses));
          }, [selectedSchool, selectedClass, settings.schoolClassSubjects, settings.classSubjects, courses]);

          // Filtrage par établissement et classe sélectionnés avec restriction stricte aux matières associées
          const filteredCourses = useMemo(() => {
              const assocSet = new Set(activeSubjects.map(s => s.toLowerCase().trim()));
              return courses.filter(c => {
                  const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim();
                  const cClass = (c.classe || 'Terminale STI2D').trim();
                  const matchSchool = cSchool.toLowerCase() === (selectedSchool || '').trim().toLowerCase();
                  const matchClass = cClass.toLowerCase() === (selectedClass || '').trim().toLowerCase();
                  const cSubject = (c.subject || '').trim().toLowerCase();
                  const matchAssociated = cSubject ? assocSet.has(cSubject) : false;
                  return matchSchool && matchClass && matchAssociated;
              });
          }, [courses, selectedSchool, selectedClass, activeSubjects]);

          const filteredArticles = useMemo(() => {
              const list = articles.filter(a => (a.school || 'Lycée François Bazin') === selectedSchool && (a.classe || 'Terminale STI2D') === selectedClass);
              return [...list].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || new Date(b.date) - new Date(a.date));
          }, [articles, selectedSchool, selectedClass]);

          // Réinitialiser la matière sélectionnée si elle n'est plus associée à la classe courante
          useEffect(() => {
              if (selectedSubject && !activeSubjects.some(s => (s || '').trim().toLowerCase() === selectedSubject.trim().toLowerCase())) {
                  setSelectedSubject(null);
                  if (currentView === 'subject') {
                      setCurrentView('home');
                  }
              }
          }, [selectedSubject, activeSubjects, currentView]);

          const sortedSubjects = useMemo(() => {
              const ordered = Array.isArray(settings.subjects)
                  ? settings.subjects
                  : (Array.isArray(settings.subjectOrder) ? settings.subjectOrder : DEFAULT_SUBJECTS);
              
              const assocLowerMap = new Map();
              activeSubjects.forEach(s => {
                  if (s) assocLowerMap.set(s.trim().toLowerCase(), s);
              });

              const known = [];
              const visited = new Set();
              ordered.forEach(s => {
                  const sLower = (s || '').trim().toLowerCase();
                  if (assocLowerMap.has(sLower) && !visited.has(sLower)) {
                      known.push(assocLowerMap.get(sLower));
                      visited.add(sLower);
                  }
              });

              const remaining = activeSubjects.filter(s => !visited.has((s || '').trim().toLowerCase()));
              return [...known, ...remaining];
          }, [activeSubjects, settings.subjects, settings.subjectOrder]);

          const latestCourses = useMemo(() => filteredCourses.slice(0, 4), [filteredCourses]);
          const favoriteCourses = useMemo(() => filteredCourses.filter(c => favorites.includes(c.id)), [filteredCourses, favorites]);

          // Liste complète de tous les sous-dossiers existants pour les matières de la classe
          const allAvailableSubFolders = useMemo(() => {
              const list = [];
              sortedSubjects.forEach(subject => {
                  const targetSubjLower = (subject || '').trim().toLowerCase();
                  const subjectCourses = filteredCourses.filter(c => (c.subject || '').trim().toLowerCase() === targetSubjLower);
                  const registeredSubs = (settings?.subjectSubFolders?.[subject] || settings?.subjectSubFolders?.[subject.trim()] || []);
                  const subSet = new Set([
                      ...subjectCourses.map(c => (c.subSubject || c.subFolder || '').trim()).filter(Boolean),
                      ...registeredSubs.map(s => (s || '').trim()).filter(Boolean)
                  ]);
                  Array.from(subSet).forEach(subFolder => {
                      const count = subjectCourses.filter(c => (c.subSubject || c.subFolder || '').trim().toLowerCase() === subFolder.toLowerCase()).length;
                      list.push({
                          subject,
                          subFolder,
                          count
                      });
                  });
              });
              return list;
          }, [sortedSubjects, filteredCourses, settings.subjectSubFolders]);

          // Tokens de recherche insensibles aux accents et minuscules
          const searchTokens = useMemo(() => {
              if (!searchQuery) return [];
              return normalizeSearchText(searchQuery).split(/\s+/).filter(Boolean);
          }, [searchQuery]);

          // 1. Matières correspondantes
          const searchedSubjects = useMemo(() => {
              if (searchTokens.length === 0) return [];
              return sortedSubjects.filter(sub => {
                  const normSub = normalizeSearchText(sub);
                  return searchTokens.every(tok => normSub.includes(tok));
              });
          }, [sortedSubjects, searchTokens]);

          // 2. Sous-dossiers correspondants
          const searchedSubFolders = useMemo(() => {
              if (searchTokens.length === 0) return [];
              return allAvailableSubFolders.filter(item => {
                  const combined = normalizeSearchText(`${item.subject} ${item.subFolder}`);
                  return searchTokens.every(tok => combined.includes(tok));
              });
          }, [allAvailableSubFolders, searchTokens]);

          // 3. Actualités correspondantes
          const searchedArticles = useMemo(() => {
              if (searchTokens.length === 0) return [];
              return filteredArticles.filter(art => {
                  const combined = normalizeSearchText(`${art.title || ''} ${art.content || ''}`);
                  return searchTokens.every(tok => combined.includes(tok));
              });
          }, [filteredArticles, searchTokens]);

          // 4. Cours correspondants
          const searchedCourses = useMemo(() => {
              if (searchTokens.length === 0) return [];
              return filteredCourses.filter(c => {
                  const combined = normalizeSearchText(
                      `${c.title || ''} ${c.chapter || ''} ${c.subject || ''} ${c.subFolder || ''} ${c.subSubject || ''} ${c.tag || ''} ${c.description || ''} ${c.fileName || ''} ${c.fileType || ''} ${c.mediaType || ''}`
                  );
                  return searchTokens.every(tok => combined.includes(tok));
              });
          }, [filteredCourses, searchTokens]);

          // Alias pour compatibilité
          const filteredSubjectsList = searchedSubjects;

          // Nombre total de résultats trouvés
          const totalSearchResultsCount = searchedSubjects.length + searchedSubFolders.length + searchedArticles.length + searchedCourses.length;

          // Suggestions intelligentes pour le menu déroulant
          const searchSuggestions = useMemo(() => {
              if (searchTokens.length === 0) return [];
              const list = [];
              
              // Matières (jusqu'à 3)
              searchedSubjects.slice(0, 3).forEach(sub => {
                  const count = filteredCourses.filter(c => (c.subject || '').trim().toLowerCase() === sub.trim().toLowerCase()).length;
                  list.push({
                      type: 'subject',
                      id: `sub-${sub}`,
                      title: sub,
                      subtitle: `${count} cours disponible${count !== 1 ? 's' : ''}`,
                      badge: 'Matière',
                      badgeColor: 'blue',
                      data: sub,
                      action: () => {
                          openSubject(sub);
                          setIsSearchFocused(false);
                      }
                  });
              });

              // Sous-dossiers (jusqu'à 3)
              searchedSubFolders.slice(0, 3).forEach(item => {
                  list.push({
                      type: 'subFolder',
                      id: `folder-${item.subject}-${item.subFolder}`,
                      title: item.subFolder,
                      subtitle: `Dans ${item.subject} • ${item.count} cours`,

                      badgeColor: 'indigo',
                      data: item,
                      action: () => {
                          openSubject(item.subject, item.subFolder);
                          setIsSearchFocused(false);
                      }
                  });
              });

              // Cours (jusqu'à 5)
              searchedCourses.slice(0, 5).forEach(c => {
                  const formatLabel = c.digitalLink ? 'PDF' : (c.casioLink ? 'Casio' : (c.videoLink ? 'Vidéo' : (c.imageLink ? 'Image' : 'Document')));
                  list.push({
                      type: 'course',
                      id: `course-${c.id}`,
                      title: c.title,
                      subtitle: `${c.subject}${c.subFolder ? ` • ${c.subFolder}` : (c.chapter ? ` • ${c.chapter}` : '')}`,
                      badge: c.tag || formatLabel,

                      data: c,
                      action: () => {
                          const targetType = c.digitalLink ? 'Numérique' : (c.casioLink ? 'Casio' : (c.videoLink ? 'Vidéo' : (c.imageLink ? 'Image' : (c.audioLink ? 'Audio' : 'Numérique'))));
                          handleView(c, targetType);
                          setIsSearchFocused(false);
                      }
                  });
              });

              // Actualités (jusqu'à 2)
              searchedArticles.slice(0, 2).forEach(art => {
                  list.push({
                      type: 'article',
                      id: `art-${art.id}`,
                      title: art.title,
                      subtitle: `Actualité • ${new Date(art.date).toLocaleDateString('fr-FR')}`,
                      badge: 'Annonce',
                      badgeColor: 'amber',
                      data: art,
                      action: () => {
                          setReadingArticle(art);
                          setIsSearchFocused(false);
                      }
                  });
              });

              return list;
          }, [searchTokens, searchedSubjects, searchedSubFolders, searchedCourses, searchedArticles, filteredCourses]);

          const handleSearchKeyDown = (e) => {
              if (e.key === 'ArrowDown') {
                  e.preventDefault();
                  setSearchSelectedIndex(prev => {
                      if (searchSuggestions.length === 0) return -1;
                      return prev < searchSuggestions.length - 1 ? prev + 1 : 0;
                  });
              } else if (e.key === 'ArrowUp') {
                  e.preventDefault();
                  setSearchSelectedIndex(prev => {
                      if (searchSuggestions.length === 0) return -1;
                      return prev > 0 ? prev - 1 : searchSuggestions.length - 1;
                  });
              } else if (e.key === 'Enter') {
                  if (searchSelectedIndex >= 0 && searchSelectedIndex < searchSuggestions.length) {
                      e.preventDefault();
                      searchSuggestions[searchSelectedIndex].action();
                  } else {
                      setIsSearchFocused(false);
                      if (searchInputRef.current) searchInputRef.current.blur();
                  }
              } else if (e.key === 'Escape') {
                  setIsSearchFocused(false);
                  if (searchInputRef.current) searchInputRef.current.blur();
              }
          };

          const handleClearSearch = () => {
              setSearchQuery('');
              setSearchSelectedIndex(-1);
              if (searchInputRef.current) {
                  searchInputRef.current.focus();
              }
          };
          const goHome = () => { setSelectedSubject(null); setSelectedSubFolder(null); setCurrentView('home'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openSoftwareHub = () => { setSelectedSubject(null); setSelectedSubFolder(null); setCurrentView('software'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openSubject = (subject, subFolder = null) => { setSelectedSubject(subject); setSelectedSubFolder(subFolder); setCurrentView('subject'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openTerms = () => { setSelectedSubject(null); setSelectedSubFolder(null); setCurrentView('terms'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openCasioGuide = () => { setSelectedSubject(null); setSelectedSubFolder(null); setCurrentView('casioGuide'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          
          const openFlashcardsModal = (course = null) => {
              const targetCourse = course || (courses && courses.length > 0 ? courses[0] : null) || { 
                  id: 'demo-fc-1', 
                  title: 'Théorème des Valeurs Intermédiaires (TVI)', 
                  subject: 'Mathématiques', 
                  description: 'Quand peut-on appliquer le TVI pour prouver l\'existence d\'une solution f(x) = k ?', 
                  content: 'Lorsque f est une fonction continue sur un intervalle [a, b], et que k est compris entre f(a) et f(b).' 
              };
              setActiveFlashcardCourse(targetCourse);
              setFlashcardIndex(0);
              setShowFlashcardHint(false);

          };
          
          const openProfile = (tab = 'overview') => {
              if (!activeUser) {
                  setShowAuthModal(true);

              }
              setSelectedSubject(null);
              setSelectedSubFolder(null);
              const cleanTab = typeof tab === 'string' ? tab : 'overview';
              const targetTab = (cleanTab === 'profile' || cleanTab === 'account') ? 'overview' : (cleanTab || 'overview');
              setProfileTab(targetTab);
              setCurrentView('profile');
              window.scrollTo({top: 0, behavior: 'smooth'});
          };

          const activeSubFolders = useMemo(() => {
              if (!selectedSubject) return [];
              const targetSubjLower = selectedSubject.trim().toLowerCase();
              const subjectCourses = filteredCourses.filter(c => (c.subject || '').trim().toLowerCase() === targetSubjLower);
              const registeredSubs = (settings?.subjectSubFolders?.[selectedSubject] || settings?.subjectSubFolders?.[selectedSubject.trim()] || []);
              const subSet = new Set([
                  ...subjectCourses.map(c => (c.subSubject || c.subFolder || '').trim()).filter(Boolean),
                  ...registeredSubs.map(s => (s || '').trim()).filter(Boolean)
              ]);
              return Array.from(subSet).sort();
          }, [filteredCourses, selectedSubject, settings.subjectSubFolders]);
          const openFavorites = () => openProfile('favorites');
          const openCloud = () => openProfile('cloud');
          const openSharedCloud = () => openProfile('sharedCloud');
          const openAccount = () => openProfile('account');

          const handleView = async (course, type) => {
              if (type === 'Numérique') setPreviewData({ link: course.digitalLink, title: course.title, type: 'Numérique', course });
              else if (type === 'Casio') setPreviewData({ link: course.casioLink, title: course.title, type: 'Casio', course });
              else if (type === 'Vidéo') setPreviewData({ link: course.videoLink, title: course.title, type: 'Vidéo', course });
              else if (type === 'Image') setPreviewData({ link: course.imageLink, title: course.title, type: 'Image', course });
              else if (type === 'Audio') setPreviewData({ link: course.audioLink, title: course.title, type: 'Audio', course });

              if (dataDb) {
                  try {
                      const docRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', course.id.toString());
                      const updates = {};
                      if (type === 'Numérique') updates.viewsDigital = (course.viewsDigital || 0) + 1;
                      if (type === 'Casio') updates.viewsCasio = (course.viewsCasio || 0) + 1;
                      if (Object.keys(updates).length > 0) await updateDoc(docRef, updates);
                  } catch(e) {
                      console.warn('Erreur incrément vue :', e);
                  }
              }
          };

          // Détection d'un lien direct vers un cours dans l'URL (?course=... ou ?c=...)

          useEffect(() => {
              if (deepLinkHandled || !courses || courses.length === 0) return;
              try {
                  const params = new URLSearchParams(window.location.search);
                  const targetCourseId = params.get('course') || params.get('c');
                  if (targetCourseId) {
                      const target = courses.find(c => String(c.id) === String(targetCourseId));
                      if (target) {
                          setDeepLinkHandled(true);
                          if (target.school) {
                              setSelectedSchool(target.school);
                              localStorage.setItem('wb_selected_school', target.school);
                          }
                          if (target.classe) {
                              setSelectedClass(target.classe);
                              localStorage.setItem('wb_selected_class', target.classe);
                          }
                          if (target.subject) {
                              setSelectedSubject(target.subject);
                              setCurrentView('subject');
                          }
                          const link = target.digitalLink || target.casioLink || target.videoLink || target.imageLink || target.audioLink;
                          const type = target.digitalLink ? 'Numérique' : (target.casioLink ? 'Casio' : (target.videoLink ? 'Vidéo' : (target.imageLink ? 'Image' : 'Audio')));
                          if (link) {
                              setPreviewData({
                                  link,
                                  type,
                                  title: target.title,
                                  course: target
                              });
                          }
                          showToast(`Affichage du cours « ${target.title} »`, 'info', 'info');

                  console.warn('Erreur lecture lien direct cours :', err);

          const chaptersData = useMemo(() => {
            if (!selectedSubject) return [];

            let filtered = filteredCourses.filter(c => (c.subject || '').trim().toLowerCase() === targetSubjLower);
            if (selectedSubFolder) {
                const sfLower = selectedSubFolder.trim().toLowerCase();
                filtered = filtered.filter(c => (c.subSubject || c.subFolder || '').trim().toLowerCase() === sfLower);
            }
            const groups = {};
            filtered.forEach(course => {
                if (!groups[course.chapter]) groups[course.chapter] = { name: course.chapter, courses: [] };
                groups[course.chapter].courses.push(course);
            });
            Object.values(groups).forEach(group => {
                group.chapterOrder = Math.min(...group.courses.map(c => c.chapterOrder || 0));
                group.courses.sort((a, b) => (a.courseOrder||0) - (b.courseOrder||0));

                      const userRef = doc(userDb, 'users', user.uid);

                          selectedClass: selectedClass,
                          updatedAt: new Date().toISOString()

                      console.warn('Erreur sauvegarde profil utilisateur :', err);
                  }

              if (!url) return null;
              if (url.includes('embed/')) return url;
              let videoId = '';
              if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
              else if (url.includes('watch?v=')) videoId = new URLSearchParams(new URL(url).search).get('v');
              return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
          };

          const getYouTubeThumbnail = (url) => {
              if (!url) return null;
              try {
                  let videoId = '';
                  if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
                  else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
                  else if (url.includes('watch?v=')) videoId = new URLSearchParams(new URL(url).search).get('v');

                  <div className="absolute -bottom-40 left-1/3 w-[450px] h-[450px] sm:w-[700px] sm:h-[700px] bg-gradient-to-tl from-sky-400/15 via-blue-600/15 to-teal-400/10 dark:from-sky-500/20 dark:via-blue-800/25 dark:to-indigo-900/30 rounded-full blur-[130px]" />

                                    🚧
                                </div>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-1.5 leading-none">
                                        <span className="text-base sm:text-lg font-black tracking-tight text-slate-900 dark:text-white">WorksBox</span>
                                        <span className="text-[10px] sm:text-xs font-black px-1.5 py-0.5 rounded-md bg-amber-500 text-slate-950 uppercase tracking-wider">LIMITED</span>

                        {/* Liens desktop */}
                        <div className="hidden lg:flex items-center space-x-1.5">
                            <button onClick={goHome} className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-all flex items-center cursor-pointer ${(currentView === 'home' || currentView === 'subject') ? 'bg-blue-500/15 dark:bg-blue-400/20 text-blue-600 dark:text-blue-300 border border-blue-400/30 shadow-xs' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-white/5'}`}><HomeIcon className="w-4 h-4 mr-1.5" /> Accueil</button>
                            <button onClick={openSoftwareHub} className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-all flex items-center cursor-pointer ${(currentView === 'software' || currentView === 'noteEditor') ? 'bg-blue-500/15 dark:bg-blue-400/20 text-blue-600 dark:text-blue-300 border border-blue-400/30 shadow-xs' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-white/5'}`}>
                                <Layers className="w-4 h-4 mr-1.5 text-blue-500 dark:text-blue-400" />

                            <button onClick={openCasioGuide} className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-all flex items-center cursor-pointer ${currentView === 'casioGuide' ? 'bg-blue-500/15 dark:bg-blue-400/20 text-blue-600 dark:text-blue-300 border border-blue-400/30 shadow-xs' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-white/5'}`}><HelpCircle className="w-4 h-4 mr-1.5" /> Tuto Casio</button>
                        </div>
                    </div>

                    {/* Actions de droite (Adaptées mobile : badge classe, thème, menu compact) */}
                    <div className="flex items-center space-x-1.5 sm:space-x-2.5">
                        {/* Bouton d'accès rapide à l'annonce officielle si définie */}

        function SuggestDocumentModal({ subject, school, classe, activeUser, onClose, onToast }) {
            const [documentTitle, setDocumentTitle] = useState('');
            const [chapter, setChapter] = useState('');
            const [file, setFile] = useState(null);
            const [userName, setUserName] = useState(activeUser?.displayName || '');
            const [userEmail, setUserEmail] = useState(activeUser?.email || '');
            const [notes, setNotes] = useState('');
            const [isSending, setIsSending] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [successMsg, setSuccessMsg] = useState('');

            const handleFileChange = (e) => {
                const selected = e.target.files?.[0];
                if (selected) {
                    setFile(selected);
                    if (!documentTitle) {
                        const cleanName = selected.name.replace(/\.[^/.]+$/, '').replace(/[_.-]+/g, ' ');
                        setDocumentTitle(cleanName.charAt(0).toUpperCase() + cleanName.slice(1));
                    }
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const cleanTitle = documentTitle.trim();
                const cleanNotes = notes.trim();
                if (!file && !cleanTitle && !cleanNotes) {
                    if (onToast) onToast("Veuillez remplir au moins le titre, un message ou choisir un fichier.", "warning");
                    return;
                }
                setIsSending(true);

                const processAndSave = async (fileDataUrl = '', fileNameStr = '') => {
                    const suggestionId = `suggest-${Date.now()}`;
                    const senderName = userName.trim() || activeUser?.displayName || 'Un élève';
                    const docName = fileNameStr || cleanTitle || 'Demande de cours';
                    const formattedNotification = `${senderName} à suggérer le document [${docName}] pour l'ajouter au cours`;

                    if (dataDb) {
                        try {
                            const sugRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'documentSuggestions', suggestionId);
                            await setDoc(sugRef, {
                                id: suggestionId,
                                senderName,
                                senderEmail: userEmail || activeUser?.email || '',
                                subject: subject || 'Général',
                                school: school || 'Lycée François Bazin',
                                classe: classe || 'Terminale STI2D',
                                documentTitle: cleanTitle || docName,
                                fileName: fileNameStr || cleanTitle || 'Demande de cours',
                                fileSize: file ? file.size : 0,
                                fileType: file ? file.type : 'text/plain',
                                fileDataUrl: fileDataUrl,
                                chapter: chapter.trim() || 'Suggestions d\'élèves',
                                notes: cleanNotes,
                                createdAt: new Date().toISOString(),
                                status: 'pending'
                            });

                            const logId = `log-sug-${Date.now()}`;
                            const logRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'activityLogs', logId);
                            await setDoc(logRef, {
                                id: logId,
                                type: 'SUGGESTION',
                                action: `Document suggéré : « ${cleanTitle || docName} » (${subject || 'Général'} - ${classe || 'STI2D'})`,
                                userEmail: userEmail || activeUser?.email || '',
                                timestamp: new Date().toISOString()
                            });
                        } catch (fsErr) {
                            console.warn('Firestore suggestion save note:', fsErr);
                        }
                    }

                    try {
                        await fetch('/api/suggest-document', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userName: senderName,
                                userEmail: userEmail || activeUser?.email || '',
                                subject: subject || 'Général',
                                school: school || 'Lycée François Bazin',
                                classe: classe || 'Terminale STI2D',
                                documentTitle: cleanTitle || docName,
                                fileName: fileNameStr || cleanTitle || 'Demande de cours',
                                notes: cleanNotes
                            })
                        });
                    } catch (apiErr) {
                        console.warn('Backend notification call:', apiErr);
                    }

                    setIsSending(false);
                    setIsSuccess(true);
                    setSuccessMsg(formattedNotification);
                    if (onToast) onToast(`Merci ! Demande transmise à l'administrateur.`, "success", "check");
                };

                if (file) {
                    try {
                        const fileReader = new FileReader();
                        fileReader.onload = (evt) => {
                            const dataUrl = evt.target.result;
                            processAndSave(dataUrl.length < 5000000 ? dataUrl : '', file.name);
                        };
                        fileReader.readAsDataURL(file);
                    } catch (err) {
                        setIsSending(false);
                        if (onToast) onToast("Erreur lors de la lecture du fichier.", "error");
                    }
                } else {
                    processAndSave('', '');
                }
            };

            return (
                <div id="suggest-document-modal" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-lg p-6 sm:p-8 border border-slate-200 dark:border-slate-800 flex flex-col relative max-h-[92vh] overflow-y-auto animate-in zoom-in-95 duration-200">
                        <button 
                            onClick={onClose} 
                            className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer"
                        >
                            <X className="w-5 h-5" />
                        </button>

                        <div className="text-center mb-5">
                            <div className="w-14 h-14 bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner border border-blue-200 dark:border-blue-800">
                                <UploadCloud className="w-7 h-7" />
                            </div>
                            <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">
                                Suggérer un document / demander un cours
                            </h2>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">
                                Matière : <strong className="text-blue-600 dark:text-blue-400">{subject}</strong> • {classe}
                            </p>
                        </div>

                        {isSuccess ? (
                            <div className="p-6 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 rounded-2xl text-center space-y-4 my-2">
                                <div className="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto shadow-md">
                                    <Check className="w-6 h-6" />
                                </div>
                                <h3 className="text-base font-extrabold text-emerald-900 dark:text-emerald-200">
                                    Demande transmise avec succès !
                                </h3>
                                <p className="text-xs font-semibold text-emerald-800 dark:text-emerald-300 leading-relaxed bg-white/60 dark:bg-slate-900/60 p-3 rounded-xl border border-emerald-200 dark:border-emerald-800">
                                    "{successMsg}"
                                </p>
                                <p className="text-[11px] text-emerald-700 dark:text-emerald-400">
                                    L'administrateur Roman Ferrière a bien reçu votre demande sur son panel d'administration WorksBox. Merci pour votre aide !
                                </p>
                                <button
                                    onClick={onClose}
                                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-md transition cursor-pointer"
                                >
                                    Fermer
                                </button>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>

                    return;

                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_SIZE = 256;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height = Math.round((height * MAX_SIZE) / width);
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width = Math.round((width * MAX_SIZE) / height);
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                        setPhotoURL(compressedDataUrl);

                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-red-100 text-red-700 border border-red-200 uppercase tracking-wider">
                        <VideoIcon className="w-2.5 h-2.5 mr-1" /> {ext ? ext.toUpperCase() : 'VIDÉO'}
                    </span>
                );
            }
            if (media === 'audio' || ext === 'mp3' || ext === 'wav' || ext === 'm4a') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-purple-100 text-purple-700 border border-purple-200 uppercase tracking-wider">

            if (media === 'casio' || ext === 'g1m' || ext === 'txt') {

                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-emerald-100 text-emerald-800 border border-emerald-200 uppercase tracking-wider">

            }
            if (media === 'spreadsheet' || ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-green-100 text-green-700 border border-green-200 uppercase tracking-wider">

            if (media === 'image' || ['png', 'jpg', 'jpeg', 'webp', 'svg'].includes(ext)) {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-amber-100 text-amber-700 border border-amber-200 uppercase tracking-wider">

            if (ext === 'pdf') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-blue-100 text-blue-700 border border-blue-200 uppercase tracking-wider">

            if (ext) {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 uppercase tracking-wider">
