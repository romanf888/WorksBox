          GET: 'get',
          WRITE: 'write',
        };

        function handleFirestoreError(error, operationType, path) {
          const errInfo = {
            error: error instanceof Error ? error.message : String(error),
            authInfo: {
              userId: auth?.currentUser?.uid,
              email: auth?.currentUser?.email,
              emailVerified: auth?.currentUser?.emailVerified,
              isAnonymous: auth?.currentUser?.isAnonymous,
              tenantId: auth?.currentUser?.tenantId,
              providerInfo: auth?.currentUser?.providerData?.map(provider => ({
                providerId: provider.providerId,
                email: provider.email,
              })) || []
            },
            operationType,
            path
          };
          console.error('Firestore Error: ', JSON.stringify(errInfo));
          return errInfo;
        }

            }
          }
        }

          const [selectedSubject, setSelectedSubject] = useState(null);
          const [searchQuery, setSearchQuery] = useState('');
          const [courses, setCourses] = useState([]);
          const [articles, setArticles] = useState([]);

              subjectOrder: DEFAULT_SUBJECTS, 
              tagColors: {}, 
              schools: DEFAULT_SCHOOLS, 
              classes: DEFAULT_CLASSES,
              termsContent: DEFAULT_TERMS_FALLBACK,
              casioGuideContent: DEFAULT_CASIO_FALLBACK
          });
          const [isLoading, setIsLoading] = useState(true);
          const [dataUser, setDataUser] = useState(null);
          const [user, setUser] = useState(null);
          // Par défaut, l'utilisateur n'a aucun compte au démarrage. C'est à lui de choisir de se connecter.
          const [localUser, setLocalUser] = useState(null);
          const [userProfile, setUserProfile] = useState(null);
          const [showAuthModal, setShowAuthModal] = useState(false);
          const [showAccountModal, setShowAccountModal] = useState(false);
          const [authLoading, setAuthLoading] = useState(false);
          const [authError, setAuthError] = useState(null);
          const [previewData, setPreviewData] = useState(null);

          const activeUser = user || localUser;

          // Nettoyage de tout compte élève implicite hérité pour s'assurer que le visiteur commence sans compte
          useEffect(() => {
              if (!user && !localUser) {
                  localStorage.removeItem('worksbox_local_user');
              }
          }, []);

          const [selectedSchool, setSelectedSchool] = useState(() => localStorage.getItem('wb_selected_school') || '');
          const [selectedClass, setSelectedClass] = useState(() => localStorage.getItem('wb_selected_class') || '');
          const [showOnboarding, setShowOnboarding] = useState(!localStorage.getItem('wb_selected_school') || !localStorage.getItem('wb_selected_class'));

          // Gestion de l'acceptation obligatoire des conditions d'utilisation au démarrage
          const [hasAcceptedTerms, setHasAcceptedTerms] = useState(() => localStorage.getItem('wb_terms_accepted') === 'true');
          const [termsAgreementChecked, setTermsAgreementChecked] = useState(false);

          const [favorites, setFavorites] = useState(() => {
              const saved = localStorage.getItem('worksbox_favs');
              return saved ? JSON.parse(saved) : [];
          });

          useEffect(() => { 
              localStorage.setItem('worksbox_favs', JSON.stringify(favorites)); 
          }, [favorites]);

          const toggleFav = async (courseId) => {
              // Si l'utilisateur n'est pas connecté, demander la connexion pour utiliser les favoris
              if (!activeUser) {
                  setShowAuthModal(true);
                  return;
              }

              const newFavs = favorites.includes(courseId)
                  ? favorites.filter(id => id !== courseId)
                  : [...favorites, courseId];
              setFavorites(newFavs);

              if (localUser) {
                  const updatedLocal = { ...localUser, favorites: newFavs };
                  setLocalUser(updatedLocal);
                  localStorage.setItem('worksbox_local_user', JSON.stringify(updatedLocal));
              }

              if (user && !user.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', user.uid);
                      await setDoc(userRef, { 
                          favorites: newFavs, 
                          updatedAt: new Date().toISOString() 
                      }, { merge: true });
                  } catch (e) {
                      handleFirestoreError(e, OperationType.UPDATE, `users/${user.uid}`);
                  }
              }
          };

          const handleLocalSignIn = (name) => {
              const cleanName = (name || '').trim() || 'Élève WorksBox';
              const newLocalProfile = {
                  uid: 'local_' + Date.now(),
                  displayName: cleanName,
                  email: cleanName.toLowerCase().replace(/[^a-z0-9]/g, '') + '@eleve.worksbox',
                  selectedSchool: selectedSchool || 'Lycée François Bazin',
                  selectedClass: selectedClass || 'Terminale STI2D',
                  favorites: favorites,
                  isLocal: true,
                  createdAt: new Date().toISOString()
              };
              localStorage.setItem('worksbox_local_user', JSON.stringify(newLocalProfile));
              localStorage.setItem('wb_student_name', cleanName);
              setLocalUser(newLocalProfile);
              setUserProfile(newLocalProfile);
              setShowAuthModal(false);
              setAuthError(null);
          };

          const handleGoogleSignIn = async () => {
              if (!auth) {
                  setAuthError({ code: 'auth/not-initialized', message: 'Le service d\'authentification Firebase n\'est pas encore prêt.' });
                  return;
              }
              setAuthLoading(true);
              setAuthError(null);
              try {
                  const provider = new GoogleAuthProvider();
                  provider.setCustomParameters({ prompt: 'select_account' });
                  const cred = await signInWithPopup(auth, provider);
                  const currentUser = cred.user;
                  
                  if (userDb && currentUser) {
                      try {
                          const userRef = doc(userDb, 'users', currentUser.uid);
                          const snap = await getDoc(userRef);
                          const existingData = snap.exists() ? snap.data() : {};
                          const mergedFavs = Array.from(new Set([...(existingData.favorites || []), ...favorites]));
                          const newSchool = selectedSchool || existingData.selectedSchool || 'Lycée François Bazin';
                          const newClass = selectedClass || existingData.selectedClass || 'Terminale STI2D';
                          
                          const profilePayload = {
                              id: currentUser.uid,
                              email: currentUser.email || '',
                              displayName: currentUser.displayName || 'Élève',
                              photoURL: currentUser.photoURL || '',
                              selectedSchool: newSchool,
                              selectedClass: newClass,
                              favorites: mergedFavs,
                              createdAt: existingData.createdAt || new Date().toISOString(),
                              updatedAt: new Date().toISOString()
                          };
                          await setDoc(userRef, profilePayload, { merge: true });
                          setUserProfile(profilePayload);
                          setFavorites(mergedFavs);
                          if (newSchool) { setSelectedSchool(newSchool); localStorage.setItem('wb_selected_school', newSchool); }
                          if (newClass) { setSelectedClass(newClass); localStorage.setItem('wb_selected_class', newClass); }
                      } catch (err) {
                          handleFirestoreError(err, OperationType.WRITE, `users/${currentUser.uid}`);
                      }
                  }
                  localStorage.removeItem('worksbox_local_user');
                  setLocalUser(null);
                  setShowAuthModal(false);
              } catch (err) {
                  console.error('Google Sign In Error:', err);
                  if (err.code === 'auth/unauthorized-domain' || err.message?.includes('unauthorized-domain')) {
                      setAuthError({
                          code: 'auth/unauthorized-domain',
                          domain: window.location.hostname,
                          message: `Le domaine "${window.location.hostname}" n'est pas encore autorisé dans Firebase pour la connexion Google OAuth.`
                      });
                  } else if (err.code === 'auth/operation-not-allowed' || err.message?.includes('operation-not-allowed')) {
                      setAuthError({
                          code: 'auth/operation-not-allowed',
                          message: 'La connexion avec Google n\'est pas encore activée dans la console Firebase pour le projet lycee-share.'
                      });
                  } else if (err.code === 'auth/popup-closed-by-user') {
                      setAuthError({
                          code: err.code,
                          message: 'La fenêtre de connexion Google a été fermée avant la fin.'
                      });
                  } else if (err.code === 'auth/popup-blocked') {
                      setAuthError({
                          code: err.code,
                          message: 'La popup de connexion a été bloquée par votre navigateur. Autorisez les popups ou ouvrez dans un nouvel onglet.'
                      });
                  } else {
                      setAuthError({
                          code: err.code || 'unknown',
                          message: err.message || 'Impossible de se connecter avec Google.'
                      });
                  }
              } finally {
                  setAuthLoading(false);
              }
          };

          const handleSignOut = async () => {
              try {
                  if (auth && user) {
                      await signOut(auth);
                  }
                  localStorage.removeItem('worksbox_local_user');
                  setUser(null);
                  setLocalUser(null);
                  setUserProfile(null);
                  setShowAccountModal(false);
              } catch (err) {
                  console.error('Sign out error:', err);
              }
          };

          useEffect(() => {
            if (!auth) {
              setIsLoading(false);
              return;
            }
            const fallbackTimer = setTimeout(() => {
              setIsLoading(false);
            }, 2500);

            const unsubAuth = onAuthStateChanged(auth, async (u) => {
              setUser(u);
              if (u && !u.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', u.uid);
                      const snap = await getDoc(userRef);
                      if (snap.exists()) {
                          const data = snap.data();
                          setUserProfile(data);
                          if (data.favorites && Array.isArray(data.favorites)) {
                              setFavorites(data.favorites);
                          }
                          if (data.selectedSchool && !selectedSchool) {
                              setSelectedSchool(data.selectedSchool);
                              localStorage.setItem('wb_selected_school', data.selectedSchool);
                          }
                          if (data.selectedClass && !selectedClass) {
                              setSelectedClass(data.selectedClass);
                              localStorage.setItem('wb_selected_class', data.selectedClass);
                          }
                      }
                  } catch (err) {
                      console.warn('Could not fetch user profile:', err);
                  }
              } else if (!u) {
                  if (localUser) {
                      setUserProfile(localUser);
                  } else {
                      setUserProfile(null);
                  }
              }
              setIsLoading(false);
            });

            return () => {
              clearTimeout(fallbackTimer);
              unsubAuth();
            };
          }, [localUser]);

          useEffect(() => {
            if (!dataAuth) return;
            const initDataAuth = async () => {
              try {
                await signInAnonymously(dataAuth);
              } catch (e) {
                console.warn('Erreur connexion anonyme lycee-share:', e);
              }
            };
            initDataAuth();
            return onAuthStateChanged(dataAuth, setDataUser);
          }, []);

          useEffect(() => {
            if (!dataDb || !dataUser) {
              return;
            }
            
            const settingsRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (docSnap) => { 
              if (docSnap.exists()) {
                const data = docSnap.data();
                setSettings(prev => ({
                    ...prev,
                    ...data,
                    schools: Array.from(new Set([...DEFAULT_SCHOOLS, ...(data.schools || [])])),
                    classes: Array.from(new Set([...DEFAULT_CLASSES, ...(data.classes || [])]))
                }));
              }
            }, (err) => console.warn('Settings snapshot error:', err));

            const coursesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses');
            const unsubCourses = onSnapshot(coursesRef, (snapshot) => {
              const loadedCourses = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  return {
                      id: docSnap.id,
                      school: data.school || 'Lycée François Bazin',
                      classe: data.classe || 'Terminale STI2D',
                      chapterOrder: typeof data.chapterOrder === 'number' ? data.chapterOrder : -new Date(data.date).getTime(),
                      courseOrder: typeof data.courseOrder === 'number' ? data.courseOrder : -new Date(data.date).getTime(),
                      viewsDigital: data.viewsDigital || 0,
                      viewsCasio: data.viewsCasio || 0,
                      isVisible: data.isVisible !== false,
                      ...data
                  };
              });
              setCourses(loadedCourses.filter(c => c.isVisible !== false));
              setIsLoading(false);
            }, (err) => {
              console.warn('Courses snapshot error:', err);
              setIsLoading(false);
            });

            const articlesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'articles');
            const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
              const loadedArticles = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  return {
                      id: docSnap.id,
                      school: data.school || 'Lycée François Bazin',
                      classe: data.classe || 'Terminale STI2D',
                      ...data
                  };
              });
              loadedArticles.sort((a, b) => new Date(b.date) - new Date(a.date));
              setArticles(loadedArticles);
            }, (err) => console.warn('Articles snapshot error:', err));

            return () => { unsubSettings(); unsubCourses(); unsubArticles(); };
          }, [dataUser]);

          const allSchools = useMemo(() => {
              const list = new Set([...DEFAULT_SCHOOLS, ...(settings.schools || []), ...courses.map(c => c.school), ...articles.map(a => a.school)]);
              return Array.from(list).filter(Boolean);
          }, [settings.schools, courses, articles]);

          const allClasses = useMemo(() => {
              const list = new Set([...DEFAULT_CLASSES, ...(settings.classes || []), ...courses.map(c => c.classe), ...articles.map(a => a.classe)]);
              return Array.from(list).filter(Boolean);
          }, [settings.classes, courses, articles]);

          useEffect(() => {
              if (allSchools.length > 0 && (!selectedSchool || !allSchools.includes(selectedSchool))) {
                  const defSchool = allSchools.includes('Lycée François Bazin') ? 'Lycée François Bazin' : allSchools[0];
                  setSelectedSchool(defSchool);
                  localStorage.setItem('wb_selected_school', defSchool);
              }
              if (allClasses.length > 0 && (!selectedClass || !allClasses.includes(selectedClass))) {
                  const defClass = allClasses.includes('Terminale STI2D') ? 'Terminale STI2D' : allClasses[0];
                  setSelectedClass(defClass);
                  localStorage.setItem('wb_selected_class', defClass);
              }
          }, [allSchools, allClasses, selectedSchool, selectedClass]);

          // Filtrage par établissement et classe sélectionnés
          const filteredCourses = useMemo(() => {
              return courses.filter(c => (c.school || 'Lycée François Bazin') === selectedSchool && (c.classe || 'Terminale STI2D') === selectedClass);
          }, [courses, selectedSchool, selectedClass]);

          const filteredArticles = useMemo(() => {
              return articles.filter(a => (a.school || 'Lycée François Bazin') === selectedSchool && (a.classe || 'Terminale STI2D') === selectedClass);
          }, [articles, selectedSchool, selectedClass]);

          const activeSubjects = useMemo(() => {
              const isBazinSTI2D = selectedSchool === 'Lycée François Bazin' && selectedClass === 'Terminale STI2D';
              const baseList = isBazinSTI2D ? (settings.subjectOrder || DEFAULT_SUBJECTS) : [];
              const subs = new Set([...baseList, ...filteredCourses.map(c => c.subject)]);
              return Array.from(subs).filter(Boolean);
          }, [filteredCourses, settings.subjectOrder, selectedSchool, selectedClass]);

          const sortedSubjects = useMemo(() => {
              const ordered = settings.subjectOrder || [];
              const known = ordered.filter(s => activeSubjects.includes(s));
              const unknown = activeSubjects.filter(s => !ordered.includes(s)).sort();
              return [...known, ...unknown];
          }, [activeSubjects, settings.subjectOrder]);

          const latestCourses = useMemo(() => filteredCourses.slice(0, 4), [filteredCourses]);
          const favoriteCourses = useMemo(() => filteredCourses.filter(c => favorites.includes(c.id)), [filteredCourses, favorites]);

          const searchedCourses = useMemo(() => {
              if (!searchQuery || searchQuery.length < 2) return [];
              const q = searchQuery.toLowerCase();
              return filteredCourses.filter(c => c.title.toLowerCase().includes(q) || c.chapter.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q));
          }, [filteredCourses, searchQuery]);

          const filteredSubjectsList = sortedSubjects.filter(subject => subject.toLowerCase().includes(searchQuery.toLowerCase()));
          const goHome = () => { setSelectedSubject(null); setCurrentView('home'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openSubject = (subject) => { setSelectedSubject(subject); setCurrentView('subject'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openTerms = () => { setSelectedSubject(null); setCurrentView('terms'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openCasioGuide = () => { setSelectedSubject(null); setCurrentView('casioGuide'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openFavorites = () => { 
              setSelectedSubject(null); 
              setCurrentView('favorites'); 
              window.scrollTo({top: 0, behavior: 'smooth'}); 
              if (!activeUser) {
                  setShowAuthModal(true);
              }
          };

          const handleView = async (course, type) => {
              if (type === 'Numérique') setPreviewData({ link: course.digitalLink, title: course.title, type: 'Numérique' });
              else if (type === 'Casio') setPreviewData({ link: course.casioLink, title: course.title, type: 'Casio' });
              else if (type === 'Vidéo') setPreviewData({ link: course.videoLink, title: course.title, type: 'Vidéo' });
              else if (type === 'Image') setPreviewData({ link: course.imageLink, title: course.title, type: 'Image' });
              else if (type === 'Audio') setPreviewData({ link: course.audioLink, title: course.title, type: 'Audio' });

              if (dataDb) {
                  try {
                      const docRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', course.id.toString());
                      const updates = {};
                      if (type === 'Numérique') updates.viewsDigital = (course.viewsDigital || 0) + 1;
                      if (type === 'Casio') updates.viewsCasio = (course.viewsCasio || 0) + 1;
                      if (Object.keys(updates).length > 0) await updateDoc(docRef, updates);
                  } catch(e) {
                      console.warn('Erreur incrément vue :', e);
                  }
              }
          };

          const chaptersData = useMemo(() => {
            if (!selectedSubject) return [];
            const filtered = filteredCourses.filter(c => c.subject === selectedSubject);
            const groups = {};
            filtered.forEach(course => {
                if (!groups[course.chapter]) groups[course.chapter] = { name: course.chapter, courses: [] };
                groups[course.chapter].courses.push(course);
            });
            Object.values(groups).forEach(group => {
                group.chapterOrder = Math.min(...group.courses.map(c => c.chapterOrder || 0));
                group.courses.sort((a, b) => (a.courseOrder||0) - (b.courseOrder||0));
            });
            return Object.values(groups).sort((a, b) => a.chapterOrder - b.chapterOrder);
          }, [filteredCourses, selectedSubject]);

          const handleSaveOnboarding = async (e) => {
              e.preventDefault();
              if (!selectedSchool || !selectedClass) return;
              localStorage.setItem('wb_selected_school', selectedSchool);
              localStorage.setItem('wb_selected_class', selectedClass);
              setShowOnboarding(false);

              if (user && !user.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', user.uid);
                      await setDoc(userRef, {
                          selectedSchool: selectedSchool,
                          selectedClass: selectedClass,
                          updatedAt: new Date().toISOString()
                      }, { merge: true });
                  } catch (err) {
                      console.warn('Erreur sauvegarde profil utilisateur :', err);
                  }
              }
          };

          const handleAcceptTerms = () => {
              if (!termsAgreementChecked) return;
              localStorage.setItem('wb_terms_accepted', 'true');
              setHasAcceptedTerms(true);
          };

          const getYouTubeEmbedUrl = (url) => {
              if (!url) return null;
              if (url.includes('embed/')) return url;
              let videoId = '';
              if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
              else if (url.includes('watch?v=')) videoId = new URLSearchParams(new URL(url).search).get('v');
              return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
          };

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-20">
              {/* MODALE D'ACCEPTATION OBLIGATOIRE DES CONDITIONS D'UTILISATION */}
              {!hasAcceptedTerms && (
                  <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md animate-in fade-in duration-300">
                      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl p-6 sm:p-8 border border-slate-200 flex flex-col max-h-[90vh]">
                          <div className="flex items-center space-x-3 mb-4 pb-4 border-b border-slate-100 flex-shrink-0">
                              <div className="bg-blue-100 text-blue-600 p-2.5 rounded-2xl">
                                  <Shield className="w-6 h-6" />
                              </div>
                              <div>
                                  <h2 className="text-xl font-extrabold text-slate-900">Conditions d'utilisations de WorksBox</h2>
                                  <p className="text-xs text-slate-500">Veuillez prendre connaissance du règlement et l'accepter pour accéder au site.</p>
                              </div>
                          </div>

                          <div 
                              className="flex-1 overflow-y-auto pr-2 mb-6 bg-slate-50 rounded-2xl p-5 border border-slate-200 text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line space-y-4"
                              dangerouslySetInnerHTML={{ __html: settings.termsContent || DEFAULT_TERMS_FALLBACK }}
                          />

                          <div className="flex-shrink-0 pt-2 border-t border-slate-100 space-y-4">
                              <label className="flex items-start space-x-3 cursor-pointer select-none">
                                  <input 
                                      type="checkbox" 
                                      checked={termsAgreementChecked} 
                                      onChange={(e) => setTermsAgreementChecked(e.target.checked)} 
                                      className="mt-1 w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer" 
                                  />
                                  <span className="text-xs sm:text-sm font-semibold text-slate-800">
                                      J'ai lu et j'accepte les conditions d'utilisation de WorksBox.
                                  </span>
                              </label>

                              <button 
                                  onClick={handleAcceptTerms} 
                                  disabled={!termsAgreementChecked} 
                                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-2"
                              >
                                  <span>Accepter et continuer</span>
                              </button>
                          </div>
                      </div>
                  </div>
              )}

              {/* MODALE DE CHOIX D'ÉTABLISSEMENT / CLASSE */}
              {hasAcceptedTerms && showOnboarding && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/85 backdrop-blur-md animate-in fade-in duration-300">
                      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-8 sm:p-10 border border-slate-100 relative">
                          {selectedSchool && selectedClass && (
                              <button 
                                  type="button" 
                                  onClick={() => setShowOnboarding(false)} 
                                  className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
                                  title="Fermer"
                              >
                                  <X className="w-5 h-5" />
                              </button>
                          )}
                          <div className="text-center mb-8">
                              <div className="bg-blue-100 text-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                                  <SchoolIcon className="w-8 h-8" />
                              </div>
                              <h1 className="text-2xl font-extrabold text-slate-900">Bienvenue sur WorksBox</h1>
                              <p className="text-sm text-slate-500 mt-2">Veuillez indiquer votre établissement et votre classe pour accéder aux cours.</p>
                          </div>
                          <form onSubmit={handleSaveOnboarding} className="space-y-6">
                              <div>
                                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Sélectionnez votre Lycée</label>
                                  <select value={selectedSchool} onChange={(e) => setSelectedSchool(e.target.value)} required className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 outline-none focus:border-blue-500 cursor-pointer">
                                      <option value="" disabled>-- Choisir un lycée --</option>
                                      {allSchools.map(s => <option key={s} value={s}>{s}</option>)}
                                  </select>
                              </div>
                              <div>
                                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Sélectionnez votre Classe</label>
                                  <select value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)} required className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 outline-none focus:border-blue-500 cursor-pointer">
                                      <option value="" disabled>-- Choisir une classe --</option>
                                      {allClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                  </select>
                              </div>
                              <button type="submit" disabled={!selectedSchool || !selectedClass} className="w-full py-4 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all">Accéder aux cours</button>
                          </form>
                      </div>
                  </div>
              )}

              {settings.announcement && (
                  <div className="bg-amber-500 text-white text-sm font-bold py-2 px-4 flex justify-center items-center">
                      <Megaphone className="w-4 h-4 mr-2" />{settings.announcement}
                  </div>
              )}

              <nav className="bg-slate-900 text-white shadow-lg sticky top-0 z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center h-16">
                    <div className="flex items-center space-x-8">
                        <div className="flex items-center space-x-3 cursor-pointer group active:scale-95 transition-all" onClick={goHome}>
                            <div className="bg-blue-500 p-2 rounded-lg"><BookOpen className="w-6 h-6 text-white" /></div>
                            <span className="font-bold text-xl tracking-tight">WorksBox</span>
                        </div>
                        <div className="hidden lg:flex items-center space-x-6">
                            <button onClick={goHome} className={`text-sm font-medium flex items-center transition-colors hover:text-white ${(currentView === 'home' || currentView === 'subject') ? 'text-white border-b-2 border-blue-500 pb-1 mt-1' : 'text-slate-400'}`}><HomeIcon className="w-4 h-4 mr-1.5" /> Accueil</button>
                            <button onClick={openFavorites} className={`text-sm font-medium flex items-center transition-colors hover:text-amber-400 ${currentView === 'favorites' ? 'text-amber-400 border-b-2 border-amber-400 pb-1 mt-1' : 'text-slate-400'}`}><Star className="w-4 h-4 mr-1.5" filled={currentView === 'favorites'} /> Favoris {activeUser && favorites.length > 0 && <span className="ml-1.5 bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">{favorites.length}</span>}</button>
                            <button onClick={openTerms} className={`text-sm font-medium flex items-center transition-colors hover:text-white ${currentView === 'terms' ? 'text-white border-b-2 border-blue-500 pb-1 mt-1' : 'text-slate-400'}`}><Shield className="w-4 h-4 mr-1.5" /> Conditions</button>
                            <button onClick={openCasioGuide} className={`text-sm font-medium flex items-center transition-colors hover:text-white ${currentView === 'casioGuide' ? 'text-white border-b-2 border-blue-500 pb-1 mt-1' : 'text-slate-400'}`}><HelpCircle className="w-4 h-4 mr-1.5" /> Tuto Casio</button>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2.5">
                        <button id="nav-btn-school-class" onClick={() => setShowOnboarding(true)} className="flex items-center space-x-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl border border-slate-700 transition-all active:scale-95">
                            <SchoolIcon className="w-4 h-4 text-blue-400" />
                            <span className="hidden sm:inline truncate max-w-[130px]">{selectedSchool} • {selectedClass}</span>
                        </button>

                        {activeUser ? (
                            <button 
                                id="nav-btn-user-profile"
                                onClick={() => setShowAccountModal(true)} 
                                className="flex items-center space-x-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-blue-400 border border-blue-500/30 px-3 py-2 rounded-xl transition-all active:scale-95"
                                title="Gérer mon compte"
                            >
                                {activeUser.photoURL ? (
                                    <img src={activeUser.photoURL} alt="Avatar" className="w-5 h-5 rounded-full object-cover border border-blue-400" />
                                ) : (
                                    <div className={`w-5 h-5 rounded-full ${activeUser.isLocal ? 'bg-emerald-600' : 'bg-blue-600'} text-white flex items-center justify-center text-[10px] font-bold`}>
                                        {(activeUser.displayName || activeUser.email || 'E')[0].toUpperCase()}
                                    </div>
                                )}
                                <span className="hidden sm:inline max-w-[110px] truncate text-slate-200">{activeUser.displayName || activeUser.email?.split('@')[0]}</span>
                                {activeUser.isLocal && (
                                    <span className="hidden md:inline-block w-2 h-2 rounded-full bg-emerald-400" title="Profil élève actif"></span>
                                )}
                            </button>
                        ) : (
                            <button 
                                id="nav-btn-login"
                                onClick={() => setShowAuthModal(true)} 
                                className="flex items-center space-x-1.5 text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-xl transition-all shadow-sm active:scale-95"
                            >
                                <UserIcon className="w-4 h-4" />
                                <span>Connexion</span>
                            </button>
                        )}
                    </div>
                  </div>
                </div>
              </nav>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                {isLoading ? (
                    <div className="flex flex-col items-center justify-center py-20">
                        <div className="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                    </div>
                ) : (
                    <>
                        {currentView === 'home' && (
                        <div className="space-y-12 animate-in fade-in duration-300">
                            <div className="text-center max-w-2xl mx-auto">
                                <h1 className="text-4xl font-extrabold text-slate-900 mb-3">Ressources & Cours</h1>
                                <div className="flex items-center justify-center space-x-2 mb-6">
                                    <span className="inline-flex items-center space-x-1.5 bg-blue-50 border border-blue-200 text-blue-800 text-xs sm:text-sm font-bold px-3.5 py-1.5 rounded-full shadow-xs">
                                        <SchoolIcon className="w-4 h-4 text-blue-600" />
                                        <span>{selectedSchool || 'Choisir un lycée'}</span>
                                        <span className="text-blue-300">•</span>
                                        <span>{selectedClass || 'Choisir une classe'}</span>
                                    </span>
                                    <button 
                                        onClick={() => setShowOnboarding(true)}
                                        className="text-xs font-bold text-blue-600 hover:text-blue-800 bg-white hover:bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl shadow-xs transition-all active:scale-95"
                                        title="Changer d'établissement ou de classe"
                                    >
                                        Changer
                                    </button>
                                </div>
                                <div className="max-w-xl mx-auto relative">
                                    <Search className="absolute left-4 top-4 h-5 w-5 text-slate-400" />
                                    <input type="text" className="block w-full pl-12 pr-4 py-4 border-2 border-slate-200 rounded-2xl bg-white focus:outline-none focus:border-blue-500 text-base shadow-sm" placeholder="Rechercher un cours, un chapitre..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                </div>
                            </div>

                            {filteredArticles.length > 0 && (
                                <div className="space-y-4">
                                    <h3 className="text-xl font-bold text-slate-800 flex items-center"><Newspaper className="w-5 h-5 mr-2 text-red-500"/> Actualités & Annonces</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {filteredArticles.map(art => {
                                            const embedUrl = getYouTubeEmbedUrl(art.videoUrl);
                                            return (
                                                <div key={art.id} className={`bg-white rounded-2xl p-6 shadow-sm border flex flex-col justify-between ${art.pinned ? 'border-amber-400 ring-2 ring-amber-400/20' : 'border-slate-200'}`}>
                                                    <div>
                                                        <div className="flex justify-between items-center mb-3">
                                                            <span className="text-xs text-slate-400 font-medium">{new Date(art.date).toLocaleDateString('fr-FR')}</span>
                                                            {art.pinned && <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full">Épinglé</span>}
                                                        </div>
                                                        <h4 className="text-lg font-bold text-slate-900 mb-2">{art.title}</h4>
                                                        <p className="text-slate-600 text-sm whitespace-pre-line mb-4">{art.content}</p>
                                                    </div>
                                                    {art.imageUrl && (
                                                        <div className="mb-4 rounded-xl overflow-hidden border border-slate-100 bg-slate-50 max-h-72">
                                                            <img src={art.imageUrl} alt={art.title} className="w-full h-full object-cover" onError={(e)=>{e.target.style.display='none'}} />
                                                        </div>
                                                    )}
                                                    {embedUrl && (
                                                        <div className="mb-4 aspect-video w-full rounded-xl overflow-hidden shadow-sm bg-slate-900">
                                                            <iframe src={embedUrl} className="w-full h-full border-0" allowFullScreen title="YouTube Video"></iframe>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {searchQuery.length >= 2 ? (
                                <div className="space-y-6">
                                    <h3 className="text-xl font-bold text-slate-800 border-b pb-2">Résultats pour "{searchQuery}"</h3>
                                    {searchedCourses.length === 0 && filteredSubjectsList.length === 0 ? (
                                        <p className="text-slate-500 text-center py-8">Aucun résultat trouvé.</p>
                                    ) : (
                                        <div className="space-y-8">
                                            {filteredSubjectsList.length > 0 && (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                                    {filteredSubjectsList.map(sub => (
                                                        <div key={sub} onClick={() => openSubject(sub)} className="bg-white rounded-xl p-4 shadow-sm border border-slate-200 hover:border-blue-400 cursor-pointer flex items-center space-x-3">
                                                            <Folder className="w-6 h-6 text-blue-500" /><h3 className="font-bold text-slate-800">{sub}</h3>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            {searchedCourses.length > 0 && (
                                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                                    <ul className="divide-y divide-slate-100">
                                                        {searchedCourses.map(course => (
                                                            <CourseListItem key={course.id} course={course} handleView={handleView} tagColors={settings.tagColors} isFav={favorites.includes(course.id)} toggleFav={() => toggleFav(course.id)} showSubject={true} />
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <>
                                    {latestCourses.length > 0 && (
                                        <div>
                                            <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center"><Clock className="w-5 h-5 mr-2 text-blue-500"/> Derniers ajouts</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                                {latestCourses.map(course => (
                                                    <div key={course.id} className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group hover:border-blue-300">
                                                        <button onClick={() => toggleFav(course.id)} className="absolute top-3 right-3 text-slate-300 hover:text-amber-400 z-10">
                                                            <Star className="w-5 h-5" filled={favorites.includes(course.id)} />
                                                        </button>
                                                        <div className="text-[10px] font-bold text-slate-500 uppercase mb-2">{course.subject}</div>
                                                        <h4 className="font-bold text-slate-800 text-sm mb-2 line-clamp-2">{course.title}</h4>
                                                        <div className="flex flex-wrap gap-1.5 mt-4">
                                                            {course.digitalLink && <button onClick={() => handleView(course, 'Numérique')} className="flex-1 min-w-[65px] bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold py-1.5 rounded flex justify-center items-center"><Eye className="w-3 h-3 mr-1"/> PDF</button>}
                                                            {course.casioLink && <button onClick={() => handleView(course, 'Casio')} className="flex-1 min-w-[65px] bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold py-1.5 rounded flex justify-center items-center"><Calculator className="w-3 h-3 mr-1"/> Casio</button>}
                                                            {course.videoLink && <button onClick={() => handleView(course, 'Vidéo')} className="flex-1 min-w-[65px] bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold py-1.5 rounded flex justify-center items-center"><VideoIcon className="w-3 h-3 mr-1"/> Vidéo</button>}
                                                            {course.imageLink && <button onClick={() => handleView(course, 'Image')} className="flex-1 min-w-[65px] bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs font-bold py-1.5 rounded flex justify-center items-center"><ImageIcon className="w-3 h-3 mr-1"/> Image</button>}
                                                            {course.audioLink && <button onClick={() => handleView(course, 'Audio')} className="flex-1 min-w-[65px] bg-purple-50 hover:bg-purple-100 text-purple-700 text-xs font-bold py-1.5 rounded flex justify-center items-center"><MusicIcon className="w-3 h-3 mr-1"/> Audio</button>}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center"><Folder className="w-5 h-5 mr-2 text-blue-500"/> Explorer par matière</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {sortedSubjects.map((subject, index) => {
                                                const courseCount = filteredCourses.filter(c => c.subject === subject).length;
                                                return (
                                                <div key={index} onClick={() => openSubject(subject)} className="bg-white rounded-xl p-6 shadow-sm border border-slate-200 hover:shadow-md hover:border-blue-400 cursor-pointer transition-all flex items-start space-x-4">
                                                    <div className="bg-blue-50 text-blue-600 p-3 rounded-lg"><Folder className="w-8 h-8" /></div>
                                                    <div>
                                                        <h3 className="text-lg font-bold text-slate-900 mb-1">{subject}</h3>
                                                        <p className="text-sm text-slate-500 font-medium">{courseCount} document{courseCount !== 1 ? 's' : ''}</p>
                                                    </div>
                                                </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                        )}

                        {currentView === 'favorites' && (
                        <div className="space-y-6 animate-in fade-in duration-300">
                            <div className="flex items-center space-x-4 mb-8 border-b border-slate-200 pb-4">
                                <div className="bg-amber-100 p-3 rounded-xl"><Star className="w-8 h-8 text-amber-500" filled={true}/></div>
                                <div><h1 className="text-3xl font-bold text-slate-900">Mes Favoris</h1><p className="text-slate-500">Retrouvez ici vos cours sauvegardés.</p></div>
                            </div>

                            {!activeUser ? (
                                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 sm:p-12 text-center max-w-lg mx-auto my-6 animate-in zoom-in-95 duration-200">
                                    <div className="w-16 h-16 bg-amber-50 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-amber-100 shadow-sm">
                                        <Star className="w-8 h-8" filled={true} />
                                    </div>
                                    <h2 className="text-2xl font-black text-slate-900 mb-2">Connexion requise</h2>
                                    <p className="text-sm text-slate-600 leading-relaxed mb-6">
                                        Pour ajouter des cours à vos favoris et les retrouver lors de vos révisions, vous devez vous connecter.
                                    </p>
                                    <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                                        <button 
                                            id="btn-favorites-login-cta"
                                            onClick={() => setShowAuthModal(true)} 
                                            className="w-full sm:w-auto px-6 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-500/20 active:scale-95 transition-all flex items-center justify-center space-x-2"
                                        >
                                            <UserIcon className="w-4 h-4" />
                                            <span>Se connecter pour utiliser les favoris</span>
                                        </button>
                                        <button 
                                            onClick={goHome} 
                                            className="w-full sm:w-auto px-5 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl active:scale-95 transition-all"
                                        >
                                            Explorer les cours
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    {(!user || user.isAnonymous) && (
                                        <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                            <div className="flex items-center space-x-3">
                                                <div className="bg-blue-100 text-blue-600 p-2 rounded-xl flex-shrink-0"><UserIcon className="w-5 h-5"/></div>
                                                <div>
                                                    <p className="text-xs sm:text-sm font-bold text-blue-950">Synchronisez vos favoris dans le cloud</p>
                                                    <p className="text-xs text-blue-700">Connectez-vous avec Google pour ne jamais perdre vos cours et les retrouver sur tous vos appareils.</p>
                                                </div>
                                            </div>
                                            <button onClick={() => setShowAuthModal(true)} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm transition-all whitespace-nowrap">Lier avec Google</button>
                                        </div>
                                    )}
                                    {favoriteCourses.length === 0 ? (
                                        <div className="bg-white border border-dashed border-slate-300 rounded-2xl p-12 text-center text-slate-500">
                                            <Star className="w-10 h-10 text-slate-300 mx-auto mb-3" />
                                            <p className="font-bold text-slate-700">Aucun favori enregistré pour le moment.</p>
                                            <p className="text-xs text-slate-400 mt-1">Cliquez sur l'étoile d'un cours pour l'enregistrer dans cette liste.</p>
                                        </div>
                                    ) : (
                                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                            <ul className="divide-y divide-slate-100">
                                                {favoriteCourses.map(course => (
                                                    <CourseListItem key={course.id} course={course} handleView={handleView} tagColors={settings.tagColors} isFav={true} toggleFav={() => toggleFav(course.id)} showSubject={true} />
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                        )}

                        {currentView === 'subject' && (
                        <div className="space-y-6 animate-in fade-in duration-300">
                            <div className="flex items-center space-x-4 mb-8">
                                <button onClick={goHome} className="p-2 bg-white border border-slate-200 rounded-full text-slate-600 shadow-sm"><ChevronLeft className="w-5 h-5" /></button>
                                <h1 className="text-3xl font-bold text-slate-900">{selectedSubject}</h1>
                            </div>
                            {chaptersData.length === 0 ? (
                                <div className="bg-white border border-dashed border-slate-300 rounded-2xl p-12 text-center text-slate-500">Aucun cours dans cette matière pour ce lycée et cette classe.</div>
                            ) : (
                                <div className="space-y-6">
                                    {chaptersData.map((chap) => (
                                        <ChapterBlock key={chap.name} chapter={chap.name} chapterCourses={chap.courses} handleView={handleView} tagColors={settings.tagColors} favorites={favorites} toggleFav={toggleFav} />
                                    ))}
                                </div>
                            )}
                        </div>
                        )}

                        {currentView === 'casioGuide' && (
                          <div className="space-y-8 max-w-4xl mx-auto">
                            <h1 className="text-3xl font-extrabold text-slate-900 flex items-center"><HelpCircle className="w-8 h-8 text-blue-600 mr-4"/> Tuto Casio Graph 35+EII</h1>
                            <div 
                                className="bg-white rounded-2xl shadow-sm border p-8 space-y-6 text-slate-600 whitespace-pre-line leading-relaxed text-sm sm:text-base"
                                dangerouslySetInnerHTML={{ __html: settings.casioGuideContent || DEFAULT_CASIO_FALLBACK }}
                            />
                          </div>
                        )}

                        {currentView === 'terms' && (
                          <div className="space-y-8 max-w-4xl mx-auto">
                            <h1 className="text-3xl font-extrabold text-slate-900 flex items-center"><Shield className="w-8 h-8 text-blue-600 mr-4"/> Conditions d'utilisations</h1>
                            <div 
                                className="bg-white rounded-2xl shadow-sm border p-8 space-y-6 text-slate-600 whitespace-pre-line leading-relaxed text-sm sm:text-base"
                                dangerouslySetInnerHTML={{ __html: settings.termsContent || DEFAULT_TERMS_FALLBACK }}
                            />
                          </div>
                        )}
                    </>
                )}
              </main>

              <footer className="mt-20 border-t border-slate-200 py-8 text-center text-xs text-slate-500 max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <span>WorksBox — Cours & Ressources pour Lycées</span>
                  <div className="flex items-center space-x-4">
                      <button onClick={openTerms} className="hover:text-slate-800 transition-colors">Conditions</button>
                      <span>•</span>
                      <button onClick={openCasioGuide} className="hover:text-slate-800 transition-colors">Tuto Casio</button>
                  </div>
              </footer>

              {previewData && <PreviewModal data={previewData} onClose={() => setPreviewData(null)} />}

              {showAuthModal && (
                  <AuthModal 
                      onClose={() => { setShowAuthModal(false); setAuthError(null); }} 
                      onGoogleSignIn={handleGoogleSignIn}
                      onLocalSignIn={handleLocalSignIn}
                      isLoading={authLoading}
                      error={authError}
                  />
              )}

              {showAccountModal && activeUser && (
                  <AccountModal 
                      user={activeUser}
                      profile={userProfile}
                      selectedSchool={selectedSchool}
                      selectedClass={selectedClass}
                      favoritesCount={favorites.length}
                      onOpenFavorites={() => { setShowAccountModal(false); openFavorites(); }}
                      onChangeSchoolClass={() => { setShowAccountModal(false); setShowOnboarding(true); }}
                      onUpgradeToGoogle={() => { setShowAccountModal(false); setShowAuthModal(true); }}
                      onSignOut={handleSignOut}
                      onClose={() => setShowAccountModal(false)}
                  />
              )}
            </div>
          );
        }

        function AuthModal({ onClose, onGoogleSignIn, onLocalSignIn, isLoading, error }) {
            const [studentName, setStudentName] = useState(() => {
                const saved = localStorage.getItem('wb_student_name');
                return saved || '';
            });
            const [copiedDomain, setCopiedDomain] = useState(false);
            const isUnauthorizedDomain = error && (
                (typeof error === 'object' && error.code === 'auth/unauthorized-domain') ||
                (typeof error === 'string' && error.includes('unauthorized-domain'))
            );
            const isOperationNotAllowed = error && (
                (typeof error === 'object' && error.code === 'auth/operation-not-allowed') ||
                (typeof error === 'string' && error.includes('operation-not-allowed'))
            );
            const currentHost = window.location.hostname;
            const isInIframe = window.self !== window.top;

            const handleLocalSubmit = (e) => {
                e.preventDefault();
                const nameToUse = studentName.trim() || 'Élève';
                localStorage.setItem('wb_student_name', nameToUse);
                onLocalSignIn(nameToUse);
            };

            return (
                <div id="auth-modal" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 border border-slate-100 flex flex-col relative animate-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto">
                        <button 
                            id="btn-close-auth"
                            onClick={onClose} 
                            className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
                        >
                            <X className="w-5 h-5" />
                        </button>

                        <div className="text-center mb-5 pt-1">
                            <div className="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-sm">
                                <UserIcon className="w-7 h-7" />
                            </div>
                            <h2 className="text-2xl font-black text-slate-900">Connexion</h2>
                            <p className="text-xs sm:text-sm text-slate-500 mt-1">Connectez-vous pour utiliser vos favoris et synchroniser vos préférences.</p>
                        </div>

                        {/* Erreur spécifique Fournisseur Google non activé dans Firebase */}
                        {isOperationNotAllowed ? (
                            <div className="mb-5 p-4 bg-amber-50/90 border border-amber-200 text-amber-900 text-xs rounded-2xl space-y-3 animate-in fade-in">
                                <div className="flex items-start space-x-2.5">
                                    <AlertCircle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                                    <div>
                                        <p className="font-bold text-slate-900 text-sm">Fournisseur Google non activé</p>
                                        <p className="mt-1 text-slate-600 leading-relaxed">
                                            La connexion avec Google n'est pas encore activée dans la console Firebase pour le projet <strong>lycee-share</strong>.
                                        </p>
                                        <ol className="list-decimal list-inside mt-2 space-y-1 text-slate-700 font-medium">
                                            <li>Ouvrez la console Firebase (lien ci-dessous).</li>
                                            <li>Allez dans <em>Authentication</em> &gt; <em>Sign-in method</em>.</li>
                                            <li>Cliquez sur <strong>Google</strong>, activez le bouton et validez.</li>
                                        </ol>
                                    </div>
                                </div>
                                <div className="pt-1">
                                    <a 
                                        href="https://console.firebase.google.com/project/lycee-share/authentication/providers" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center justify-center px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-[11px] transition-colors shadow-sm"
                                    >
                                        <span>Activer Google dans Firebase Console</span>
                                        <ExternalLink className="w-3.5 h-3.5 ml-1.5" />
                                    </a>
                                </div>
                            </div>
                        ) : isUnauthorizedDomain ? (
                            <div className="mb-5 p-4 bg-amber-50/90 border border-amber-200 text-amber-900 text-xs rounded-2xl space-y-3 animate-in fade-in">
                                <div className="flex items-start space-x-2.5">
                                    <AlertCircle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                                    <div>
                                        <p className="font-bold text-slate-900 text-sm">Domaine non autorisé dans Firebase</p>
                                        <p className="mt-1 text-slate-600 leading-relaxed">
                                            Pour que Google OAuth fonctionne, ce domaine doit être ajouté dans les <strong>Domaines autorisés</strong> de Firebase Console (projet <code>lycee-share</code>).
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="bg-white/90 p-2.5 rounded-xl border border-amber-200 flex items-center justify-between">
                                    <span className="font-mono font-semibold text-slate-800 text-[11px] truncate mr-2">{currentHost}</span>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            navigator.clipboard.writeText(currentHost);
                                            setCopiedDomain(true);
                                            setTimeout(() => setCopiedDomain(false), 2000);
                                        }}
                                        className="flex items-center space-x-1 px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold rounded-lg text-[10px] transition-colors"
                                    >
                                        <span>{copiedDomain ? '✓ Copié !' : 'Copier'}</span>
                                    </button>
                                </div>

                                <div className="pt-1 flex flex-col sm:flex-row gap-2">
                                    <a 
                                        href="https://console.firebase.google.com/project/lycee-share/authentication/settings" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center justify-center px-3 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-[11px] transition-colors"
                                    >
                                        <span>Ouvrir la Console Firebase</span>
                                        <ExternalLink className="w-3.5 h-3.5 ml-1.5" />
                                    </a>
                                    {isInIframe && (
                                        <a
                                            href={window.location.href}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center justify-center px-3 py-2 bg-amber-200/90 hover:bg-amber-300 text-amber-950 rounded-xl font-bold text-[11px] transition-colors"
                                        >
                                            <span>Ouvrir dans un nouvel onglet</span>
                                            <ExternalLink className="w-3.5 h-3.5 ml-1" />
                                        </a>
                                    )}
                                </div>
                            </div>
                        ) : error && (
                            <div className="mb-5 p-3.5 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl flex items-start space-x-2">
                                <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5 text-red-600" />
                                <span className="flex-1 leading-relaxed">
                                    {typeof error === 'string' ? error : error.message}
                                </span>
                            </div>
                        )}

                        {/* Option 1: Google Sign In */}
                        <div className="space-y-3 mb-3">
                            <button
                                id="btn-google-login"
                                onClick={onGoogleSignIn}
                                disabled={isLoading}
                                className="w-full flex items-center justify-center space-x-3 py-3.5 px-4 bg-white hover:bg-slate-50 border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-bold text-sm rounded-xl shadow-sm active:scale-[0.99] transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {isLoading ? (
                                    <div className="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                ) : (
                                    <>
                                        <GoogleIcon className="w-5 h-5" />
                                        <span>Continuer avec Google</span>
                                    </>
                                )}
                            </button>
                        </div>

                        {/* Séparateur */}
                        <div className="relative my-3">
                            <div className="absolute inset-0 flex items-center">
                                <div className="w-full border-t border-slate-200"></div>
                            </div>
                            <div className="relative flex justify-center text-[10px] uppercase font-bold text-slate-400">
                                <span className="bg-white px-3 tracking-wider">OU PROFIL ÉLÈVE IMMÉDIAT</span>
                            </div>
                        </div>

                        {/* Option 2: Profil Élève Local Immédiat */}
                        <form onSubmit={handleLocalSubmit} className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 mb-4 space-y-2.5">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Votre prénom ou pseudo d'élève :</label>
                                <input 
                                    type="text"
                                    value={studentName}
                                    onChange={(e) => setStudentName(e.target.value)}
                                    placeholder="Ex: Romain, Lucas..."
                                    className="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-800"
                                />
                            </div>
                            <button
                                type="submit"
                                className="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-sm active:scale-[0.99] transition-all"
                            >
                                Activer mon Profil Élève
                            </button>
                            <p className="text-[10px] text-slate-500 text-center">
                                Mémorise vos favoris et vos cours sur cet appareil sans nécessiter de compte externe.
                            </p>
                        </form>

                        <div className="bg-slate-50 rounded-2xl p-3.5 border border-slate-200/80 mb-3 space-y-2">
                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Avantages</span>
                            <div className="flex items-center text-xs text-slate-700 space-x-2">
                                <Check className="w-4 h-4 text-emerald-600 flex-shrink-0" />
                                <span>Synchronisation automatique de vos cours favoris</span>
                            </div>
                            <div className="flex items-center text-xs text-slate-700 space-x-2">
                                <Check className="w-4 h-4 text-emerald-600 flex-shrink-0" />
                                <span>Mémorisation de votre Lycée et votre Classe</span>
                            </div>
                            <div className="flex items-center text-xs text-slate-700 space-x-2">
                                <Check className="w-4 h-4 text-emerald-600 flex-shrink-0" />
                                <span>Accès multi-appareils avec Google</span>
                            </div>
                        </div>

                        <button 
                            id="btn-guest-continue"
                            onClick={onClose} 
                            className="text-xs text-slate-500 hover:text-slate-800 text-center font-medium py-1 transition-colors"
                        >
                            Continuer en tant qu'invité
                        </button>
                    </div>
                </div>
            );
        }

        function AccountModal({ user, profile, selectedSchool, selectedClass, favoritesCount, onOpenFavorites, onChangeSchoolClass, onUpgradeToGoogle, onSignOut, onClose }) {
            const isLocal = user?.isLocal;

            return (
                <div id="account-modal" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 border border-slate-100 flex flex-col relative animate-in zoom-in-95 duration-200">
                        <button 
                            id="btn-close-account"
                            onClick={onClose} 
                            className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
                        >
                            <X className="w-5 h-5" />
                        </button>

                        <div className="flex items-center space-x-4 mb-6 pb-6 border-b border-slate-100">
                            {user.photoURL ? (
                                <img src={user.photoURL} alt="Avatar" className="w-14 h-14 rounded-2xl object-cover border-2 border-blue-500 shadow-sm" />
                            ) : (
                                <div className={`w-14 h-14 rounded-2xl ${isLocal ? 'bg-emerald-600' : 'bg-blue-600'} text-white flex items-center justify-center text-xl font-bold shadow-sm`}>
                                    {(user.displayName || user.email || 'E')[0].toUpperCase()}
                                </div>
                            )}
                            <div className="min-w-0 flex-1">
                                <h2 className="text-lg font-bold text-slate-900 truncate">{user.displayName || 'Élève'}</h2>
                                <p className="text-xs text-slate-500 truncate">{user.email}</p>
                                {isLocal ? (
                                    <span className="inline-flex items-center mt-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                                        <UserIcon className="w-3 h-3 mr-1" /> Profil Élève (Local)
                                    </span>
                                ) : (
                                    <span className="inline-flex items-center mt-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-800">
                                        <Check className="w-3 h-3 mr-1" /> Compte Google vérifié
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="space-y-4 mb-6">
                            <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wide">Établissement & Classe</span>
                                    <button 
                                        onClick={onChangeSchoolClass}
