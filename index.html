    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('worksbox_theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        /* Fluid View Transitions */
        @keyframes viewFadeSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .view-transition {
            animation: viewFadeSlide 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: opacity, transform;
        }

        /* Fluid Chapter Accordion */
        .chapter-accordion-grid {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease-out;
            opacity: 0;
        }

        .chapter-accordion-grid.expanded {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .chapter-accordion-inner {
            overflow: hidden;
            min-height: 0;
        }

        /* Generic Animation Helpers */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-in {
            animation-duration: 0.25s;
            animation-fill-mode: both;
            animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-in {
            animation-name: fadeIn;
        }

        @media (prefers-reduced-motion: reduce) {
            .view-transition,
            .animate-in,
            .chapter-accordion-grid {
                animation: none !important;
                transition: none !important;
                opacity: 1 !important;
            }
        }

        @keyframes skeleton-shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        .skeleton-shimmer-box {
            position: relative;
            overflow: hidden;
            background-color: #e2e8f0;
        }
        .dark .skeleton-shimmer-box {
            background-color: #1e293b;
        }
        .skeleton-shimmer-box::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.45) 45%,
                rgba(255, 255, 255, 0.75) 50%,
                rgba(255, 255, 255, 0.45) 55%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: skeleton-shimmer 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
            content: '';
        }
        .dark .skeleton-shimmer-box::after {
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.03) 45%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.03) 55%,
                rgba(255, 255, 255, 0) 100%
            );
        }
    </style>

          CREATE: 'create',

          DELETE: 'delete',
          LIST: 'list',
          GET: 'get',
          WRITE: 'write',
        };

        function handleFirestoreError(error, operationType, path) {
          const errInfo = {
            error: error instanceof Error ? error.message : String(error),
            authInfo: {
              userId: auth?.currentUser?.uid,
              email: auth?.currentUser?.email,
              emailVerified: auth?.currentUser?.emailVerified,
              isAnonymous: auth?.currentUser?.isAnonymous,
              tenantId: auth?.currentUser?.tenantId,
              providerInfo: auth?.currentUser?.providerData?.map(provider => ({
                providerId: provider.providerId,
                email: provider.email,
              })) || []
            },
            operationType,
            path
          };
          console.error('Firestore Error: ', JSON.stringify(errInfo));
          throw new Error(JSON.stringify(errInfo));
        }

        async function testConnection() {
          const dbToTest = dataDb || userDb;
          if (!dbToTest) return;
          try {
            await getDocFromServer(doc(dbToTest, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'global'));
          } catch (error) {
            if (error instanceof Error && error.message && error.message.includes('the client is offline')) {
              console.error("Please check your Firebase configuration.");
            }
          }
        }

          });
          const [isLoading, setIsLoading] = useState(true);

          const [user, setUser] = useState(null);
          // Par défaut, l'utilisateur n'a aucun compte au démarrage. C'est à lui de choisir de se connecter.
          const [localUser, setLocalUser] = useState(null);
          const [userProfile, setUserProfile] = useState(null);
          const [showAuthModal, setShowAuthModal] = useState(false);
          const [showAccountModal, setShowAccountModal] = useState(false);
          const [authLoading, setAuthLoading] = useState(false);
          const [authError, setAuthError] = useState(null);
          const [previewData, setPreviewData] = useState(null);

          // Espace Cloud Google Drive Personnel (1 Go max par élève)
          const MAX_CLOUD_QUOTA_BYTES = 1024 * 1024 * 1024; // 1 Go (1,073,741,824 octets)
          const [driveToken, setDriveToken] = useState(null);
          const [cloudFolderId, setCloudFolderId] = useState(null);
          const [cloudFiles, setCloudFiles] = useState([]);
          const [cloudStorageUsed, setCloudStorageUsed] = useState(0);
          const [cloudLoading, setCloudLoading] = useState(false);
          const [cloudUploading, setCloudUploading] = useState(false);
          const [cloudSearchQuery, setCloudSearchQuery] = useState('');
          const [favoritesSearchQuery, setFavoritesSearchQuery] = useState('');

          // Onglet actif dans la page Profil dédiée ('favorites' | 'cloud' | 'account')
          const [profileTab, setProfileTab] = useState('favorites');

          // Envoi direct et robuste d'un fichier binaire/texte à Google Drive v3 (format multipart/related)
          const uploadFileToGoogleDrive = async (file, token, targetFolderId = null) => {
              const boundary = '-------314159265358979323846' + Date.now();
              const metadata = {
                  name: file.name,
                  mimeType: file.type || 'application/octet-stream'
              };
              if (targetFolderId) {
                  metadata.parents = [targetFolderId];
              }

              const metadataPart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`;
              const mediaHeaderPart = `--${boundary}\r\nContent-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`;
              const closingPart = `\r\n--${boundary}--`;

              const multipartBlob = new Blob([
                  metadataPart,
                  mediaHeaderPart,
                  file,
                  closingPart
              ], { type: `multipart/related; boundary=${boundary}` });

              const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,mimeType,webContentLink,webViewLink,createdTime,modifiedTime', {
                  method: 'POST',
                  headers: {
                      'Authorization': `Bearer ${token}`,
                      'Content-Type': `multipart/related; boundary=${boundary}`
                  },
                  body: multipartBlob
              });

              if (!response.ok) {
                  if (response.status === 401) {
                      setDriveToken(null);
                      throw new Error("Session Google expirée. Veuillez reconnecter votre Google Drive.");
                  }
                  const errData = await response.json().catch(() => ({}));
                  const msg = errData?.error?.message || `Erreur serveur Google Drive (${response.status})`;
                  throw new Error(msg);
              }

              return await response.json();
          };

          // Découverte / création du dossier personnel WorksBox Cloud sur Google Drive
          const getOrCreateWorksBoxFolder = async (token) => {
              if (!token) return null;
              try {
                  const query = encodeURIComponent("name='WorksBox Cloud' and mimeType='application/vnd.google-apps.folder' and trashed=false");
                  const searchRes = await fetch(
                      `https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)&spaces=drive`,
                      { headers: { Authorization: `Bearer ${token}` } }
                  );
                  if (searchRes.ok) {
                      const searchData = await searchRes.json();
                      if (searchData.files && searchData.files.length > 0) {
                          return searchData.files[0].id;
                      }
                  } else if (searchRes.status === 401) {
                      setDriveToken(null);
                      return null;
                  }

                  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                      method: 'POST',
                      headers: {
                          Authorization: `Bearer ${token}`,
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                          name: 'WorksBox Cloud',
                          mimeType: 'application/vnd.google-apps.folder',
                          description: 'Dossier personnel WorksBox pour vos cours et fiches (quota 1 Go)'
                      })
                  });
                  if (createRes.ok) {
                      const createData = await createRes.json();
                      return createData.id;
                  }
              } catch (e) {
                  console.warn("Erreur dossier WorksBox Cloud :", e);
              }
              return null;
          };

          // Chargement des fichiers du dossier personnel et calcul du quota utilisé
          const loadWorksBoxCloudFiles = async (token = driveToken) => {
              if (!token) return;
              setCloudLoading(true);
              try {
                  const folderId = await getOrCreateWorksBoxFolder(token);
                  if (folderId) {
                      setCloudFolderId(folderId);
                  }
                  const q = folderId 
                      ? encodeURIComponent(`'${folderId}' in parents and trashed=false`)
                      : encodeURIComponent("trashed=false");

                  const filesRes = await fetch(
                      `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,mimeType,webContentLink,webViewLink,createdTime,modifiedTime,thumbnailLink,iconLink)&orderBy=modifiedTime desc&pageSize=100`,
                      { headers: { Authorization: `Bearer ${token}` } }
                  );
                  
                  if (!filesRes.ok) {
                      if (filesRes.status === 401) {
                          setDriveToken(null);
                          throw new Error("Session Google expirée. Veuillez reconnecter votre Google Drive.");
                      }
                      const errData = await filesRes.json().catch(() => ({}));
                      throw new Error(errData?.error?.message || `Erreur chargement Drive (${filesRes.status})`);
                  }

                  const filesData = await filesRes.json();
                  const filesList = filesData.files || [];
                  setCloudFiles(filesList);

                  const totalUsed = filesList.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                  setCloudStorageUsed(totalUsed);
              } catch (e) {
                  console.warn("Erreur chargement fichiers Drive :", e);
                  showToast(e.message || "Erreur de synchronisation Google Drive", "warning", "warning");
              } finally {
                  setCloudLoading(false);
              }
          };

          // Connexion explicite Google Drive avec permission
          const connectGoogleDrive = async () => {
              if (!auth) {
                  showToast("Service d'authentification non disponible", "warning", "warning");
                  return;
              }
              setCloudLoading(true);
              try {
                  const provider = new GoogleAuthProvider();
                  provider.addScope('https://www.googleapis.com/auth/drive.file');
                  provider.setCustomParameters({ prompt: 'select_account' });
                  const cred = await signInWithPopup(auth, provider);
                  const token = GoogleAuthProvider.credentialFromResult(cred)?.accessToken;
                  if (token) {
                      setDriveToken(token);
                      showToast("Google Drive connecté ! Espace 1 Go activé.", "success", "check");
                      await loadWorksBoxCloudFiles(token);
                  } else {
                      showToast("Compte Google connecté mais jeton Drive non fourni.", "warning", "warning");
                  }
              } catch (err) {
                  showToast("Erreur connexion Drive : " + (err.message || err), "warning", "warning");
              } finally {
                  setCloudLoading(false);
              }
          };

          // Téléversement d'un fichier avec contrôle strict du quota 1 Go
          const uploadFileToCloud = async (file) => {
              if (!driveToken) {
                  showToast("Veuillez d'abord connecter votre Google Drive", "warning", "warning");
                  connectGoogleDrive();
                  return;
              }
              if (!file) return;

              // Vérification du quota 1 Go
              if (cloudStorageUsed + file.size > MAX_CLOUD_QUOTA_BYTES) {
                  const remainingMb = Math.max(0, ((MAX_CLOUD_QUOTA_BYTES - cloudStorageUsed) / (1024 * 1024))).toFixed(1);
                  showToast(`Quota de 1 Go dépassé ! Espace restant : ${remainingMb} Mo.`, "warning", "warning");
                  return;
              }

              setCloudUploading(true);
              try {
                  const folderId = cloudFolderId || await getOrCreateWorksBoxFolder(driveToken);
                  await uploadFileToGoogleDrive(file, driveToken, folderId);

                  showToast(`« ${file.name} » ajouté avec succès à votre Cloud !`, "success", "check");
                  await loadWorksBoxCloudFiles(driveToken);
              } catch (e) {
                  showToast("Erreur d'envoi : " + e.message, "warning", "warning");
                  if (e.message && e.message.includes('reconnecter')) {
                      connectGoogleDrive();
                  }
              } finally {
                  setCloudUploading(false);
              }
          };

          // Sauvegarde en 1 clic d'un cours de WorksBox vers le Drive personnel de l'élève
          const saveCourseToCloudDrive = async (course) => {
              if (!driveToken) {
                  showToast("Veuillez connecter votre compte Google Drive", "warning", "warning");
                  connectGoogleDrive();
                  return;
              }
              if (!course) return;

              setCloudUploading(true);
              try {
                  const folderId = cloudFolderId || await getOrCreateWorksBoxFolder(driveToken);
                  const cleanTitle = (course.title || 'Cours').replace(/[\\/:*?"<>|]/g, '_');
                  const fileName = `[WorksBox] ${course.subject || 'Cours'} - ${cleanTitle}.txt`;
                  const fileContent = `========================================\nWORKSBOX • RESSOURCE PÉDAGOGIQUE\n========================================\n\nTitre : ${course.title}\nMatière : ${course.subject}\nChapitre : ${course.chapter || 'Général'}\nLycée : ${course.school || selectedSchool}\nClasse : ${course.classe || selectedClass}\n\nLiens d'accès direct :\n- Document PDF : ${course.digitalLink || 'Non disponible'}\n- Calculatrice Casio : ${course.casioLink || 'Non disponible'}\n- Vidéo : ${course.videoLink || 'Non disponible'}\n- Audio : ${course.audioLink || 'Non disponible'}\n\nEnregistré dans votre espace WorksBox Cloud le ${new Date().toLocaleDateString('fr-FR')}.\nRetrouvez tous vos cours sur WorksBox !\n`;

                  const textBlob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
                  const textFile = new File([textBlob], fileName, { type: 'text/plain;charset=utf-8' });
                  
                  await uploadFileToGoogleDrive(textFile, driveToken, folderId);

                  showToast(`« ${course.title} » sauvegardé dans votre Drive !`, "success", "check");
                  await loadWorksBoxCloudFiles(driveToken);
              } catch (e) {
                  showToast("Erreur sauvegarde : " + e.message, "warning", "warning");
                  if (e.message && e.message.includes('reconnecter')) {
                      connectGoogleDrive();
                  }
              } finally {
                  setCloudUploading(false);
              }
          };

          // Suppression d'un fichier avec confirmation et mise à jour immédiate du quota
          const deleteCloudFile = async (fileId, fileName) => {
              if (!confirm(`Supprimer définitivement « ${fileName} » de votre Google Drive ?\n(Cela libérera de l'espace dans votre quota 1 Go)`)) return;
              try {
                  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                      method: 'DELETE',
                      headers: { Authorization: `Bearer ${driveToken}` }
                  });
                  if (!res.ok && res.status !== 204) throw new Error("Impossible de supprimer");
                  
                  showToast(`« ${fileName} » supprimé de votre Drive`, "info", "info");
                  setCloudFiles(prev => prev.filter(f => f.id !== fileId));
                  setCloudStorageUsed(prev => {
                      const removed = cloudFiles.find(f => f.id === fileId);
                      return Math.max(0, prev - (parseInt(removed?.size, 10) || 0));
                  });
              } catch (e) {
                  showToast("Erreur suppression : " + e.message, "warning", "warning");
              }
          };

          // Gestion du thème clair / sombre (synchronisé avec localStorage et la balise html)
          const [isDark, setIsDark] = useState(() => {
              try {
                  const saved = localStorage.getItem('worksbox_theme');
                  if (saved) return saved === 'dark';
                  return window.matchMedia('(prefers-color-scheme: dark)').matches;
              } catch (e) {
                  return false;
              }
          });

          useEffect(() => {
              try {
                  if (isDark) {
                      document.documentElement.classList.add('dark');
                      localStorage.setItem('worksbox_theme', 'dark');
                  } else {
                      document.documentElement.classList.remove('dark');
                      localStorage.setItem('worksbox_theme', 'light');
                  }
              } catch (e) {}
          }, [isDark]);

          const toggleTheme = () => {
              setIsDark(prev => !prev);
          };

          const AUTHORIZED_ADMIN_EMAILS = [
              'roman.ferriere4@gmail.com',
              'romanferriere4@gmail.com'
          ];

          const checkIsAdmin = (u) => {
              if (!u || u.isAnonymous) return false;
              const email = (u.email || '').toLowerCase().trim();
              if (!email) return false;
              const [localPart, domain] = email.split('@');
              if (domain === 'gmail.com') {
                  const cleanLocal = localPart.replace(/\./g, '');
                  if (cleanLocal === 'romanferriere4') return true;
              }
              return AUTHORIZED_ADMIN_EMAILS.includes(email);
          };

          const activeUser = user || localUser;
          const isUserAdmin = checkIsAdmin(user);

          // Nettoyage de tout compte élève implicite hérité pour s'assurer que le visiteur commence sans compte
          useEffect(() => {
              if (!user && !localUser) {
                  localStorage.removeItem('worksbox_local_user');
              }
          }, []);

          const [selectedSchool, setSelectedSchool] = useState(() => localStorage.getItem('wb_selected_school') || '');
          const [selectedClass, setSelectedClass] = useState(() => localStorage.getItem('wb_selected_class') || '');
          const [showOnboarding, setShowOnboarding] = useState(!localStorage.getItem('wb_selected_school') || !localStorage.getItem('wb_selected_class'));

          // Gestion de l'acceptation obligatoire des conditions d'utilisation au démarrage
          const [hasAcceptedTerms, setHasAcceptedTerms] = useState(() => localStorage.getItem('wb_terms_accepted') === 'true');
          const [termsAgreementChecked, setTermsAgreementChecked] = useState(false);

          const [favorites, setFavorites] = useState(() => {
              const saved = localStorage.getItem('worksbox_favs');
              return saved ? JSON.parse(saved) : [];
          });

          const [toast, setToast] = useState(null);

          const showToast = (message, type = 'success', icon = null) => {
              setToast({ id: Date.now(), message, type, icon });
          };

          const hideToast = () => {
              setToast(null);
          };

          const copyToClipboard = async (text, label = "Lien copié dans le presse-papiers !") => {
              if (!text) return;
              try {
                  if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
                      await navigator.clipboard.writeText(text);
                  } else {
                      const textarea = document.createElement('textarea');
                      textarea.value = text;
                      textarea.style.position = 'fixed';
                      textarea.style.opacity = '0';
                      document.body.appendChild(textarea);
                      textarea.select();
                      document.execCommand('copy');
                      document.body.removeChild(textarea);
                  }
                  showToast(label, 'success', 'copy');
              } catch (err) {
                  showToast("Impossible de copier dans le presse-papiers", "warning", "warning");
              }
          };

          const shareCourse = (course) => {
              if (!course) return;
              try {
                  const url = new URL(window.location.origin + window.location.pathname);
                  url.searchParams.set('course', course.id);
                  const directUrl = url.toString();
                  copyToClipboard(directUrl, `Lien direct vers « ${course.title} » copié !`);
              } catch (e) {
                  const directUrl = `${window.location.origin}${window.location.pathname}?course=${encodeURIComponent(course.id)}`;
                  copyToClipboard(directUrl, `Lien direct vers « ${course.title} » copié !`);
              }
          };

          const copyCourseLink = (course) => {
              if (!course) return;
              shareCourse(course);
          };

          useEffect(() => { 
              localStorage.setItem('worksbox_favs', JSON.stringify(favorites)); 
          }, [favorites]);

          const toggleFav = async (courseId) => {
              // Si l'utilisateur n'est pas connecté, demander la connexion pour utiliser les favoris
              if (!activeUser) {
                  showToast("Veuillez vous connecter pour enregistrer vos favoris", "warning", "warning");
                  setShowAuthModal(true);
                  return;
              }

              const isAdding = !favorites.includes(courseId);
              const targetCourse = courses.find(c => c.id === courseId);
              const courseTitle = targetCourse?.title ? `« ${targetCourse.title} »` : "Le cours";

              const newFavs = isAdding
                  ? [...favorites, courseId]
                  : favorites.filter(id => id !== courseId);
              setFavorites(newFavs);

              if (isAdding) {
                  showToast(`${courseTitle} ajouté à vos favoris`, "success", "star");
              } else {
                  showToast(`${courseTitle} retiré de vos favoris`, "info", "info");
              }

              if (localUser) {
                  const updatedLocal = { ...localUser, favorites: newFavs };
                  setLocalUser(updatedLocal);
                  localStorage.setItem('worksbox_local_user', JSON.stringify(updatedLocal));
              }

              if (user && !user.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', user.uid);
                      await setDoc(userRef, { 
                          favorites: newFavs, 
                          updatedAt: new Date().toISOString() 
                      }, { merge: true });
                  } catch (e) {
                      handleFirestoreError(e, OperationType.UPDATE, `users/${user.uid}`);
                  }
              }
          };

          const handleLocalSignIn = (name) => {
              const cleanName = (name || '').trim() || 'Élève WorksBox';
              const newLocalProfile = {
                  uid: 'local_' + Date.now(),
                  displayName: cleanName,
                  email: cleanName.toLowerCase().replace(/[^a-z0-9]/g, '') + '@eleve.worksbox',
                  selectedSchool: selectedSchool || 'Lycée François Bazin',
                  selectedClass: selectedClass || 'Terminale STI2D',
                  favorites: favorites,
                  isLocal: true,
                  createdAt: new Date().toISOString()
              };
              localStorage.setItem('worksbox_local_user', JSON.stringify(newLocalProfile));
              localStorage.setItem('wb_student_name', cleanName);
              setLocalUser(newLocalProfile);
              setUserProfile(newLocalProfile);
              setShowAuthModal(false);
              setAuthError(null);
          };

          const handleGoogleSignIn = async () => {
              if (!auth) {
                  setAuthError({ code: 'auth/not-initialized', message: 'Le service d\'authentification Firebase n\'est pas encore prêt.' });
                  return;
              }
              setAuthLoading(true);
              setAuthError(null);
              try {
                  const provider = new GoogleAuthProvider();
                  provider.addScope('https://www.googleapis.com/auth/drive.file');
                  provider.setCustomParameters({ prompt: 'select_account' });
                  const cred = await signInWithPopup(auth, provider);
                  const currentUser = cred.user;
                  const token = GoogleAuthProvider.credentialFromResult(cred)?.accessToken;
                  if (token) {
                      setDriveToken(token);
                      loadWorksBoxCloudFiles(token);
                  }
                  
                  if (userDb && currentUser) {
                      try {
                          const userRef = doc(userDb, 'users', currentUser.uid);
                          const snap = await getDoc(userRef);
                          const existingData = snap.exists() ? snap.data() : {};
                          const mergedFavs = Array.from(new Set([...(existingData.favorites || []), ...favorites]));
                          const newSchool = selectedSchool || existingData.selectedSchool || 'Lycée François Bazin';
                          const newClass = selectedClass || existingData.selectedClass || 'Terminale STI2D';
                          
                          const profilePayload = {
                              id: currentUser.uid,
                              email: currentUser.email || '',
                              displayName: currentUser.displayName || 'Élève',
                              photoURL: currentUser.photoURL || '',
                              selectedSchool: newSchool,
                              selectedClass: newClass,
                              favorites: mergedFavs,
                              createdAt: existingData.createdAt || new Date().toISOString(),
                              updatedAt: new Date().toISOString()
                          };
                          await setDoc(userRef, profilePayload, { merge: true });
                          setUserProfile(profilePayload);
                          setFavorites(mergedFavs);
                          if (newSchool) { setSelectedSchool(newSchool); localStorage.setItem('wb_selected_school', newSchool); }
                          if (newClass) { setSelectedClass(newClass); localStorage.setItem('wb_selected_class', newClass); }
                      } catch (err) {
                          handleFirestoreError(err, OperationType.WRITE, `users/${currentUser.uid}`);
                      }
                  }
                  localStorage.removeItem('worksbox_local_user');
                  setLocalUser(null);
                  setShowAuthModal(false);
              } catch (err) {
                  const errorCode = err?.code || '';
                  const errorMessage = err?.message || '';

                  if (errorCode === 'auth/unauthorized-domain' || errorMessage.includes('unauthorized-domain')) {
                      console.warn('Firebase Auth (auth/unauthorized-domain): Le domaine actuel n\'est pas encore dans les Domaines autorisés de la console Firebase (projet lycee-share) :', window.location.hostname);
                      setAuthError({
                          code: 'auth/unauthorized-domain',
                          domain: window.location.hostname,
                          message: `Le domaine "${window.location.hostname}" n'est pas encore autorisé dans Firebase pour la connexion Google OAuth.`
                      });
                  } else if (errorCode === 'auth/operation-not-allowed' || errorMessage.includes('operation-not-allowed')) {
                      console.warn('Firebase Auth (auth/operation-not-allowed): Le fournisseur Google n\'est pas activé dans le projet Firebase lycee-share.');
                      setAuthError({
                          code: 'auth/operation-not-allowed',
                          message: 'La connexion avec Google n\'est pas encore activée dans la console Firebase pour le projet lycee-share.'
                      });
                  } else if (errorCode === 'auth/popup-closed-by-user') {
                      console.warn('Firebase Auth: La fenêtre de connexion Google a été fermée.');
                      setAuthError({
                          code: errorCode,
                          message: 'La fenêtre de connexion Google a été fermée avant la fin.'
                      });
                  } else if (errorCode === 'auth/popup-blocked') {
                      console.warn('Firebase Auth: La popup a été bloquée par le navigateur.');
                      setAuthError({
                          code: errorCode,
                          message: 'La popup de connexion a été bloquée par votre navigateur. Autorisez les popups ou ouvrez dans un nouvel onglet.'
                      });
                  } else {
                      console.warn('Firebase Auth: Erreur lors de la tentative de connexion Google :', err);
                      setAuthError({
                          code: errorCode || 'unknown',
                          message: errorMessage || 'Impossible de se connecter avec Google.'
                      });
                  }
              } finally {
                  setAuthLoading(false);
              }
          };

          const handleSignOut = async () => {
              try {
                  if (auth && user) {
                      await signOut(auth);
                  }
                  localStorage.removeItem('worksbox_local_user');
                  setUser(null);
                  setLocalUser(null);
                  setUserProfile(null);
                  setShowAccountModal(false);
              } catch (err) {
                  console.error('Sign out error:', err);
              }
          };

          useEffect(() => {
            if (!auth) {
              setIsLoading(false);
              return;
            }
            const fallbackTimer = setTimeout(() => {
              setIsLoading(false);
            }, 2500);

            const unsubAuth = onAuthStateChanged(auth, async (u) => {
              setUser(u);
              if (u && !u.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', u.uid);
                      const snap = await getDoc(userRef);
                      if (snap.exists()) {
                          const data = snap.data();
                          setUserProfile(data);
                          if (data.favorites && Array.isArray(data.favorites)) {
                              setFavorites(data.favorites);
                          }
                          if (data.selectedSchool && !selectedSchool) {
                              setSelectedSchool(data.selectedSchool);
                              localStorage.setItem('wb_selected_school', data.selectedSchool);
                          }
                          if (data.selectedClass && !selectedClass) {
                              setSelectedClass(data.selectedClass);
                              localStorage.setItem('wb_selected_class', data.selectedClass);
                          }
                      }
                  } catch (err) {
                      console.warn('Could not fetch user profile:', err);
                  }
              } else if (!u) {
                  if (localUser) {
                      setUserProfile(localUser);
                  } else {
                      setUserProfile(null);
                  }
              }
              setIsLoading(false);
            });

            return () => {
              clearTimeout(fallbackTimer);
              unsubAuth();
            };
          }, [localUser]);

          useEffect(() => {
            if (!auth) return;
            return onAuthStateChanged(auth, (u) => {
              if (setDataUser) setDataUser(u);
            });
          }, []);

          useEffect(() => {
            if (!dataDb) {
              return;
            }
            
            const settingsRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (docSnap) => { 
              if (docSnap.exists()) {
                const data = docSnap.data();
                setSettings(prev => ({
                    ...prev,
                    ...data,
                    schools: Array.isArray(data.schools) ? data.schools : prev.schools,
                    classes: Array.isArray(data.classes) ? data.classes : prev.classes,
                    subjects: Array.isArray(data.subjects) ? data.subjects : (Array.isArray(data.subjectOrder) ? data.subjectOrder : prev.subjects),
                    subjectOrder: Array.isArray(data.subjectOrder) ? data.subjectOrder : (Array.isArray(data.subjects) ? data.subjects : prev.subjectOrder),
                    schoolClasses: (data.schoolClasses && typeof data.schoolClasses === 'object') ? data.schoolClasses : prev.schoolClasses,
                    schoolClassSubjects: (data.schoolClassSubjects && typeof data.schoolClassSubjects === 'object') ? data.schoolClassSubjects : prev.schoolClassSubjects,
                    classSubjects: (data.classSubjects && typeof data.classSubjects === 'object') ? data.classSubjects : prev.classSubjects
                }));
              }
            }, (err) => console.warn('Settings snapshot error:', err));

            const coursesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses');
            const unsubCourses = onSnapshot(coursesRef, (snapshot) => {
              const loadedCourses = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  // Résolution intelligente de l'établissement pour les anciens cours
                  let resolvedSchool = data.school;
                  if (!resolvedSchool || resolvedSchool === 'Lycée François Bazin') {
                      if (data.classe === 'BTS SIO 1' || data.classe === 'BTS SIO 2') {
                          resolvedSchool = 'Lycée Gaspard Monge';
                      } else if (!resolvedSchool) {
                          resolvedSchool = 'Lycée François Bazin';
                      }
                  }
                  return {
                      id: docSnap.id,
                      school: resolvedSchool,
                      classe: data.classe || 'Terminale STI2D',
                      chapterOrder: typeof data.chapterOrder === 'number' ? data.chapterOrder : -new Date(data.date).getTime(),
                      courseOrder: typeof data.courseOrder === 'number' ? data.courseOrder : -new Date(data.date).getTime(),
                      viewsDigital: data.viewsDigital || 0,
                      viewsCasio: data.viewsCasio || 0,
                      isVisible: data.isVisible !== false,
                      ...data,
                      school: resolvedSchool
                  };
              });
              setCourses(loadedCourses.filter(c => c.isVisible !== false));
              setIsLoading(false);
            }, (err) => {
              console.warn('Courses snapshot error:', err);
              setIsLoading(false);
            });

            const articlesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'articles');
            const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
              const loadedArticles = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  return {
                      id: docSnap.id,
                      school: data.school || 'Lycée François Bazin',
                      classe: data.classe || 'Terminale STI2D',
                      ...data
                  };
              });
              loadedArticles.sort((a, b) => new Date(b.date) - new Date(a.date));
              setArticles(loadedArticles);
            }, (err) => console.warn('Articles snapshot error:', err));

            return () => { unsubSettings(); unsubCourses(); unsubArticles(); };
          }, []);

          const allSchools = useMemo(() => {
              const base = Array.isArray(settings.schools) ? settings.schools : DEFAULT_SCHOOLS;
              const list = new Set([...base, ...courses.map(c => c.school), ...articles.map(a => a.school)]);
              return Array.from(list).filter(Boolean);
          }, [settings.schools, courses, articles]);

          const allClasses = useMemo(() => {
              const base = Array.isArray(settings.classes) ? settings.classes : DEFAULT_CLASSES;
              const list = new Set([...base, ...courses.map(c => c.classe), ...articles.map(a => a.classe)]);
              return Array.from(list).filter(Boolean);
          }, [settings.classes, courses, articles]);

          const getClassesForSchool = (schoolName) => {
              if (!schoolName) return allClasses;
              if (settings.schoolClasses && Array.isArray(settings.schoolClasses[schoolName]) && settings.schoolClasses[schoolName].length > 0) {
                  return settings.schoolClasses[schoolName];
              }
              if (DEFAULT_SCHOOL_CLASSES[schoolName]) {
                  return DEFAULT_SCHOOL_CLASSES[schoolName];
              }
              const inCourses = Array.from(new Set(courses.filter(c => c.school === schoolName).map(c => c.classe).filter(Boolean)));
              if (inCourses.length > 0) return inCourses;
              return allClasses;
          };

          const availableClassesForSchool = useMemo(() => {
              return getClassesForSchool(selectedSchool);
          }, [selectedSchool, settings.schoolClasses, courses, allClasses]);

          useEffect(() => {
              if (allSchools.length > 0 && (!selectedSchool || !allSchools.includes(selectedSchool))) {
                  const defSchool = allSchools.includes('Lycée François Bazin') ? 'Lycée François Bazin' : allSchools[0];
                  setSelectedSchool(defSchool);
                  localStorage.setItem('wb_selected_school', defSchool);
              }
              const validClasses = getClassesForSchool(selectedSchool);
              if (validClasses.length > 0 && (!selectedClass || !validClasses.includes(selectedClass))) {
                  const defClass = validClasses.includes('Terminale STI2D') ? 'Terminale STI2D' : validClasses[0];
                  setSelectedClass(defClass);
                  localStorage.setItem('wb_selected_class', defClass);
              }
          }, [allSchools, selectedSchool, settings.schoolClasses]);

          const getSubjectsForClass = (schoolName, className) => {
              if (!className) return [];
              const pairKey = `${schoolName}__${className}`;
              // 1. Spécifique Lycée + Classe défini dans les réglages
              if (settings.schoolClassSubjects && settings.schoolClassSubjects[pairKey] !== undefined && Array.isArray(settings.schoolClassSubjects[pairKey])) {
                  return settings.schoolClassSubjects[pairKey];
              }
              // 2. Spécifique Lycée + Classe par défaut
              if (DEFAULT_SCHOOL_CLASS_SUBJECTS && DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey]) {
                  return DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey];
              }
              // 3. Spécifique Classe défini dans les réglages
              if (settings.classSubjects && settings.classSubjects[className] !== undefined && Array.isArray(settings.classSubjects[className])) {
                  return settings.classSubjects[className];
              }
              // 4. Spécifique Classe par défaut
              if (DEFAULT_CLASS_SUBJECTS && DEFAULT_CLASS_SUBJECTS[className]) {
                  return DEFAULT_CLASS_SUBJECTS[className];
              }
              // 5. Aucune matière associée à cette classe : on ne renvoie rien (seules les matières associées s'affichent)
              return [];
          };

          const activeSubjects = useMemo(() => {
              const configured = getSubjectsForClass(selectedSchool, selectedClass);
              // Détection automatique des matières des cours existants pour cette classe et cet établissement
              const fromCourses = courses
                  .filter(c => {
                      const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim();
                      const cClass = (c.classe || 'Terminale STI2D').trim();
                      return cSchool.toLowerCase() === (selectedSchool || '').trim().toLowerCase() &&
                             cClass.toLowerCase() === (selectedClass || '').trim().toLowerCase() &&
                             c.subject;
                  })
                  .map(c => c.subject.trim())
                  .filter(Boolean);
              
              const combined = Array.from(new Set([...configured, ...fromCourses]));
              return combined;
          }, [selectedSchool, selectedClass, settings.schoolClassSubjects, settings.classSubjects, courses]);

          // Filtrage par établissement et classe sélectionnés avec restriction stricte aux matières associées
          const filteredCourses = useMemo(() => {
              const assocSet = new Set(activeSubjects.map(s => s.toLowerCase().trim()));
              return courses.filter(c => {
                  const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim();
                  const cClass = (c.classe || 'Terminale STI2D').trim();
                  const matchSchool = cSchool.toLowerCase() === (selectedSchool || '').trim().toLowerCase();
                  const matchClass = cClass.toLowerCase() === (selectedClass || '').trim().toLowerCase();
                  const cSubject = (c.subject || '').trim().toLowerCase();
                  const matchAssociated = cSubject ? assocSet.has(cSubject) : false;
                  return matchSchool && matchClass && matchAssociated;
              });
          }, [courses, selectedSchool, selectedClass, activeSubjects]);

          const filteredArticles = useMemo(() => {
              return articles.filter(a => (a.school || 'Lycée François Bazin') === selectedSchool && (a.classe || 'Terminale STI2D') === selectedClass);
          }, [articles, selectedSchool, selectedClass]);

          // Réinitialiser la matière sélectionnée si elle n'est plus associée à la classe courante
          useEffect(() => {
              if (selectedSubject && !activeSubjects.includes(selectedSubject)) {
                  setSelectedSubject(null);
                  if (currentView === 'subject') {
                      setCurrentView('home');
                  }
              }
          }, [selectedSubject, activeSubjects, currentView]);

          const sortedSubjects = useMemo(() => {
              const ordered = Array.isArray(settings.subjects)
                  ? settings.subjects
                  : (Array.isArray(settings.subjectOrder) ? settings.subjectOrder : DEFAULT_SUBJECTS);
              const assocSet = new Set(activeSubjects);
              const known = ordered.filter(s => assocSet.has(s));
              const unknown = activeSubjects.filter(s => !ordered.includes(s)).sort();
              return [...known, ...unknown];
          }, [activeSubjects, settings.subjects, settings.subjectOrder]);

          const latestCourses = useMemo(() => filteredCourses.slice(0, 4), [filteredCourses]);
          const favoriteCourses = useMemo(() => filteredCourses.filter(c => favorites.includes(c.id)), [filteredCourses, favorites]);

          const searchedCourses = useMemo(() => {
              if (!searchQuery || searchQuery.length < 2) return [];
              const q = searchQuery.toLowerCase();
              return filteredCourses.filter(c => c.title.toLowerCase().includes(q) || c.chapter.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q));
          }, [filteredCourses, searchQuery]);

          const filteredSubjectsList = sortedSubjects.filter(subject => subject.toLowerCase().includes(searchQuery.toLowerCase()));
          const goHome = () => { setSelectedSubject(null); setCurrentView('home'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openSubject = (subject) => { setSelectedSubject(subject); setCurrentView('subject'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openTerms = () => { setSelectedSubject(null); setCurrentView('terms'); setSearchQuery(''); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openCasioGuide = () => { setSelectedSubject(null); setCurrentView('casioGuide'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          
          const openProfile = (tab = 'favorites') => {
              if (!activeUser) {
                  setShowAuthModal(true);
                  return;
              }
              setSelectedSubject(null);
              setProfileTab(tab);
              setCurrentView('profile');
              window.scrollTo({top: 0, behavior: 'smooth'});
          };
          const openFavorites = () => openProfile('favorites');
          const openCloud = () => openProfile('cloud');
          const openAccount = () => openProfile('account');

          const handleView = async (course, type) => {
              if (type === 'Numérique') setPreviewData({ link: course.digitalLink, title: course.title, type: 'Numérique', course });
              else if (type === 'Casio') setPreviewData({ link: course.casioLink, title: course.title, type: 'Casio', course });
              else if (type === 'Vidéo') setPreviewData({ link: course.videoLink, title: course.title, type: 'Vidéo', course });
              else if (type === 'Image') setPreviewData({ link: course.imageLink, title: course.title, type: 'Image', course });
              else if (type === 'Audio') setPreviewData({ link: course.audioLink, title: course.title, type: 'Audio', course });

              if (dataDb) {
                  try {
                      const docRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', course.id.toString());
                      const updates = {};
                      if (type === 'Numérique') updates.viewsDigital = (course.viewsDigital || 0) + 1;
                      if (type === 'Casio') updates.viewsCasio = (course.viewsCasio || 0) + 1;
                      if (Object.keys(updates).length > 0) await updateDoc(docRef, updates);
                  } catch(e) {
                      console.warn('Erreur incrément vue :', e);
                  }
              }
          };

          // Détection d'un lien direct vers un cours dans l'URL (?course=... ou ?c=...)
          const [deepLinkHandled, setDeepLinkHandled] = useState(false);
          useEffect(() => {
              if (deepLinkHandled || !courses || courses.length === 0) return;
              try {
                  const params = new URLSearchParams(window.location.search);
                  const targetCourseId = params.get('course') || params.get('c');
                  if (targetCourseId) {
                      const target = courses.find(c => String(c.id) === String(targetCourseId));
                      if (target) {
                          setDeepLinkHandled(true);
                          if (target.school) {
                              setSelectedSchool(target.school);
                              localStorage.setItem('wb_selected_school', target.school);
                          }
                          if (target.classe) {
                              setSelectedClass(target.classe);
                              localStorage.setItem('wb_selected_class', target.classe);
                          }
                          if (target.subject) {
                              setSelectedSubject(target.subject);
                              setCurrentView('subject');
                          }
                          const link = target.digitalLink || target.casioLink || target.videoLink || target.imageLink || target.audioLink;
                          const type = target.digitalLink ? 'Numérique' : (target.casioLink ? 'Casio' : (target.videoLink ? 'Vidéo' : (target.imageLink ? 'Image' : 'Audio')));
                          if (link) {
                              setPreviewData({
                                  link,
                                  type,
                                  title: target.title,
                                  course: target
                              });
                          }
                          showToast(`Affichage du cours « ${target.title} »`, 'info', 'info');
                      }
                  }
              } catch (err) {
                  console.warn('Erreur lecture lien direct cours :', err);
              }
          }, [courses, deepLinkHandled]);

          const chaptersData = useMemo(() => {
            if (!selectedSubject) return [];
            const targetSubjLower = selectedSubject.trim().toLowerCase();
            const filtered = filteredCourses.filter(c => (c.subject || '').trim().toLowerCase() === targetSubjLower);
            const groups = {};
            filtered.forEach(course => {
                if (!groups[course.chapter]) groups[course.chapter] = { name: course.chapter, courses: [] };
                groups[course.chapter].courses.push(course);
            });
            Object.values(groups).forEach(group => {
                group.chapterOrder = Math.min(...group.courses.map(c => c.chapterOrder || 0));
                group.courses.sort((a, b) => (a.courseOrder||0) - (b.courseOrder||0));
            });
            return Object.values(groups).sort((a, b) => a.chapterOrder - b.chapterOrder);
          }, [filteredCourses, selectedSubject]);

          const handleSaveOnboarding = async (e) => {
              e.preventDefault();
              if (!selectedSchool || !selectedClass) return;
              localStorage.setItem('wb_selected_school', selectedSchool);
              localStorage.setItem('wb_selected_class', selectedClass);
              setShowOnboarding(false);

              if (user && !user.isAnonymous && userDb) {
                  try {
                      const userRef = doc(userDb, 'users', user.uid);
                      await setDoc(userRef, {
                          selectedSchool: selectedSchool,
                          selectedClass: selectedClass,
                          updatedAt: new Date().toISOString()
                      }, { merge: true });
                  } catch (err) {
                      console.warn('Erreur sauvegarde profil utilisateur :', err);
                  }
              }
          };

          const handleAcceptTerms = () => {
              if (!termsAgreementChecked) return;
              localStorage.setItem('wb_terms_accepted', 'true');
              setHasAcceptedTerms(true);
          };

          const getYouTubeEmbedUrl = (url) => {
              if (!url) return null;
              if (url.includes('embed/')) return url;
              let videoId = '';
              if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
              else if (url.includes('watch?v=')) videoId = new URLSearchParams(new URL(url).search).get('v');
              return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
          };

          return (
            <div className="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 pb-20 transition-colors duration-200">
              {/* MODALE D'ACCEPTATION OBLIGATOIRE DES CONDITIONS D'UTILISATION */}
              {!hasAcceptedTerms && (
                  <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md animate-in fade-in duration-300">
                      <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-2xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90vh]">
                          <div className="flex items-center space-x-3 mb-4 pb-4 border-b border-slate-100 dark:border-slate-800 flex-shrink-0">
                              <div className="bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 p-2.5 rounded-2xl">
                                  <Shield className="w-6 h-6" />
                              </div>
                              <div>
                                  <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">Conditions d'utilisations de WorksBox</h2>
                                  <p className="text-xs text-slate-500 dark:text-slate-400">Veuillez prendre connaissance du règlement et l'accepter pour accéder au site.</p>
                              </div>
                          </div>

                          <div 
                              className="flex-1 overflow-y-auto pr-2 mb-6 bg-slate-50 dark:bg-slate-950 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line space-y-4"
                              dangerouslySetInnerHTML={{ __html: settings.termsContent || DEFAULT_TERMS_FALLBACK }}
                          />

                          <div className="flex-shrink-0 pt-2 border-t border-slate-100 dark:border-slate-800 space-y-4">
                              <label className="flex items-start space-x-3 cursor-pointer select-none">
                                  <input 
                                      type="checkbox" 
                                      checked={termsAgreementChecked} 
                                      onChange={(e) => setTermsAgreementChecked(e.target.checked)} 
                                      className="mt-1 w-4 h-4 text-blue-600 rounded border-slate-300 dark:border-slate-700 focus:ring-blue-500 cursor-pointer" 
                                  />
                                  <span className="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-200">
                                      J'ai lu et j'accepte les conditions d'utilisation de WorksBox.
                                  </span>
                              </label>

                              <button 
                                  onClick={handleAcceptTerms} 
                                  disabled={!termsAgreementChecked} 
                                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-2"
                              >
                                  <span>Accepter et continuer</span>
                              </button>
                          </div>
                      </div>
                  </div>
              )}

              {/* MODALE DE CHOIX D'ÉTABLISSEMENT / CLASSE */}
              {hasAcceptedTerms && showOnboarding && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/85 backdrop-blur-md animate-in fade-in duration-300">
                      <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-lg p-8 sm:p-10 border border-slate-100 dark:border-slate-800 relative">
                          {selectedSchool && selectedClass && (
                              <button 
                                  type="button" 
                                  onClick={() => setShowOnboarding(false)} 
                                  className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors"
                                  title="Fermer"
                              >
                                  <X className="w-5 h-5" />
                              </button>
                          )}
                          <div className="text-center mb-8">
                              <WorksBoxLogo className="w-16 h-16 rounded-2xl mx-auto mb-4 shadow-md" />
                              <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">Bienvenue sur WorksBox</h1>
                              <p className="text-sm text-slate-500 dark:text-slate-400 mt-2">Veuillez indiquer votre établissement et votre classe pour accéder aux cours.</p>
                          </div>
                          <form onSubmit={handleSaveOnboarding} className="space-y-6">
                              <div>
                                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-2">Sélectionnez votre Lycée</label>
                                  <select 
                                      value={selectedSchool} 
                                      onChange={(e) => {
                                          const sch = e.target.value;
                                          setSelectedSchool(sch);
                                          const avail = getClassesForSchool(sch);
                                          if (avail && avail.length > 0 && !avail.includes(selectedClass)) {
                                              setSelectedClass(avail[0]);
                                          }
                                      }} 
                                      required 
                                      className="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 dark:text-slate-100 outline-none focus:border-blue-500 cursor-pointer"
                                  >
                                      <option value="" disabled>-- Choisir un lycée --</option>
                                      {allSchools.map(s => <option key={s} value={s}>{s}</option>)}
                                  </select>
                              </div>
                              <div>
                                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-2">Sélectionnez votre Classe</label>
                                  <select 
                                      value={selectedClass} 
                                      onChange={(e) => setSelectedClass(e.target.value)} 
                                      required 
                                      className="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 dark:text-slate-100 outline-none focus:border-blue-500 cursor-pointer"
                                  >
                                      <option value="" disabled>-- Choisir une classe --</option>
                                      {availableClassesForSchool.map(c => <option key={c} value={c}>{c}</option>)}
                                  </select>
                              </div>
                              <button type="submit" disabled={!selectedSchool || !selectedClass} className="w-full py-4 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all">Accéder aux cours</button>
                          </form>
                      </div>
                  </div>
              )}

              {settings.announcement && (
                  <div className="bg-amber-500 text-white text-sm font-bold py-2 px-4 flex justify-center items-center">
                      <Megaphone className="w-4 h-4 mr-2" />{settings.announcement}
                  </div>
              )}

              <nav className="bg-slate-900 dark:bg-slate-950 text-white shadow-lg sticky top-0 z-10 border-b border-slate-800 dark:border-slate-800/80 transition-colors duration-200">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center h-16">
                    <div className="flex items-center space-x-8">
                        <div className="flex items-center space-x-3 cursor-pointer group active:scale-95 transition-all" onClick={goHome}>
                            <WorksBoxLogo className="w-9 h-9 rounded-xl shadow-md group-hover:scale-105 transition-transform" />
                            <span className="font-bold text-xl tracking-tight">WorksBox</span>
                        </div>
                        <div className="hidden lg:flex items-center space-x-6">
                            <button onClick={goHome} className={`text-sm font-medium flex items-center transition-colors hover:text-white ${(currentView === 'home' || currentView === 'subject') ? 'text-white border-b-2 border-blue-500 pb-1 mt-1' : 'text-slate-400'}`}><HomeIcon className="w-4 h-4 mr-1.5" /> Accueil</button>
                            <button onClick={openTerms} className={`text-sm font-medium flex items-center transition-colors hover:text-white ${currentView === 'terms' ? 'text-white border-b-2 border-blue-500 pb-1 mt-1' : 'text-slate-400'}`}><Shield className="w-4 h-4 mr-1.5" /> Conditions</button>
                            <button onClick={openCasioGuide} className={`text-sm font-medium flex items-center transition-colors hover:text-white ${currentView === 'casioGuide' ? 'text-white border-b-2 border-blue-500 pb-1 mt-1' : 'text-slate-400'}`}><HelpCircle className="w-4 h-4 mr-1.5" /> Tuto Casio</button>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2.5">
                        {/* Bouton de basculement Mode Clair / Sombre */}
                        <button 
                            id="nav-btn-theme-toggle" 
                            onClick={toggleTheme} 
                            className="p-2 rounded-xl text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-700 dark:border-slate-750 transition-all active:scale-95 flex items-center justify-center cursor-pointer"
                            title={isDark ? "Passer en mode clair" : "Passer en mode sombre"}
                            aria-label={isDark ? "Passer en mode clair" : "Passer en mode sombre"}
                        >
                            {isDark ? (
                                <Sun className="w-4 h-4 text-amber-400" />
                            ) : (
                                <Moon className="w-4 h-4 text-sky-300" />
                            )}
                        </button>

                        <button id="nav-btn-school-class" onClick={() => setShowOnboarding(true)} className="flex items-center space-x-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-700 transition-all active:scale-95">
                            <SchoolIcon className="w-4 h-4 text-blue-400" />
                            <span className="hidden sm:inline truncate max-w-[130px]">{selectedSchool} • {selectedClass}</span>
                        </button>

                        {isUserAdmin && (
                            <a 
                                id="nav-btn-admin-panel"
                                href="admin.html"
                                className="flex items-center space-x-1.5 text-xs font-black bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white px-3 py-2 rounded-xl border border-red-400/40 shadow-md shadow-red-900/30 transition-all active:scale-95"
                                title="Accéder au panneau d'administration WorksBox"
                            >
                                <Shield className="w-3.5 h-3.5 text-white" />
                                <span className="hidden sm:inline">Panel Admin</span>
                                <span className="sm:hidden">Admin</span>
                            </a>
                        )}

                        {activeUser ? (
                            <button 
                                id="nav-btn-user-profile"
                                onClick={() => openProfile(profileTab || 'favorites')} 
                                className={`flex items-center space-x-2 text-xs font-bold px-3 py-2 rounded-xl transition-all active:scale-95 cursor-pointer ${
                                    currentView === 'profile' 
                                        ? 'bg-blue-600 text-white shadow-md ring-2 ring-blue-400/50' 
                                        : 'bg-slate-800 hover:bg-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800 text-blue-400 border border-blue-500/30'
                                }`}
                                title="Accéder à mon espace profil et mes onglets exclusifs"
                            >
                                {activeUser.photoURL ? (
                                    <img src={activeUser.photoURL} alt="Avatar" className="w-5 h-5 rounded-full object-cover border border-blue-400" />
                                ) : (
                                    <div className={`w-5 h-5 rounded-full ${activeUser.isLocal ? 'bg-emerald-600' : 'bg-blue-600'} text-white flex items-center justify-center text-[10px] font-bold`}>
                                        {(activeUser.displayName || activeUser.email || 'E')[0].toUpperCase()}
                                    </div>
                                )}
                                <span className="hidden sm:inline max-w-[110px] truncate text-slate-200">{activeUser.displayName || activeUser.email?.split('@')[0]}</span>
                                {activeUser.isLocal && (
                                    <span className="hidden md:inline-block w-2 h-2 rounded-full bg-emerald-400" title="Profil élève actif"></span>
                                )}
                            </button>
                        ) : (
                            <button 
                                id="nav-btn-login"
                                onClick={() => setShowAuthModal(true)} 
                                className="flex items-center space-x-1.5 text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-xl transition-all shadow-sm active:scale-95"
                            >
                                <UserIcon className="w-4 h-4" />
                                <span>Connexion</span>
                            </button>
                        )}
                    </div>
                  </div>
                </div>
              </nav>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                {isLoading ? (
                    <CourseListSkeleton view={currentView} selectedSubject={selectedSubject} />
                ) : (
                    <>
                        {currentView === 'home' && (
                        <div key="view-home" className="space-y-12 view-transition">
                            <div className="text-center max-w-2xl mx-auto">
                                <div className="flex items-center justify-center space-x-3 mb-3">
                                    <WorksBoxLogo className="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl shadow-md" />
                                    <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">Ressources & Cours</h1>
                                </div>
                                <div className="flex items-center justify-center space-x-2 mb-6">
                                    <span className="inline-flex items-center space-x-1.5 bg-blue-50 dark:bg-blue-950/70 border border-blue-200 dark:border-blue-900 text-blue-800 dark:text-blue-300 text-xs sm:text-sm font-bold px-3.5 py-1.5 rounded-full shadow-xs">
                                        <SchoolIcon className="w-4 h-4 text-blue-600 dark:text-blue-400" />
                                        <span>{selectedSchool || 'Choisir un lycée'}</span>
                                        <span className="text-blue-300 dark:text-blue-700">•</span>
                                        <span>{selectedClass || 'Choisir une classe'}</span>
                                    </span>
                                    <button 
                                        onClick={() => setShowOnboarding(true)}
                                        className="text-xs font-bold text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-xl shadow-xs transition-all active:scale-95"
                                        title="Changer d'établissement ou de classe"
                                    >
                                        Changer
                                    </button>
                                </div>
                                <div className="max-w-xl mx-auto relative">
                                    <Search className="absolute left-4 top-4 h-5 w-5 text-slate-400 dark:text-slate-500" />
                                    <input type="text" className="block w-full pl-12 pr-4 py-4 border-2 border-slate-200 dark:border-slate-700 rounded-2xl bg-white dark:bg-slate-900 focus:outline-none focus:border-blue-500 text-base shadow-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-colors" placeholder="Rechercher un cours, un chapitre..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                </div>
                            </div>

                            {filteredArticles.length > 0 && (
                                <div className="space-y-4">
                                    <h3 className="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center"><Newspaper className="w-5 h-5 mr-2 text-red-500"/> Actualités & Annonces</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {filteredArticles.map(art => {
                                            const embedUrl = getYouTubeEmbedUrl(art.videoUrl);
                                            return (
                                                <div key={art.id} className={`bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border flex flex-col justify-between ${art.pinned ? 'border-amber-400 dark:border-amber-500 ring-2 ring-amber-400/20' : 'border-slate-200 dark:border-slate-800'}`}>
                                                    <div>
                                                        <div className="flex justify-between items-center mb-3">
                                                            <span className="text-xs text-slate-400 dark:text-slate-500 font-medium">{new Date(art.date).toLocaleDateString('fr-FR')}</span>
                                                            {art.pinned && <span className="bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-amber-300 dark:border-amber-700">Épinglé</span>}
                                                        </div>
                                                        <h4 className="text-lg font-bold text-slate-900 dark:text-white mb-2">{art.title}</h4>
                                                        <p className="text-slate-600 dark:text-slate-300 text-sm whitespace-pre-line mb-4">{art.content}</p>
                                                    </div>
                                                    {art.imageUrl && (
                                                        <div className="mb-4 rounded-xl overflow-hidden border border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 max-h-72">
                                                            <img src={art.imageUrl} alt={art.title} className="w-full h-full object-cover" onError={(e)=>{e.target.style.display='none'}} />
                                                        </div>
                                                    )}
                                                    {embedUrl && (
