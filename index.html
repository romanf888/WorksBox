                                                                            <div className={`p-2.5 rounded-xl flex-shrink-0 ${isNoteFile ? 'bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-400' : 'bg-blue-50 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400'}`}>
                                                                                {isNoteFile ? <PenTool className="w-5 h-5" /> : <FileText className="w-5 h-5" />}
                                                                            </div>
                                                                            <div className="min-w-0">
                                                                                <div className="flex items-center space-x-2">
                                                                                    <h4 className="text-sm font-bold text-slate-800 dark:text-slate-100 truncate">{file.name}</h4>
                                                                                    {isNoteFile && (
                                                                                        <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300">
                                                                                            Note
                                                                                        </span>
                                                                                    )}
                                                                                </div>
                                                                                <div className="flex items-center space-x-2 text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
                                                                                    <span>{sizeMb} Mo</span>
                                                                                    <span>•</span>
                                                                                    <span>Modifié le {dateFormatted}</span>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                        <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                                                            {isNoteFile && matchedLocalNote && (
                                                                                <button
                                                                                    onClick={() => openNoteInEditor(matchedLocalNote)}
                                                                                    className="px-3 py-1.5 bg-sky-50 dark:bg-sky-950/80 hover:bg-sky-100 text-sky-700 dark:text-sky-300 text-xs font-bold rounded-lg transition flex items-center"
                                                                                    title="Ouvrir dans l'éditeur WorksBox Note"
                                                                                >
                                                                                    <PenTool className="w-3.5 h-3.5 mr-1" /> Éditer
                                                                                </button>
                                                                            )}
                                                                            {file.webViewLink && (
                                                                                <a 
                                                                                    href={file.webViewLink} 
                                                                                    target="_blank" 
                                                                                    rel="noopener noreferrer" 
                                                                                    className="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-lg transition flex items-center"
                                                                                >
                                                                                    <ExternalLink className="w-3.5 h-3.5 mr-1" /> Ouvrir sur Drive
                                                                                </a>
                                                                            )}
                                                                            <button 
                                                                                onClick={() => deleteCloudFile(file.id, file.name)} 
                                                                                className="p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-950/50 rounded-lg transition"
                                                                                title="Supprimer du Drive et libérer l'espace"
                                                                            >
                                                                                <Trash2 className="w-4 h-4" />
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {profileTab === 'sharedCloud' && (
                                <div className="space-y-6 animate-in fade-in duration-200">
                                    {/* Jauge de Quota Global & Présentation de l'Espace Partagé */}
                                    <div className="bg-gradient-to-br from-indigo-900/90 via-slate-900 to-slate-950 text-white rounded-3xl border border-indigo-700/50 p-6 sm:p-8 shadow-xl space-y-6 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-80 h-80 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none -mr-20 -mt-20"></div>
                                        
                                        <div className="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6 relative z-10">
                                            <div className="space-y-2 max-w-2xl">
                                                <div className="flex flex-wrap items-center gap-2">
                                                    <span className="px-3 py-1 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full text-xs font-black uppercase tracking-wider flex items-center">
                                                        <Users className="w-3.5 h-3.5 mr-1.5" />
                                                        Espace Partagé Collectif
                                                    </span>
                                                    <span className="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full text-[11px] font-bold">
                                                        Accessible à tous les élèves
                                                    </span>
                                                </div>
                                                <h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight">
                                                    {sharedCloudConfig.name || "Cloud Partagé de l'Établissement"}
                                                </h2>
                                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                                                    {sharedCloudConfig.description || "Consultez, téléchargez et importez dans votre espace personnel les ressources, devoirs et annales officielles mis à disposition par l'administration."}
                                                </p>
                                            </div>

                                            {/* Statut Espace & Quota fixé par l'admin */}
                                            <div className="bg-slate-900/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl border border-indigo-500/30 w-full lg:w-80 flex-shrink-0 space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wide flex items-center">
                                                        <HardDrive className="w-3.5 h-3.5 mr-1.5 text-indigo-400" />
                                                        Quota Fixé par l'Admin
                                                    </span>
                                                    <span className="text-xs font-black text-indigo-300">
                                                        {((sharedCloudStorageUsed / (1024 * 1024))).toFixed(1)} Mo / {((sharedCloudConfig.quotaBytes || 5368709120) / (1024 * 1024 * 1024)).toFixed(0)} Go
                                                    </span>
                                                </div>

                                                {/* Barre de quota */}
                                                <div className="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                                                    <div 
                                                        className="h-full rounded-full bg-gradient-to-r from-indigo-500 via-sky-400 to-emerald-400 transition-all duration-500"
                                                        style={{ width: `${Math.min(100, Math.max(3, (sharedCloudStorageUsed / (sharedCloudConfig.quotaBytes || 5368709120)) * 100))}%` }}
                                                    ></div>
                                                </div>

                                                <div className="flex items-center justify-between text-[11px] text-slate-400">
                                                    <span>{sharedCloudFiles.length} ressource{sharedCloudFiles.length !== 1 ? 's' : ''} disponible{sharedCloudFiles.length !== 1 ? 's' : ''}</span>
                                                    <span className="font-semibold text-emerald-400">
                                                        {Math.max(0, (((sharedCloudConfig.quotaBytes || 5368709120) - sharedCloudStorageUsed) / (1024 * 1024 * 1024))).toFixed(2)} Go libres
                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Statut de synchronisation avec l'établissement */}
                                        <div className="pt-4 border-t border-indigo-700/40 flex items-center space-x-2 text-xs text-slate-300">
                                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                            <span>Synchronisé en direct avec la base de données de l'établissement</span>
                                        </div>
                                    </div>

                                    {/* Barre de Recherche et Filtres par Catégorie */}
                                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-5">
                                        <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
                                            <div className="relative flex-1 max-w-md">
                                                <Search className="absolute left-3.5 top-3 h-4 w-4 text-slate-400" />
                                                <input 
                                                    type="text" 
                                                    placeholder="Rechercher une annale, fiche, sujet, devoir..." 
                                                    value={sharedCloudSearchQuery} 
                                                    onChange={(e) => setSharedCloudSearchQuery(e.target.value)} 
                                                    className="w-full pl-10 pr-4 py-2.5 text-xs sm:text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 text-slate-800 dark:text-slate-100 placeholder-slate-400 transition"
                                                />
                                            </div>

                                            <div className="flex items-center space-x-2 text-xs font-semibold text-slate-500 dark:text-slate-400">
                                                <span>Affichage :</span>
                                                <span className="px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold text-slate-700 dark:text-slate-200">
                                                    {filteredSharedFiles.length} document{filteredSharedFiles.length !== 1 ? 's' : ''}
                                                </span>
                                            </div>
                                        </div>

                                        {/* Filtres Catégories */}
                                        <div className="flex items-center space-x-2 overflow-x-auto pb-1 scrollbar-none">
                                            {['Tout', 'BAC', 'BTS', 'Cours', 'Devoirs', 'Logiciels', 'Documentation', 'Autre'].map(cat => {
                                                const isActive = sharedCloudCategory === cat;
                                                return (
                                                    <button
                                                        key={cat}
                                                        onClick={() => setSharedCloudCategory(cat)}
                                                        className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition-all cursor-pointer ${
                                                            isActive
                                                                ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-600/30'
                                                                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'
                                                        }`}
                                                    >
                                                        {cat}
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {/* Liste des Documents Partagés */}

                                            <div className="border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl p-12 text-center space-y-3">

                                                <h4 className="text-base font-bold text-slate-800 dark:text-slate-200">
                                                    Aucun document trouvé dans cette catégorie

                                                    {sharedCloudSearchQuery ? "Modifiez votre recherche pour trouver d'autres documents." : "L'administrateur n'a pas encore téléversé de fichiers dans ce dossier."}
                                                </p>
                                                {sharedCloudSearchQuery && (
                                                    <button 
                                                        onClick={() => { setSharedCloudSearchQuery(''); setSharedCloudCategory('Tout'); }}
                                                        className="px-4 py-2 bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-bold rounded-xl transition"
                                                    >
                                                        Réinitialiser les filtres
                                                    </button>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                                {filteredSharedFiles.map(file => {
                                                    const sizeMb = ((parseInt(file.size, 10) || 0) / (1024 * 1024)).toFixed(2);
                                                    const dateFormatted = file.uploadedAt || (file.modifiedTime ? new Date(file.modifiedTime).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Récemment');
                                                    
                                                    let catColor = 'bg-blue-100 text-blue-800 dark:bg-blue-950/80 dark:text-blue-300 border-blue-200 dark:border-blue-800';
                                                    if (file.category === 'BAC') catColor = 'bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border-amber-200 dark:border-amber-800';
                                                    if (file.category === 'BTS') catColor = 'bg-purple-100 text-purple-800 dark:bg-purple-950/80 dark:text-purple-300 border-purple-200 dark:border-purple-800';
                                                    if (file.category === 'Logiciels') catColor = 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800';
                                                    if (file.category === 'Devoirs') catColor = 'bg-rose-100 text-rose-800 dark:bg-rose-950/80 dark:text-rose-300 border-rose-200 dark:border-rose-800';

                                                    return (
                                                        <div 
                                                            key={file.id} 
                                                            className="bg-slate-50 dark:bg-slate-800/60 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 p-5 transition-all flex flex-col justify-between space-y-4 hover:shadow-md"
                                                        >
                                                            <div className="space-y-3">
                                                                <div className="flex items-start justify-between gap-3">
                                                                    <div className="flex items-center space-x-3 min-w-0">
                                                                        <div className="p-3 bg-indigo-100 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400 rounded-2xl flex-shrink-0">
                                                                            <FileText className="w-6 h-6" />
                                                                        </div>
                                                                        <div className="min-w-0">
                                                                            <span className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${catColor}`}>
                                                                                {file.category || 'Général'}
                                                                            </span>
                                                                            <h4 className="text-sm sm:text-base font-bold text-slate-900 dark:text-white mt-1 leading-snug break-words">
                                                                                {file.name}
                                                                            </h4>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                {file.description && (
                                                                    <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed line-clamp-2">
                                                                        {file.description}
                                                                    </p>
                                                                )}

                                                                <div className="flex flex-wrap items-center gap-y-1 gap-x-3 text-[11px] text-slate-500 dark:text-slate-400 pt-1">
                                                                    <span className="font-semibold">{sizeMb} Mo</span>
                                                                    <span>•</span>
                                                                    <span>Ajouté le {dateFormatted}</span>
                                                                    <span>•</span>
                                                                    <span className="text-indigo-600 dark:text-indigo-400 font-bold">{file.uploadedBy || 'Admin'}</span>
                                                                </div>
                                                            </div>

                                                            {/* Actions sur le fichier partagé */}
                                                            <div className="pt-3 border-t border-slate-200/60 dark:border-slate-700/60 flex flex-wrap items-center justify-between gap-2">
                                                                <button
                                                                    onClick={() => saveSharedFileToPersonalCloud(file)}
                                                                    className="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-950/80 hover:bg-indigo-100 dark:hover:bg-indigo-900 text-indigo-700 dark:text-indigo-300 text-xs font-bold rounded-xl transition flex items-center space-x-1.5 border border-indigo-200 dark:border-indigo-800"
                                                                    title="Importer et copier directement dans mon espace Google Drive personnel"
                                                                >
                                                                    <Cloud className="w-3.5 h-3.5 text-indigo-500" />
                                                                    <span>Copier dans mon Cloud</span>
                                                                </button>

                                                                <div className="flex items-center space-x-2">
                                                                    {file.url && (
                                                                        <button
                                                                            onClick={() => handleSharedFilePreview(file)}
                                                                            className="px-3 py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition flex items-center space-x-1"
                                                                        >
                                                                            <Eye className="w-3.5 h-3.5 mr-1" />
                                                                            <span>Aperçu</span>
                                                                        </button>
                                                                    )}

                                                                    <button
                                                                        onClick={() => downloadSharedFile(file)}
                                                                        className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow-xs transition flex items-center space-x-1 cursor-pointer"

                                                                    >
                                                                        <Download className="w-3.5 h-3.5 mr-1" />
                                                                        <span>Télécharger</span>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>

                            {/* CONTENU ONGLET 4 : MON COMPTE & RÉGLAGES */}

                                <div className="max-w-2xl mx-auto space-y-6 animate-in fade-in duration-200">

                                            <div>
                                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide block">Scolarité</span>
                                                <h3 className="text-base font-bold text-slate-900 dark:text-white">Établissement & Classe active</h3>
                                            </div>
                                            <button 
                                                onClick={() => setShowOnboarding(true)}
                                                className="px-3.5 py-1.5 bg-blue-50 dark:bg-blue-950/80 hover:bg-blue-100 text-blue-700 dark:text-blue-300 text-xs font-bold rounded-xl transition"
                                            >
                                                Modifier
                                            </button>
                                        </div>
                                        <div className="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl space-y-1">
                                            <p className="text-sm font-black text-slate-900 dark:text-white flex items-center">
                                                <SchoolIcon className="w-4 h-4 text-blue-500 mr-2" />
                                                {selectedSchool || 'Non sélectionné'}
                                            </p>
                                            <p className="text-xs text-slate-600 dark:text-slate-400 pl-6">
                                                Classe : <strong>{selectedClass || 'Non sélectionnée'}</strong>
                                            </p>
                                        </div>
                                    </div>

                                    {/* Connexion Google pour les élèves en session locale */}
                                    {activeUser?.isLocal && (
                                        <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                            <div>
                                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide block">Compte Google</span>
                                                <h3 className="text-base font-bold text-slate-900 dark:text-white">Connexion Google</h3>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Activez votre espace WorksBox Cloud (1 Go) et synchronisez vos favoris en toute sécurité.</p>
                                            </div>
                                            <button 
                                                onClick={() => setShowAuthModal(true)}
                                                className="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition shadow-sm whitespace-nowrap flex items-center space-x-2"
                                            >
                                                <GoogleIcon className="w-4 h-4" />
                                                <span>Se connecter avec Google</span>
                                            </button>
                                        </div>
                                    )}

                                    {/* Accès Admin si applicable */}
                                    {isUserAdmin && (

                                            <div className="text-xs text-slate-200 mr-2">
                                                <span className="font-extrabold flex items-center text-red-400 text-sm mb-1">
                                                    <Shield className="w-4 h-4 mr-1.5 inline" /> Panneau d'Administration
                                                </span>
                                                <span className="text-xs text-slate-300">Gérez les cours, fiches Casio et importations Google Drive par IA.</span>
                                            </div>
                                            <a
                                                href="admin.html"
                                                className="px-4 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-sm flex items-center space-x-1.5"
                                            >
                                                <span>Ouvrir le Panel</span>
                                                <ExternalLink className="w-3.5 h-3.5" />
                                            </a>
                                        </div>
                                    )}

                                    {/* Déconnexion */}
                                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm flex items-center justify-between">
                                        <div>
                                            <h3 className="text-sm font-bold text-slate-900 dark:text-white">Déconnexion de WorksBox</h3>
                                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Vous pourrez vous reconnecter à tout moment.</p>
                                        </div>
                                        <button 
                                            onClick={handleSignOut}
                                            className="px-4 py-2 bg-red-50 dark:bg-red-950/50 hover:bg-red-100 text-red-700 dark:text-red-300 font-bold text-xs rounded-xl border border-red-200 dark:border-red-900 transition flex items-center space-x-1.5"
                                        >
                                            <LogOut className="w-3.5 h-3.5" />
                                            <span>Se déconnecter</span>
                                        </button>
                                    </div>
                                </div>
                            )}
                          </div>
                        )}

                        {currentView === 'subject' && (

                                <div className="flex flex-wrap items-center justify-between gap-4">
                                    <div className="flex items-center space-x-3.5">
                                        <button 
                                            onClick={goHome} 
                                            className="p-2.5 liquid-glass-btn rounded-2xl text-slate-700 dark:text-slate-200 shadow-xs transition-all active:scale-95 cursor-pointer"
                                            title="Retour à l'accueil"
                                        >
                                            <ChevronLeft className="w-5 h-5 text-blue-600 dark:text-blue-400" />
                                        </button>
                                        <div>
                                            <div className="flex items-center space-x-2 text-xs font-bold text-blue-600 dark:text-blue-400">
                                                <span>{selectedSchool}</span>
                                                <span className="text-slate-300 dark:text-slate-600">•</span>
                                                <span className="liquid-glass-pill px-2.5 py-0.5 rounded-md font-extrabold text-blue-700 dark:text-blue-300">{selectedClass}</span>
                                            </div>
                                            <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white mt-1">{selectedSubject}</h1>
                                        </div>
                                    </div>
                                    <div className="text-xs font-bold text-slate-700 dark:text-slate-200 liquid-glass-pill px-4 py-2 rounded-xl">

                                    </div>
                                </div>
                            </div>
                            {chaptersData.length === 0 ? (
                                <div className="liquid-glass rounded-3xl p-12 text-center text-slate-500 dark:text-slate-400">

                                    </button>
                                </div>

                                <div className="space-y-6">

                                            key={chap.name} 
                                            chapter={chap.name} 
                                            chapterCourses={chap.courses} 
                                            handleView={handleView} 
                                            tagColors={settings.tagColors} 
                                            favorites={favorites} 
                                            toggleFav={toggleFav} 
                                            onCopyCourse={copyCourseLink}
                                            onShareCourse={shareCourse}
                                            onSaveCourseToCloud={saveCourseToCloudDrive}
                                            onTakeNotesCourse={handleTakeNotesOnCourse}
                                        />
                                    ))}
                                </div>
                            )}

                            {/* Section "Vous ne trouvez pas le cours ?" en bas de chaque matière */}
                            <div className="liquid-glass-card rounded-3xl p-6 sm:p-8 mt-8 border border-blue-200/60 dark:border-blue-800/40 shadow-xl">

                                    <div className="flex items-center space-x-3.5">
                                        <div className="p-3.5 bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 rounded-2xl shrink-0 shadow-xs">
                                            <HelpCircle className="w-6 h-6" />

                                        <div>
                                            <h3 className="text-base sm:text-lg font-black text-slate-900 dark:text-white">
                                                Vous ne trouvez pas le cours en {selectedSubject} ?
                                            </h3>
                                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                                Proposez votre document pour l'ajouter à WorksBox ou contactez directement l'administration.
                                            </p>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => setShowSuggestDocumentModal(true)}

                                    >
                                        <UploadCloud className="w-4 h-4" />
                                        <span>Suggérer un document</span>
                                    </button>
                                </div>

                                    <div 
                                        onClick={() => setShowSuggestDocumentModal(true)}
                                        className="p-4 bg-slate-50 dark:bg-slate-800/60 hover:bg-blue-50/80 dark:hover:bg-blue-950/40 border border-slate-200/80 dark:border-slate-700/80 hover:border-blue-400 dark:hover:border-blue-600 rounded-2xl transition-all cursor-pointer group space-y-2"
                                    >
                                        <div className="flex items-center justify-between">
                                            <span className="inline-flex items-center px-2.5 py-1 bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 text-[10px] font-black rounded-lg">
                                                Option 1
                                            </span>
                                            <ChevronRight className="w-4 h-4 text-slate-400 group-hover:text-blue-500 transition-transform group-hover:translate-x-1" />
                                        </div>
                                        <strong className="block text-sm font-extrabold text-slate-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                                            📄 Vous possédez le document
                                        </strong>
                                        <p className="text-xs text-slate-500 dark:text-slate-400">
                                            Téléversez votre cours, TP ou fiche PDF. L'administrateur recevra une notification automatique pour l'ajouter.
                                        </p>
                                    </div>

                                    {/* Option 2 : Demander l'ajout d'un cours à l'administrateur */}
                                    <div 
                                        onClick={() => setShowSuggestDocumentModal(true)}
                                        className="p-4 bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-50/80 dark:hover:bg-indigo-950/40 border border-slate-200/80 dark:border-slate-700/80 hover:border-indigo-400 dark:hover:border-indigo-600 rounded-2xl transition-all cursor-pointer group space-y-2"
                                    >
                                        <div className="flex items-center justify-between">
                                            <span className="inline-flex items-center px-2.5 py-1 bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 text-[10px] font-black rounded-lg">
                                                Option 2
                                            </span>
                                            <ChevronRight className="w-4 h-4 text-slate-400 group-hover:text-indigo-500 transition-transform group-hover:translate-x-1" />
                                        </div>
                                        <strong className="block text-sm font-extrabold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
                                            ✉️ Demander l'ajout d'un cours
                                        </strong>
                                        <p className="text-xs text-slate-500 dark:text-slate-400">
                                            Transmettez une demande de cours à l'administration. Elle apparaîtra directement dans le panel d'administration WorksBox.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        )}

                        {currentView === 'software' && (
                          <SoftwareHubView 
                              notesList={notesList}
                              cloudFiles={cloudFiles}
                              cloudStorageUsed={cloudStorageUsed}
                              favorites={favorites}
                              courses={courses}
                              activeUser={activeUser}
                              driveToken={driveToken}
                              onCreateNewNote={createNewNote}
                              onOpenNote={openNoteInEditor}
                              onOpenCloud={() => openProfile('cloud')}
                              onOpenCasioGuide={openCasioGuide}
                              onGoHome={goHome}
                              onOpenFavorites={() => openProfile('favorites')}
                              onShowAuthModal={() => setShowAuthModal(true)}
                              showToast={showToast}
                          />
                        )}

                        {currentView === 'casioGuide' && (
                          <div key="view-casioGuide" className="space-y-8 max-w-4xl mx-auto view-transition">
                            <h1 className="text-3xl font-black text-slate-900 dark:text-white flex items-center"><HelpCircle className="w-8 h-8 text-blue-600 dark:text-blue-400 mr-4"/> Tuto Casio Graph 35+EII</h1>
                            <div 
                                className="liquid-glass rounded-3xl p-8 space-y-6 text-slate-700 dark:text-slate-200 whitespace-pre-line leading-relaxed text-sm sm:text-base shadow-xl"
                                dangerouslySetInnerHTML={{ __html: settings.casioGuideContent || DEFAULT_CASIO_FALLBACK }}
                            />
                          </div>
                        )}

                        {currentView === 'terms' && (
                          <div key="view-terms" className="space-y-8 max-w-4xl mx-auto view-transition">
                            <h1 className="text-3xl font-black text-slate-900 dark:text-white flex items-center"><Shield className="w-8 h-8 text-blue-600 dark:text-blue-400 mr-4"/> Conditions d'utilisations</h1>
                            <div 
                                className="liquid-glass rounded-3xl p-8 space-y-6 text-slate-700 dark:text-slate-200 whitespace-pre-line leading-relaxed text-sm sm:text-base shadow-xl"
                                dangerouslySetInnerHTML={{ __html: settings.termsContent || DEFAULT_TERMS_FALLBACK }}
                            />
                          </div>
                        )}

                        {currentView === 'noteEditor' && (
                          <div key="view-noteEditor" className="w-full">
                            <WorksBoxNoteEditor 
                                note={activeNote || { title: 'Nouvelle note', content: '<h1>Nouvelle note</h1><p>Commencez à rédiger vos notes ou cours ici...</p>', subject: activeSubjects?.[0]?.name || 'Général', folderName: 'WorksBox Cloud' }}
                                activeSubjects={activeSubjects}
                                cloudBreadcrumbs={cloudBreadcrumbs}
                                cloudFiles={cloudFiles}
                                onCreateCloudFolder={createCloudFolder}
                                driveToken={driveToken}
                                activeUser={activeUser}
                                autosaveStatus={noteAutosaveStatus}
                                lastSavedTime={noteLastSavedTime}
                                notesList={notesList}
                                onSave={saveNoteDirectly}
                                onClose={goHome}
                                onDelete={deleteNote}
                                onCreateNew={createNewNote}
                                onOpenNote={openNoteInEditor}
                                onExportPDF={exportNotePDF}
                                onExportFile={exportNoteFile}
                                showToast={showToast}
                            />
                          </div>
                        )}
                    </>
                )}
              </main>

              <footer className={`mt-20 border-t border-white/40 dark:border-white/10 py-8 text-center text-xs text-slate-500 dark:text-slate-400 ${currentView === 'noteEditor' ? 'w-full px-4 sm:px-8' : 'max-w-7xl mx-auto px-4'} flex flex-col sm:flex-row items-center justify-between gap-3 transition-colors`}>
                  <span>WorksBox — Cours & Ressources pour Lycées</span>
                  <div className="flex items-center space-x-4">
                      <button onClick={openTerms} className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors cursor-pointer">Conditions</button>
                      <span>•</span>
                      <button onClick={openCasioGuide} className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors cursor-pointer">Tuto Casio</button>
                      <span>•</span>
                      <a href="admin.html" className="hover:text-blue-600 dark:hover:text-blue-400 font-bold transition-colors flex items-center">Administration</a>
                  </div>
              </footer>

              {previewData && (
                  <PreviewModal 
                      data={previewData} 
                      onClose={() => setPreviewData(null)} 
                      onCopy={(link, title) => copyToClipboard(link, title ? `Lien de « ${title} » copié !` : "Lien copié dans le presse-papiers !")}
                      onShare={previewData.course ? () => shareCourse(previewData.course) : undefined}
                      onTakeNotes={previewData.course ? () => { setPreviewData(null); handleTakeNotesOnCourse(previewData.course); } : undefined}
                      onSaveToCloud={
                          previewData.course 
                              ? () => saveCourseToCloudDrive(previewData.course) 
                              : (previewData.sharedFile ? () => saveSharedFileToPersonalCloud(previewData.sharedFile) : undefined)
                      }
                  />
              )}

              {showAuthModal && (
                  <AuthModal 
                      onClose={() => { setShowAuthModal(false); setAuthError(null); }} 
                      onGoogleSignIn={handleGoogleSignIn}
                      onLocalSignIn={handleLocalSignIn}
                      isLoading={authLoading}
                      error={authError}
                      onToast={showToast}
                  />
              )}

              {showProfileSetupModal && (
                  <ProfileCompletionModal 
                      user={pendingSetupUser || user || activeUser}
                      initialProfile={userProfile}
                      schools={settings.schools || DEFAULT_SCHOOLS}
                      classes={settings.classes || DEFAULT_CLASSES}
                      onSaveProfile={handleSaveCompletedProfile}
                      onClose={() => {
                          if (userProfile?.setupCompleted) {
                              setShowProfileSetupModal(false);
                          } else {
                              setShowProfileSetupModal(false);
                              showToast("Note : La configuration du profil personnalisera vos accès sur WorksBox.", "info", "info");
                          }
                      }}
                  />
              )}

              {showSuggestDocumentModal && (
                  <SuggestDocumentModal 
                      subject={selectedSubject || 'Général'}
                      school={selectedSchool || 'Lycée François Bazin'}
                      classe={selectedClass || 'Terminale STI2D'}
                      activeUser={activeUser}
                      onClose={() => setShowSuggestDocumentModal(false)}
                      onToast={showToast}
                  />
              )}

              {showAccountModal && activeUser && (
                  <AccountModal 
                      user={activeUser}
                      profile={userProfile}
                      isAdmin={isUserAdmin}
                      selectedSchool={selectedSchool}
                      selectedClass={selectedClass}
                      favoritesCount={favorites.length}
                      onOpenFavorites={() => { setShowAccountModal(false); openFavorites(); }}
                      onChangeSchoolClass={() => { setShowAccountModal(false); setShowOnboarding(true); }}
                      onEditProfile={() => { setShowAccountModal(false); setShowProfileSetupModal(true); }}
                      onUpgradeToGoogle={() => { setShowAccountModal(false); setShowAuthModal(true); }}
                      onSignOut={handleSignOut}
                      onClose={() => setShowAccountModal(false)}
                  />
              )}

              {/* Barre de progression de téléversement en temps réel */}
              {uploadProgress?.active && (
                  <UploadProgressWidget 
                      progress={uploadProgress} 
                      onDismiss={() => setUploadProgress(null)} 
                  />
              )}

              {/* Modal de Confirmation Générique Non-Bloquante */}
              {genericConfirmModal && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xl animate-in fade-in duration-200">
                      <div className="liquid-glass rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-4 animate-in zoom-in-95 duration-200">
                          <div className="flex items-center space-x-3">
                              <div className="p-3 bg-red-500/20 text-red-600 dark:text-red-400 rounded-2xl shrink-0 border border-red-400/30">
                                  <Trash2 className="w-5 h-5" />
                              </div>
                              <div>
                                  <h3 className="font-bold text-slate-900 dark:text-white text-base">{genericConfirmModal.title || 'Confirmation'}</h3>
                                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Cette action est irréversible</p>
                              </div>
                          </div>
                          <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line">{genericConfirmModal.message}</p>
                          <div className="flex justify-end space-x-2 pt-2">
                              <button
                                  onClick={() => setGenericConfirmModal(null)}
                                  className="px-4 py-2 text-xs font-bold liquid-glass-btn rounded-xl text-slate-700 dark:text-slate-300 transition cursor-pointer"
                              >
                                  Annuler
                              </button>
                              <button
                                  onClick={() => {
                                      const cb = genericConfirmModal.onConfirm;
                                      setGenericConfirmModal(null);
                                      if (cb) cb();
                                  }}
                                  className="px-4 py-2 text-xs font-bold bg-red-600 hover:bg-red-700 text-white rounded-xl shadow-sm transition cursor-pointer"
                              >
                                  {genericConfirmModal.confirmText || 'Supprimer'}
                              </button>
                          </div>
                      </div>
                  </div>
              )}

              {/* Modal de Création de Dossier WorksBox Cloud */}
              {showNewFolderModal && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xl animate-in fade-in duration-200">
                      <div className="liquid-glass rounded-3xl shadow-2xl max-w-md w-full p-6 sm:p-8 space-y-5 animate-in zoom-in-95 duration-200">
                          <div className="flex items-center space-x-3">
                              <div className="p-3 bg-sky-500/20 text-sky-600 dark:text-sky-400 rounded-2xl shrink-0 border border-sky-400/30">
                                  <FolderPlus className="w-6 h-6" />
                              </div>
                              <div>
                                  <h3 className="font-black text-slate-900 dark:text-white text-lg">Nouveau dossier Cloud</h3>
                                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                      Créer dans : <strong>{cloudBreadcrumbs[cloudBreadcrumbs.length - 1]?.name || 'WorksBox Cloud'}</strong>
                                  </p>
                              </div>
                          </div>
                          <form onSubmit={(e) => { e.preventDefault(); createCloudFolder(newFolderNameInput); }} className="space-y-4">
                              <div>
                                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-1.5">
                                      Nom du dossier
                                  </label>
                                  <input 
                                      type="text" 
                                      value={newFolderNameInput} 
                                      onChange={(e) => setNewFolderNameInput(e.target.value)} 
                                      placeholder="Ex: Mathématiques, Physique-Chimie, Fiches BAC..." 
                                      required 
                                      autoFocus
                                      className="w-full px-4 py-3 liquid-glass-input rounded-xl text-sm font-semibold outline-none text-slate-900 dark:text-white"
                                  />
                              </div>
                              <div className="flex justify-end space-x-2 pt-2">
                                  <button
                                      type="button"
                                      onClick={() => { setShowNewFolderModal(false); setNewFolderNameInput(''); }}
                                      className="px-4 py-2.5 text-xs font-bold liquid-glass-btn rounded-xl text-slate-700 dark:text-slate-300 transition cursor-pointer"
                                  >
                                      Annuler
                                  </button>
                                  <button

                      <span className="text-[10px] truncate max-w-[50px]">{activeUser ? (activeUser.displayName?.split(' ')[0] || 'Profil') : 'Connexion'}</span>
                  </button>
              </div>

              {/* Tiroir Modal Mobile (Bottom Sheet) pour Accès Rapide & Outils Dédiés */}
              {showMobileMenu && (
                  <div className="lg:hidden fixed inset-0 z-50 flex flex-col justify-end bg-slate-950/70 backdrop-blur-md animate-in fade-in duration-200">

                          {/* Barre de poignée (Drag handle) */}
                          <div className="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto" />
