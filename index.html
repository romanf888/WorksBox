            return null;
        }

        // === ÉDITEUR DE COURS & BLOC-NOTES ÉLÈVE : WORKSBOX NOTE AVEC ONGLETS ===
        function WorksBoxNoteEditor({ 
            note, 
            activeSubjects = [], 
            cloudBreadcrumbs = [], 
            cloudFiles = [],
            onCreateCloudFolder,
            driveToken, 
            activeUser, 
            autosaveStatus, 
            lastSavedTime, 
            notesList = [], 
            onSave, 
            onClose, 
            onDelete, 
            onCreateNew, 
            onOpenNote, 
            onOpenProfile,
            onOpenCloud,
            onExportPDF, 
            onExportFile,
            onOpenLogin,
            showToast 
        }) {
            const cleanInitialTitle = (t) => {
                if (!t || typeof t !== 'string' || t === '[object Object]') return 'Note de cours';
                return t;
            };
            const [title, setTitle] = useState(cleanInitialTitle(note?.title));
            const [subject, setSubject] = useState(note?.subject || (activeSubjects[0]?.name || 'Général'));
            const [chapter, setChapter] = useState(note?.chapter || '');
            const [selectedFolder, setSelectedFolder] = useState(note?.folderName || 'WorksBox Cloud');
            const [wordCount, setWordCount] = useState(0);
            const [charCount, setCharCount] = useState(0);
            const [readingTimeMinutes, setReadingTimeMinutes] = useState(1);
            
            // Onglets thématiques pour organiser les outils de cours
            const [activeNoteTab, setActiveNoteTab] = useState('redaction'); // 'redaction', 'cours', 'mise-en-page', 'organisation'
            
            const [showNotesDrawer, setShowNotesDrawer] = useState(false);
            const [showFolderModal, setShowFolderModal] = useState(false);
            const [showExportModal, setShowExportModal] = useState(false);
            const [paperStyle, setPaperStyle] = useState('plain'); // 'plain', 'lined', 'grid'
            const [fontSize, setFontSize] = useState('base'); // 'sm', 'base', 'lg'
            const [fontFamily, setFontFamily] = useState('sans'); // 'sans', 'serif', 'mono'
            const [lineSpacing, setLineSpacing] = useState('relaxed'); // 'normal', 'relaxed', 'loose'
            const [searchFilter, setSearchFilter] = useState('');

            const editorRef = React.useRef(null);
            const saveDebounceRef = React.useRef(null);
            const noteContentRef = React.useRef(note?.content || '');

            useEffect(() => {
                if (note) {
                    setTitle(cleanInitialTitle(note.title));
                    setSubject(note.subject || (activeSubjects[0]?.name || 'Général'));
                    setChapter(note.chapter || '');
                    setSelectedFolder(note.folderName || 'WorksBox Cloud');
                    let contentStr = (typeof note.content === 'string') ? note.content : '';
                    if (contentStr.includes('[object Object]')) {
                        contentStr = contentStr.replace(/\[object Object\]/g, cleanInitialTitle(note.title));
                    }
                    noteContentRef.current = contentStr;
                    if (editorRef.current) {
                        editorRef.current.innerHTML = contentStr || '<p><br></p>';
                        calculateCounts(contentStr);
                    }
                }
            }, [note?.id]);

            useEffect(() => {
                if (editorRef.current) {
                    if (!editorRef.current.innerHTML || editorRef.current.innerHTML.trim() === '') {
                        editorRef.current.innerHTML = noteContentRef.current || '<p><br></p>';
                    }
                    calculateCounts(editorRef.current.innerHTML);
                    setTimeout(() => {
                        try {
                            editorRef.current?.focus();
                        } catch (e) {}
                    }, 50);
                }
            }, [note?.id]);

            const calculateCounts = (html) => {
                const text = (html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
                const chars = text.length;
                const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
                setCharCount(chars);
                setWordCount(words);
                setReadingTimeMinutes(Math.max(1, Math.ceil(words / 180)));
            };

            const triggerAutoSave = (updatedHtml, customTitle = title, customSubj = subject, customChap = chapter, customFolder = selectedFolder) => {
                calculateCounts(updatedHtml);
                if (saveDebounceRef.current) clearTimeout(saveDebounceRef.current);
                saveDebounceRef.current = setTimeout(() => {
                    const payload = {
                        ...note,
                        title: customTitle,
                        subject: customSubj,
                        chapter: customChap,
                        content: updatedHtml,
                        folderName: customFolder,
                        updatedAt: new Date().toISOString()
                    };
                    onSave(payload, true);
                }, 800);
            };

            const handleManualSave = () => {
                if (editorRef.current) {
                    const payload = {
                        ...note,
                        title: title,
                        subject: subject,
                        chapter: chapter,
                        content: editorRef.current.innerHTML,
                        folderName: selectedFolder,
                        updatedAt: new Date().toISOString()
                    };
                    onSave(payload, false);
                    if (showToast) showToast('Note de cours enregistrée !', 'success');
                }
            };

            const handleEditorInput = () => {
                if (!editorRef.current) return;
                triggerAutoSave(editorRef.current.innerHTML);
            };

            const exec = (cmd, val = null) => {
                document.execCommand(cmd, false, val);
                if (editorRef.current) {
                    editorRef.current.focus();
                    triggerAutoSave(editorRef.current.innerHTML);
                }
            };

            const insertHtmlSnippet = (snippet) => {
                if (window.getSelection) {
                    const sel = window.getSelection();
                    if (sel.getRangeAt && sel.rangeCount) {
                        let range = sel.getRangeAt(0);
                        range.deleteContents();
                        const el = document.createElement("div");
                        el.innerHTML = snippet;
                        const frag = document.createDocumentFragment();
                        let node, lastNode;
                        while ((node = el.firstChild)) {
                            lastNode = frag.appendChild(node);
                        }
                        range.insertNode(frag);
                        if (lastNode) {
                            range = range.cloneRange();
                            range.setStartAfter(lastNode);
                            range.collapse(true);
                            sel.removeAllRanges();
                            sel.addRange(range);
                        }
                    }
                } else {
                    document.execCommand('insertHTML', false, snippet);
                }
                if (editorRef.current) {
                    editorRef.current.focus();
                    triggerAutoSave(editorRef.current.innerHTML);
                }
            };

            // Blocs pédagogiques et typographiques pour le cours
            const insertCourseCallout = (type) => {
                let html = '';
                if (type === 'definition') {
                    html = `<div class="course-callout" style="background:#eff6ff; border-left:4px solid #3b82f6; padding:12px 16px; border-radius:8px; margin:16px 0;"><strong style="color:#1d4ed8; font-size:13px; display:block; margin-bottom:4px;">📘 DÉFINITION :</strong><span style="color:#1e293b;">Écrire ici la définition exacte du cours...</span></div><p><br></p>`;
                } else if (type === 'formula') {
                    html = `<div class="course-callout" style="background:#fef3c7; border-left:4px solid #f59e0b; padding:12px 16px; border-radius:8px; margin:16px 0;"><strong style="color:#b45309; font-size:13px; display:block; margin-bottom:4px;">⚡ FORMULE / THÉORÈME :</strong><span style="color:#1e293b; font-family:monospace; font-weight:600; font-size:14px;">f'(x) = 2ax + b</span></div><p><br></p>`;
                } else if (type === 'remember') {
                    html = `<div class="course-callout" style="background:#ecfdf5; border-left:4px solid #10b981; padding:12px 16px; border-radius:8px; margin:16px 0;"><strong style="color:#047857; font-size:13px; display:block; margin-bottom:4px;">💡 À RETENIR POUR L'ÉPREUVE :</strong><span style="color:#1e293b;">Point méthodologique clé ou astuce de révision...</span></div><p><br></p>`;
                } else if (type === 'warning') {
                    html = `<div class="course-callout" style="background:#fef2f2; border-left:4px solid #ef4444; padding:12px 16px; border-radius:8px; margin:16px 0;"><strong style="color:#b91c1c; font-size:13px; display:block; margin-bottom:4px;">⚠️ PIÈGE FRÉQUENT :</strong><span style="color:#1e293b;">Attention aux conditions d'application, signes et unités...</span></div><p><br></p>`;
                } else if (type === 'example') {
                    html = `<div class="course-callout" style="background:#f5f3ff; border-left:4px solid #8b5cf6; padding:12px 16px; border-radius:8px; margin:16px 0;"><strong style="color:#6d28d9; font-size:13px; display:block; margin-bottom:4px;">🔍 EXEMPLE D'APPLICATION :</strong><span style="color:#1e293b;">Soit la fonction définie par...</span></div><p><br></p>`;
                } else if (type === 'date') {
                    const todayStr = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                    html = `<p style="color:#64748b; font-size:12px; font-weight:600; margin:10px 0; border-bottom:1px dashed #cbd5e1; padding-bottom:4px;">📅 Séance du ${todayStr}</p>`;
                } else if (type === 'table') {
                    html = `<table style="width:100%; border-collapse:collapse; margin:16px 0;"><thead><tr><th style="border:1px solid #cbd5e1; padding:8px 12px; background:#f1f5f9; text-align:left;">Élément</th><th style="border:1px solid #cbd5e1; padding:8px 12px; background:#f1f5f9; text-align:left;">Propriété</th><th style="border:1px solid #cbd5e1; padding:8px 12px; background:#f1f5f9; text-align:left;">Remarques</th></tr></thead><tbody><tr><td style="border:1px solid #cbd5e1; padding:8px 12px;">Cas 1</td><td style="border:1px solid #cbd5e1; padding:8px 12px;">Valeur A</td><td style="border:1px solid #cbd5e1; padding:8px 12px;">-</td></tr><tr><td style="border:1px solid #cbd5e1; padding:8px 12px;">Cas 2</td><td style="border:1px solid #cbd5e1; padding:8px 12px;">Valeur B</td><td style="border:1px solid #cbd5e1; padding:8px 12px;">-</td></tr></tbody></table><p><br></p>`;
                } else if (type === 'hr') {
                    html = `<hr style="border:none; border-top:1.5px solid #cbd5e1; margin:20px 0;"><p><br></p>`;
                }
                insertHtmlSnippet(html);
            };

            const availableFolders = useMemo(() => {
                const set = new Set(['WorksBox Cloud', 'Mathématiques', 'Physique-Chimie', 'NSI', 'SVT', 'Histoire-Géo', 'Français', 'Philosophie', 'Anglais']);
                (cloudFiles || []).filter(f => f.mimeType === 'application/vnd.google-apps.folder').forEach(f => set.add(f.name));
                return Array.from(set);
            }, [cloudFiles]);

            const filteredNotes = useMemo(() => {
                if (!searchFilter.trim()) return notesList;
                const q = searchFilter.toLowerCase();
                return notesList.filter(n => (n.title || '').toLowerCase().includes(q) || (n.subject || '').toLowerCase().includes(q));
            }, [notesList, searchFilter]);

            // Fonction dédiée pour déclencher l'impression et export PDF propre
            const handlePrintOrPDF = () => {
                const notePayload = {
                    ...note,
                    title: title,
                    subject: subject,
                    chapter: chapter,
                    content: editorRef.current ? editorRef.current.innerHTML : note?.content,
                    folderName: selectedFolder
                };
                if (onExportPDF) {
                    onExportPDF(notePayload);

                    window.print();
                }
            };

            return (
                <div className="w-full min-h-[calc(100vh-4rem)] bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col font-sans transition-colors antialiased">
                    
                    {/* === EN-TÊTE DU BLOC-NOTES AVEC STATUT & ACTIONS PRINCIPALES === */}
                    <header className="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-3 sm:px-6 py-2.5 transition-colors shadow-xs no-print">
                        <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">

        function UploadProgressWidget({ progress, onDismiss }) {
            if (!progress || !progress.active) return null;

            const isDone = progress.stage === 'success';
            const isError = progress.stage === 'error';
            const isProcessing = progress.stage === 'processing';
            const percentValue = Math.round(progress.percent !== undefined ? progress.percent : (progress.percentage || 0));
            const loadedMb = ((progress.loadedBytes || 0) / (1024 * 1024)).toFixed(1);
            const totalMb = ((progress.totalBytes || 0) / (1024 * 1024)).toFixed(1);
            const errorText = progress.errorMsg || progress.errorMessage || 'Une erreur est survenue';

            return (
                <div 
                    id="upload-progress-widget"
                    className="fixed bottom-6 right-6 z-[120] max-w-sm w-full p-4 bg-slate-900/95 dark:bg-slate-900/95 text-white border border-slate-700/80 rounded-3xl shadow-2xl backdrop-blur-md animate-in fade-in slide-in-from-bottom-6 duration-300"
                >
                    <div className="space-y-3">
                        <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center space-x-2.5 min-w-0">
                                <div className={`p-2 rounded-xl flex-shrink-0 ${
                                    isDone 
                                        ? 'bg-emerald-500/20 text-emerald-400' 
                                        : isError 
                                            ? 'bg-rose-500/20 text-rose-400' 
                                            : 'bg-indigo-500/20 text-indigo-400 animate-pulse'
                                }`}>
                                    {isDone ? (
                                        <Check className="w-5 h-5" />
                                    ) : isError ? (
                                        <AlertCircle className="w-5 h-5" />
                                    ) : (
                                        <UploadCloud className="w-5 h-5 animate-bounce" />
                                    )}
                                </div>
                                <div className="min-w-0">
                                    <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 block">
                                        {progress.target === 'shared' ? 'Cloud Partagé' : 'Mon Cloud Personnel'}
                                    </span>
                                    <h4 className="text-xs sm:text-sm font-bold text-slate-100 truncate">
                                        {progress.fileName || 'Fichier en cours...'}
                                    </h4>
                                </div>
                            </div>

                            {(isDone || isError) && (
                                <button 
                                    onClick={onDismiss}
                                    className="p-1 text-slate-400 hover:text-white hover:bg-white/10 rounded-lg transition"
                                >
                                    <X className="w-4 h-4" />
                                </button>
                            )}
                        </div>

                        {/* Barre de chargement avec animation */}
                        <div className="space-y-1.5">
                            <div className="flex justify-between items-center text-xs">
                                <span className="font-semibold text-slate-300">
                                    {isDone 
                                        ? 'Importation terminée !' 
                                        : isError 
                                            ? 'Échec de l\'envoi' 
                                            : isProcessing 
                                                ? 'Finalisation & Indexation...' 
                                                : 'Téléversement en cours...'}
                                </span>
                                <span className="font-black text-indigo-400">
                                    {percentValue} %
                                </span>
                            </div>

                            <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700">
                                <div 
                                    className={`h-full rounded-full transition-all duration-300 ${
                                        isDone 
                                            ? 'bg-gradient-to-r from-emerald-500 to-teal-400' 
                                            : isError 
                                                ? 'bg-rose-500' 
                                                : 'bg-gradient-to-r from-indigo-500 via-sky-400 to-emerald-400'
                                    }`}
                                    style={{ width: `${Math.max(4, Math.min(100, percentValue))}%` }}
                                ></div>
                            </div>
                        </div>

                        {/* Détail du poids téléversé */}
                        <div className="flex items-center justify-between text-[11px] text-slate-400 pt-0.5">
                            <span>
                                {progress.totalBytes > 0 ? `${loadedMb} Mo / ${totalMb} Mo` : 'Calcul de la taille...'}
                            </span>
                            {isProcessing && (
                                <span className="text-sky-400 font-bold flex items-center">
                                    <RefreshCw className="w-3 h-3 mr-1 animate-spin" />
                                    Synchronisation Drive
                                </span>
                            )}
                        </div>

                        {isError && (
                            <p className="text-[11px] text-rose-300 bg-rose-950/60 p-2 rounded-xl border border-rose-800/60">
                                {errorText}
                            </p>
                        )}
                    </div>
                </div>
            );
        }

        function Toast({ toast, onClose }) {
            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => {
                    onClose();
                }, 3200);
                return () => clearTimeout(timer);
            }, [toast?.id, onClose]);

            if (!toast) return null;

            return (
                <div 
                    id="toast-notification"
                    role="status"
                    aria-live="polite"
                    className="fixed bottom-6 inset-x-0 z-[100] flex justify-center px-4 pointer-events-none"
                >
                    <div className="pointer-events-auto max-w-md w-full sm:w-auto flex items-center space-x-3 px-4 py-3 sm:px-5 sm:py-3.5 bg-slate-900/95 dark:bg-slate-800/95 text-white border border-slate-700/80 dark:border-slate-600/80 rounded-2xl shadow-2xl backdrop-blur-md transition-all animate-in fade-in slide-in-from-bottom-5 duration-300">
                        <div className="flex-shrink-0">
                            {toast.icon === 'star' && (
                                <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
                                    <Star className="w-4 h-4" filled={true} />
                                </div>
                            )}
                            {toast.icon === 'copy' && (
                                <div className="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center">
                                    <Copy className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'check' && (
                                <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                    <Check className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'warning' && (
                                <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
                                    <AlertCircle className="w-4 h-4" />
                                </div>
                            )}
                            {toast.icon === 'info' && (
                                <div className="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center">
                                    <FileText className="w-4 h-4" />
                                </div>
                            )}
                            {!toast.icon && (
                                <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                    <Check className="w-4 h-4" />
                                </div>
                            )}
                        </div>
                        <div className="flex-1 min-w-0 pr-1">
                            <p className="text-xs sm:text-sm font-semibold leading-tight break-words text-slate-100">
                                {typeof toast.message === 'string' ? toast.message : ''}
                            </p>
                        </div>
                        <button
                            id="btn-toast-close"
                            onClick={onClose}
                            className="flex-shrink-0 p-1 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
                            title="Fermer la notification"
                        >
                            <X className="w-4 h-4" />
                        </button>
                    </div>
                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.warn("WorksBox ErrorBoundary caught error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
                            <div className="max-w-md w-full bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 text-center space-y-4">
                                <div className="w-14 h-14 bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 rounded-2xl flex items-center justify-center mx-auto">
                                    <AlertCircle className="w-8 h-8" />
                                </div>
                                <h2 className="text-xl font-black">Une interruption temporaire est survenue</h2>
                                <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                                    L'application a rencontré une anomalie d'affichage. Vous pouvez recharger la page pour continuer votre navigation.
                                </p>
                                <button
                                    onClick={() => {
                                        this.setState({ hasError: false, error: null });
                                        window.location.reload();
                                    }}
                                    className="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition shadow-sm"
                                >
                                    Actualiser la page
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
