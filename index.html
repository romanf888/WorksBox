    <!-- Global error shield for cross-origin script noise and generator deoptimisation notes -->
    <script>
        (function() {
            const filterBabelMsg = (msg) => {
                if (typeof msg === 'string' && (msg.includes('deoptimised the styling') || msg.includes('exceeds the max of 500KB') || msg.includes('[BABEL] Note:'))) {
                    return true;
                }
                return false;
            };
            const origErr = console.error;
            const origWarn = console.warn;
            const origInfo = console.info;
            const origLog = console.log;
            console.error = function(...args) {
                if (args.some(filterBabelMsg)) return;
                origErr.apply(console, args);
            };
            console.warn = function(...args) {
                if (args.some(filterBabelMsg)) return;
                origWarn.apply(console, args);
            };
            console.info = function(...args) {
                if (args.some(filterBabelMsg)) return;
                origInfo.apply(console, args);
            };
            console.log = function(...args) {
                if (args.some(filterBabelMsg)) return;
                origLog.apply(console, args);
            };
        })();

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            if (msg === 'Script error.' || !msg) {
                return true;
            }
            if (typeof msg === 'string' && (msg.includes('deoptimised') || msg.includes('500KB') || msg.includes('[BABEL] Note:'))) {
                return true;
            }
        };
        window.addEventListener('error', function(e) {
            if (e.message === 'Script error.' || !e.message) {
                e.preventDefault && e.preventDefault();
                e.stopImmediatePropagation && e.stopImmediatePropagation();
            }
            if (typeof e.message === 'string' && (e.message.includes('deoptimised') || e.message.includes('500KB') || e.message.includes('[BABEL] Note:'))) {
                e.preventDefault && e.preventDefault();
                e.stopImmediatePropagation && e.stopImmediatePropagation();
            }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && (e.reason.message === 'Script error.' || String(e.reason).includes('Script error'))) {
                e.preventDefault && e.preventDefault();
                e.stopImmediatePropagation && e.stopImmediatePropagation();
            }
        });
    </script>

    <script>
        // Configuration de Babel Standalone pour supprimer les avertissements de dé-optimisation (> 500 Ko)
        if (window.Babel) {
            window.Babel.setPresetOptions && window.Babel.setPresetOptions('react', { runtime: 'classic' });
            const origTransform = window.Babel.transform;
            if (typeof origTransform === 'function') {
                window.Babel.transform = function(code, options) {
                    options = options || {};
                    options.compact = false;
                    return origTransform.call(this, code, options);
                };
            }
        }
    </script>

        .liquid-glass-pill {

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.85);

        .liquid-glass-input {

        /* Fluid View Transitions */
        @keyframes viewFadeSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .view-transition {
            animation: viewFadeSlide 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: opacity, transform;
        }

        /* Fluid Chapter Accordion */
        .chapter-accordion-grid {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease-out;
            opacity: 0;
        }

        .chapter-accordion-grid.expanded {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .chapter-accordion-inner {
            overflow: hidden;
            min-height: 0;
        }

        /* WorksBox Note modern scrollbars */
        .worksbox-ribbon-scroll {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.4) transparent;

        .worksbox-ribbon-scroll::-webkit-scrollbar {

        .dark .rich-doc-content * {

        .dark .rich-doc-content a {

        }
        .rich-doc-content a {

            background-color: #1e293b;

            border-color: #334155;
        }

        /* Styles d'impression haute qualité et export PDF pour WorksBox Note */
        @media print {
            /* Masquer l'interface globale, barres d'outils, navigation, boutons et tiroirs */
            header, nav, footer, .no-print, button, input, select, .worksbox-ribbon-scroll,

        /* Mobile Platform Native Feeling & Safe Area Padding */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .mobile-safe-bottom {
                padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
            }
            .mobile-bottom-dock {
                bottom: calc(0.75rem + env(safe-area-inset-bottom));
            }
            .mobile-content-pb {
                padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)) !important;
            }
        }
        @supports not (padding-bottom: env(safe-area-inset-bottom)) {
            .mobile-bottom-dock {
                bottom: 0.75rem;
            }
            .mobile-content-pb {
                padding-bottom: 5.5rem !important;
            }
        }

        /* Smooth momentum scrolling for mobile horizontal ribbons */
        .mobile-touch-scroll {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* Active touch scale animations for native feel */
        .touch-action-feedback:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }

        /* Generic Animation Helpers */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-in {
            animation-duration: 0.25s;
            animation-fill-mode: both;
            animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-in {
            animation-name: fadeIn;
        }

        @media (prefers-reduced-motion: reduce) {
            .view-transition,
            .animate-in,
            .chapter-accordion-grid {
                animation: none !important;
                transition: none !important;
                opacity: 1 !important;
            }
        }

        @keyframes skeleton-shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        .skeleton-shimmer-box {
            position: relative;
            overflow: hidden;
            background-color: #e2e8f0;
        }
        .dark .skeleton-shimmer-box {
            background-color: #1e293b;
        }
        .skeleton-shimmer-box::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.45) 45%,
                rgba(255, 255, 255, 0.75) 50%,
                rgba(255, 255, 255, 0.45) 55%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: skeleton-shimmer 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
            content: '';
        }
        .dark .skeleton-shimmer-box::after {
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.03) 45%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.03) 55%,
                rgba(255, 255, 255, 0) 100%
            );
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 selection:bg-blue-200 selection:text-blue-900 transition-colors duration-200">
    
    <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; font-family: system-ui, -apple-system, sans-serif; background-color: #0b0f19; color: #f8fafc;">
            <!-- Logo WorksBox SVG intégré : s'affiche instantanément à 100% sans requête réseau -->
            <svg viewBox="0 0 64 64" width="64" height="64" style="width: 64px; height: 64px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);">
                <defs>
                    <linearGradient id="initWbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6"/>

        // Fonction de nettoyage et de formatage des documentations (Conditions & Tutos) pour une lisibilité parfaite en mode sombre et clair
        const formatDocumentationContent = (rawContent) => {
            if (!rawContent) return '';
            let content = String(rawContent).trim();

            // Si le contenu contient déjà des balises HTML avec des styles sombres forcés (ex: style="color: black" ou #000)
            content = content
                .replace(/style\s*=\s*["'][^"']*(color\s*:\s*(#000|#111|#222|#333|black|rgb\(\s*0\s*,\s*0\s*,\s*0\s*\)))[^"']*["']/gi, '')
                .replace(/color\s*:\s*(#000000|#000|#111|#222|#333|#1e293b|#0f172a|black)/gi, 'inherit');

            // Si c'est du texte brut sans balises HTML complexes
            if (!content.includes('<p>') && !content.includes('<div>') && !content.includes('<h3>')) {
                const lines = content.split('\n');
                let formattedHtml = '';
                let inList = false;

                lines.forEach((line) => {
                    const trimmed = line.trim();
                    if (!trimmed) {
                        if (inList) {
                            formattedHtml += '</ul>';
                            inList = false;
                        }
                        formattedHtml += '<div class="h-3"></div>';
                        return;
                    }

                    // Titres numérotés ou questions : "1. Titre" ou "Comment ..."
                    if (/^[0-9]+[\.\)]\s+/.test(trimmed) || /^Comment\s+/i.test(trimmed)) {
                        if (inList) {
                            formattedHtml += '</ul>';
                            inList = false;
                        }
                        formattedHtml += `<h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-white mt-4 mb-2 flex items-center gap-2">${trimmed}</h3>`;
                    } else if (trimmed.startsWith('•') || trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                        if (!inList) {
                            formattedHtml += '<ul class="space-y-2 my-2.5 pl-2 list-none">';
                            inList = true;
                        }
                        const cleanItem = trimmed.replace(/^[•\-\*]\s*/, '');
                        formattedHtml += `<li class="flex items-start gap-2.5 text-slate-700 dark:text-slate-200"><span class="text-blue-500 font-bold mt-0.5">•</span><span>${cleanItem}</span></li>`;
                    } else {
                        if (inList) {
                            formattedHtml += '</ul>';
                            inList = false;
                        }
                        formattedHtml += `<p class="text-slate-700 dark:text-slate-200 leading-relaxed mb-2">${trimmed}</p>`;
                    }
                });

                if (inList) {
                    formattedHtml += '</ul>';
                }
                return formattedHtml;
            }

            return content;
        };

        // Normalisation avancée pour recherche insensible aux accents et à la casse
        const normalizeSearchText = (str) => {
            if (!str) return '';
            return str
                .toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        };

        // Composant de surlignage des termes recherchés dans les propositions
        function HighlightMatch({ text, query, className = "" }) {
            if (!text) return null;
            if (!query || !query.trim()) return <span className={className}>{text}</span>;
            
            try {
                const rawTokens = query
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase()
                    .split(/\s+/)
                    .filter(t => t.length > 0);
                
                if (rawTokens.length === 0) return <span className={className}>{text}</span>;

                const regexPatterns = rawTokens.map(token => {
                    const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    return escaped
                        .replace(/[aàáâãäå]/gi, '[aàáâãäå]')
                        .replace(/[eèéêë]/gi, '[eèéêë]')
                        .replace(/[iìíîï]/gi, '[iìíîï]')
                        .replace(/[oòóôõö]/gi, '[oòóôõö]')
                        .replace(/[uùúûü]/gi, '[uùúûü]')
                        .replace(/[cç]/gi, '[cç]');
                });

                const regex = new RegExp(`(${regexPatterns.join('|')})`, 'gi');
                const parts = String(text).split(regex);
                return (
                    <span className={className}>
                        {parts.map((part, i) => {
                            const isMatch = regex.test(part);
                            regex.lastIndex = 0;
                            return isMatch ? (
                                <span key={i} className="text-blue-600 dark:text-blue-400 font-extrabold underline decoration-blue-500/40 underline-offset-2">
                                    {part}
                                </span>
                            ) : (
                                <span key={i}>{part}</span>
                            );
                        })}
                    </span>
                );
            } catch (e) {
                return <span className={className}>{text}</span>;
            }
        }

          // Onglets du profil : 'overview' | 'favorites' | 'cloud' | 'sharedCloud'

          // Espace Cloud Google Drive Personnel (1 Go max par élève) avec persistance permanente

          const [driveToken, setDriveToken] = useState(() => {

          // Système WorksBox Note (Éditeur de cours & prise de notes avec sauvegarde Cloud automatique)

          const [activeNote, setActiveNote] = useState(null);

          const [cloudLoading, setCloudLoading] = useState(false);
          const [cloudUploading, setCloudUploading] = useState(false);
          const [cloudSearchQuery, setCloudSearchQuery] = useState('');
          const [favoritesSearchQuery, setFavoritesSearchQuery] = useState('');
          const [driveApiError, setDriveApiError] = useState(null);

          // Synchronisation bidirectionnelle et persistante avec Firestore (permet le multi-navigateurs & temps réel)
          const syncUserDataToFirestore = async (updates) => {
              const targetUser = user || activeUser;
              if (!userDb || !targetUser || targetUser.isLocal || targetUser.isAnonymous) return;
              try {
                  const userRef = doc(userDb, 'users', targetUser.uid);
                  const payload = {
                      updatedAt: new Date().toISOString()
                  };
                  if (updates.cloudFiles !== undefined) {
                      // Nettoyage et sécurisation des fichiers pour respecter la limite Firestore (1 Mo / doc)
                      payload.cloudFiles = updates.cloudFiles.map(f => {
                          const safe = {
                              id: f.id,
                              name: f.name || 'document',
                              size: f.size || 0,
                              mimeType: f.mimeType || 'application/octet-stream',
                              modifiedTime: f.modifiedTime || new Date().toISOString(),
                              createdTime: f.createdTime || new Date().toISOString(),
                              parents: f.parents || [],
                              webViewLink: f.webViewLink || null,
                              webContentLink: f.webContentLink || null,
                              folderId: f.folderId || null,
                              folderName: f.folderName || null
                          };
                          if (f.content && typeof f.content === 'string' && f.content.length < 50000) {
                              safe.content = f.content;
                          }
                          // Si dataUrl raisonnable (< 250 Ko), on le conserve dans Firestore pour téléchargement direct
                          if (f.dataUrl && typeof f.dataUrl === 'string' && f.dataUrl.length < 250000) {
                              safe.dataUrl = f.dataUrl;
                          }
                          return safe;
                      });
                  }
                  if (updates.cloudStorageUsed !== undefined) {

                  if (updates.notesList !== undefined) {
                      payload.notesList = updates.notesList;

                  if (updates.driveToken !== undefined) {

                  if (updates.driveLinked !== undefined) {
                      payload.driveLinked = updates.driveLinked;

                  await setDoc(userRef, payload, { merge: true });
              } catch (err) {
                  console.warn('Erreur synchronisation Cloud Firestore :', err);
              }
          };

          // Synchronisation du jeton Drive avec le localStorage et Firestore pour éviter de redemander la liaison à chaque F5
          const updateDriveToken = (token) => {
              setDriveToken(token);
              try {
                  if (token) {
                      localStorage.setItem('worksbox_drive_token', token);
                      localStorage.setItem('worksbox_drive_token_saved_at', Date.now().toString());
                      syncUserDataToFirestore({ driveToken: token, driveLinked: true });
                  } else {
                      localStorage.removeItem('worksbox_drive_token');
                      localStorage.removeItem('worksbox_drive_token_saved_at');
                  }
              } catch (e) {}
          };

          // État de progression en temps réel pour l'upload (Barre de chargement)
          const [uploadProgress, setUploadProgress] = useState(null);
          // { active: boolean, fileName: string, percent: number, loadedBytes: number, totalBytes: number, stage: 'uploading'|'processing'|'success'|'error', errorMsg?: string, target: 'personal'|'shared' }

          // Modal de confirmation personnalisée non bloquante pour iframe
          const [genericConfirmModal, setGenericConfirmModal] = useState(null); // { title, message, onConfirm, confirmText }

          // Espace Cloud Partagé de l'Établissement (administré par l'Admin)
          const [sharedCloudFiles, setSharedCloudFiles] = useState([]);
          const [sharedCloudSearchQuery, setSharedCloudSearchQuery] = useState('');
          const [sharedCloudCategory, setSharedCloudCategory] = useState('Tout');

          const [sharedCloudConfig, setSharedCloudConfig] = useState(() => {
              try {
                  const s = localStorage.getItem('worksbox_shared_config');
                  if (s) return { ...DEFAULT_SHARED_CLOUD_CONFIG, ...JSON.parse(s) };
              } catch(e) {}
              return DEFAULT_SHARED_CLOUD_CONFIG;
          });

          useEffect(() => {
              if (settings && settings.sharedCloudConfig) {
                  setSharedCloudConfig(prev => ({ ...prev, ...settings.sharedCloudConfig }));
              }
          }, [settings?.sharedCloudConfig]);

          const sharedCloudStorageUsed = useMemo(() => {
              return sharedCloudFiles.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
          }, [sharedCloudFiles]);

          const filteredSharedFiles = useMemo(() => {
              return (sharedCloudFiles || []).filter(file => {
                  const matchesCat = !sharedCloudCategory || sharedCloudCategory === 'Tout' || sharedCloudCategory === 'Tous' || file.category === sharedCloudCategory;
                  const query = (sharedCloudSearchQuery || '').trim().toLowerCase();
                  const matchesQuery = !query || (
                      (file.name && file.name.toLowerCase().includes(query)) ||
                      (file.description && file.description.toLowerCase().includes(query)) ||
                      (file.category && file.category.toLowerCase().includes(query))
                  );
                  return matchesCat && matchesQuery;
              });
          }, [sharedCloudFiles, sharedCloudCategory, sharedCloudSearchQuery]);

          // Vérification et analyse fine des erreurs de l'API Google Drive (avec bascule automatique transparente)
          const handleDriveApiError = (err) => {
              const msg = err?.message || String(err);
              console.warn("Google Drive API notification :", msg);
              // Ne pas afficher de bannière d'erreur bloquante : WorksBox Cloud bascule en toute fluidité
              setDriveApiError(null);
              return msg;
          };

          // Envoi direct et robuste d'un fichier avec progression réelle byte-par-byte via XMLHttpRequest
          const uploadFileToGoogleDrive = async (file, token, targetFolderId = null, onProgress = null, mimeTypeOverride = null) => {
              return new Promise((resolve, reject) => {
                  const boundary = '-------314159265358979323846' + Date.now();
                  const metadata = {
                      name: file.name,
                      mimeType: mimeTypeOverride || file.type || 'application/octet-stream'
                  };
                  if (targetFolderId) {
                      metadata.parents = [targetFolderId];
                  }

                  const metadataPart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`;
                  const mediaHeaderPart = `--${boundary}\r\nContent-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`;
                  const closingPart = `\r\n--${boundary}--`;

                  const multipartBlob = new Blob([
                      metadataPart,
                      mediaHeaderPart,
                      file,
                      closingPart
                  ], { type: `multipart/related; boundary=${boundary}` });

                  const xhr = new XMLHttpRequest();
                  xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,mimeType,webContentLink,webViewLink,createdTime,modifiedTime');
                  xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                  xhr.setRequestHeader('Content-Type', `multipart/related; boundary=${boundary}`);

                  if (xhr.upload) {
                      xhr.upload.addEventListener('progress', (e) => {
                          if (e.lengthComputable) {
                              const percent = Math.min(99, Math.round((e.loaded / e.total) * 100));
                              onProgress?.({
                                  loaded: e.loaded,
                                  total: e.total,
                                  percent: percent,
                                  fileName: file.name,
                                  stage: 'uploading'
                              });
                          }
                      });
                  }

                  xhr.onload = () => {
                      if (xhr.status >= 200 && xhr.status < 300) {
                          try {
                              const data = JSON.parse(xhr.responseText);
                              onProgress?.({
                                  loaded: multipartBlob.size,
                                  total: multipartBlob.size,
                                  percent: 100,
                                  fileName: file.name,
                                  stage: 'success'
                              });
                              resolve(data);
                          } catch (err) {
                              resolve({ id: 'done', name: file.name });
                          }
                      } else if (xhr.status === 401) {
                          setDriveToken(null);
                          const err = new Error("Session Google expirée. Veuillez reconnecter votre Google Drive.");
                          onProgress?.({ fileName: file.name, percent: 0, stage: 'error', errorMsg: err.message });
                          reject(err);
                      } else {
                          let msg = `Erreur serveur Google Drive (${xhr.status})`;
                          try {
                              const errData = JSON.parse(xhr.responseText);
                              msg = errData?.error?.message || msg;
                          } catch (_) {}
                          console.warn("Upload Drive warning:", msg);
                          onProgress?.({ fileName: file.name, percent: 0, stage: 'error', errorMsg: msg });
                          reject(new Error(msg));
                      }
                  };

                  xhr.onerror = () => {
                      const msg = "Erreur de connexion réseau lors du téléversement.";
                      onProgress?.({ fileName: file.name, percent: 0, stage: 'error', errorMsg: msg });
                      reject(new Error(msg));
                  };

                  onProgress?.({
                      loaded: 0,
                      total: multipartBlob.size,
                      percent: 1,
                      fileName: file.name,
                      stage: 'uploading'
                  });

                  xhr.send(multipartBlob);
              });
          };

          // Découverte / création du dossier personnel WorksBox Cloud sur Google Drive
          const getOrCreateWorksBoxFolder = async (token) => {
              if (!token) return null;
              try {
                  const query = encodeURIComponent("name='WorksBox Cloud' and mimeType='application/vnd.google-apps.folder' and trashed=false");
                  const searchRes = await fetch(
                      `https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)&spaces=drive`,
                      { headers: { Authorization: `Bearer ${token}` } }
                  );
                  if (searchRes.ok) {
                      const searchData = await searchRes.json();
                      if (searchData.files && searchData.files.length > 0) {
                          return searchData.files[0].id;
                      }
                  } else if (searchRes.status === 401) {
                      updateDriveToken(null);
                      return null;
                  } else {
                      console.warn(`Recherche dossier Drive (${searchRes.status}), bascule local.`);
                      return null;
                  }

                  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                      method: 'POST',
                      headers: {
                          Authorization: `Bearer ${token}`,
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                          name: 'WorksBox Cloud',
                          mimeType: 'application/vnd.google-apps.folder',
                          description: 'Dossier personnel WorksBox pour vos cours et fiches (quota 1 Go)'
                      })
                  });
                  if (createRes.ok) {
                      const createData = await createRes.json();
                      return createData.id;
                  } else {
                      console.warn(`Création dossier Drive (${createRes.status}), bascule local.`);
                      return null;
                  }
              } catch (e) {
                  console.warn("Dossier WorksBox Cloud en mode local :", e.message);
                  return null;
              }
          };

          // Chargement des fichiers et sous-dossiers du Cloud personnel et calcul du quota utilisé (mémorisation automatique)
          const loadWorksBoxCloudFiles = async (token = driveToken, isSilent = false, targetFolderId = cloudCurrentFolderId) => {
              let activeToken = token || driveToken;
              if (!activeToken) {
                  try { activeToken = localStorage.getItem('worksbox_drive_token'); } catch(e) {}
              }
              if (!activeToken && userProfile?.driveToken) {
                  activeToken = userProfile.driveToken;
                  updateDriveToken(activeToken);
              }
              if (!activeToken && activeUser && !activeUser.isLocal) {
                  activeToken = await connectGoogleDrive(true);
              }
              if (!activeToken) {
                  // Charger en priorité depuis Firestore si l'utilisateur est connecté (synchronisation multi-navigateurs)
                  if (activeUser && !activeUser.isLocal && userDb) {
                      setCloudLoading(true);
                      try {
                          const userRef = doc(userDb, 'users', activeUser.uid);
                          const snap = await getDoc(userRef);
                          if (snap.exists()) {
                              const data = snap.data();
                              if (Array.isArray(data.cloudFiles)) {
                                  setCloudFiles(data.cloudFiles);
                                  const totalUsed = typeof data.cloudStorageUsed === 'number' ? data.cloudStorageUsed : data.cloudFiles.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                                  setCloudStorageUsed(totalUsed);
                                  try {
                                      localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(data.cloudFiles));
                                      localStorage.setItem('worksbox_cached_cloud_storage_used', totalUsed.toString());
                                  } catch(e) {}
                                  if (!isSilent) showToast(`✓ WorksBox Cloud synchronisé : ${data.cloudFiles.length} élément(s)`, "success", "check");
                                  return;
                              }
                          }
                      } catch (err) {
                          console.warn("Erreur chargement Firestore cloudFiles :", err);
                      } finally {
                          setCloudLoading(false);
                      }
                  }
                  // Repli sur le cache local
                  try {
                      const cached = JSON.parse(localStorage.getItem('worksbox_cached_cloud_files') || '[]');
                      setCloudFiles(cached);
                      const totalUsed = cached.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                      setCloudStorageUsed(totalUsed);
                  } catch(e) {}
                  return;
              }
              setCloudLoading(true);
              try {
                  const rootFolderId = cloudFolderId || await getOrCreateWorksBoxFolder(activeToken);
                  if (rootFolderId && !cloudFolderId) {
                      setCloudFolderId(rootFolderId);
                      try { localStorage.setItem('worksbox_cloud_folder_id', rootFolderId); } catch(e) {}
                  }
                  
                  const effectiveFolderId = targetFolderId || rootFolderId;
                  const q = effectiveFolderId 
                      ? encodeURIComponent(`'${effectiveFolderId}' in parents and trashed = false`)
                      : encodeURIComponent("trashed = false");

                  const filesRes = await fetch(
                      `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,mimeType,webContentLink,webViewLink,createdTime,modifiedTime,thumbnailLink,iconLink,parents,trashed)&orderBy=folder,modifiedTime desc&pageSize=100`,
                      { headers: { Authorization: `Bearer ${activeToken}` } }
                  );
                  
                  if (!filesRes.ok) {
                      if (filesRes.status === 401) {
                          updateDriveToken(null);
                          console.warn("Session Google Drive expirée. Reconnexion manuelle requise.");
                      }
                      // Gestion des dossiers supprimés sur Google Drive (erreur 400 Bad Request ou 404 Not Found)
                      if ((filesRes.status === 400 || filesRes.status === 404) && effectiveFolderId) {
                          setCloudFolderId(null);
                          setCloudCurrentFolderId(null);
                          setCloudBreadcrumbs([{ id: 'root', name: 'WorksBox Cloud' }]);
                          try { localStorage.removeItem('worksbox_cloud_folder_id'); } catch(e) {}
                      }
                      // Basculer sans interruption sur les fichiers Firestore et locaux stockés
                      console.warn(`Drive (${filesRes.status}) non accessible, chargement direct de l'espace synchronisé.`);
                      setDriveApiError(null);
                      if (activeUser && !activeUser.isLocal && userDb) {
                          try {
                              const userRef = doc(userDb, 'users', activeUser.uid);
                              const snap = await getDoc(userRef);
                              if (snap.exists() && Array.isArray(snap.data().cloudFiles)) {
                                  const firestoreFiles = snap.data().cloudFiles;
                                  setCloudFiles(firestoreFiles);
                                  const totalUsed = typeof snap.data().cloudStorageUsed === 'number' ? snap.data().cloudStorageUsed : firestoreFiles.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                                  setCloudStorageUsed(totalUsed);
                                  return;
                              }
                          } catch (_) {}
                      }
                      try {
                          const cached = JSON.parse(localStorage.getItem('worksbox_cached_cloud_files') || '[]');
                          setCloudFiles(cached);
                          const totalUsed = cached.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                          setCloudStorageUsed(totalUsed);
                      } catch(_) {}
                      return;
                  }

                  const filesData = await filesRes.json();
                  const filesList = (filesData.files || []).filter(f => !f.trashed);
                  
                  // Fusion intelligente avec d'éventuels fichiers Firestore ou locaux existants
                  let mergedList = [...filesList];
                  try {
                      let baseLocal = [];
                      if (userDb && activeUser && !activeUser.isLocal) {
                          const userRef = doc(userDb, 'users', activeUser.uid);
                          const snap = await getDoc(userRef);
                          if (snap.exists() && Array.isArray(snap.data().cloudFiles)) {
                              baseLocal = snap.data().cloudFiles;
                          }
                      }
                      if (baseLocal.length === 0) {
                          baseLocal = JSON.parse(localStorage.getItem('worksbox_cached_cloud_files') || '[]');
                      }
                      const existingIds = new Set(filesList.map(f => f.id));
                      baseLocal.forEach(bf => {
                          if (bf && bf.id && !existingIds.has(bf.id)) {
                              mergedList.push(bf);
                          }
                      });
                  } catch (_) {}

                  // Mise à jour de l'état et du cache
                  setCloudFiles(mergedList);
                  setDriveApiError(null);

                  const totalUsed = mergedList.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                  setCloudStorageUsed(totalUsed);

                  try {
                      localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(mergedList));
                      localStorage.setItem('worksbox_cached_cloud_storage_used', totalUsed.toString());
                  } catch(e) {}

                  // Synchronisation persistante vers Firestore pour rendre disponible sur tous les navigateurs
                  syncUserDataToFirestore({
                      cloudFiles: mergedList,
                      cloudStorageUsed: totalUsed,
                      cloudFolderId: rootFolderId
                  });

                  // Nettoyer définitivement les notes locales dont le fichier a été supprimé sur Google Drive
                  const driveFileIds = new Set(filesList.map(f => f.id));
                  setNotesList(prev => {
                      let changed = false;
                      const updated = prev.map(note => {
                          if (note.driveFileId && !driveFileIds.has(note.driveFileId)) {
                              changed = true;
                              return { 
                                  ...note, 
                                  driveFileId: null, 
                                  driveDeleted: true, 
                                  syncWithDrive: false 
                              };
                          }
                          return note;
                      });
                      if (changed) {
                          try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updated)); } catch(e) {}
                          syncUserDataToFirestore({ notesList: updated });
                          return updated;
                      }
                      return prev;
                  });
                  if (activeNote && activeNote.driveFileId && !driveFileIds.has(activeNote.driveFileId)) {
                      setActiveNote(prev => prev ? { 
                          ...prev, 
                          driveFileId: null, 
                          driveDeleted: true, 
                          syncWithDrive: false 
                      } : null);
                  }

                  if (!isSilent) {
                      if (mergedList.length === 0) {
                          showToast("✓ WorksBox Cloud à jour : 0 fichier (0 Mo)", "success", "check");
                      } else {
                          showToast(`✓ WorksBox Cloud synchronisé : ${mergedList.length} élément(s)`, "success", "check");
                      }
                  }
              } catch (e) {
                  console.warn("WorksBox Cloud synchronisation locale :", e.message);
                  setDriveApiError(null);
                  if (activeUser && !activeUser.isLocal && userDb) {
                      try {
                          const userRef = doc(userDb, 'users', activeUser.uid);
                          const snap = await getDoc(userRef);
                          if (snap.exists() && Array.isArray(snap.data().cloudFiles)) {
                              const firestoreFiles = snap.data().cloudFiles;
                              setCloudFiles(firestoreFiles);
                              const totalUsed = typeof snap.data().cloudStorageUsed === 'number' ? snap.data().cloudStorageUsed : firestoreFiles.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                              setCloudStorageUsed(totalUsed);
                              return;
                          }
                      } catch (_) {}
                  }
                  try {
                      const cached = JSON.parse(localStorage.getItem('worksbox_cached_cloud_files') || '[]');
                      setCloudFiles(cached);
                      const totalUsed = cached.reduce((acc, f) => acc + (parseInt(f.size, 10) || 0), 0);
                      setCloudStorageUsed(totalUsed);
                  } catch (_) {}
              } finally {
                  setCloudLoading(false);
              }
          };

          // Nettoyage forcé de la mémoire locale WorksBox Cloud et resynchronisation Google Drive
          const clearCloudCacheAndResync = async () => {
              setCloudLoading(true);
              try {
                  // 1. Purge sécurisée du cache WorksBox Cloud dans le stockage local
                  try {
                      localStorage.removeItem('worksbox_cached_cloud_files');
                      localStorage.removeItem('worksbox_cached_cloud_storage_used');
                      localStorage.removeItem('worksbox_cloud_folder_id');
                  } catch (_) {}

                  // 2. Réinitialisation des états Cloud (0 fichier, 0 Mo, retour à la racine)
                  setCloudFolderId(null);
                  setCloudCurrentFolderId(null);
                  setCloudBreadcrumbs([{ id: null, name: 'WorksBox Cloud' }]);
                  setCloudFiles([]);
                  setCloudStorageUsed(0);
                  setDriveApiError(null);
                  syncUserDataToFirestore({ cloudFiles: [], cloudStorageUsed: 0 });

                  // 3. Sécurisation de la liste des notes en mémoire
                  setNotesList(prev => Array.isArray(prev) ? prev : []);

                  // 4. Resynchronisation fluide et silencieuse si Google Drive est déjà connecté
                  let token = driveToken;
                  if (!token) {
                      try { token = localStorage.getItem('worksbox_drive_token'); } catch (_) {}
                  }

                  if (token && activeUser && !activeUser.isLocal) {
                      try {
                          await loadWorksBoxCloudFiles(token, true, null);
                          showToast("✓ Mémoire nettoyée et Google Drive synchronisé !", "success", "check");
                          return;
                      } catch (syncErr) {
                          console.warn("Synchronisation Drive silencieuse :", syncErr);
                      }
                  }

                  showToast("✓ Mémoire locale nettoyée avec succès (0 fichier).", "success", "check");
              } catch (e) {
                  console.error("Erreur nettoyage mémoire :", e);
                  showToast("Mémoire nettoyée avec succès.", "success", "check");
              } finally {
                  setCloudLoading(false);
              }
          };

          // Création d'un sous-dossier dans WorksBox Cloud
          const createCloudFolder = async (folderName, parentFolderId = null) => {
              if (!activeUser || activeUser.isLocal) {
                  setShowAuthModal(true);
                  showToast("Connectez-vous pour créer des dossiers dans votre Cloud.", "info", "info");
                  return;
              }
              const cleanName = (folderName || '').trim();
              if (!cleanName) {
                  showToast("Veuillez saisir un nom pour le dossier.", "warning", "warning");
                  return;
              }
              setCloudLoading(true);
              let createdFolder = null;
              const targetParentId = parentFolderId || cloudCurrentFolderId;
              let token = driveToken || localStorage.getItem('worksbox_drive_token');

              if (token) {
                  try {
                      const rootId = cloudFolderId || await getOrCreateWorksBoxFolder(token);
                      const finalParent = targetParentId || rootId;
                      const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                          method: 'POST',
                          headers: {
                              Authorization: `Bearer ${token}`,
                              'Content-Type': 'application/json'
                          },
                          body: JSON.stringify({
                              name: cleanName,
                              mimeType: 'application/vnd.google-apps.folder',
                              parents: finalParent ? [finalParent] : undefined
                          })
                      });
                      if (createRes.ok) {
                          const data = await createRes.json();
                          createdFolder = {
                              id: data.id,
                              name: cleanName,
                              mimeType: 'application/vnd.google-apps.folder',
                              parents: finalParent ? [finalParent] : [],
                              modifiedTime: new Date().toISOString()
                          };
                      }
                  } catch (e) {
                      console.warn("Création dossier Drive repli local :", e.message);
                  }
              }

              if (!createdFolder) {
                  createdFolder = {
                      id: 'folder_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                      name: cleanName,
                      mimeType: 'application/vnd.google-apps.folder',
                      parents: targetParentId ? [targetParentId] : [],
                      modifiedTime: new Date().toISOString()
                  };
              }

              const updatedFolders = [createdFolder, ...cloudFiles];
              setCloudFiles(updatedFolders);
              try { localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(updatedFolders)); } catch(e) {}
              syncUserDataToFirestore({ cloudFiles: updatedFolders });

              showToast(`Dossier « ${cleanName} » créé avec succès !`, "success", "check");
              setShowNewFolderModal(false);
              setNewFolderNameInput('');
              setCloudLoading(false);
          };

          // Ouvrir un sous-dossier dans l'explorateur Cloud
          const openCloudFolder = (folderObj) => {
              if (!folderObj || !folderObj.id) return;
              setCloudCurrentFolderId(folderObj.id);
              setCloudBreadcrumbs(prev => [...prev, { id: folderObj.id, name: folderObj.name }]);
              loadWorksBoxCloudFiles(driveToken, false, folderObj.id);
          };

          // Naviguer via le fil d'Ariane (Breadcrumb)
          const navigateCloudBreadcrumb = (index) => {
              if (index < 0 || index >= cloudBreadcrumbs.length) return;
              const target = cloudBreadcrumbs[index];
              const newBreadcrumbs = cloudBreadcrumbs.slice(0, index + 1);
              setCloudBreadcrumbs(newBreadcrumbs);
              setCloudCurrentFolderId(target.id);
              loadWorksBoxCloudFiles(driveToken, false, target.id);
          };

          // Gestion des Notes WorksBox (Création, Édition, Sauvegarde Cloud & Local, Export)
          const createNewNote = (initialTitle = 'Nouvelle note', initialSubject = '', initialChapter = '', initialContent = '', targetFolderId = null, targetFolderName = '') => {
              const noteId = 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
              const safeTitle = (typeof initialTitle === 'string' && initialTitle.trim() && initialTitle !== '[object Object]') ? initialTitle.trim() : 'Nouvelle note';
              const safeSubject = (typeof initialSubject === 'string' && initialSubject.trim()) ? initialSubject.trim() : (activeSubjects?.[0]?.name || 'Général');
              const safeChapter = typeof initialChapter === 'string' ? initialChapter : '';
              const safeContent = (typeof initialContent === 'string' && initialContent) ? initialContent : `<h1>${safeTitle}</h1><p>Commencez à rédiger vos notes, théorèmes ou résumés de cours ici...</p>`;
              const safeFolderId = typeof targetFolderId === 'string' ? targetFolderId : (cloudCurrentFolderId || null);
              const safeFolderName = (typeof targetFolderName === 'string' && targetFolderName) ? targetFolderName : (cloudBreadcrumbs.length > 1 ? cloudBreadcrumbs[cloudBreadcrumbs.length - 1].name : 'WorksBox Cloud');
              
              const newNote = {
                  id: noteId,
                  title: safeTitle,
                  subject: safeSubject,
                  chapter: safeChapter,
                  content: safeContent,
                  folderId: safeFolderId,
                  folderName: safeFolderName,
                  createdAt: new Date().toISOString(),
                  updatedAt: new Date().toISOString(),
                  syncWithDrive: true,
                  driveDeleted: false,
                  driveFileId: null
              };
              
              const updated = [newNote, ...(notesList || []).filter(n => n.id !== noteId)];
              setNotesList(updated);
              try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updated)); } catch(e) {}
              syncUserDataToFirestore({ notesList: updated });
              
              setActiveNote(newNote);
              setCurrentView('noteEditor');
              setNoteAutosaveStatus('local');
              setNoteLastSavedTime(new Date());
          };

          const openNoteInEditor = (note) => {
              if (!note || typeof note !== 'object') return;
              const sanitized = sanitizeNoteItem(note);
              if (!sanitized) return;
              setActiveNote(sanitized);
              setCurrentView('noteEditor');
              setNoteAutosaveStatus('saved');
          };

          const deleteNote = (noteId) => {
              const noteToDelete = notesList.find(n => n.id === noteId);
              setGenericConfirmModal({
                  title: "Supprimer cette note ?",

                  confirmText: "Supprimer la note",

                      const updatedNotes = (notesList || []).filter(n => n.id !== noteId);
                      setNotesList(updatedNotes);
                      try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updatedNotes)); } catch(e) {}
                      syncUserDataToFirestore({ notesList: updatedNotes });
                      if (activeNote && activeNote.id === noteId) {
                          setActiveNote(null);
                          setCurrentView('home');
                      }
                      if (noteToDelete && noteToDelete.driveFileId) {
                          const fileId = noteToDelete.driveFileId;
                          const updatedFiles = (cloudFiles || []).filter(f => f.id !== fileId);
                          const removed = (cloudFiles || []).find(f => f.id === fileId);
                          const newSize = Math.max(0, cloudStorageUsed - (parseInt(removed?.size, 10) || 0));
                          setCloudFiles(updatedFiles);
                          setCloudStorageUsed(newSize);
                          try {
                              localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(updatedFiles));
                              localStorage.setItem('worksbox_cached_cloud_storage_used', newSize.toString());
                          } catch(e) {}
                          syncUserDataToFirestore({ cloudFiles: updatedFiles, cloudStorageUsed: newSize });
                          let token = driveToken || localStorage.getItem('worksbox_drive_token');
                          if (token) {
                              try {
                                  await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                                      method: 'DELETE',
                                      headers: { Authorization: `Bearer ${token}` }
                                  });
                              } catch(e) {}
                          }
                      }
                      showToast("Note supprimée avec succès.", "info", "trash");
                  }
              });
          };

          // Sauvegarde automatique et directe de la note dans WorksBox Cloud (Google Drive)
          const saveNoteDirectly = async (noteToSave, isSilent = false) => {
              if (!noteToSave) return;
              setNoteAutosaveStatus('saving');
              
              // 1. Sauvegarde locale immédiate (zéro perte de données) et synchronisation Firestore
              const timestampedNote = { ...noteToSave, updatedAt: new Date().toISOString() };
              const currentNotes = notesList || [];
              const updated = currentNotes.map(n => n.id === timestampedNote.id ? timestampedNote : n);
              if (!updated.some(n => n.id === timestampedNote.id)) updated.unshift(timestampedNote);
              setNotesList(updated);
              try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updated)); } catch(e) {}
              syncUserDataToFirestore({ notesList: updated });
              setActiveNote(timestampedNote);

              // 2. Synchronisation transparente avec Google Drive si connecté
              if (driveToken && activeUser && !activeUser.isLocal) {
                  try {
                      const rootId = cloudFolderId || await getOrCreateWorksBoxFolder(driveToken);
                      const parentId = noteToSave.folderId || cloudCurrentFolderId || rootId;
                      const cleanTitle = (noteToSave.title || 'Note').replace(/[\\/:*?"<>|]/g, '_');
                      const fileName = `[Note] ${noteToSave.subject || 'Cours'} - ${cleanTitle}.html`;
                      
                      const htmlDocument = `<!DOCTYPE html>

                      const blob = new Blob([htmlDocument], { type: 'text/html;charset=utf-8' });
                      const file = new File([blob], fileName, { type: 'text/html;charset=utf-8' });

                      // Si la note a été supprimée de Drive ou si la synchronisation est désactivée, ne jamais la renvoyer vers Drive
                      if (noteToSave.driveDeleted || noteToSave.syncWithDrive === false) {
                          setNoteAutosaveStatus('local');
                          setNoteLastSavedTime(new Date());
                          return;
                      }

                      if (noteToSave.driveFileId) {
                          const updateRes = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${noteToSave.driveFileId}?uploadType=media`, {
                              method: 'PATCH',
                              headers: {
                                  Authorization: `Bearer ${driveToken}`,
                                  'Content-Type': 'text/html;charset=utf-8'
                              },
                              body: blob
                          });
                          if (updateRes.ok) {
                              setNoteAutosaveStatus('saved');
                              setNoteLastSavedTime(new Date());
                              if (!isSilent) showToast("Note synchronisée sur WorksBox Cloud !", "success", "check");
                              return;
                          }
                          // Si le fichier a été supprimé sur Google Drive (404 Not Found ou 410 Gone) :
                          // Ne JAMAIS le recréer automatiquement sur Google Drive !
                          if (updateRes.status === 404 || updateRes.status === 410) {
                              const unlinked = { ...timestampedNote, driveFileId: null, driveDeleted: true, syncWithDrive: false };
                              setActiveNote(unlinked);
                              setNotesList(prev => {
                                  const u = prev.map(n => n.id === unlinked.id ? unlinked : n);
                                  try { localStorage.setItem('worksbox_notes_list', JSON.stringify(u)); } catch(e) {}
                                  return u;
                              });
                              // Supprimer immédiatement de la mémoire cache Cloud pour éviter toute réapparition
                              setCloudFiles(prev => {
                                  const u = prev.filter(f => f.id !== noteToSave.driveFileId);
                                  try { localStorage.setItem('worksbox_cached_cloud_files', JSON.stringify(u)); } catch(e) {}
                                  return u;

                              setNoteAutosaveStatus('local');
                              setNoteLastSavedTime(new Date());
                              return;
                          }
                      }
                      
                      // Ne téléverser sur Google Drive que si la synchronisation n'est pas expressément désactivée
                      if (noteToSave.syncWithDrive === false && !noteToSave.driveFileId) {
                          setNoteAutosaveStatus('local');
                          setNoteLastSavedTime(new Date());
                          return;

                      const uploadRes = await uploadFileToGoogleDrive(file, driveToken, parentId, null, 'application/vnd.google-apps.document');
                      if (uploadRes && uploadRes.id) {
                          const docLink = uploadRes.webViewLink || `https://docs.google.com/document/d/${uploadRes.id}/edit`;

                          setActiveNote(updatedWithDriveId);
                          setNotesList(prev => {
                              const u = prev.map(n => n.id === updatedWithDriveId.id ? updatedWithDriveId : n);
                              try { localStorage.setItem('worksbox_notes_list', JSON.stringify(u)); } catch(e) {}
                              return u;
                          });
                          // Ajouter ou rafraîchir immédiatement dans cloudFiles pour apparition instantanée dans le Cloud
                          const noteFileItem = {
                              id: uploadRes.id,

                              webViewLink: docLink

                              const updated = [noteFileItem, ...withoutExisting];

                              return updated;

                          setNoteAutosaveStatus('saved');
                          setNoteLastSavedTime(new Date());
                          if (!isSilent) showToast("Note sauvegardée sur votre Google Drive !", "success", "check");
                          loadWorksBoxCloudFiles(driveToken, true, cloudCurrentFolderId);
                      }
                  } catch (err) {
                      console.warn("Erreur synchronisation Drive de la note :", err);
                      setNoteAutosaveStatus('local');
                      setNoteLastSavedTime(new Date());

              } else {
                  setNoteAutosaveStatus('local');

          const exportNotePDF = (note) => {

                  const printHtml = `<!DOCTYPE html>

                          // Si le fichier était une note locale, marquer définitivement comme supprimé de Drive pour éviter toute résurrection
                          const updatedNotes = (notesList || []).map(n => {
                              if (n.driveFileId === fileId || (fileName && (fileName.includes(n.title) || fileName.includes(n.id)))) {
                                  return { ...n, driveFileId: null, driveDeleted: true, syncWithDrive: false };
                              }
                              return n;
                          });
                          setNotesList(updatedNotes);
                          try { localStorage.setItem('worksbox_notes_list', JSON.stringify(updatedNotes)); } catch(e) {}
                          
                          // Synchronisation immédiate avec Firestore
                          syncUserDataToFirestore({
                              cloudFiles: updatedList,
                              cloudStorageUsed: newSize,
                              notesList: updatedNotes
                          });

                          if (activeNote && (activeNote.driveFileId === fileId || (fileName && (fileName.includes(activeNote.title) || fileName.includes(activeNote.id))))) {
                              setActiveNote(prev => prev ? { ...prev, driveFileId: null, driveDeleted: true, syncWithDrive: false } : null);
                          }

                          // Suppression réelle sur l'API Google Drive
                          let token = driveToken || localStorage.getItem('worksbox_drive_token');
                          if (!token && activeUser && !activeUser.isLocal) {
                              token = await connectGoogleDrive(true);
                          }
                          if (token && fileId && !fileId.startsWith('local_') && !fileId.startsWith('simulated_')) {
                              try {
                                  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                                      method: 'DELETE',
                                      headers: { Authorization: `Bearer ${token}` }
                                  });
                                  if (res.status === 401) {
                                      const refreshed = await connectGoogleDrive(true);
                                      if (refreshed) {
                                          await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
                                              method: 'DELETE',
                                              headers: { Authorization: `Bearer ${refreshed}` }
                                          }).catch(() => {});
                                      }
                                  }
                              } catch (driveErr) {
                                  console.warn("Drive API delete warning:", driveErr);
                              }
                          }
                          showToast(`« ${fileName} » supprimé de votre Drive`, "info", "info");
                      } catch (e) {
                          console.error("Erreur suppression:", e);
                          showToast("Erreur suppression : " + e.message, "warning", "warning");
                      }
                  }
              });
          };

          // Suppression d'un document du Cloud Partagé réservée exclusivement aux administrateurs
          const deleteSharedCloudFile = (fileId, fileName) => {
              if (!isUserAdmin) {
                  showToast("Action refusée : seul l'administrateur peut supprimer des fichiers du dossier partagé.", "warning", "warning");

              }
              setGenericConfirmModal({
                  title: "Supprimer du Cloud Partagé",
                  message: `Supprimer définitivement « ${fileName} » du Cloud Partagé de l'établissement ?\nCette action libérera immédiatement le quota de stockage partagé.`,

                  onConfirm: async () => {

                          if (dataDb && fileId) {

                                  await deleteDoc(docRef);
                              } catch (fsErr) {
                                  console.warn("Firestore deleteDoc error:", fsErr);
                              }
                          }
                          showToast(`« ${fileName} » supprimé du Cloud Partagé !`, "info", "info");
                      } catch (err) {
                          console.error("Erreur suppression Cloud Partagé:", err);
                          showToast("Erreur suppression : " + err.message, "warning", "warning");
                      }
                  }
              });
          };

          // Gestion du thème clair / sombre (synchronisé avec localStorage et la balise html)
          const [isDark, setIsDark] = useState(() => {

              } catch (e) {
                  return false;
              }
          });

          useEffect(() => {
              try {
                  if (isDark) {
                      document.documentElement.classList.add('dark');
                      localStorage.setItem('worksbox_theme', 'dark');
                  } else {
                      document.documentElement.classList.remove('dark');
                      localStorage.setItem('worksbox_theme', 'light');
                  }
              } catch (e) {}
          }, [isDark]);

          const toggleTheme = () => {
              setIsDark(prev => !prev);
          };

          const AUTHORIZED_ADMIN_EMAILS = [
              'roman.ferriere4@gmail.com',

          ];

          const checkIsAdmin = (u) => {

              if (!email) return false;

              if (domain === 'gmail.com') {
                  const cleanLocal = localPart.replace(/\./g, '');

              return AUTHORIZED_ADMIN_EMAILS.includes(email);
          };

          const activeUser = useMemo(() => {
              const savedGoogle = (() => {

                      return s ? JSON.parse(s) : null;

              })();

                  ...base,

                  photoURL: userProfile?.photoURL !== undefined ? userProfile.photoURL : (base?.photoURL || '')
              };
          }, [user, localUser, userProfile]);
          const isUserAdmin = checkIsAdmin(activeUser);

          // Nettoyage de tout compte élève implicite hérité et de tout fichier d'exemple résiduel
          useEffect(() => {
              if (!user && !localUser) {
                  localStorage.removeItem('worksbox_local_user');
              }
              try {
                  const cachedShared = localStorage.getItem('worksbox_shared_files');

                          localStorage.removeItem('worksbox_shared_files');

                  }

          const [selectedSchool, setSelectedSchool] = useState(() => localStorage.getItem('wb_selected_school') || '');
          const [selectedClass, setSelectedClass] = useState(() => localStorage.getItem('wb_selected_class') || '');
          const [showOnboarding, setShowOnboarding] = useState(!localStorage.getItem('wb_selected_school') || !localStorage.getItem('wb_selected_class'));

          // Calcul dynamique du logo officiel WorksBox actif (WorksBox HIGH SCHOOL vs WorksBox STUDENTS)
          const currentLogoData = useMemo(() => {
              return getWorksBoxLogoData(selectedSchool, selectedClass, settings);
          }, [selectedSchool, selectedClass, settings.schoolClassLevels, settings.classLevels]);

          // Gestion de l'acceptation obligatoire des conditions d'utilisation au démarrage
          const [hasAcceptedTerms, setHasAcceptedTerms] = useState(() => localStorage.getItem('wb_terms_accepted') === 'true');
          const [termsAgreementChecked, setTermsAgreementChecked] = useState(false);

          const [favorites, setFavorites] = useState(() => {

          });

          const [toast, setToast] = useState(null);

          const showToast = (message, type = 'success', icon = null) => {
              const safeMsg = (typeof message === 'string' && message) ? message : 'Action effectuée';
              setToast({ id: Date.now(), message: safeMsg, type: typeof type === 'string' ? type : 'success', icon });
          };

          const hideToast = () => {
              setToast(null);
          };

          const copyToClipboard = async (text, label = "Lien copié dans le presse-papiers !") => {
              if (!text) return;
              try {
                  if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
                      await navigator.clipboard.writeText(text);
                  } else {
                      const textarea = document.createElement('textarea');
                      textarea.value = text;
                      textarea.style.position = 'fixed';
                      textarea.style.opacity = '0';
                      document.body.appendChild(textarea);
                      textarea.select();
                      document.execCommand('copy');
                      document.body.removeChild(textarea);
                  }
                  showToast(label, 'success', 'copy');
              } catch (err) {
                  showToast("Impossible de copier dans le presse-papiers", "warning", "warning");
              }
          };

          const shareCourse = (course) => {
              if (!course) return;
              try {
                  const url = new URL(window.location.origin + window.location.pathname);
                  url.searchParams.set('course', course.id);
                  const directUrl = url.toString();
                  copyToClipboard(directUrl, `Lien direct vers « ${course.title} » copié !`);
              } catch (e) {
                  const directUrl = `${window.location.origin}${window.location.pathname}?course=${encodeURIComponent(course.id)}`;
                  copyToClipboard(directUrl, `Lien direct vers « ${course.title} » copié !`);

          };

          const copyCourseLink = (course) => {
              if (!course) return;
              shareCourse(course);
          };

          useEffect(() => { 
              localStorage.setItem('worksbox_favs', JSON.stringify(favorites)); 
          }, [favorites]);

          const toggleFav = async (courseId) => {
              // Si l'utilisateur n'est pas connecté, demander la connexion pour utiliser les favoris
              if (!activeUser) {

                  ? [...favorites, courseId]

              setFavorites(newFavs);
