                                                <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full ${
                                                    (cloudStorageUsed / MAX_CLOUD_QUOTA_BYTES) > 0.9 
                                                        ? 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300' 
                                                        : (cloudStorageUsed / MAX_CLOUD_QUOTA_BYTES) > 0.7 
                                                            ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300' 
                                                            : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'
                                                }`}>
                                                    {((cloudStorageUsed / MAX_CLOUD_QUOTA_BYTES) * 100).toFixed(1)} % utilisé
                                                </span>
                                            </div>
                                        </div>

                                        {/* Barre de progression */}
                                        <div className="w-full bg-slate-100 dark:bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200/80 dark:border-slate-700">
                                            <div 
                                                className={`h-full rounded-full transition-all duration-500 ${
                                                    (cloudStorageUsed / MAX_CLOUD_QUOTA_BYTES) > 0.9 
                                                        ? 'bg-gradient-to-r from-red-500 to-rose-600' 
                                                        : (cloudStorageUsed / MAX_CLOUD_QUOTA_BYTES) > 0.7 
                                                            ? 'bg-gradient-to-r from-amber-500 to-orange-600' 
                                                            : 'bg-gradient-to-r from-sky-500 to-blue-600'
                                                }`}
                                                style={{ width: `${Math.min(100, Math.max(2, (cloudStorageUsed / MAX_CLOUD_QUOTA_BYTES) * 100))}%` }}
                                            ></div>
                                        </div>

                                        <div className="flex flex-wrap items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400 gap-3">
                                            <span>Espace restant disponible : <strong className="text-slate-800 dark:text-slate-200 font-bold">{Math.max(0, ((MAX_CLOUD_QUOTA_BYTES - cloudStorageUsed) / (1024 * 1024))).toFixed(1)} Mo</strong></span>
                                            <div className="flex items-center space-x-3">
                                                {driveToken && (
                                                    <button 
                                                        onClick={() => loadWorksBoxCloudFiles(driveToken)}
                                                        disabled={cloudLoading}
                                                        className="px-3 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition flex items-center space-x-1.5"
                                                        title="Synchroniser avec Google Drive"
                                                    >
                                                        <RefreshCw className={`w-3.5 h-3.5 ${cloudLoading ? 'animate-spin' : ''}`} />
                                                        <span>Actualiser</span>
                                                    </button>
                                                )}
                                                <input 
                                                    type="file" 
                                                    id="cloud-file-uploader" 
                                                    className="hidden" 
                                                    onChange={(e) => {
                                                        const file = e.target.files?.[0];
                                                        if (file) {
                                                            uploadFileToCloud(file);
                                                            e.target.value = '';
                                                        }
                                                    }}
                                                />
                                                <button 
                                                    onClick={() => {
                                                        if (!driveToken) {
                                                            connectGoogleDrive();
                                                        } else {
                                                            document.getElementById('cloud-file-uploader')?.click();
                                                        }
                                                    }}
                                                    disabled={cloudUploading}
                                                    className="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold rounded-xl shadow-sm transition active:scale-95 flex items-center space-x-2"
                                                >
                                                    {cloudUploading ? (
                                                        <>
                                                            <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                                            <span>Téléversement...</span>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <UploadCloud className="w-4 h-4" />
                                                            <span>Ajouter un document</span>
                                                        </>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Liste des fichiers Cloud */}
                                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-sm space-y-6">
                                        <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
                                            <div className="flex items-center space-x-3">
                                                <Folder className="w-6 h-6 text-sky-500" />
                                                <h3 className="text-lg font-bold text-slate-900 dark:text-white">Documents dans votre WorksBox Cloud</h3>
                                                <span className="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-bold px-2.5 py-0.5 rounded-full">
                                                    {cloudFiles.length} fichier{cloudFiles.length !== 1 ? 's' : ''}
                                                </span>
                                            </div>
                                            {driveToken && cloudFiles.length > 0 && (
                                                <div className="relative max-w-xs w-full">
                                                    <Search className="absolute left-3 top-2.5 h-4 w-4 text-slate-400" />
                                                    <input 
                                                        type="text" 
                                                        placeholder="Filtrer mes fichiers Drive..." 
                                                        value={cloudSearchQuery} 
                                                        onChange={(e) => setCloudSearchQuery(e.target.value)} 
                                                        className="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-sky-500 text-slate-800 dark:text-slate-100"
                                                    />
                                                </div>
                                            )}
                                        </div>

                                        {!driveToken ? (
                                            <div className="border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center space-y-4">
                                                <div className="w-16 h-16 bg-sky-50 dark:bg-sky-950 text-sky-600 dark:text-sky-400 rounded-2xl flex items-center justify-center mx-auto shadow-xs">
                                                    <Cloud className="w-8 h-8" />
                                                </div>
                                                <h4 className="text-base font-bold text-slate-800 dark:text-slate-200">Connectez votre Google Drive pour activer votre espace 1 Go</h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 max-w-md mx-auto">
                                                    Vos fichiers sont privés, hébergés en toute sécurité sur votre propre compte Google dans le dossier dédié <strong>WorksBox Cloud</strong>.
                                                </p>
                                                <button 
                                                    onClick={connectGoogleDrive}
                                                    className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow-sm transition active:scale-95 inline-flex items-center space-x-2"
                                                >
                                                    <GoogleIcon className="w-4 h-4" />
                                                    <span>Activer mon Cloud avec Google</span>
                                                </button>
                                            </div>
                                        ) : cloudLoading ? (
                                            <div className="py-12 flex flex-col items-center justify-center space-y-3">
                                                <div className="w-8 h-8 border-3 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
                                                <p className="text-xs font-bold text-slate-500">Chargement de vos fichiers Google Drive...</p>
                                            </div>
                                        ) : cloudFiles.length === 0 ? (
                                            <div className="border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center space-y-3">
                                                <UploadCloud className="w-12 h-12 text-slate-300 dark:text-slate-600 mx-auto" />
                                                <h4 className="text-base font-bold text-slate-800 dark:text-slate-200">Aucun fichier dans votre espace Cloud pour l'instant</h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 max-w-md mx-auto">
                                                    Vous pouvez téléverser vos devoirs ou fiches personnelles, ou cliquer sur le bouton <strong>Drive</strong> sur un cours pour le copier dans votre espace.
                                                </p>
                                                <button 
                                                    onClick={() => document.getElementById('cloud-file-uploader')?.click()}
                                                    className="mt-2 px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition"
                                                >
                                                    Téléverser un premier fichier
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                                {cloudFiles
                                                    .filter(f => !cloudSearchQuery.trim() || f.name.toLowerCase().includes(cloudSearchQuery.toLowerCase()))
                                                    .map(file => {
                                                        const sizeMb = ((parseInt(file.size, 10) || 0) / (1024 * 1024)).toFixed(2);
                                                        const dateFormatted = file.modifiedTime ? new Date(file.modifiedTime).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
                                                        return (
                                                            <div key={file.id} className="py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/50 px-3 rounded-xl transition-colors">
                                                                <div className="flex items-center space-x-3 min-w-0">
                                                                    <div className="p-2.5 bg-sky-50 dark:bg-sky-950/80 text-sky-600 dark:text-sky-400 rounded-xl flex-shrink-0">
                                                                        <FileText className="w-5 h-5" />
                                                                    </div>
                                                                    <div className="min-w-0">
                                                                        <h4 className="text-sm font-bold text-slate-800 dark:text-slate-100 truncate">{file.name}</h4>
                                                                        <div className="flex items-center space-x-2 text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
                                                                            <span>{sizeMb} Mo</span>
                                                                            <span>•</span>
                                                                            <span>Modifié le {dateFormatted}</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                                                    {file.webViewLink && (
                                                                        <a 
                                                                            href={file.webViewLink} 
                                                                            target="_blank" 
                                                                            rel="noopener noreferrer" 
                                                                            className="px-3 py-1.5 bg-sky-50 dark:bg-sky-950/80 hover:bg-sky-100 text-sky-700 dark:text-sky-300 text-xs font-bold rounded-lg transition flex items-center"
                                                                        >
                                                                            <ExternalLink className="w-3.5 h-3.5 mr-1" /> Ouvrir sur Drive
                                                                        </a>
                                                                    )}
                                                                    <button 
                                                                        onClick={() => deleteCloudFile(file.id, file.name)} 
                                                                        className="p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-950/50 rounded-lg transition"
                                                                        title="Supprimer du Drive et libérer l'espace"
                                                                    >
                                                                        <Trash2 className="w-4 h-4" />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* CONTENU ONGLET 3 : MON COMPTE & RÉGLAGES */}
                            {profileTab === 'account' && (
                                <div className="max-w-2xl mx-auto space-y-6 animate-in fade-in duration-200">
                                    {/* Établissement et Classe */}
                                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-4">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide block">Scolarité</span>
                                                <h3 className="text-base font-bold text-slate-900 dark:text-white">Établissement & Classe active</h3>
                                            </div>
                                            <button 
                                                onClick={() => setShowOnboarding(true)}
                                                className="px-3.5 py-1.5 bg-blue-50 dark:bg-blue-950/80 hover:bg-blue-100 text-blue-700 dark:text-blue-300 text-xs font-bold rounded-xl transition"
                                            >
                                                Modifier
                                            </button>
                                        </div>
                                        <div className="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl space-y-1">
                                            <p className="text-sm font-black text-slate-900 dark:text-white flex items-center">
                                                <SchoolIcon className="w-4 h-4 text-blue-500 mr-2" />
                                                {selectedSchool || 'Non sélectionné'}
                                            </p>
                                            <p className="text-xs text-slate-600 dark:text-slate-400 pl-6">
                                                Classe : <strong>{selectedClass || 'Non sélectionnée'}</strong>
                                            </p>
                                        </div>
                                    </div>

                                    {/* Liaison Google pour les élèves locaux */}
                                    {activeUser?.isLocal && (
                                        <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                            <div>
                                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide block">Synchronisation</span>
                                                <h3 className="text-base font-bold text-slate-900 dark:text-white">Associer un compte Google</h3>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Conservez vos favoris et votre Cloud sur tous vos téléphones et ordinateurs.</p>
                                            </div>
                                            <button 
                                                onClick={() => setShowAuthModal(true)}
                                                className="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition shadow-sm whitespace-nowrap flex items-center space-x-2"
                                            >
                                                <GoogleIcon className="w-4 h-4" />
                                                <span>Lier Google</span>
                                            </button>
                                        </div>
                                    )}

                                    {/* Accès Admin si applicable */}
                                    {isUserAdmin && (
                                        <div className="bg-gradient-to-r from-red-950/70 to-slate-900 border border-red-500/50 rounded-3xl p-6 flex items-center justify-between shadow-sm">
                                            <div className="text-xs text-slate-200 mr-2">
                                                <span className="font-extrabold flex items-center text-red-400 text-sm mb-1">
                                                    <Shield className="w-4 h-4 mr-1.5 inline" /> Panneau d'Administration
                                                </span>
                                                <span className="text-xs text-slate-300">Gérez les cours, fiches Casio et importations Google Drive par IA.</span>
                                            </div>
                                            <a
                                                href="admin.html"
                                                className="px-4 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-sm flex items-center space-x-1.5"
                                            >
                                                <span>Ouvrir le Panel</span>
                                                <ExternalLink className="w-3.5 h-3.5" />
                                            </a>
                                        </div>
                                    )}

                                    {/* Déconnexion */}
                                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm flex items-center justify-between">
                                        <div>
                                            <h3 className="text-sm font-bold text-slate-900 dark:text-white">Déconnexion de WorksBox</h3>
                                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Vous pourrez vous reconnecter à tout moment.</p>
                                        </div>
                                        <button 
                                            onClick={handleSignOut}
                                            className="px-4 py-2 bg-red-50 dark:bg-red-950/50 hover:bg-red-100 text-red-700 dark:text-red-300 font-bold text-xs rounded-xl border border-red-200 dark:border-red-900 transition flex items-center space-x-1.5"
                                        >
                                            <LogOut className="w-3.5 h-3.5" />
                                            <span>Se déconnecter</span>
                                        </button>
                                    </div>
                                </div>
                            )}
                          </div>
                        )}

                        {currentView === 'subject' && (
                        <div key={`view-subject-${selectedSubject}`} className="space-y-6 view-transition">
                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xs mb-6">
                                <div className="flex flex-wrap items-center justify-between gap-4">
                                    <div className="flex items-center space-x-3.5">
                                        <button 
                                            onClick={goHome} 
                                            className="p-2.5 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-600 dark:text-slate-300 shadow-2xs hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95 cursor-pointer"
                                            title="Retour à l'accueil"
                                        >
                                            <ChevronLeft className="w-5 h-5" />
                                        </button>
                                        <div>
                                            <div className="flex items-center space-x-2 text-xs font-bold text-blue-600 dark:text-blue-400">
                                                <span>{selectedSchool}</span>
                                                <span className="text-slate-300 dark:text-slate-600">•</span>
                                                <span className="bg-blue-100 dark:bg-blue-950/90 text-blue-800 dark:text-blue-300 px-2 py-0.5 rounded-md border border-blue-200 dark:border-blue-900 font-extrabold">{selectedClass}</span>
                                            </div>
                                            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1">{selectedSubject}</h1>
                                        </div>
                                    </div>
                                    <div className="text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/80 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700">
                                        {chaptersData.reduce((acc, chap) => acc + chap.courses.length, 0)} cours spécifiques à <span className="font-bold text-blue-600 dark:text-blue-400">{selectedClass}</span>
                                    </div>
                                </div>
                            </div>
                            {chaptersData.length === 0 ? (
                                <div className="bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-12 text-center text-slate-500 dark:text-slate-400">
                                    <Folder className="w-12 h-12 text-slate-300 dark:text-slate-600 mx-auto mb-3" />
                                    <p className="font-bold text-slate-700 dark:text-slate-300 text-base">Aucun cours d'« {selectedSubject} » pour {selectedClass}.</p>
                                    <p className="text-xs text-slate-400 dark:text-slate-500 mt-1 max-w-md mx-auto">Chaque classe possède son propre programme et ses propres cours indépendants.</p>
                                    <button onClick={goHome} className="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition shadow-xs">
                                        ← Retourner à l'accueil
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    {chaptersData.map((chap) => (
                                        <ChapterBlock 
                                            key={chap.name} 
                                            chapter={chap.name} 
                                            chapterCourses={chap.courses} 
                                            handleView={handleView} 
                                            tagColors={settings.tagColors} 
                                            favorites={favorites} 
                                            toggleFav={toggleFav} 
                                            onCopyCourse={copyCourseLink}
                                            onShareCourse={shareCourse}
                                            onSaveCourseToCloud={saveCourseToCloudDrive}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                        )}

                        {currentView === 'casioGuide' && (
                          <div key="view-casioGuide" className="space-y-8 max-w-4xl mx-auto view-transition">
                            <h1 className="text-3xl font-extrabold text-slate-900 dark:text-white flex items-center"><HelpCircle className="w-8 h-8 text-blue-600 dark:text-blue-400 mr-4"/> Tuto Casio Graph 35+EII</h1>
                            <div 
                                className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-8 space-y-6 text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed text-sm sm:text-base"
                                dangerouslySetInnerHTML={{ __html: settings.casioGuideContent || DEFAULT_CASIO_FALLBACK }}
                            />
                          </div>
                        )}

                        {currentView === 'terms' && (
                          <div key="view-terms" className="space-y-8 max-w-4xl mx-auto view-transition">
                            <h1 className="text-3xl font-extrabold text-slate-900 dark:text-white flex items-center"><Shield className="w-8 h-8 text-blue-600 dark:text-blue-400 mr-4"/> Conditions d'utilisations</h1>
                            <div 
                                className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-8 space-y-6 text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed text-sm sm:text-base"
                                dangerouslySetInnerHTML={{ __html: settings.termsContent || DEFAULT_TERMS_FALLBACK }}
                            />
                          </div>
                        )}
                    </>
                )}
              </main>

              <footer className="mt-20 border-t border-slate-200 dark:border-slate-800 py-8 text-center text-xs text-slate-500 dark:text-slate-400 max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 transition-colors">
                  <span>WorksBox — Cours & Ressources pour Lycées</span>
                  <div className="flex items-center space-x-4">
                      <button onClick={openTerms} className="hover:text-slate-800 dark:hover:text-slate-200 transition-colors">Conditions</button>
                      <span>•</span>
                      <button onClick={openCasioGuide} className="hover:text-slate-800 dark:hover:text-slate-200 transition-colors">Tuto Casio</button>
                      <span>•</span>
                      <a href="admin.html" className="hover:text-blue-600 dark:hover:text-blue-400 font-semibold transition-colors flex items-center">Administration</a>
                  </div>
              </footer>

              {previewData && (
                  <PreviewModal 
                      data={previewData} 
                      onClose={() => setPreviewData(null)} 
                      onCopy={(link, title) => copyToClipboard(link, title ? `Lien de « ${title} » copié !` : "Lien copié dans le presse-papiers !")}
                      onShare={previewData.course ? () => shareCourse(previewData.course) : undefined}
                      onSaveToCloud={previewData.course ? () => saveCourseToCloudDrive(previewData.course) : undefined}
                  />
              )}

              {showAuthModal && (
                  <AuthModal 
                      onClose={() => { setShowAuthModal(false); setAuthError(null); }} 
                      onGoogleSignIn={handleGoogleSignIn}
                      onLocalSignIn={handleLocalSignIn}
                      isLoading={authLoading}
                      error={authError}
                      onToast={showToast}
                  />
              )}

              {showAccountModal && activeUser && (
                  <AccountModal 
                      user={activeUser}
                      profile={userProfile}
                      isAdmin={isUserAdmin}
                      selectedSchool={selectedSchool}
                      selectedClass={selectedClass}
                      favoritesCount={favorites.length}
                      onOpenFavorites={() => { setShowAccountModal(false); openFavorites(); }}
                      onChangeSchoolClass={() => { setShowAccountModal(false); setShowOnboarding(true); }}
                      onUpgradeToGoogle={() => { setShowAccountModal(false); setShowAuthModal(true); }}
                      onSignOut={handleSignOut}
                      onClose={() => setShowAccountModal(false)}
                  />
              )}

              {toast && (
                  <Toast toast={toast} onClose={hideToast} />
              )}
            </div>
          );
        }

        function AuthModal({ onClose, onGoogleSignIn, onLocalSignIn, isLoading, error, onToast }) {
            const [studentName, setStudentName] = useState(() => {
                const saved = localStorage.getItem('wb_student_name');
                return saved || '';
            });
            const [copiedDomain, setCopiedDomain] = useState(false);
            const isUnauthorizedDomain = error && (
                (typeof error === 'object' && error.code === 'auth/unauthorized-domain') ||
                (typeof error === 'string' && error.includes('unauthorized-domain'))
            );
            const isOperationNotAllowed = error && (
                (typeof error === 'object' && error.code === 'auth/operation-not-allowed') ||
                (typeof error === 'string' && error.includes('operation-not-allowed'))
            );
            const currentHost = window.location.hostname;
            const isInIframe = window.self !== window.top;

            const handleLocalSubmit = (e) => {
                e.preventDefault();
                const nameToUse = studentName.trim() || 'Élève';
                localStorage.setItem('wb_student_name', nameToUse);
                onLocalSignIn(nameToUse);
            };

            return (
                <div id="auth-modal" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 border border-slate-100 dark:border-slate-800 flex flex-col relative animate-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto">
                        <button 
                            id="btn-close-auth"
                            onClick={onClose} 
                            className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors"
                        >
                            <X className="w-5 h-5" />
                        </button>

                        <div className="text-center mb-5 pt-1">
                            <div className="w-14 h-14 bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-sm">
                                <UserIcon className="w-7 h-7" />
                            </div>
                            <h2 className="text-2xl font-black text-slate-900 dark:text-white">Connexion</h2>
                            <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Connectez-vous pour utiliser vos favoris et synchroniser vos préférences.</p>
                        </div>

                        {/* Erreur spécifique Fournisseur Google non activé dans Firebase */}
                        {isOperationNotAllowed ? (
                            <div className="mb-5 p-4 bg-amber-50/90 dark:bg-amber-950/70 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200 text-xs rounded-2xl space-y-3 animate-in fade-in">
                                <div className="flex items-start space-x-2.5">
                                    <AlertCircle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                                    <div>
                                        <p className="font-bold text-slate-900 dark:text-white text-sm">Fournisseur Google non activé</p>
                                        <p className="mt-1 text-slate-600 dark:text-slate-300 leading-relaxed">
                                            La connexion avec Google n'est pas encore activée dans la console Firebase pour le projet <strong>lycee-share</strong>.
                                        </p>
                                        <ol className="list-decimal list-inside mt-2 space-y-1 text-slate-700 dark:text-slate-300 font-medium">
                                            <li>Ouvrez la console Firebase (lien ci-dessous).</li>
                                            <li>Allez dans <em>Authentication</em> &gt; <em>Sign-in method</em>.</li>
                                            <li>Cliquez sur <strong>Google</strong>, activez le bouton et validez.</li>
                                        </ol>
                                    </div>
                                </div>
                                <div className="pt-1">
                                    <a 
                                        href="https://console.firebase.google.com/project/lycee-share/authentication/providers" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center justify-center px-3.5 py-2 bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white rounded-xl font-bold text-[11px] transition-colors shadow-sm"
                                    >
                                        <span>Activer Google dans Firebase Console</span>
                                        <ExternalLink className="w-3.5 h-3.5 ml-1.5" />
                                    </a>
                                </div>
                            </div>
                        ) : isUnauthorizedDomain ? (
                            <div className="mb-5 p-4 bg-amber-50/90 dark:bg-amber-950/70 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200 text-xs rounded-2xl space-y-3 animate-in fade-in">
                                <div className="flex items-start space-x-2.5">
                                    <AlertCircle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                                    <div>
                                        <p className="font-bold text-slate-900 dark:text-white text-sm">Domaine à autoriser dans Firebase</p>
                                        <p className="mt-1 text-slate-600 dark:text-slate-300 leading-relaxed">
                                            Pour activer la connexion Google, ce domaine doit être ajouté aux <strong>Domaines autorisés</strong> de Firebase (projet <code>lycee-share</code>).
                                        </p>
                                    </div>

                                    <div className="flex items-center justify-between">
                                        <span className="font-mono font-semibold text-slate-800 dark:text-slate-200 text-[11px] truncate mr-2">{currentHost}</span>

                                            type="button"
                                            onClick={() => {
                                                 navigator.clipboard.writeText(currentHost);
                                                 setCopiedDomain(true);
                                                 setTimeout(() => setCopiedDomain(false), 2000);
                                                 if (onToast) onToast("Domaine copié dans le presse-papiers !", "success", "copy");
                                            }}
                                            className="flex items-center space-x-1 px-2.5 py-1 bg-amber-100 dark:bg-amber-900 hover:bg-amber-200 dark:hover:bg-amber-800 text-amber-800 dark:text-amber-200 font-bold rounded-lg text-[10px] transition-colors whitespace-nowrap"
                                        >
                                            <span>{copiedDomain ? '✓ Copié !' : 'Copier le domaine'}</span>
                                        </button>
                                    </div>
                                    {currentHost.includes('-dev-') && (
                                        <div className="flex items-center justify-between pt-1 border-t border-slate-100 dark:border-slate-750">
                                            <span className="font-mono text-slate-500 dark:text-slate-400 text-[10px] truncate mr-2">
                                                {currentHost.replace('-dev-', '-pre-')} (domaine partagé)
                                            </span>
                                            <button
                                                type="button"
                                                onClick={() => {
                                                     const preDomain = currentHost.replace('-dev-', '-pre-');
                                                     navigator.clipboard.writeText(preDomain);
                                                     if (onToast) onToast("Domaine partagé (-pre-) copié !", "success", "copy");
                                                }}
                                                className="text-[10px] font-bold text-amber-700 dark:text-amber-300 hover:underline"
                                            >
                                                Copier
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <ol className="list-decimal list-inside space-y-1 text-[11px] text-slate-600 dark:text-slate-300 bg-white/60 dark:bg-slate-900/50 p-2.5 rounded-xl border border-amber-200/50 dark:border-amber-800/50">
                                    <li>Copiez le domaine ci-dessus.</li>
                                    <li>Cliquez sur <strong>Ouvrir la Console Firebase</strong> ci-dessous.</li>
                                    <li>Dans <em>Paramètres</em> &gt; <em>Domaines autorisés</em>, cliquez sur <strong>Ajouter un domaine</strong> et collez l'adresse.</li>
                                </ol>

                                <div className="pt-1 flex flex-col sm:flex-row gap-2">
                                    <a 
                                        href="https://console.firebase.google.com/project/lycee-share/authentication/settings" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center justify-center px-3 py-2 bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white rounded-xl font-bold text-[11px] transition-colors"

                                        <span>Ouvrir la Console Firebase</span>

                                    </a>
                                    {isInIframe && (
                                        <a
                                            href={window.location.href}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center justify-center px-3 py-2 bg-amber-200/90 dark:bg-amber-900/90 hover:bg-amber-300 dark:hover:bg-amber-800 text-amber-950 dark:text-amber-100 rounded-xl font-bold text-[11px] transition-colors"
                                        >
                                            <span>Ouvrir dans un nouvel onglet</span>
                                            <ExternalLink className="w-3.5 h-3.5 ml-1" />
                                        </a>
                                    )}
                                </div>

                                {/* Option immédiate sans blocage */}
                                <div className="pt-2 border-t border-amber-200/70 dark:border-amber-800/70">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            const name = studentName.trim() || 'Élève';
                                            localStorage.setItem('wb_student_name', name);
                                            onLocalSignIn(name);
                                        }}
                                        className="w-full flex items-center justify-center space-x-2 py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-sm transition-all"

                                        <Check className="w-3.5 h-3.5 mr-1" />
                                        <span>Activer le Profil Élève immédiatement (sans attente)</span>

                            </div>
                        ) : error && (
                            <div className="mb-5 p-3.5 bg-red-50 dark:bg-red-950/70 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-300 text-xs rounded-xl flex items-start space-x-2">
                                <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5 text-red-600 dark:text-red-400" />

                                id="btn-google-login"

                            >

                                    <div className="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>

                                    <>
                                        <GoogleIcon className="w-5 h-5" />

                                    </>

                        {/* Séparateur */}

                                <div className="w-full border-t border-slate-200 dark:border-slate-800"></div>

                        {/* Option 2: Profil Élève Local Immédiat */}
                        <form onSubmit={handleLocalSubmit} className="bg-slate-50 dark:bg-slate-800/80 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 mb-4 space-y-2.5">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Votre prénom ou pseudo d'élève :</label>

                                    type="text"
                                    value={studentName}
                                    onChange={(e) => setStudentName(e.target.value)}

                                    className="w-full px-3 py-2 text-xs bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500"
                                />

                            <button
                                type="submit"
                                className="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-sm active:scale-[0.99] transition-all"

                                Activer mon Profil Élève
                            </button>
                            <p className="text-[10px] text-slate-500 dark:text-slate-400 text-center">
                                Mémorise vos favoris et vos cours sur cet appareil sans nécessiter de compte externe.
                            </p>
                        </form>

                        <div className="bg-slate-50 dark:bg-slate-800/80 rounded-2xl p-3.5 border border-slate-200/80 dark:border-slate-700 mb-3 space-y-2">
                            <span className="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block">Avantages</span>
                            <div className="flex items-center text-xs text-slate-700 dark:text-slate-300 space-x-2">
                                <Check className="w-4 h-4 text-emerald-600 dark:text-emerald-400 flex-shrink-0" />
                                <span>Synchronisation automatique de vos cours favoris</span>
                            </div>
                            <div className="flex items-center text-xs text-slate-700 dark:text-slate-300 space-x-2">
                                <Check className="w-4 h-4 text-emerald-600 dark:text-emerald-400 flex-shrink-0" />
                                <span>Mémorisation de votre Lycée et votre Classe</span>
                            </div>
                            <div className="flex items-center text-xs text-slate-700 dark:text-slate-300 space-x-2">
                                <Check className="w-4 h-4 text-emerald-600 dark:text-emerald-400 flex-shrink-0" />
                                <span>Accès multi-appareils avec Google</span>
                            </div>
                        </div>

                        <button 
                            id="btn-guest-continue"
                            onClick={onClose} 
                            className="text-xs text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 text-center font-medium py-1 transition-colors"
                        >
                            Continuer en tant qu'invité
                        </button>
                    </div>
                </div>
            );
        }

        function AccountModal({ user, profile, isAdmin, selectedSchool, selectedClass, favoritesCount, onOpenFavorites, onChangeSchoolClass, onUpgradeToGoogle, onSignOut, onClose }) {
            const isLocal = user?.isLocal;

            return (
                <div id="account-modal" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 border border-slate-100 dark:border-slate-800 flex flex-col relative animate-in zoom-in-95 duration-200">
                        <button 
                            id="btn-close-account"
                            onClick={onClose} 
                            className="absolute top-5 right-5 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors"
                        >
                            <X className="w-5 h-5" />
                        </button>

                        <div className="flex items-center space-x-4 mb-6 pb-6 border-b border-slate-100 dark:border-slate-800">
                            {user.photoURL ? (
                                <img src={user.photoURL} alt="Avatar" className="w-14 h-14 rounded-2xl object-cover border-2 border-blue-500 shadow-sm" />
                            ) : (
                                <div className={`w-14 h-14 rounded-2xl ${isLocal ? 'bg-emerald-600' : (isAdmin ? 'bg-red-600' : 'bg-blue-600')} text-white flex items-center justify-center text-xl font-bold shadow-sm`}>
                                    {(user.displayName || user.email || 'E')[0].toUpperCase()}
                                </div>
                            )}
                            <div className="min-w-0 flex-1">
                                <h2 className="text-lg font-bold text-slate-900 dark:text-white truncate">{user.displayName || (isAdmin ? 'Roman Ferrière' : 'Élève')}</h2>
                                <p className="text-xs text-slate-500 dark:text-slate-400 truncate">{user.email}</p>
                                {isLocal ? (
                                    <span className="inline-flex items-center mt-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700">
                                        <UserIcon className="w-3 h-3 mr-1" /> Profil Élève (Local)
                                    </span>
                                ) : isAdmin ? (
                                    <span className="inline-flex items-center mt-1 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-red-100 dark:bg-red-950 text-red-800 dark:text-red-300 border border-red-300 dark:border-red-800">
                                        <Shield className="w-3 h-3 mr-1" /> Administrateur Officiel
                                    </span>
                                ) : (
                                    <span className="inline-flex items-center mt-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-300 border border-blue-300 dark:border-blue-700">
                                        <Check className="w-3 h-3 mr-1" /> Compte Google vérifié
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="space-y-4 mb-6">
                            {isAdmin && (
                                <div className="p-4 bg-gradient-to-r from-red-950/60 to-slate-900 border border-red-500/50 rounded-2xl flex items-center justify-between shadow-sm">
                                    <div className="text-xs text-slate-200 mr-2">
                                        <span className="font-extrabold flex items-center text-red-400 mb-0.5">
                                            <Shield className="w-4 h-4 mr-1.5 inline" /> Accès Administrateur
                                        </span>
                                        <span className="text-[11px] text-slate-400">Gérer les cours, matières et établissements.</span>
                                    </div>
                                    <a
                                        href="admin.html"
                                        className="px-3.5 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-sm flex items-center space-x-1"
                                    >
                                        <span>Ouvrir</span>
                                        <ExternalLink className="w-3.5 h-3.5" />
                                    </a>
                                </div>
                            )}

                            <div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Établissement & Classe</span>
                                    <button 
                                        onClick={onChangeSchoolClass} 
                                        className="text-xs font-bold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300"
                                    >
                                        Modifier
                                    </button>
                                </div>
                                <p className="text-sm font-bold text-slate-800 dark:text-slate-100">{selectedSchool || 'Non défini'}</p>

                            </div>

                            <div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                                <div>
                                    <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Cours favoris</span>
                                    <p className="text-sm font-bold text-slate-800 dark:text-slate-100">{favoritesCount} cours enregistré{favoritesCount !== 1 ? 's' : ''}</p>
                                </div>
                                <button 
                                    onClick={onOpenFavorites} 
                                    className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all"
                                >
                                    Voir les favoris
                                </button>
                            </div>

                            {isLocal && (
                                <div className="p-3.5 bg-blue-50/70 dark:bg-blue-950/50 border border-blue-200/80 dark:border-blue-800 rounded-2xl flex items-center justify-between">
                                    <div className="text-xs text-slate-700 dark:text-slate-300 mr-2">
                                        <span className="font-bold block text-slate-900 dark:text-white">Synchroniser avec Google ?</span>
                                        <span className="text-[11px] text-slate-500 dark:text-slate-400">Liez votre compte Google à ce profil.</span>
                                    </div>
                                    <button
                                        onClick={onUpgradeToGoogle}
                                        className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-sm"
                                    >
                                        Lier Google
                                    </button>
                                </div>
                            )}
                        </div>

                        <div className="pt-2 border-t border-slate-100 dark:border-slate-800 flex flex-col space-y-2">
                            <button 
                                id="btn-signout"
                                onClick={onSignOut}
                                className="w-full flex items-center justify-center space-x-2 py-2.5 px-4 bg-red-50 dark:bg-red-950/50 hover:bg-red-100 dark:hover:bg-red-900/50 text-red-700 dark:text-red-300 font-bold text-xs sm:text-sm rounded-xl border border-red-200 dark:border-red-900 active:scale-[0.99] transition-all"
                            >
                                <LogOut className="w-4 h-4" />
                                <span>Se déconnecter</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function FileTypeBadge({ fileType, mediaType }) {
            const ext = (fileType || '').toLowerCase().replace(/^\./, '');
            const media = mediaType || '';

            if (media === 'video' || ext === 'mp4' || ext === 'webm' || ext === 'mkv') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-red-100 text-red-700 border border-red-200 uppercase tracking-wider">
                        <VideoIcon className="w-2.5 h-2.5 mr-1" /> {ext ? ext.toUpperCase() : 'VIDÉO'}
                    </span>
                );
            }
            if (media === 'audio' || ext === 'mp3' || ext === 'wav' || ext === 'm4a') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-purple-100 text-purple-700 border border-purple-200 uppercase tracking-wider">
                        <MusicIcon className="w-2.5 h-2.5 mr-1" /> {ext ? ext.toUpperCase() : 'AUDIO'}
                    </span>
                );
            }
            if (media === 'casio' || ext === 'g1m' || ext === 'txt') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-emerald-100 text-emerald-800 border border-emerald-200 uppercase tracking-wider">
                        <Calculator className="w-2.5 h-2.5 mr-1" /> {ext ? ext.toUpperCase() : 'CASIO'}
                    </span>
                );
            }
            if (media === 'presentation' || ext === 'pptx' || ext === 'ppt') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-orange-100 text-orange-700 border border-orange-200 uppercase tracking-wider">
                        <FileText className="w-2.5 h-2.5 mr-1" /> PPTX
                    </span>
                );
            }
            if (media === 'spreadsheet' || ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-green-100 text-green-700 border border-green-200 uppercase tracking-wider">
                        <FileText className="w-2.5 h-2.5 mr-1" /> XLSX
                    </span>
                );
            }
            if (media === 'image' || ['png', 'jpg', 'jpeg', 'webp', 'svg'].includes(ext)) {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-amber-100 text-amber-700 border border-amber-200 uppercase tracking-wider">
                        <ImageIcon className="w-2.5 h-2.5 mr-1" /> {ext ? ext.toUpperCase() : 'IMAGE'}
                    </span>
                );
            }
            if (ext === 'pdf') {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-blue-100 text-blue-700 border border-blue-200 uppercase tracking-wider">
                        <FileText className="w-2.5 h-2.5 mr-1" /> PDF
                    </span>
                );
            }
            if (ext) {
                return (
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-black bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 uppercase tracking-wider">
                        {ext.toUpperCase()}
                    </span>
                );
            }
            return null;
        }

                                <Star className="w-5 h-5 sm:w-6 sm:h-6" filled={isFav} />
                            </button>
                            {(onShare || onCopy) && (

                                {showSubject && <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">{course.subject}</span>}
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider ${style}`}>{courseTag}</span>
                                <FileTypeBadge fileType={course.fileType} mediaType={course.mediaType} />
                            </div>
                            <h4 className="text-lg font-semibold text-slate-900 dark:text-white truncate">{course.title}</h4>

                    </div>
                    <div className="flex items-center space-x-2 flex-wrap gap-2">
                        {course.digitalLink && <button onClick={() => handleView(course, 'Numérique')} className="px-3 py-1.5 bg-blue-50 dark:bg-blue-950/60 hover:bg-blue-100 dark:hover:bg-blue-900 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><Eye className="w-4 h-4 mr-1"/> PDF</button>}
                        {course.casioLink && <button onClick={() => handleView(course, 'Casio')} className="px-3 py-1.5 bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><Calculator className="w-4 h-4 mr-1"/> Casio</button>}
                        {course.videoLink && <button onClick={() => handleView(course, 'Vidéo')} className="px-3 py-1.5 bg-red-50 dark:bg-red-950/60 hover:bg-red-100 dark:hover:bg-red-900 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><VideoIcon className="w-4 h-4 mr-1"/> Vidéo</button>}
                        {course.imageLink && <button onClick={() => handleView(course, 'Image')} className="px-3 py-1.5 bg-amber-50 dark:bg-amber-950/60 hover:bg-amber-100 dark:hover:bg-amber-900 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><ImageIcon className="w-4 h-4 mr-1"/> Image</button>}
                        {course.audioLink && <button onClick={() => handleView(course, 'Audio')} className="px-3 py-1.5 bg-purple-50 dark:bg-purple-950/60 hover:bg-purple-100 dark:hover:bg-purple-900 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"><MusicIcon className="w-4 h-4 mr-1"/> Audio</button>}
                        {onSaveToCloud && (
                            <button 
                                type="button"
                                onClick={onSaveToCloud}
                                className="px-2.5 py-1.5 bg-sky-50 dark:bg-sky-950/60 hover:bg-sky-100 dark:hover:bg-sky-900 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"
                                title="Sauvegarder ce cours dans mon Google Drive (1 Go)"
                            >
                                <Cloud className="w-4 h-4 mr-1 text-sky-500 dark:text-sky-400" />
                                <span className="hidden sm:inline">Drive</span>
                            </button>
                        )}
                        <button 
                            type="button"
                            onClick={() => onShare ? onShare(course) : (onCopy ? onCopy(course) : null)} 
                            className="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-950/60 text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-300 border border-slate-200 dark:border-slate-700 rounded-lg text-xs sm:text-sm font-medium flex items-center transition-all active:scale-95"
                            title="Partager ce cours (copier le lien direct)"
                        >
                            <Share2 className="w-4 h-4 mr-1.5 text-blue-500 dark:text-blue-400" />
                            <span>Partager</span>
                        </button>
