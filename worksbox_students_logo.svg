<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="iconBlueGradStd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowPillStd" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadowStd" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g transform="translate(16, 18)" filter="url(#iconShadowStd)">
    <!-- App Icon Rounded Squircle -->
    <rect width="104" height="104" rx="26" fill="url(#iconBlueGradStd)"/>

    <!-- Open Book with Pencil Spine -->
    <g fill="#ffffff">
      <!-- Left Page -->
      <path d="M 47,40 C 37,34 27,35 19,38 C 17.5,38.6 17,40 17,41.5 L 17,67.5 C 17,68.8 17.8,69.8 19,69.5 C 27,66.5 37,66.5 47,72.5 Z" />
      
      <!-- Right Page -->
      <path d="M 57,40 C 67,34 77,35 85,38 C 86.5,38.6 87,40 87,41.5 L 87,67.5 C 87,68.8 86.2,69.8 85,69.5 C 77,66.5 67,66.5 57,72.5 Z" />

      <!-- Pencil Body (Spine) -->
      <rect x="49" y="38" width="6" height="32" rx="1"/>

      <!-- Pencil Tip Pointing Up -->
      <polygon points="48,37 56,37 52,24" fill="#ffffff"/>
      <polygon points="50.5,29 53.5,29 52,24" fill="#1e3a8a"/>

      <!-- Pencil Lead / Base Detail -->
      <polygon points="49,71 55,71 52,76" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography WorksBox -->
  <text x="138" y="78" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="-1.5" 
        fill="#72b3f7">WorksBox</text>

  <!-- Capsule Badge STUDENTS -->
  <g transform="translate(290, 84)" filter="url(#shadowPillStd)">
    <rect width="234" height="42" rx="21" fill="#c5221f"/>
    <rect x="1" y="1" width="232" height="40" rx="20" fill="none" stroke="#ea4335" stroke-width="2"/>
    <text x="117" y="27" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#f4f5a3">STUDENTS</text>
  </g>
</svg>
