        const deduplicateCourses = (list) => {
            if (!Array.isArray(list)) return [];
            const seen = new Set();
            const result = [];
            for (const item of list) {
                if (!item) continue;
                const key = item.id || `${item.title}_${item.subject}_${item.school}_${item.classe}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    result.push(item);
                }
            }
            return result;
        };

            const [classifiedCourses, setClassifiedCourses] = useState([]);
            const [isSavingBatch, setIsSavingBatch] = useState(false);
            const [isSyncingFirebase, setIsSyncingFirebase] = useState(false);
            const fileInputRef = useRef(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Surveillance de l'authentification Google Administrateur
            useEffect(() => {
                if (!dataAuth) {
                    setIsAuthLoading(false);
                    return;
                }
                const unsub = onAuthStateChanged(dataAuth, (user) => {
                    if (user && !user.isAnonymous) {
                        setCurrentUser(user);
                    } else {
                        setCurrentUser(null);
                    }
                    setIsAuthLoading(false);
                });
                return () => unsub();
            }, []);

            const isAuthorizedAdmin = checkIsAdmin(currentUser);

            const handleGoogleLogin = async () => {
                if (!dataAuth) return showToast('Firebase Auth non initialisé', 'error');
                setAuthError(null);
                setIsAuthLoading(true);
                try {
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    const res = await signInWithPopup(dataAuth, provider);
                    if (!checkIsAdmin(res.user)) {
                        setCurrentUser(res.user);
                        setAuthError(`Le compte « ${res.user.email} » n'est pas autorisé à administrer WorksBox.`);
                    } else {
                        setCurrentUser(res.user);
                        showToast(`Bienvenue Roman (${res.user.email}) !`);
                    }
                } catch (err) {
                    console.error('Google Sign In Error:', err);
                    setAuthError(err.message || 'Erreur lors de la connexion Google.');
                } finally {
                    setIsAuthLoading(false);
                }
            };

            const handleAdminLogout = async () => {
                try {
                    if (dataAuth) await signOut(dataAuth);
                    setCurrentUser(null);
                    showToast('Déconnexion réussie.');
                } catch (e) {
                    console.error(e);
                }
            };

            // Firestore real-time sync (uniquement si administrateur autorisé)
            useEffect(() => {
                if (!dataDb || !isAuthorizedAdmin) return;
                const unsubSettings = onSnapshot(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'settings', 'global'), (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        setSettings(prev => ({
                            ...prev,
                            ...d,
                            schools: Array.isArray(d.schools) ? d.schools : prev.schools,
                            classes: Array.isArray(d.classes) ? d.classes : prev.classes,
                            subjects: Array.isArray(d.subjects) ? d.subjects : (Array.isArray(d.subjectOrder) ? d.subjectOrder : prev.subjects),
                            schoolClasses: (typeof d.schoolClasses === 'object' && d.schoolClasses) ? d.schoolClasses : prev.schoolClasses,
                            schoolClassSubjects: (typeof d.schoolClassSubjects === 'object' && d.schoolClassSubjects) ? d.schoolClassSubjects : prev.schoolClassSubjects,
                            classSubjects: (typeof d.classSubjects === 'object' && d.classSubjects) ? d.classSubjects : prev.classSubjects,
                            tagColors: { ...DEFAULT_TAG_COLORS, ...(d.tagColors || {}) }
                        }));
                    }
                }, err => console.warn('Settings snap err:', err));

                const unsubCourses = onSnapshot(collection(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses'), (snap) => {
                    const list = snap.docs.map(d => {
                        const data = d.data();
                        let resolvedSchool = data.school;
                        if (!resolvedSchool || resolvedSchool === 'Lycée François Bazin') {
                            if (data.classe === 'BTS SIO 1' || data.classe === 'BTS SIO 2') {
                                resolvedSchool = 'Lycée Gaspard Monge';
                            } else if (!resolvedSchool) {
                                resolvedSchool = 'Lycée François Bazin';
                            }
                        }
                        return { id: d.id, ...data, school: resolvedSchool };
                    });
                    setCourses(deduplicateCourses(list));
                }, err => console.warn('Courses snap err:', err));

                const unsubArticles = onSnapshot(collection(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'articles'), (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => new Date(b.date) - new Date(a.date));
                    setArticles(list);
                }, err => console.warn('Articles snap err:', err));

                return () => { unsubSettings(); unsubCourses(); unsubArticles(); };
            }, [isAuthorizedAdmin]);

            // Save local cache
            useEffect(() => {
                try {
                    localStorage.setItem('worksbox_courses', JSON.stringify(courses));
                    localStorage.setItem('worksbox_articles', JSON.stringify(articles));
                    localStorage.setItem('worksbox_settings', JSON.stringify(settings));
                } catch(e) {}
            }, [courses, articles, settings]);

            // Ensure valid school/class
            const schoolsList = settings.schools && settings.schools.length > 0 ? settings.schools : DEFAULT_SCHOOLS;

            const allClassesList = useMemo(() => {
                const set = new Set([...(settings.classes || DEFAULT_CLASSES)]);
                if (settings.schoolClasses && typeof settings.schoolClasses === 'object') {
                    Object.values(settings.schoolClasses).forEach(arr => {
                        if (Array.isArray(arr)) arr.forEach(c => set.add(c));
                    });
                }
                courses.forEach(c => { if (c.classe) set.add(c.classe); });
                return Array.from(set).filter(Boolean);
            }, [settings.classes, settings.schoolClasses, courses]);

            const getClassesForSchool = (schoolName) => {
                if (!schoolName) return allClassesList;
                if (settings.schoolClasses && Array.isArray(settings.schoolClasses[schoolName])) {
                    return settings.schoolClasses[schoolName];
                }
                if (DEFAULT_SCHOOL_CLASSES[schoolName]) {
                    return DEFAULT_SCHOOL_CLASSES[schoolName];
                }
                return allClassesList;
            };

            const classesList = useMemo(() => {
                return getClassesForSchool(assocSchool);
            }, [assocSchool, settings.schoolClasses, allClassesList]);

            useEffect(() => {
                if (!schoolsList.includes(assocSchool) && schoolsList.length > 0) setAssocSchool(schoolsList[0]);
            }, [schoolsList, assocSchool]);

            useEffect(() => {
                if (!classesList.includes(assocClass) && classesList.length > 0) setAssocClass(classesList[0]);
            }, [classesList, assocClass]);

            const subjectsList = settings.subjects && settings.subjects.length > 0 ? settings.subjects : DEFAULT_SUBJECTS;

            const getSubjectsForClass = (schoolName, className) => {
                if (!className) return [];
                const pairKey = `${schoolName}__${className}`;
                if (settings.schoolClassSubjects && settings.schoolClassSubjects[pairKey] !== undefined && Array.isArray(settings.schoolClassSubjects[pairKey])) {
                    return settings.schoolClassSubjects[pairKey];
                }
                if (DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey]) {
                    return DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey];
                }
                if (settings.classSubjects && settings.classSubjects[className] !== undefined && Array.isArray(settings.classSubjects[className])) {
                    return settings.classSubjects[className];
                }
                if (DEFAULT_CLASS_SUBJECTS[className]) {
                    return DEFAULT_CLASS_SUBJECTS[className];
                }
                return [];
            };

            const currentAssociatedSubjects = useMemo(() => {
                return getSubjectsForClass(assocSchool, assocClass);
            }, [assocSchool, assocClass, settings.schoolClassSubjects, settings.classSubjects]);

            const tagColors = { ...DEFAULT_TAG_COLORS, ...(settings.tagColors || {}) };

            // Handlers
            const handleUpdateSettings = async (keyOrObj, maybeVal) => {
                const updates = typeof keyOrObj === 'string' ? { [keyOrObj]: maybeVal } : keyOrObj;
                setSettings(prev => ({ ...prev, ...updates }));
                if (dataDb) {
                    try {
                        await setDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'settings', 'global'), updates, { merge: true });
                        showToast('Paramètres synchronisés !');
                    } catch (e) {
                        showToast('Erreur Firestore : ' + e.message, 'error');
                    }
                }
            };

            // Associations Lycées <-> Classes
            const handleToggleSchoolClass = async (school, cls) => {
                const current = getClassesForSchool(school);
                let updated;
                if (current.includes(cls)) {
                    updated = current.filter(c => c !== cls);
                } else {
                    updated = [...current, cls];
                }
                const updatedSC = { ...(settings.schoolClasses || DEFAULT_SCHOOL_CLASSES), [school]: updated };
                await handleUpdateSettings('schoolClasses', updatedSC);
                showToast(`Classe « ${cls} » ${updated.includes(cls) ? 'rattachée à' : 'retirée de'} ${school}`);
            };

            const handleSetAllSchoolClasses = async (school, enableAll) => {
                const updatedSC = { ...(settings.schoolClasses || DEFAULT_SCHOOL_CLASSES), [school]: enableAll ? [...allClassesList] : [] };
                await handleUpdateSettings('schoolClasses', updatedSC);
                showToast(enableAll ? `Toutes les classes associées à ${school}` : `Toutes les classes dissociées de ${school}`);
            };

            // Associations Classes <-> Matières
            const handleToggleSubjectForClass = async (school, cls, subj) => {
                const pairKey = `${school}__${cls}`;
                const current = getSubjectsForClass(school, cls);
                let updated;
                if (current.includes(subj)) {
                    updated = current.filter(s => s !== subj);
                } else {
                    updated = [...current, subj];
                }
                const updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS), [pairKey]: updated };
                const updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS), [cls]: updated };
                await handleUpdateSettings({ schoolClassSubjects: updatedSCS, classSubjects: updatedCS });
                showToast(`Matière « ${subj} » ${updated.includes(subj) ? 'associée à' : 'dissociée de'} ${cls}`);
            };

            const handleSetAllSubjectsForClass = async (school, cls, enableAll) => {
                const pairKey = `${school}__${cls}`;
                const updatedList = enableAll ? [...subjectsList] : [];
                const updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS), [pairKey]: updatedList };
                const updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS), [cls]: updatedList };
                await handleUpdateSettings({ schoolClassSubjects: updatedSCS, classSubjects: updatedCS });
                showToast(enableAll ? `Toutes les matières associées à ${cls}` : `Toutes les matières dissociées de ${cls}`);
            };

            const handleResetDefaultClassSubjects = async (school, cls) => {
                const pairKey = `${school}__${cls}`;
                const defPair = DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey];
                const defClass = DEFAULT_CLASS_SUBJECTS[cls] || DEFAULT_SUBJECTS;
                const target = defPair || defClass;
                const updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS), [pairKey]: target };
                const updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS), [cls]: target };
                await handleUpdateSettings({ schoolClassSubjects: updatedSCS, classSubjects: updatedCS });
                showToast(`Matières par défaut rétablies pour ${cls} (${target.length} matières)`);
            };

            // Lycées
            const handleAddSchool = async (name) => {
                const val = (name || newSchoolInput).trim();
                if (!val) return showToast('Nom de lycée requis', 'warning');
                if (schoolsList.includes(val)) return showToast('Ce lycée existe déjà', 'warning');
                const updated = [...schoolsList, val];
                const updatedSC = { ...(settings.schoolClasses || {}), [val]: [...(classesList)] };
                await handleUpdateSettings({ schools: updated, schoolClasses: updatedSC });
                setNewSchoolInput('');
                setAssocSchool(val);
                showToast(`Lycée « ${val} » ajouté avec succès !`);
            };

            const handleDeleteSchool = (sch) => {
                setDeleteGenericModal({
                    title: `Supprimer le lycée « ${sch} »`,
                    message: `Êtes-vous sûr de vouloir supprimer ce lycée ? Toutes ses associations de classes seront également retirées.`,
                    onConfirm: async () => {
                        const updated = schoolsList.filter(s => s !== sch);
                        const updatedSC = { ...(settings.schoolClasses || {}) };
                        delete updatedSC[sch];
                        await handleUpdateSettings({ schools: updated, schoolClasses: updatedSC });
                        if (assocSchool === sch && updated.length > 0) setAssocSchool(updated[0]);
                        showToast(`Lycée « ${sch} » supprimé.`);
                    }
                });
            };

            // Classes
            const handleAddClass = async (name) => {
                const val = (name || newClassInput).trim();
                if (!val) return showToast('Nom de classe requis', 'warning');
                let updated = [...(settings.classes || DEFAULT_CLASSES)];
                if (!updated.includes(val)) updated.push(val);
                const updatedSC = { ...(settings.schoolClasses || {}) };
                if (!updatedSC[assocSchool]) updatedSC[assocSchool] = [];
                if (!updatedSC[assocSchool].includes(val)) updatedSC[assocSchool].push(val);
                await handleUpdateSettings({ classes: updated, schoolClasses: updatedSC });
                setNewClassInput('');
                setAssocClass(val);
                showToast(`Classe « ${val} » ajoutée avec succès !`);
            };

            const handleDeleteClass = (cls) => {
                setDeleteGenericModal({
                    title: `Supprimer la classe « ${cls} »`,
                    message: `Êtes-vous sûr de vouloir supprimer cette classe de la liste ?`,
                    onConfirm: async () => {
                        const updated = (settings.classes || []).filter(c => c !== cls);
                        const updatedSC = { ...(settings.schoolClasses || {}) };
                        Object.keys(updatedSC).forEach(k => {
                            updatedSC[k] = (updatedSC[k] || []).filter(c => c !== cls);
                        });
                        await handleUpdateSettings({ classes: updated, schoolClasses: updatedSC });
                        if (assocClass === cls && updated.length > 0) setAssocClass(updated[0]);
                        showToast(`Classe « ${cls} » supprimée.`);
                    }
                });
            };

            // Matières
            const handleCreateSubject = async (name, associateToCurrentClass = true) => {
                const val = (name || '').trim();
                if (!val) return showToast('Nom de matière requis', 'warning');
                
                let updated = [...subjectsList];
                if (!subjectsList.some(s => s.toLowerCase() === val.toLowerCase())) {
                    updated.push(val);
                }

                let updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS) };
                let updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS) };

                if (associateToCurrentClass && assocSchool && assocClass) {
                    const pairKey = `${assocSchool}__${assocClass}`;
                    const currentClassSubs = getSubjectsForClass(assocSchool, assocClass);
                    const updatedClassSubs = currentClassSubs.includes(val) ? currentClassSubs : [...currentClassSubs, val];
                    updatedSCS[pairKey] = updatedClassSubs;
                    updatedCS[assocClass] = updatedClassSubs;
                }

                await handleUpdateSettings({ 
                    subjects: updated, 
                    subjectOrder: updated,
                    schoolClassSubjects: updatedSCS,
                    classSubjects: updatedCS
                });
                setNewSubjectInput('');
                showToast(`Matière « ${val} » ${associateToCurrentClass ? `créée et associée à ${assocClass}` : 'créée'} !`);
            };

            const handleAddSubject = async (name) => {
                const val = (name || newSubjectInput).trim();
                if (!val) {
                    setAddSubjectModalOpen(true);
                    return;
                }
                await handleCreateSubject(val, true);
            };

            const executeDeleteSubjectFromClass = async (subj, school = assocSchool, cls = assocClass) => {
                const targetSubjLower = (subj || '').trim().toLowerCase();
                const targetSchoolLower = (school || '').trim().toLowerCase();
                const targetClassLower = (cls || '').trim().toLowerCase();

                const classCourses = courses.filter(c => {
                    const cSubj = (c.subject || '').trim().toLowerCase();
                    const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim().toLowerCase();
                    const cClass = (c.classe || 'Terminale STI2D').trim().toLowerCase();
                    return cSubj === targetSubjLower && cSchool === targetSchoolLower && cClass === targetClassLower;
                });

                // 1. Supprimer uniquement les cours de cette classe
                if (classCourses.length > 0 && dataDb) {
                    for (const c of classCourses) {
                        await deleteDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', c.id)).catch(() => {});
                    }
                }
                const deletedIds = new Set(classCourses.map(c => c.id));
                setCourses(prev => prev.filter(c => !deletedIds.has(c.id)));

                // 2. Retirer de l'association de cette classe
                const pairKey = `${school}__${cls}`;
                const current = getSubjectsForClass(school, cls);
                const updated = current.filter(s => s.trim().toLowerCase() !== targetSubjLower);
                const updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS), [pairKey]: updated };
                const updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS), [cls]: updated };
                await handleUpdateSettings({ schoolClassSubjects: updatedSCS, classSubjects: updatedCS });

                if (selectedSubject && selectedSubject.trim().toLowerCase() === targetSubjLower) {
                    setSelectedSubject(null);
                }
                setDeleteSubjectModal(null);
                showToast(`Matière « ${subj} » retirée de ${cls} (${classCourses.length} cours supprimés).`);
            };

            const executeDeleteSubjectGlobal = async (subj) => {
                const targetSubjLower = (subj || '').trim().toLowerCase();
                const targetCourses = courses.filter(c => (c.subject || '').trim().toLowerCase() === targetSubjLower);

                // 1. Supprimer tous les cours associés de Firebase
                if (targetCourses.length > 0 && dataDb) {
                    for (const c of targetCourses) {
                        await deleteDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', c.id)).catch(() => {});
                    }
                }
                const deletedIds = new Set(targetCourses.map(c => c.id));
                setCourses(prev => prev.filter(c => !deletedIds.has(c.id)));

                // 2. Retirer de la liste globale
                const updated = subjectsList.filter(s => s.trim().toLowerCase() !== targetSubjLower);
                
                // 3. Retirer de toutes les associations
                const updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS) };
                Object.keys(updatedSCS).forEach(k => {
                    if (Array.isArray(updatedSCS[k])) {
                        updatedSCS[k] = updatedSCS[k].filter(s => s.trim().toLowerCase() !== targetSubjLower);
                    }
                });
                const updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS) };
                Object.keys(updatedCS).forEach(k => {
                    if (Array.isArray(updatedCS[k])) {
                        updatedCS[k] = updatedCS[k].filter(s => s.trim().toLowerCase() !== targetSubjLower);
                    }
                });

                await handleUpdateSettings({ 
                    subjects: updated, 
                    subjectOrder: updated,
                    schoolClassSubjects: updatedSCS,
                    classSubjects: updatedCS
                });

                if (selectedSubject && selectedSubject.trim().toLowerCase() === targetSubjLower) {
                    setSelectedSubject(null);
                }
                setDeleteSubjectModal(null);
                showToast(`Matière « ${subj} » supprimée globalement de toutes les classes.`);
            };

            const handleDeleteSubject = (subj) => {
                const sLower = (subj || '').trim().toLowerCase();
                const sSchoolLower = (assocSchool || '').trim().toLowerCase();
                const sClassLower = (assocClass || '').trim().toLowerCase();

                const classCount = courses.filter(c => {
                    const cSubj = (c.subject || '').trim().toLowerCase();
                    const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim().toLowerCase();
                    const cClass = (c.classe || 'Terminale STI2D').trim().toLowerCase();
                    return cSubj === sLower && cSchool === sSchoolLower && cClass === sClassLower;
                }).length;

                const totalCount = courses.filter(c => (c.subject || '').trim().toLowerCase() === sLower).length;

                setDeleteSubjectModal({
                    subject: subj,
                    school: assocSchool,
                    classe: assocClass,
                    classCount,
                    totalCount
                });
            };

            const handleRenameSubject = async (oldName, newName, scope = 'class') => {
                const clean = (newName || '').trim();
                if (!clean || clean === oldName) return;
                
                const oldLower = oldName.trim().toLowerCase();

                if (scope === 'class') {
                    // Spécifique à la classe
                    const pairKey = `${assocSchool}__${assocClass}`;
                    const current = getSubjectsForClass(assocSchool, assocClass);
                    const updatedSubsForClass = current.map(s => s.trim().toLowerCase() === oldLower ? clean : s);
                    const updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS), [pairKey]: updatedSubsForClass };
                    const updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS), [assocClass]: updatedSubsForClass };
                    
                    let globalSubs = [...subjectsList];
                    if (!globalSubs.some(s => s.toLowerCase() === clean.toLowerCase())) globalSubs.push(clean);

                    await handleUpdateSettings({ 
                        subjects: globalSubs, 
                        subjectOrder: globalSubs,
                        schoolClassSubjects: updatedSCS, 
                        classSubjects: updatedCS 
                    });

                    // Mettre à jour uniquement les cours de cette classe
                    const classCourses = courses.filter(c => {
                        const cSubj = (c.subject || '').trim().toLowerCase();
                        const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim().toLowerCase();
                        const cClass = (c.classe || 'Terminale STI2D').trim().toLowerCase();
                        return cSubj === oldLower && cSchool === (assocSchool || '').trim().toLowerCase() && cClass === (assocClass || '').trim().toLowerCase();
                    });

                    if (dataDb) {
                        for (const c of classCourses) {
                            await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', c.id), { subject: clean }).catch(() => {});
                        }
                    }
                    setCourses(prev => prev.map(c => {
                        const cSubj = (c.subject || '').trim().toLowerCase();
                        const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim().toLowerCase();
                        const cClass = (c.classe || 'Terminale STI2D').trim().toLowerCase();
                        if (cSubj === oldLower && cSchool === (assocSchool || '').trim().toLowerCase() && cClass === (assocClass || '').trim().toLowerCase()) {
                            return { ...c, subject: clean };
                        }
                        return c;
                    }));
                    if (selectedSubject && selectedSubject.trim().toLowerCase() === oldLower) setSelectedSubject(clean);
                    setRenameModal(null);
                    showToast(`Matière renommée en « ${clean} » pour ${assocClass} !`);
                } else {
                    // Global pour toutes les classes
                    const updated = subjectsList.map(s => s.trim().toLowerCase() === oldLower ? clean : s);
                    
                    const updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS) };
                    Object.keys(updatedSCS).forEach(k => {
                        if (Array.isArray(updatedSCS[k])) {
                            updatedSCS[k] = updatedSCS[k].map(s => s.trim().toLowerCase() === oldLower ? clean : s);
                        }
                    });
                    const updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS) };
                    Object.keys(updatedCS).forEach(k => {
                        if (Array.isArray(updatedCS[k])) {
                            updatedCS[k] = updatedCS[k].map(s => s.trim().toLowerCase() === oldLower ? clean : s);
                        }
                    });

                    await handleUpdateSettings({ 
                        subjects: updated, 
                        subjectOrder: updated,
                        schoolClassSubjects: updatedSCS,
                        classSubjects: updatedCS
                    });

                    if (dataDb) {
                        for (const c of courses.filter(c => (c.subject || '').trim().toLowerCase() === oldLower)) {
                            await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', c.id), { subject: clean }).catch(() => {});
                        }
                    }
                    setCourses(prev => prev.map(c => (c.subject || '').trim().toLowerCase() === oldLower ? { ...c, subject: clean } : c));
                    if (selectedSubject && selectedSubject.trim().toLowerCase() === oldLower) setSelectedSubject(clean);
                    setRenameModal(null);
                    showToast(`Matière renommée globalement en « ${clean} » !`);
                }
            };

            // Courses CRUD
            const handleSaveCourse = async (courseData) => {
                try {
                    const clean = {
                        title: (courseData.title || '').trim(),
                        subject: courseData.subject || subjectsList[0] || 'Général',
                        chapter: (courseData.chapter || '').trim() || 'Chapitre 1',
                        chapterOrder: Number(courseData.chapterOrder) || 1,
                        courseOrder: Number(courseData.courseOrder) || 1,
                        school: courseData.school || assocSchool,
                        classe: courseData.classe || assocClass,
                        tag: courseData.tag || 'Cours',
                        digitalLink: (courseData.digitalLink || '').trim(),
                        casioLink: (courseData.casioLink || '').trim(),
                        videoLink: (courseData.videoLink || '').trim(),
                        audioLink: (courseData.audioLink || '').trim(),
                        imageLink: (courseData.imageLink || '').trim(),
                        isVisible: courseData.isVisible !== false,
                        viewsDigital: Number(courseData.viewsDigital) || 0,
                        viewsCasio: Number(courseData.viewsCasio) || 0,
                        updatedAt: new Date().toISOString()
                    };

                    if (editingCourse && editingCourse.id) {
                        if (dataDb) await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', editingCourse.id), clean);
                        setCourses(prev => prev.map(c => c.id === editingCourse.id ? { ...c, ...clean } : c));
                        showToast('Cours mis à jour !');
                    } else {
                        clean.createdAt = new Date().toISOString();
                        if (dataDb) {
                            const newDoc = await addDoc(collection(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses'), clean);
                            setCourses(prev => [{ id: newDoc.id, ...clean }, ...prev]);
                        } else {
                            setCourses(prev => [{ id: 'course-' + Date.now(), ...clean }, ...prev]);
                        }
                        showToast('Nouveau cours ajouté !');
                    }
                    setIsUploadOpen(false);
                    setEditingCourse(null);
                } catch (e) {
                    showToast('Erreur cours : ' + e.message, 'error');
                }
            };

            const handleDeleteCourse = async (id, title) => {
                if (!confirm(`Supprimer définitivement « ${title} » ?`)) return;
                try {
                    if (dataDb) await deleteDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', id));
                    setCourses(prev => prev.filter(c => c.id !== id));
                    showToast('Cours supprimé !');
                } catch (e) {
                    showToast('Erreur suppression : ' + e.message, 'error');
                }
            };

            const handleToggleVisibility = async (course) => {
                const nextVis = course.isVisible === false ? true : false;
                try {
                    if (dataDb) await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', course.id), { isVisible: nextVis });
                    setCourses(prev => prev.map(c => c.id === course.id ? { ...c, isVisible: nextVis } : c));
                    showToast(nextVis ? 'Cours en ligne' : 'Cours masqué');
                } catch (e) {
                    showToast('Erreur visibilité : ' + e.message, 'error');
                }
            };

            // Reordering
            const handleMoveChapter = async (subject, chapterName, direction) => {
                const subjectCourses = courses.filter(c => c.subject === subject && c.school === assocSchool && c.classe === assocClass);
                const uniqueChaps = Array.from(new Set(subjectCourses.map(c => c.chapter)));
                const idx = uniqueChaps.indexOf(chapterName);
                if (idx < 0) return;
                const targetIdx = idx + direction;
                if (targetIdx < 0 || targetIdx >= uniqueChaps.length) return;
                
                const otherChap = uniqueChaps[targetIdx];
                // Swap chapterOrder
                for (const c of subjectCourses) {
                    if (c.chapter === chapterName) {
                        const newOrder = targetIdx + 1;
                        if (dataDb) await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', c.id), { chapterOrder: newOrder });
                    } else if (c.chapter === otherChap) {
                        const newOrder = idx + 1;
                        if (dataDb) await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', c.id), { chapterOrder: newOrder });
                    }
                }
                showToast('Ordre des chapitres mis à jour !');
            };

            const handleMoveCourse = async (courseId, direction) => {
                const c = courses.find(item => item.id === courseId);
                if (!c) return;
                const inChapter = courses.filter(item => item.subject === c.subject && item.chapter === c.chapter && item.school === c.school && item.classe === c.classe)
                    .sort((a, b) => (a.courseOrder || 0) - (b.courseOrder || 0));
                const idx = inChapter.findIndex(item => item.id === courseId);
                const targetIdx = idx + direction;
                if (targetIdx < 0 || targetIdx >= inChapter.length) return;
                
                const otherCourse = inChapter[targetIdx];
                const cOrder = c.courseOrder || (idx + 1);
                const otherOrder = otherCourse.courseOrder || (targetIdx + 1);

                if (dataDb) {
                    await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', c.id), { courseOrder: otherOrder });
                    await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', otherCourse.id), { courseOrder: cOrder });
                }
                showToast('Ordre du cours mis à jour !');
            };

            // Articles CRUD
            const handleSaveArticle = async (articleData) => {
                try {
                    const clean = {
                        title: (articleData.title || '').trim(),
                        content: (articleData.content || '').trim(),
                        date: articleData.date || new Date().toISOString().split('T')[0],
                        school: articleData.school || assocSchool,
                        classe: articleData.classe || assocClass,
                        imageUrl: (articleData.imageUrl || '').trim(),
                        videoUrl: (articleData.videoUrl || '').trim(),
                        pinned: !!articleData.pinned
                    };
                    if (editingArticle && editingArticle.id) {
                        if (dataDb) await updateDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'articles', editingArticle.id), clean);
                        setArticles(prev => prev.map(a => a.id === editingArticle.id ? { ...a, ...clean } : a));
                        showToast('Article mis à jour !');
                    } else {
                        if (dataDb) {
                            const newDoc = await addDoc(collection(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'articles'), clean);
                            setArticles(prev => [{ id: newDoc.id, ...clean }, ...prev]);
                        } else {
                            setArticles(prev => [{ id: 'art-' + Date.now(), ...clean }, ...prev]);
                        }
                        showToast('Article publié !');
                    }
                    setIsArticleModalOpen(false);
                    setEditingArticle(null);
                } catch (e) {
                    showToast('Erreur article : ' + e.message, 'error');
                }
            };

            const handleDeleteArticle = async (id, title) => {
                if (!confirm(`Supprimer l'article « ${title} » ?`)) return;
                try {
                    if (dataDb) await deleteDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'articles', id));
                    setArticles(prev => prev.filter(a => a.id !== id));
                    showToast('Article supprimé !');
                } catch (e) {
                    showToast('Erreur : ' + e.message, 'error');
                }
            };

            // Helper: Détection intelligente des extensions et types médias
            const detectClientFileTypeAndMedia = (filename = '', url = '') => {
                const cleanName = (filename || '').toLowerCase().trim();
                const cleanUrl = (url || '').toLowerCase().trim();

                let ext = '';
                const extMatch = cleanName.match(/\.([a-z0-9]{2,5})(?:[\?#].*)?$/i);
                if (extMatch) {
                    ext = extMatch[1].toLowerCase();
                } else {
                    const urlMatch = cleanUrl.match(/\.([a-z0-9]{2,5})(?:[\?#].*)?$/i);
                    if (urlMatch) {
                        ext = urlMatch[1].toLowerCase();
                    }
                }

                if (['mp4', 'mov', 'avi', 'mkv', 'webm', 'm4v', 'flv', '3gp', 'wmv'].includes(ext)) {
                    return { ext: ext || 'mp4', fileType: ext || 'mp4', mediaType: 'video', defaultTag: 'Vidéo' };
                }
                if (['mp3', 'wav', 'm4a', 'ogg', 'aac', 'flac', 'wma', 'opus'].includes(ext)) {
                    return { ext: ext || 'mp3', fileType: ext || 'mp3', mediaType: 'audio', defaultTag: 'Audio' };
                }
                if (['g1m', 'g2m'].includes(ext)) {
                    return { ext: ext || 'g1m', fileType: ext || 'g1m', mediaType: 'casio', defaultTag: 'Casio' };
                }
                if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg', 'bmp', 'ico'].includes(ext)) {
                    return { ext: ext || 'png', fileType: ext || 'png', mediaType: 'image', defaultTag: 'Fiche' };
                }
                if (['ppt', 'pptx', 'odp', 'key'].includes(ext)) {
                    return { ext: ext || 'pptx', fileType: ext || 'pptx', mediaType: 'presentation', defaultTag: 'Diaporama' };
                }
                if (['xls', 'xlsx', 'ods', 'csv'].includes(ext)) {
                    return { ext: ext || 'xlsx', fileType: ext || 'xlsx', mediaType: 'spreadsheet', defaultTag: 'Tableur' };
                }
                if (ext === 'txt') {
                    const isCasioText = /casio|calc|prog|g1m|formule|calculatrice/i.test(cleanName);
                    return {
                        ext: 'txt',
                        fileType: 'txt',
                        mediaType: isCasioText ? 'casio' : 'document',
                        defaultTag: isCasioText ? 'Casio' : 'Cours'
                    };
                }
                if (['doc', 'docx', 'odt', 'rtf'].includes(ext)) {
                    return { ext: ext || 'docx', fileType: ext || 'docx', mediaType: 'document', defaultTag: 'Cours' };
                }
                if (ext === 'pdf') {
                    return { ext: 'pdf', fileType: 'pdf', mediaType: 'document', defaultTag: 'Cours' };
                }

                if (/vidéo|video|capsule|\.mp4/i.test(cleanName)) return { ext: 'mp4', fileType: 'mp4', mediaType: 'video', defaultTag: 'Vidéo' };
                if (/audio|podcast|ecoute|son|\.mp3/i.test(cleanName)) return { ext: 'mp3', fileType: 'mp3', mediaType: 'audio', defaultTag: 'Audio' };
                if (/casio|\.g1m/i.test(cleanName)) return { ext: 'g1m', fileType: 'g1m', mediaType: 'casio', defaultTag: 'Casio' };

                return { ext: ext || 'pdf', fileType: ext || 'pdf', mediaType: 'document', defaultTag: 'Cours' };
            };

            // Moteur de parsing & classification autonome (compatible GitHub Pages statique)
            const extractAndClassifyClientSide = (rawText, targetSchool, targetClass, targetSubject) => {
                const textToScan = (rawText || '').trim();
                if (!textToScan) return [];

                // Détection de dossier Google Drive complet
                const folderMatch = textToScan.match(/(?:drive\.google\.com\/drive\/(?:folders|u\/\d+\/folders)\/|folders\/|id=)([a-zA-Z0-9_-]{15,})/i);
                const isOnlyFolderLink = folderMatch && textToScan.split(/\r?\n/).filter(Boolean).length === 1 && !textToScan.includes('/file/d/');

                if (isOnlyFolderLink) {
                    const subj = targetSubject || 'Ressources';
                    return [{
                        id: `drive-folder-${Date.now()}`,
                        title: `Dossier complet • ${subj}`,
                        subject: subj,
                        chapter: 'Dossier & Documents de la matière',
                        chapterOrder: 1,
                        courseOrder: 1,
                        tag: 'Cours',
                        fileType: 'pdf',
                        mediaType: 'document',
                        school: targetSchool || '',
                        classe: targetClass || '',
                        digitalLink: textToScan,
                        casioLink: '',
                        videoLink: '',
                        audioLink: '',
                        imageLink: '',
                        viewsDigital: 0,
                        viewsCasio: 0,
                        isVisible: true,
                        originalFilename: 'Dossier Google Drive'
                    }];
                }

                const driveRegex = /https?:\/\/(?:drive|docs)\.google\.com\/(?:file(?:\/u\/\d+)?\/d\/|open\?id=|uc\?[^"\s]*id=|(?:document|presentation|spreadsheets|forms)(?:\/u\/\d+)?\/d\/)([a-zA-Z0-9_-]+)[^\s,;"'<>()]*/gi;
                const lines = textToScan.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                const extractedFiles = [];
                const processedUrls = new Set();

                for (let i = 0; i < lines.length; i++) {
                    const currentLine = lines[i];
                    const lineDriveMatches = [...currentLine.matchAll(driveRegex)];

                    if (lineDriveMatches.length === 1) {
                        const matchedUrl = lineDriveMatches[0][0];
                        const fileId = lineDriveMatches[0][1];
                        let potentialName = currentLine.replace(matchedUrl, '').replace(/[()\[\]]/g, '').trim();

                        if (!potentialName && i > 0) {
                            const prevLine = lines[i - 1];
                            const prevMatches = [...prevLine.matchAll(driveRegex)];
                            if (prevMatches.length === 0 && prevLine.length > 2 && prevLine.length < 160) {
                                potentialName = prevLine;
                            }
                        }

                        if (!processedUrls.has(matchedUrl)) {
                            processedUrls.add(matchedUrl);
                            extractedFiles.push({
                                name: potentialName || `Document Drive (${fileId.slice(0, 6)})`,
                                url: matchedUrl,
                                id: fileId
                            });
                        }
                    } else if (lineDriveMatches.length > 1) {
                        for (const m of lineDriveMatches) {
                            const url = m[0];
                            const id = m[1];
                            if (!processedUrls.has(url)) {
                                processedUrls.add(url);
                                extractedFiles.push({
                                    name: `Document Drive (${id.slice(0, 6)})`,
                                    url: url,
                                    id: id
                                });
                            }
                        }
                    } else {
                        const generalUrlMatch = currentLine.match(/https?:\/\/[^\s,;"'<>()]+/);
                        if (generalUrlMatch) {
                            const url = generalUrlMatch[0];
                            const name = currentLine.replace(url, '').trim();
                            if (!processedUrls.has(url)) {
                                processedUrls.add(url);
                                extractedFiles.push({
                                    name: name || `Ressource (${url.slice(0, 25)})`,
                                    url: url,
                                    id: ''
                                });
                            }
                        } else if (currentLine.length > 2 && currentLine.length < 200 && !currentLine.startsWith('http')) {
                            extractedFiles.push({
                                name: currentLine,
                                url: '',
                                id: ''
                            });
                        }
                    }
                }

                // Balayage de sécurité
                const allDriveMatches = [...textToScan.matchAll(driveRegex)];
                for (const m of allDriveMatches) {
                    const url = m[0];
                    const id = m[1];
                    if (!processedUrls.has(url)) {
                        processedUrls.add(url);
                        extractedFiles.push({
                            name: `Document Drive (${id.slice(0, 6)})`,
                            url: url,
                            id: id
                        });
                    }
                }

                const subjectKeywords = [
                    { name: 'Mathématiques', match: /math|algebr|geometr|derivee|integrale|suite|complexe|probabilite/i },
                    { name: 'Physique Chimie', match: /physique|chimie|thermo|mecanique|optique|onde|energie|acide|dosage/i },
                    { name: 'SIN', match: /\bsin\b|systeme.*num|reseau|ip|can|microcontroleur|arduino|c\+\+|python|html/i },
                    { name: 'ITEC', match: /\bitec\b|mecanique|solidworks|chaine.*energie|cao|fao|resistance.*materiaux/i },
                    { name: 'Philosophie', match: /philo|morale|devoir|bonheur|liberte|verite|justice|etat/i },
                    { name: 'Anglais', match: /anglais|english|grammar|vocab/i },
                    { name: 'Histoire-Géo', match: /histoire|geo|geographie|guerre|mondialisation|territoire/i },
                    { name: 'Français', match: /francais|bac.*francais|litterature|dissertation|commentaire/i }
                ];

                return extractedFiles.map((file, index) => {
                    const rawName = file.name || 'Document sans titre';
                    const cleanExt = rawName.replace(/\.(pdf|docx?|pptx?|odt|txt|g1m|g2m|zip|mp4|mov|avi|mkv|webm|m4v|mp3|wav|m4a|ogg|aac|flac|png|jpe?g|webp|gif|xlsx?|ods|csv)$/i, '');
                    const { fileType, mediaType, defaultTag } = detectClientFileTypeAndMedia(rawName, file.url);

                    let tag = defaultTag;
                    if (/\btp\b|travaux.*pratique/i.test(cleanExt)) tag = 'TP';
                    else if (/\btd\b|travaux.*dirige/i.test(cleanExt)) tag = 'TD';
                    else if (/fiche|synthese|recap|resume/i.test(cleanExt)) tag = 'Fiche';
                    else if (/formulaire|aide.*memoire/i.test(cleanExt)) tag = 'Formulaire';
                    else if (/exo|exercice|corrige|devoir|dm|ds/i.test(cleanExt)) tag = 'Exercices';

                    let subject = targetSubject || '';
                    if (!subject) {
                        for (const sk of subjectKeywords) {
                            if (sk.match.test(rawName)) {
                                subject = sk.name;
                                break;
                            }
                        }
                    }
                    if (!subject) subject = 'Mathématiques';

                    let chapter = 'Chapitre 1 : Documents du cours';
                    const chapMatch = cleanExt.match(/(?:chapitre|chap|ch|c)[\s._-]*([0-9]{1,2})/i);
                    let chapterNumber = 1;
                    if (chapMatch && chapMatch[1]) {
                        chapterNumber = parseInt(chapMatch[1], 10);
                        chapter = `Chapitre ${chapterNumber}`;
                    }

                    let cleanedTitle = cleanExt
                        .replace(/^[0-9\s._-]+/, '')
                        .replace(/^(?:cours|tp|td|fiche|formulaire|chapitre|ch)[\s._-]*[0-9]*[\s._-]*/i, '')
                        .replace(/[._-]+/g, ' ')
                        .trim();

                    if (!cleanedTitle || cleanedTitle.length < 3) {
                        cleanedTitle = cleanExt.replace(/[._-]+/g, ' ').trim();
                    }
                    cleanedTitle = cleanedTitle.charAt(0).toUpperCase() + cleanedTitle.slice(1);

                    const fileUrl = file.url || (file.id ? `https://drive.google.com/file/d/${file.id}/view` : '');

                    return {
                        id: `client-imported-${Date.now()}-${index}`,
                        title: cleanedTitle,
                        subject: subject,
                        chapter: chapter,
                        chapterOrder: chapterNumber,
                        courseOrder: index + 1,
                        tag: tag,
                        fileType: fileType,
                        mediaType: mediaType,
                        school: targetSchool,
                        classe: targetClass,
                        digitalLink: mediaType === 'casio' ? '' : fileUrl,
                        videoLink: mediaType === 'video' ? fileUrl : '',
                        audioLink: mediaType === 'audio' ? fileUrl : '',
                        casioLink: mediaType === 'casio' ? fileUrl : '',
                        imageLink: mediaType === 'image' ? fileUrl : '',
                        viewsDigital: 0,
                        viewsCasio: 0,
                        isVisible: true,
                        originalFilename: rawName
                    };
                });
            };

            // AI Drive classify avec fallback client automatique (GitHub Pages / Node)
            const handleClassifyDrive = async () => {
                const inputVal = driveUrlInput.trim();
                if (!inputVal) return showToast('Veuillez fournir un lien ou texte', 'warning');
                setIsClassifying(true);
                try {
                    let resultCourses = [];
                    let sourceUsed = 'Moteur WorksBox';

                    // 1. Essayer le backend API si disponible (AI Studio / Serveur local)
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3500);
                        
                        const res = await fetch('/api/drive/classify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            signal: controller.signal,
                            body: JSON.stringify({
                                driveUrl: inputVal,
                                rawText: inputVal,
                                targetSchool: assocSchool,
                                targetClass: assocClass,
                                targetSubject: selectedSubject || ''
                            })
                        });
                        clearTimeout(timeoutId);

                        const contentType = res.headers.get('content-type') || '';
                        if (res.ok && contentType.includes('application/json')) {
                            const d = await res.json();
                            if (d.success && Array.isArray(d.courses) && d.courses.length > 0) {
                                resultCourses = d.courses;
                                sourceUsed = d.source || 'IA Gemini';
                            }
                        }
                    } catch (_) {
                        // Backend non disponible (ex: GitHub Pages statique)
                    }

                    // 2. Si le backend est indisponible ou a retourné du HTML (404 GitHub Pages)
                    if (!resultCourses || resultCourses.length === 0) {
                        resultCourses = extractAndClassifyClientSide(
                            inputVal, 
                            assocSchool, 
                            assocClass, 
                            selectedSubject || ''
                        );
                        sourceUsed = 'Auto-détection WorksBox';
                    }

                    if (resultCourses && resultCourses.length > 0) {
                        setClassifiedCourses(resultCourses);
                        showToast(`${resultCourses.length} ressource(s) / cours détecté(s) (${sourceUsed}) !`);
                    } else {
                        showToast('Aucun lien ou document détecté. Collez un lien Drive valide ou des noms de fichiers.', 'warning');
                    }
                } catch (e) {
                    try {
                        const fallbackCourses = extractAndClassifyClientSide(inputVal, assocSchool, assocClass, selectedSubject || '');
                        if (fallbackCourses.length > 0) {
                            setClassifiedCourses(fallbackCourses);
                            showToast(`${fallbackCourses.length} cours détecté(s) !`);
                        } else {
                            showToast('Erreur analyse : ' + e.message, 'error');
                        }
                    } catch (err2) {
                        showToast('Erreur analyse : ' + e.message, 'error');
                    }
                } finally {
                    setIsClassifying(false);
                }
            };

            // Modification et suppression individuelle dans la liste de cours analysés
            const handleUpdateClassifiedCourse = (index, field, value) => {
                setClassifiedCourses(prev => {
                    const next = [...prev];
                    const item = { ...next[index], [field]: value };
                    
                    if (field === 'mediaType') {
                        const rawUrl = item.digitalLink || item.videoLink || item.audioLink || item.casioLink || item.imageLink || '';
                        if (value === 'casio') {
                            item.casioLink = rawUrl;
                            item.digitalLink = '';
                            item.tag = 'Casio';
                        } else if (value === 'video') {
                            item.videoLink = rawUrl;
                            item.digitalLink = rawUrl;
                            item.tag = 'Vidéo';
                        } else if (value === 'audio') {
                            item.audioLink = rawUrl;
                            item.digitalLink = rawUrl;
                            item.tag = 'Audio';
                        } else {
                            item.digitalLink = rawUrl;
                        }
                    }
                    next[index] = item;
                    return next;
                });
            };

            const handleRemoveClassifiedCourse = (index) => {
                setClassifiedCourses(prev => prev.filter((_, i) => i !== index));
            };

            const handleApplySubjectToAll = (subjectName) => {
                const clean = (subjectName || '').trim();
                if (!clean) return;
                setClassifiedCourses(prev => prev.map(c => ({ ...c, subject: clean })));
                showToast(`Matière « ${clean} » appliquée à tous les cours analysés !`);
            };

            const handleApplyChapterToAll = (chapterName) => {
                const clean = (chapterName || '').trim();
                if (!clean) return;
                setClassifiedCourses(prev => prev.map(c => ({ ...c, chapter: clean })));
                showToast(`Chapitre « ${clean} » appliqué à tous les cours analysés !`);
            };

            const handleBulkSaveCourses = async () => {
                if (classifiedCourses.length === 0) return;
                setIsSavingBatch(true);
                try {
                    let count = 0;
                    const savedCourses = [];
                    const addedSubjects = new Set();

                    for (const item of classifiedCourses) {
                        const { id, ...clean } = item;
                        clean.school = assocSchool;
                        clean.classe = assocClass;
                        clean.createdAt = new Date().toISOString();
                        clean.isVisible = true;
                        clean.viewsDigital = 0;
                        clean.viewsCasio = 0;
                        
                        let newId = `imported-${Date.now()}-${count}`;
                        if (dataDb) {
                            const newDoc = await addDoc(collection(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses'), clean);
                            newId = newDoc.id;
                        }
                        savedCourses.push({ id: newId, ...clean });
                        if (clean.subject) addedSubjects.add(clean.subject);
                        count++;
                    }

                    // Enregistrer immédiatement dans l'état React local
                    setCourses(prev => [...savedCourses, ...prev]);

                    // S'assurer que les matières utilisées sont associées à cette classe
                    if (addedSubjects.size > 0 && assocSchool && assocClass) {
                        const currentClassSubs = getSubjectsForClass(assocSchool, assocClass);
                        const newSubsList = [...currentClassSubs];
                        let updatedGlobalSubs = [...subjectsList];
                        let modified = false;

                        addedSubjects.forEach(s => {
                            if (!newSubsList.some(sub => sub.toLowerCase() === s.toLowerCase())) {
                                newSubsList.push(s);
                                modified = true;
                            }
                            if (!updatedGlobalSubs.some(sub => sub.toLowerCase() === s.toLowerCase())) {
                                updatedGlobalSubs.push(s);
                                modified = true;
                            }
                        });

                        if (modified) {
                            const pairKey = `${assocSchool}__${assocClass}`;
                            const updatedSCS = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS), [pairKey]: newSubsList };
                            const updatedCS = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS), [assocClass]: newSubsList };
                            await handleUpdateSettings({ 
                                subjects: updatedGlobalSubs, 
                                subjectOrder: updatedGlobalSubs,
                                schoolClassSubjects: updatedSCS, 
                                classSubjects: updatedCS 
                            });
                        }
                    }

                    showToast(`${count} cours enregistré(s) avec succès !`);
                    setClassifiedCourses([]);
                    setDriveUrlInput('');
                    setIsDriveImportOpen(false);
                } catch (e) {
                    showToast('Erreur import par lot : ' + e.message, 'error');
                } finally {
                    setIsSavingBatch(false);
                }
            };

            // JSON / Cloud sync
            const handleExportJson = () => {
                const jsonStr = JSON.stringify(courses, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `worksbox_sauvegarde_${courses.length}_cours.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast(`Sauvegarde de ${courses.length} cours exportée !`);
            };

            const handleImportJson = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const r = new FileReader();
                r.onload = async (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (Array.isArray(parsed)) {
                            setCourses(parsed);
                            if (dataDb) {
                                for (const c of parsed) {
                                    const { id, ...clean } = c;
                                    await setDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', id || `c-${Date.now()}`), clean, { merge: true });
                                }
                            }
                            showToast(`${parsed.length} cours importés avec succès !`);
                        }
                    } catch(err) {
                        showToast('Fichier JSON invalide', 'error');
                    }
                };
                r.readAsText(file);
                e.target.value = '';
            };

            const handleSyncFirebase = async () => {
                if (!dataDb) return showToast('Firebase non disponible', 'error');
                setIsSyncingFirebase(true);
                try {
                    for (const c of courses) {
                        const { id, ...clean } = c;
                        await setDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', id), clean, { merge: true });
                    }
                    showToast(`☁️ ${courses.length} cours synchronisés sur Firebase !`);
                } catch(e) {
                    showToast('Erreur sync : ' + e.message, 'error');
                } finally {
                    setIsSyncingFirebase(false);
                }
            };

            const handleAutoSyncAndFixLegacyCourses = async () => {
                if (!dataDb) return showToast('Firebase non disponible', 'error');
                setIsSyncingFirebase(true);
                try {
                    let updatedCoursesCount = 0;
                    const currentSchoolClasses = { ...(settings.schoolClasses || DEFAULT_SCHOOL_CLASSES) };
                    const currentSchoolClassSubjects = { ...(settings.schoolClassSubjects || DEFAULT_SCHOOL_CLASS_SUBJECTS) };
                    const currentClassSubjects = { ...(settings.classSubjects || DEFAULT_CLASS_SUBJECTS) };
                    const allSubsSet = new Set(settings.subjects || DEFAULT_SUBJECTS);

                    const updatedCourses = courses.map(c => {
                        let targetSchool = c.school;
                        let targetClass = (c.classe || 'Terminale STI2D').trim();
                        
                        // Si établissement manquant ou assigné par défaut alors que c'est une classe de Monge
                        if (!targetSchool || targetSchool === 'Lycée François Bazin') {
                            if (targetClass === 'BTS SIO 1' || targetClass === 'BTS SIO 2') {
                                targetSchool = 'Lycée Gaspard Monge';
                            } else if (!targetSchool) {
                                targetSchool = 'Lycée François Bazin';
                            }
                        }

                        const cleanSubj = (c.subject || 'Général').trim();

                        // Enregistrer automatiquement la matière dans les associations de la classe
                        const pairKey = `${targetSchool}__${targetClass}`;
                        const existingPairSubs = currentSchoolClassSubjects[pairKey] ? [...currentSchoolClassSubjects[pairKey]] : (DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey] ? [...DEFAULT_SCHOOL_CLASS_SUBJECTS[pairKey]] : []);
                        if (!existingPairSubs.includes(cleanSubj)) {
                            existingPairSubs.push(cleanSubj);
                            currentSchoolClassSubjects[pairKey] = existingPairSubs;
                        }

                        const existingClassSubs = currentClassSubjects[targetClass] ? [...currentClassSubjects[targetClass]] : (DEFAULT_CLASS_SUBJECTS[targetClass] ? [...DEFAULT_CLASS_SUBJECTS[targetClass]] : []);
                        if (!existingClassSubs.includes(cleanSubj)) {
                            existingClassSubs.push(cleanSubj);
                            currentClassSubjects[targetClass] = existingClassSubs;
                        }

                        allSubsSet.add(cleanSubj);

                        // Rattachement de la classe au lycée
                        if (!currentSchoolClasses[targetSchool]) currentSchoolClasses[targetSchool] = [];
                        if (!currentSchoolClasses[targetSchool].includes(targetClass)) {
                            currentSchoolClasses[targetSchool].push(targetClass);
                        }

                        return {
                            ...c,
                            school: targetSchool,
                            classe: targetClass,
                            subject: cleanSubj,
                            chapter: (c.chapter || 'Chapitre 1').trim(),
                            title: (c.title || '').trim(),
                            isVisible: c.isVisible !== false,
                            viewsDigital: Number(c.viewsDigital) || 0,
                            viewsCasio: Number(c.viewsCasio) || 0
                        };
                    });

                    // Écriture de tous les cours nettoyés sur Firestore
                    for (const c of updatedCourses) {
                        const { id, ...clean } = c;
                        await setDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'courses', id), clean, { merge: true });
                        updatedCoursesCount++;
                    }

                    // Écriture des référentiels et associations synchronisés sur Firestore
                    const updatedSubsList = Array.from(allSubsSet);
                    const settingsUpdates = {
                        subjects: updatedSubsList,
                        subjectOrder: updatedSubsList,
                        schoolClasses: currentSchoolClasses,
                        schoolClassSubjects: currentSchoolClassSubjects,
                        classSubjects: currentClassSubjects
                    };

                    await setDoc(doc(dataDb, 'artifacts', worksBoxAppId, 'public', 'data', 'settings', 'global'), settingsUpdates, { merge: true });

                    setCourses(updatedCourses);
                    setSettings(prev => ({ ...prev, ...settingsUpdates }));
                    showToast(`✨ ${updatedCoursesCount} cours et toutes les matières ont été synchronisés avec succès !`);
                } catch (e) {
                    showToast('Erreur synchronisation : ' + e.message, 'error');
                } finally {
                    setIsSyncingFirebase(false);
                }
            };

            // Filtered courses for current view
            const currentFilteredCourses = useMemo(() => {
                const assocSet = new Set(currentAssociatedSubjects.map(s => s.toLowerCase().trim()));
                return courses.filter(c => {
                    const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim();
                    const cClass = (c.classe || 'Terminale STI2D').trim();
                    const matchSchool = cSchool.toLowerCase() === (assocSchool || '').trim().toLowerCase();
                    const matchClass = cClass.toLowerCase() === (assocClass || '').trim().toLowerCase();
                    const cSubj = (c.subject || '').trim();
                    const matchAssociated = !showOnlyAssociated || (cSubj ? assocSet.has(cSubj.toLowerCase()) : false);
                    const matchSubject = !selectedSubject || cSubj.toLowerCase() === selectedSubject.trim().toLowerCase();
                    const matchSearch = !searchQuery || (c.title || '').toLowerCase().includes(searchQuery.toLowerCase()) || (c.chapter || '').toLowerCase().includes(searchQuery.toLowerCase());
                    return matchSchool && matchClass && matchAssociated && matchSubject && matchSearch;
                });
            }, [courses, assocSchool, assocClass, selectedSubject, searchQuery, showOnlyAssociated, currentAssociatedSubjects]);

            // Subjects grouped data
            const subjectStats = useMemo(() => {
                const map = {};
                subjectsList.forEach(s => {
                    map[s] = { count: 0, views: 0, drafts: 0 };
                });
                courses.filter(c => {
                    const cSchool = (c.school || (c.classe === 'BTS SIO 1' ? 'Lycée Gaspard Monge' : 'Lycée François Bazin')).trim();
                    const cClass = (c.classe || 'Terminale STI2D').trim();
                    return cSchool.toLowerCase() === (assocSchool || '').trim().toLowerCase() &&
                           cClass.toLowerCase() === (assocClass || '').trim().toLowerCase();
                }).forEach(c => {
                    const cleanSubj = (c.subject || '').trim();
                    const matchedKey = Object.keys(map).find(k => k.toLowerCase() === cleanSubj.toLowerCase()) || cleanSubj;
                    if (!map[matchedKey]) map[matchedKey] = { count: 0, views: 0, drafts: 0 };
                    map[matchedKey].count += 1;
                    map[matchedKey].views += (c.viewsDigital || 0) + (c.viewsCasio || 0);
                    if (c.isVisible === false) map[matchedKey].drafts += 1;
                });
                return map;
            }, [courses, subjectsList, assocSchool, assocClass]);

            // Chapters grouped data for selected subject
            const chaptersGrouped = useMemo(() => {
                if (!selectedSubject) return [];
                const list = currentFilteredCourses.filter(c => c.subject === selectedSubject);
                const chaps = {};
                list.forEach(c => {
                    const chapName = c.chapter || 'Chapitre 1';
                    if (!chaps[chapName]) {
                        chaps[chapName] = {
                            name: chapName,
                            order: Number(c.chapterOrder) || 1,
                            courses: []
                        };
                    }
                    chaps[chapName].courses.push(c);
                });
                return Object.values(chaps)
                    .sort((a, b) => a.order - b.order)
                    .map(ch => ({
                        ...ch,
                        courses: ch.courses.sort((a, b) => (a.courseOrder || 0) - (b.courseOrder || 0))
                    }));
            }, [currentFilteredCourses, selectedSubject]);

            // ÉCRAN 1 : Chargement de la session administrateur
            if (isAuthLoading) {
                return (

                        <p className="text-sm font-bold text-slate-300">Vérification des autorisations administrateur...</p>
                        <p className="text-xs text-slate-500 mt-1">Connexion sécurisée à WorksBox</p>

            }

            // ÉCRAN 2 : Verrouillage de sécurité strict (Accès refusé sans le compte roman.ferriere4@gmail.com)
            if (!isAuthorizedAdmin) {
                return (

                                <div className="pt-2">
                                    <a

                                    >
                                        ← Retourner à l'accueil du site
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                );

            return (

                                    <div className="p-2 bg-red-800 border border-red-700 rounded-xl shadow-xs">
                                        <SettingsIcon className="w-5 h-5 text-white" />
                                    </div>
                                    <div className="flex flex-col">
                                        <h1 className="text-base font-black tracking-tight text-white leading-tight">Dashboard Admin</h1>
                                        <span className="text-[11px] text-red-200/90 leading-tight">WorksBox • Gestion pédagogique</span>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-2 sm:space-x-3 flex-wrap sm:flex-nowrap gap-y-2">
                                    <nav className="flex items-center space-x-1 bg-red-950/40 p-1 rounded-xl border border-red-800/60 shrink-0">
                                        <button
                                            onClick={() => { setActiveTab('home'); setSelectedSubject(null); }}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${activeTab === 'home' ? 'bg-red-700 text-white shadow-xs' : 'text-red-200 hover:text-white hover:bg-red-800/50'}`}
                                        >
                                            Cours
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('articles')}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${activeTab === 'articles' ? 'bg-red-700 text-white shadow-xs' : 'text-red-200 hover:text-white hover:bg-red-800/50'}`}
                                        >
                                            Articles
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('pages')}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${activeTab === 'pages' ? 'bg-red-700 text-white shadow-xs' : 'text-red-200 hover:text-white hover:bg-red-800/50'}`}
                                        >
                                            CGU & Tuto
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('stats')}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${activeTab === 'stats' ? 'bg-red-700 text-white shadow-xs' : 'text-red-200 hover:text-white hover:bg-red-800/50'}`}
                                        >

                                    <button
