                                    <button
                                        onClick={() => executeDeleteSubjectGlobal(deleteSubjectModal.subject)}
                                        className="w-full py-2.5 px-4 bg-red-700 hover:bg-red-800 text-white text-xs font-bold rounded-xl transition flex flex-col items-center justify-center shadow-xs"
                                    >
                                        <span>Supprimer de TOUTES les classes</span>
                                        <span className="text-[10px] font-normal opacity-90">({deleteSubjectModal.totalCount} cours supprimés définitivement)</span>
                                    </button>

                                    <button
                                        onClick={() => setDeleteSubjectModal(null)}
                                        className="w-full py-2 px-4 border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-bold rounded-xl transition"
                                    >
                                        Annuler
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: AJOUTER UNE MATIÈRE */}
                    {addSubjectModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-gray-200">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center space-x-2">
                                        <div className="p-2 bg-red-100 text-red-900 rounded-lg">
                                            <FolderIcon className="w-5 h-5" />
                                        </div>
                                        <h3 className="font-bold text-gray-900 text-base">Ajouter une nouvelle matière</h3>
                                    </div>
                                    <button onClick={() => setAddSubjectModalOpen(false)} className="text-gray-400 hover:text-gray-600 font-bold">✕</button>
                                </div>

                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const name = (fd.get('subjectName') || '').trim();
                                    const associateNow = fd.get('associateNow') === 'on';
                                    if (!name) return showToast('Nom de matière requis', 'warning');
                                    await handleCreateSubject(name, associateNow);
                                    setAddSubjectModalOpen(false);
                                }} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 uppercase block mb-1">Nom de la matière *</label>
                                        <input
                                            name="subjectName"
                                            required
                                            autoFocus
                                            placeholder="Ex: Électronique de Puissance, Mathématiques..."
                                            className="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-red-900 focus:outline-none"
                                        />
                                    </div>

                                    <div className="flex items-center space-x-2 bg-red-50 p-3 rounded-xl border border-red-100">
                                        <input
                                            type="checkbox"
                                            id="assoc-now-chk"
                                            name="associateNow"
                                            defaultChecked={true}
                                            className="w-4 h-4 rounded text-red-900 focus:ring-red-900"
                                        />
                                        <label htmlFor="assoc-now-chk" className="text-xs font-medium text-gray-800 cursor-pointer">
                                            Associer immédiatement à la classe <b>{assocClass}</b> ({assocSchool})
                                        </label>
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setAddSubjectModalOpen(false)}
                                            className="px-4 py-2 border border-gray-300 rounded-xl text-xs font-bold text-gray-700 hover:bg-gray-50"
                                        >
                                            Annuler
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 bg-red-900 hover:bg-red-800 text-white text-xs font-bold rounded-xl shadow-xs"
                                        >
                                            Créer la matière
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CONFIRMATION GÉNÉRIQUE */}
                    {deleteGenericModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 space-y-4 border border-gray-200">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2.5 bg-red-100 text-red-700 rounded-xl shrink-0">
                                        <TrashIcon className="w-5 h-5" />
                                    </div>
                                    <h3 className="font-bold text-gray-900 text-base">{deleteGenericModal.title || 'Confirmation'}</h3>
                                </div>
                                <p className="text-xs text-gray-600 leading-relaxed">{deleteGenericModal.message}</p>
                                <div className="flex justify-end space-x-2 pt-2">
                                    <button
                                        onClick={() => setDeleteGenericModal(null)}
                                        className="px-4 py-2 text-xs font-bold border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-50"
                                    >
                                        Annuler
                                    </button>
                                    <button
                                        onClick={() => {
                                            deleteGenericModal.onConfirm();
                                            setDeleteGenericModal(null);
                                        }}
                                        className="px-4 py-2 text-xs font-bold bg-red-700 hover:bg-red-800 text-white rounded-xl shadow-xs"
                                    >
                                        Confirmer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: NOUVEL ARTICLE */}
                    {isArticleModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
                            <div className="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4">
                                <h3 className="font-bold text-gray-900 text-lg">{editingArticle?.id ? 'Modifier l\'article' : 'Nouvel article'}</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    handleSaveArticle(Object.fromEntries(fd.entries()));
                                }} className="space-y-3 text-sm">
                                    <div>
                                        <label className="text-xs font-bold text-gray-600 uppercase block mb-1">Titre *</label>
                                        <input
                                            name="title"
                                            required
                                            defaultValue={editingArticle?.title || ''}
                                            className="w-full border border-gray-300 rounded-xl px-3 py-2"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-600 uppercase block mb-1">Contenu *</label>
                                        <textarea
                                            name="content"
                                            required
                                            rows="4"
                                            defaultValue={editingArticle?.content || ''}
                                            className="w-full border border-gray-300 rounded-xl p-3 text-xs"
                                        />
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <input
                                            type="checkbox"
                                            id="pinned-chk"
                                            name="pinned"
                                            defaultChecked={!!editingArticle?.pinned}
                                            className="rounded text-red-900"
                                        />
                                        <label htmlFor="pinned-chk" className="text-xs font-bold text-gray-700">Épingler en haut</label>
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-3 border-t border-gray-200">
                                        <button type="button" onClick={() => setIsArticleModalOpen(false)} className="px-4 py-2 border rounded-xl font-bold text-gray-700">Annuler</button>
                                        <button type="submit" className="px-5 py-2 bg-red-900 text-white font-bold rounded-xl">Publier</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
