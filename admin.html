          );
        }

        /* Modale d'importation intelligente Google Drive (Option A) avec analyse Gemini AI */
        function DriveAiImportModal({ onClose, onImportCourses, adminSchool, adminClass, activeSubjects, activeTags, initialSubject }) {
            const [step, setStep] = useState('input'); // 'input', 'loading', 'preview'
            const [driveUrl, setDriveUrl] = useState('');
            const [rawText, setRawText] = useState('');
            const [selectedSubject, setSelectedSubject] = useState(initialSubject || '');
            const [analyzedCourses, setAnalyzedCourses] = useState([]);
            const [selectedIndices, setSelectedIndices] = useState([]);
            const [sourceEngine, setSourceEngine] = useState('');
            const [errorMessage, setErrorMessage] = useState('');
            const fileInputRef = useRef(null);

            // Calcul en temps réel du nombre de liens ou fichiers détectés
            const detectedLinksCount = useMemo(() => {
                const combined = `${driveUrl || ''}\n${rawText || ''}`;
                const driveRegex = /https?:\/\/(?:drive|docs)\.google\.com\/(?:file(?:\/u\/\d+)?\/d\/|open\?id=|uc\?[^"\s]*id=|(?:document|presentation|spreadsheets|forms)(?:\/u\/\d+)?\/d\/)([a-zA-Z0-9_-]+)/gi;
                const matches = combined.match(driveRegex);
                if (matches && matches.length > 0) {
                    return new Set(matches).size;
                }
                const lines = combined.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 2 && !l.includes('drive.google.com/drive/folders'));
                return lines.length;
            }, [driveUrl, rawText]);

            // Gestion du glisser-déposer de fichiers locaux
            const handleLocalFiles = (files) => {
                if (!files || files.length === 0) return;
                const fileNames = Array.from(files).map(f => f.name).join('\n');
                setRawText(prev => prev ? `${prev}\n${fileNames}` : fileNames);
            };

            const handleAnalyze = async (e) => {
                if (e) e.preventDefault();
                setErrorMessage('');
                
                if (!driveUrl.trim() && !rawText.trim()) {
                    setErrorMessage("Veuillez coller un lien Google Drive ou une liste de fichiers / liens de cours.");
                    return;
                }

                setStep('loading');

                try {
                    const res = await fetch('/api/drive/classify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            driveUrl: driveUrl.trim(),
                            rawText: rawText.trim(),
                            targetSchool: adminSchool,
                            targetClass: adminClass,
                            targetSubject: selectedSubject.trim()
                        })
                    });

                    const data = await res.json();

                    if (!res.ok || !data.success || !data.courses || data.courses.length === 0) {
                        throw new Error(data.error || "Impossible d'extraire les cours. Vérifiez le lien ou le texte fourni.");
                    }

                    setAnalyzedCourses(data.courses);
                    setSelectedIndices(data.courses.map((_, i) => i)); // Sélectionnés par défaut
                    setSourceEngine(data.source === 'gemini-ai' ? 'IA Gemini' : 'Moteur automatique');
                    setStep('preview');

                } catch (err) {
                    console.error("Erreur d'analyse:", err);
                    setErrorMessage(err.message || "Une erreur est survenue lors de l'analyse.");
                    setStep('input');
                }
            };

            const toggleSelect = (index) => {
                if (selectedIndices.includes(index)) {
                    setSelectedIndices(selectedIndices.filter(i => i !== index));
                } else {
                    setSelectedIndices([...selectedIndices, index]);
                }
            };

            const updateCourseField = (index, field, value) => {
                setAnalyzedCourses(prev => {
                    const copy = [...prev];
                    copy[index] = { ...copy[index], [field]: value };
                    return copy;
                });
            };

            const handleFinalImport = () => {
                const toImport = analyzedCourses.filter((_, i) => selectedIndices.includes(i)).map(c => {
                    const originalUrl = c.digitalLink || c.videoLink || c.audioLink || c.casioLink || c.imageLink || '';
                    const fileType = (c.fileType || 'pdf').toLowerCase().replace(/^\./, '');
                    const isVideo = c.mediaType === 'video' || fileType === 'mp4';
                    const isAudio = c.mediaType === 'audio' || fileType === 'mp3';
                    const isCasio = c.mediaType === 'casio' || fileType === 'g1m' || fileType === 'txt';
                    const isImage = c.mediaType === 'image' || ['png', 'jpg', 'jpeg'].includes(fileType);

                    return {
                        ...c,
                        fileType: fileType,
                        mediaType: c.mediaType || (isVideo ? 'video' : isAudio ? 'audio' : isCasio ? 'casio' : isImage ? 'image' : 'document'),
                        digitalLink: isCasio ? '' : (c.digitalLink || originalUrl),
                        videoLink: isVideo ? (c.videoLink || originalUrl) : (c.videoLink || ''),
                        audioLink: isAudio ? (c.audioLink || originalUrl) : (c.audioLink || ''),
                        casioLink: isCasio ? (c.casioLink || originalUrl) : (c.casioLink || ''),
                        imageLink: isImage ? (c.imageLink || originalUrl) : (c.imageLink || '')
                    };
                });
                if (toImport.length === 0) {
                    alert("Sélectionnez au moins un cours à importer.");
                    return;
                }
                onImportCourses(toImport);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden max-h-[92vh] flex flex-col">
                        {/* En-tête modal */}
                        <div className="flex justify-between items-center px-6 py-4 border-b bg-gradient-to-r from-slate-900 to-slate-800 text-white flex-shrink-0">
                            <div className="flex items-center space-x-3">
                                <div className="p-2 bg-blue-600/30 border border-blue-400/40 rounded-xl">
                                    <DriveIcon className="w-6 h-6" />
                                </div>
                                <div>
                                    <h2 className="text-lg font-bold flex items-center">
                                        Importation Intelligente Google Drive
                                        <span className="ml-2 bg-amber-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full flex items-center">
                                            <Sparkles className="w-2.5 h-2.5 mr-1" /> OPTION A (Public)
                                        </span>
                                    </h2>
                                    <p className="text-xs text-slate-400">
                                        Collez l'URL de votre dossier Drive public ou les liens de vos fichiers. L'IA structure automatiquement matières, chapitres et tags.
                                    </p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded-lg">
                                <X className="w-5 h-5" />
                            </button>
                        </div>

                        {/* Corps du modal */}
                        <div className="p-6 overflow-y-auto flex-1 bg-slate-50/50">
                            {errorMessage && (
                                <div className="mb-4 p-4 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 font-semibold flex items-center justify-between">
                                    <span>⚠️ {errorMessage}</span>
                                    <button onClick={() => setErrorMessage('')} className="text-red-500 font-bold ml-2">✕</button>
                                </div>
                            )}

                            {step === 'input' && (
                                <form onSubmit={handleAnalyze} className="space-y-6">
                                    {/* Encadré d'explication et astuce rapide */}
                                    <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 p-4 rounded-xl text-xs text-blue-900 space-y-2">
                                        <div className="flex items-center space-x-2 font-bold text-blue-800">
                                            <Sparkles className="w-4 h-4 text-amber-500" />
                                            <span>Comment importer toute une matière en 5 secondes ?</span>
                                        </div>
                                        <p className="text-slate-600 leading-relaxed">
                                            <b>Pourquoi pas juste le lien du dossier ?</b> Par sécurité, Google interdit aux serveurs externes d'explorer l'intérieur d'un dossier sans compte connecté.
                                        </p>
                                        <div className="bg-white/80 p-2.5 rounded-lg border border-blue-100 flex items-start space-x-2 text-slate-700">
                                            <span className="font-black text-blue-600">👉</span>
                                            <div>
                                                <b>Astuce magique sans copier-coller fichier par fichier :</b><br/>
                                                Dans Google Drive, entrez dans votre dossier ➔ faites <b>Ctrl + A</b> (tout sélectionner) ➔ clic droit <b>« Copier les liens »</b> ➔ collez tout dans le champ ci-dessous. <b>L'IA Gemini s'occupe du reste !</b>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Informations de destination */}
                                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4 items-center justify-between">
                                        <div className="text-xs text-slate-600">
                                            <span className="font-bold text-slate-800 block text-sm mb-0.5">Destination de l'import :</span>
                                            {adminSchool} • <span className="text-blue-600 font-bold">{adminClass}</span>
                                        </div>
                                        <div className="w-full sm:w-64">
                                            <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Matière cible (facultatif)</label>
                                            <input 
                                                list="drive-subj-list" 
                                                value={selectedSubject} 
                                                onChange={(e) => setSelectedSubject(e.target.value)} 
                                                className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-semibold outline-none focus:border-blue-500" 
                                                placeholder="Laisser l'IA détecter ou choisir..."
                                            />
                                            <datalist id="drive-subj-list">
                                                {activeSubjects.map(s => <option key={s} value={s} />)}
                                            </datalist>
                                        </div>
                                    </div>

                                    {/* Option 1 : Lien dossier Drive */}
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                        <label className="block font-bold text-slate-800 text-sm flex items-center">
                                            <span className="w-6 h-6 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center text-xs font-black mr-2">1</span>
                                            Lien de partage du Dossier Google Drive (Optionnel)
                                        </label>
                                        <p className="text-xs text-slate-500 leading-relaxed">
                                            Sur Google Drive : clic droit sur votre dossier de cours ➔ <b>Partager</b> ➔ Régler sur <b>« Tous les utilisateurs disposant du lien : Lecteur »</b> ➔ Copier le lien.
                                        </p>
                                        <input 
                                            type="url" 
                                            value={driveUrl} 
                                            onChange={(e) => setDriveUrl(e.target.value)}
                                            placeholder="https://drive.google.com/drive/folders/1aBcDeFgHiJkLmNoPqRsTuVwXyZ..."
                                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-mono outline-none focus:border-blue-500 focus:bg-white transition-all"
                                        />
                                    </div>

                                    {/* Option 2 : Copier-coller de liens de fichiers ou de noms */}
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                        <div className="flex justify-between items-center">
                                            <label className="block font-bold text-slate-800 text-sm flex items-center">
                                                <span className="w-6 h-6 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-xs font-black mr-2">2</span>
                                                Liste de fichiers ou liens Drive partagés
                                            </label>
                                            <button 
                                                type="button"
                                                onClick={() => {
                                                    setRawText(`Cours_01_Cinematique_et_Vecteurs.pdf https://drive.google.com/file/d/1ABC123/view\nTP_02_Chute_Libre_Mesures.pdf https://drive.google.com/file/d/1DEF456/view\nFiche_Formulaire_Thermodynamique.pdf https://drive.google.com/file/d/1GHI789/view`);
                                                }}
                                                className="text-[11px] font-bold text-blue-600 hover:underline"
                                            >
                                                Insérer un exemple
                                            </button>
                                        </div>
                                        <p className="text-xs text-slate-500">
                                            Vous pouvez coller plusieurs liens Google Drive, ou simplement copier/coller une liste de noms de fichiers. L'IA déduira les titres, numéros de chapitres et types (Cours, TP, Formulaire).
                                        </p>
                                        <textarea 
                                            rows="6"
                                            value={rawText}
                                            onChange={(e) => setRawText(e.target.value)}
                                            placeholder={"Exemple : collez 10, 20 ou 30 liens d'un coup !\nhttps://drive.google.com/file/d/...\nhttps://drive.google.com/file/d/...\n(Accepte les sauts de ligne, les virgules et les espaces)"}
                                            className="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs font-mono outline-none focus:border-blue-500 focus:bg-white transition-all leading-relaxed"
                                        />

                                        {/* Indicateur temps réel du nombre de liens détectés */}
                                        {detectedLinksCount > 0 && (
                                            <div className="flex items-center space-x-2 text-xs font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 px-3 py-2 rounded-xl animate-in fade-in">
                                                <CheckCircle className="w-4 h-4 text-emerald-600 flex-shrink-0" />
                                                <span>{detectedLinksCount} fichier{detectedLinksCount > 1 ? 's / liens' : ''} détecté{detectedLinksCount > 1 ? 's' : ''} ! L'IA va traiter l'intégralité des {detectedLinksCount} cours sans en oublier aucun.</span>
                                            </div>
                                        )}

                                        {/* Glisser déposer rapide de fichiers locaux pour en extraire les noms */}
                                        <div 
                                            onDragOver={(e) => e.preventDefault()}
                                            onDrop={(e) => { e.preventDefault(); handleLocalFiles(e.dataTransfer.files); }}
                                            onClick={() => fileInputRef.current?.click()}
                                            className="border-2 border-dashed border-slate-300 hover:border-blue-400 p-3 rounded-xl text-center cursor-pointer bg-slate-50/70 hover:bg-blue-50/40 transition-colors"
                                        >
                                            <input 
                                                ref={fileInputRef} 
                                                type="file" 
                                                multiple 
                                                className="hidden" 
                                                onChange={(e) => handleLocalFiles(e.target.files)} 
                                            />
                                            <div className="flex items-center justify-center space-x-2 text-xs text-slate-500 font-medium">
                                                <UploadCloud className="w-4 h-4 text-blue-500" />
                                                <span>Ou glissez-déposez des fichiers ici pour importer directement leurs noms</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Bouton d'analyse */}
                                    <div className="flex justify-end space-x-3 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={onClose} 
                                            className="px-5 py-2.5 text-sm font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all"
                                        >
                                            Annuler
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-6 py-2.5 text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center space-x-2"
                                        >
                                            <Sparkles className="w-4 h-4 text-amber-300" />
                                            <span>Analyser et Déduire avec l'IA</span>
                                        </button>
                                    </div>
                                </form>
                            )}

                            {step === 'loading' && (
                                <div className="py-16 text-center flex flex-col items-center justify-center space-y-4">
                                    <div className="relative">
                                        <div className="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
                                        <Sparkles className="w-6 h-6 text-amber-500 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 animate-pulse" />
                                    </div>
                                    <div>
                                        <h3 className="text-base font-bold text-slate-900">Analyse intelligente en cours...</h3>
                                        <p className="text-xs text-slate-500 max-w-sm mt-1">
                                            L'IA Gemini analyse les noms de fichiers, nettoie la typographie, identifie les chapitres et classe les documents.
                                        </p>
                                    </div>
                                </div>
                            )}

                            {step === 'preview' && (
                                <div className="space-y-5 animate-in fade-in duration-300">
                                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                        <div>
                                            <div className="flex items-center space-x-2">
                                                <h3 className="font-bold text-slate-900 text-sm">
                                                    {analyzedCourses.length} cours analysé{analyzedCourses.length > 1 ? 's' : ''}
                                                </h3>
                                                <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center">
                                                    <CheckCircle className="w-3 h-3 mr-1" /> {sourceEngine}
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-0.5">
                                                Vérifiez et modifiez les détails ci-dessous avant la publication finale.
                                            </p>
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            <button 
                                                onClick={() => setSelectedIndices(analyzedCourses.map((_, i) => i))} 
                                                className="text-xs font-bold text-blue-600 hover:underline px-2 py-1"
                                            >
                                                Tout cocher
                                            </button>
                                            <span className="text-slate-300">|</span>
                                            <button 
                                                onClick={() => setSelectedIndices([])} 
                                                className="text-xs font-bold text-slate-500 hover:underline px-2 py-1"
                                            >
                                                Tout décocher
                                            </button>
                                            <button 
                                                onClick={() => setStep('input')} 
                                                className="text-xs font-bold px-3 py-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg ml-2"
                                            >
                                                Modifier la source
                                            </button>
                                        </div>
                                    </div>

                                    {/* Tableau des cours détectés */}
                                    <div className="space-y-3">
                                        {analyzedCourses.map((course, idx) => {
                                            const isChecked = selectedIndices.includes(idx);
                                            return (
                                                <div 
                                                    key={idx}
                                                    className={`p-4 rounded-xl border transition-all ${isChecked ? 'bg-white border-blue-300 shadow-sm' : 'bg-slate-100/70 border-slate-200 opacity-60'}`}
                                                >
                                                    <div className="flex items-start gap-3">
                                                        <input 
                                                            type="checkbox"
                                                            checked={isChecked}
                                                            onChange={() => toggleSelect(idx)}
                                                            className="w-4 h-4 mt-2 text-blue-600 rounded cursor-pointer"
                                                        />
                                                        
                                                        <div className="flex-1 space-y-3 text-xs">
                                                            {/* Ligne 1 : Titre + Badge Type + Chapitre + Matière */}
                                                            <div className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                                                                <div className="sm:col-span-5">
                                                                    <div className="flex items-center justify-between mb-0.5">
                                                                        <label className="text-[10px] font-bold text-slate-400 uppercase">Titre du cours</label>
                                                                        <FileTypeBadge fileType={course.fileType} mediaType={course.mediaType} />
                                                                    </div>
                                                                    <input 
                                                                        type="text"
                                                                        value={course.title}
                                                                        onChange={(e) => updateCourseField(idx, 'title', e.target.value)}
                                                                        className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 font-semibold text-slate-900 outline-none focus:border-blue-500"
                                                                    />
                                                                </div>

                                                                <div className="sm:col-span-4">
                                                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Chapitre</label>
                                                                    <input 
                                                                        type="text"
                                                                        value={course.chapter}
                                                                        onChange={(e) => updateCourseField(idx, 'chapter', e.target.value)}
                                                                        className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-slate-800 outline-none focus:border-blue-500"
                                                                    />
                                                                </div>

                                                                <div className="sm:col-span-3">
                                                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Matière</label>
                                                                    <input 
                                                                        type="text"
                                                                        value={course.subject}
                                                                        onChange={(e) => updateCourseField(idx, 'subject', e.target.value)}
                                                                        className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-slate-800 outline-none focus:border-blue-500"
                                                                    />
                                                                </div>
                                                            </div>

                                                            {/* Ligne 2 : Type de fichier / Media + Tag + Liens */}
                                                            <div className="grid grid-cols-1 sm:grid-cols-12 gap-2 pt-2 border-t border-slate-100 items-end">
                                                                <div className="sm:col-span-3">
                                                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Format détecté</label>
                                                                    <select 
                                                                        value={course.mediaType || 'document'}
                                                                        onChange={(e) => {
                                                                            const newMedia = e.target.value;
                                                                            let newType = course.fileType;
                                                                            let newTag = course.tag;
                                                                            const rawUrl = course.digitalLink || course.videoLink || course.audioLink || course.casioLink || course.imageLink || '';

                                                                            if (newMedia === 'video') {
                                                                                newType = 'mp4';
                                                                                if (['Cours', 'Fiche'].includes(newTag)) newTag = 'Vidéo';
                                                                                updateCourseField(idx, 'mediaType', 'video');
                                                                                updateCourseField(idx, 'fileType', 'mp4');
                                                                                updateCourseField(idx, 'tag', newTag);
                                                                                updateCourseField(idx, 'videoLink', rawUrl);
                                                                                updateCourseField(idx, 'digitalLink', rawUrl);
                                                                            } else if (newMedia === 'audio') {
                                                                                newType = 'mp3';
                                                                                if (['Cours', 'Fiche'].includes(newTag)) newTag = 'Audio';
                                                                                updateCourseField(idx, 'mediaType', 'audio');
                                                                                updateCourseField(idx, 'fileType', 'mp3');
                                                                                updateCourseField(idx, 'tag', newTag);
                                                                                updateCourseField(idx, 'audioLink', rawUrl);
                                                                                updateCourseField(idx, 'digitalLink', rawUrl);
                                                                            } else if (newMedia === 'casio') {
                                                                                newType = 'g1m';
                                                                                updateCourseField(idx, 'mediaType', 'casio');
                                                                                updateCourseField(idx, 'fileType', 'g1m');
                                                                                updateCourseField(idx, 'tag', 'Casio');
                                                                                updateCourseField(idx, 'casioLink', rawUrl);
                                                                                updateCourseField(idx, 'digitalLink', '');
                                                                            } else if (newMedia === 'image') {
                                                                                newType = 'png';
                                                                                updateCourseField(idx, 'mediaType', 'image');
                                                                                updateCourseField(idx, 'fileType', 'png');
                                                                                updateCourseField(idx, 'imageLink', rawUrl);
                                                                                updateCourseField(idx, 'digitalLink', rawUrl);
                                                                            } else {
                                                                                newType = 'pdf';
                                                                                if (['Vidéo', 'Audio', 'Casio'].includes(newTag)) newTag = 'Cours';
                                                                                updateCourseField(idx, 'mediaType', 'document');
                                                                                updateCourseField(idx, 'fileType', 'pdf');
                                                                                updateCourseField(idx, 'tag', newTag);
                                                                                updateCourseField(idx, 'digitalLink', rawUrl);
                                                                            }
                                                                        }}
                                                                        className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 font-bold text-slate-800 outline-none cursor-pointer"
                                                                    >
                                                                        <option value="document">📄 Document (PDF / DOC)</option>
                                                                        <option value="video">🎬 Vidéo (MP4 / WebM)</option>
                                                                        <option value="audio">🎧 Audio (MP3 / Podcast)</option>
                                                                        <option value="casio">📟 Calculatrice (Casio .g1m/.txt)</option>
                                                                        <option value="image">🖼️ Image (Schéma / Graphique)</option>
                                                                        <option value="presentation">📊 Diaporama (PPTX)</option>
                                                                        <option value="spreadsheet">📈 Tableur (XLSX)</option>
                                                                    </select>
                                                                </div>

                                                                <div className="sm:col-span-3">
                                                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Tag</label>
                                                                    <select 
                                                                        value={course.tag}
                                                                        onChange={(e) => updateCourseField(idx, 'tag', e.target.value)}
                                                                        className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 font-bold text-slate-800 outline-none cursor-pointer"
                                                                    >
                                                                        <option value="Cours">Cours</option>
                                                                        <option value="TP">TP</option>
                                                                        <option value="TD">TD</option>
                                                                        <option value="Fiche">Fiche</option>
                                                                        <option value="Formulaire">Formulaire</option>
                                                                        <option value="Exercices">Exercices</option>
                                                                        <option value="Vidéo">Vidéo</option>
                                                                        <option value="Audio">Audio</option>
                                                                        <option value="Diaporama">Diaporama</option>
                                                                        <option value="Casio">Casio</option>
                                                                    </select>
                                                                </div>

                                                                <div className="sm:col-span-6">
                                                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">
                                                                        {course.mediaType === 'video' ? 'Lien Vidéo' : course.mediaType === 'audio' ? 'Lien Audio' : course.mediaType === 'casio' ? 'Lien Casio' : 'Lien Drive / Fichier'}
                                                                    </label>
                                                                    <input 
                                                                        type="url"
                                                                        value={course.mediaType === 'casio' ? (course.casioLink || course.digitalLink || '') : (course.digitalLink || course.videoLink || course.audioLink || course.casioLink || '')}
                                                                        onChange={(e) => {
                                                                            const val = e.target.value;
                                                                            if (course.mediaType === 'video') {
                                                                                updateCourseField(idx, 'videoLink', val);
                                                                                updateCourseField(idx, 'digitalLink', val);
                                                                            } else if (course.mediaType === 'audio') {
                                                                                updateCourseField(idx, 'audioLink', val);
                                                                                updateCourseField(idx, 'digitalLink', val);
                                                                            } else if (course.mediaType === 'casio') {
                                                                                updateCourseField(idx, 'casioLink', val);
                                                                            } else {
                                                                                updateCourseField(idx, 'digitalLink', val);
                                                                            }
                                                                        }}
                                                                        placeholder="https://drive.google.com/file/d/..."
                                                                        className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-slate-600 font-mono outline-none focus:border-blue-500"
                                                                    />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Actions finales */}
                                    <div className="flex justify-between items-center pt-4 border-t border-slate-200">
                                        <button 
                                            type="button" 
                                            onClick={() => setStep('input')} 
                                            className="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl"
                                        >
                                            ← Revenir à la saisie
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={handleFinalImport}
                                            className="px-6 py-2.5 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-md active:scale-95 transition-all flex items-center space-x-2"
                                        >
                                            <CheckCircle className="w-4 h-4" />
                                            <span>Valider et Importer ({selectedIndices.length}) cours sur le site</span>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ message, onConfirm, onCancel }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
                        <div className="p-6 text-center"><h3 className="text-lg font-bold mb-2">Confirmation</h3><p className="text-slate-500 text-sm">{message}</p></div>
                        <div className="flex border-t bg-slate-50"><button onClick={onCancel} className="flex-1 px-4 py-3 text-sm font-medium border-r">Annuler</button><button onClick={onConfirm} className="flex-1 px-4 py-3 text-sm font-bold text-red-600">Supprimer</button></div>
                    </div>
                </div>
            );
        }

        function UploadModal({ onClose, onSaveCourse, activeSubjects, activeTags, filteredCourses, initialSubject, initialData, allSchools = [], allClasses = [], adminSchool = '', adminClass = '' }) {
          const isEditing = !!initialData;
          const [formData, setFormData] = useState({
            school: initialData ? (initialData.school || adminSchool) : adminSchool,
            classe: initialData ? (initialData.classe || adminClass) : adminClass,
            subject: initialData ? initialData.subject : (initialSubject || ''),
            chapter: initialData ? initialData.chapter : '',
            title: initialData ? initialData.title : '',
            tag: initialData ? (initialData.tag || 'Cours') : 'Cours',
            isVisible: initialData ? initialData.isVisible : true,
            hasDigital: initialData ? !!initialData.digitalLink : true,
            digitalLink: initialData ? initialData.digitalLink : '',
            hasCasio: initialData ? !!initialData.casioLink : false,
            casioLink: initialData ? initialData.casioLink : '',
            hasVideo: initialData ? !!initialData.videoLink : false,
            videoLink: initialData ? initialData.videoLink : '',
            hasImage: initialData ? !!initialData.imageLink : false,
            imageLink: initialData ? initialData.imageLink : '',
            hasAudio: initialData ? !!initialData.audioLink : false,
            audioLink: initialData ? initialData.audioLink : ''
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            onSaveCourse({
              id: isEditing ? initialData.id : Date.now().toString(),
              school: formData.school,
              classe: formData.classe,
              subject: formData.subject.trim(),
              chapter: formData.chapter.trim(),
              title: formData.title.trim(),
              tag: formData.tag.trim() || 'Cours',
              isVisible: formData.isVisible,
              digitalLink: formData.hasDigital ? formData.digitalLink.trim() : "",
              casioLink: formData.hasCasio ? formData.casioLink.trim() : "",
              videoLink: formData.hasVideo ? formData.videoLink.trim() : "",
              imageLink: formData.hasImage ? formData.imageLink.trim() : "",
              audioLink: formData.hasAudio ? formData.audioLink.trim() : "",
              date: isEditing ? initialData.date : new Date().toISOString()
            });
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center px-6 py-4 border-b bg-slate-50 flex-shrink-0"><h2 className="text-xl font-bold">{isEditing ? "Modifier le cours" : "Ajouter un cours"}</h2><button onClick={onClose} className="text-slate-400"><X className="w-5 h-5"/></button></div>
                <form onSubmit={handleSubmit} className="p-6 space-y-4 overflow-y-auto">
                    {/* Lycée et Classe */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Lycée / Établissement</label>
                            <select value={formData.school} onChange={(e) => setFormData({...formData, school: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500 bg-white font-semibold">
                                {allSchools.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Classe / Niveau</label>
                            <select value={formData.classe} onChange={(e) => setFormData({...formData, classe: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500 bg-white font-semibold">
                                {allClasses.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Matière</label>
                            <input list="s-list" value={formData.subject} onChange={(e) => setFormData({...formData, subject: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" required placeholder="Ex: Mathématiques, Physique..."/>
                            <datalist id="s-list">{activeSubjects.map(s => <option key={s} value={s}/>)}</datalist>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Type de document (Tag)</label>
                            <input list="tag-list" value={formData.tag} onChange={(e) => setFormData({...formData, tag: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500 font-semibold" placeholder="Cours, TP, Exercice..."/>
                            <datalist id="tag-list">
                                {(activeTags || ["Cours", "TP", "Exercice", "Fiche", "Formulaire"]).map(t => <option key={t} value={t}/>)}
                            </datalist>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Chapitre</label>
                            <input type="text" value={formData.chapter} onChange={(e) => setFormData({...formData, chapter: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" required placeholder="Ex: Chapitre 1 : Les Ondes"/>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Titre du cours</label>
                            <input type="text" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" required placeholder="Ex: Synthèse de révision"/>
                        </div>
                    </div>

                    <div className="pt-2 border-t border-slate-200 space-y-3">
                        <span className="block text-xs font-extrabold uppercase text-slate-600 tracking-wider">Liens & Fichiers</span>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><FileText className="w-3.5 h-3.5 mr-1 text-blue-500"/> Lien Document / PDF (Google Drive ou direct)</label>
                            <input type="url" value={formData.digitalLink} onChange={(e) => setFormData({...formData, digitalLink: e.target.value, hasDigital: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://drive.google.com/file/d/..."/>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><VideoIcon className="w-3.5 h-3.5 mr-1 text-red-500"/> Lien Vidéo MP4 / Capsule (Google Drive ou direct)</label>
                            <input type="url" value={formData.videoLink} onChange={(e) => setFormData({...formData, videoLink: e.target.value, hasVideo: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://drive.google.com/file/d/..."/>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><MusicIcon className="w-3.5 h-3.5 mr-1 text-purple-500"/> Lien Audio MP3 / Podcast (Google Drive ou direct)</label>
                            <input type="url" value={formData.audioLink} onChange={(e) => setFormData({...formData, audioLink: e.target.value, hasAudio: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://drive.google.com/file/d/..."/>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><Calculator className="w-3.5 h-3.5 mr-1 text-emerald-500"/> Lien Casio (Google Drive / Fichier texte)</label>
                            <input type="url" value={formData.casioLink} onChange={(e) => setFormData({...formData, casioLink: e.target.value, hasCasio: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://drive.google.com/file/d/..."/>
                        </div>
                    </div>

                    <div className="flex justify-end space-x-2 pt-4 border-t"><button type="button" onClick={onClose} className="px-4 py-2 text-sm bg-slate-100 rounded-xl font-semibold">Annuler</button><button type="submit" className="px-6 py-2 text-sm font-bold text-white bg-red-600 rounded-xl shadow hover:bg-red-700 transition-all">Enregistrer</button></div>
                </form>
              </div>
            </div>
          );
        }

        /* GESTIONNAIRE DES LYCÉES ET DES CLASSES */
        function SchoolsAndClassesManager({
            allSchools,
            allClasses,
            courses,
            adminSchool,
            adminClass,
            onSelectSchool,
            onSelectClass,
            onAddSchool,
            onRenameSchool,
            onDeleteSchool,
            onAddClass,
            onRenameClass,
            onDeleteClass,
            onGoToCourses
        }) {
            const [newSchoolInput, setNewSchoolInput] = useState('');
            const [newClassInput, setNewClassInput] = useState('');
            const [editingSchool, setEditingSchool] = useState(null);
            const [editingClass, setEditingClass] = useState(null);
            const [toastMessage, setToastMessage] = useState('');

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleCreateSchool = (e) => {
                e.preventDefault();
                const trimmed = newSchoolInput.trim();
                if (!trimmed) return;
                if (allSchools.includes(trimmed)) {
                    alert('Ce lycée figure déjà dans la liste.');
                    return;
                }
                onAddSchool(trimmed);
                setNewSchoolInput('');
                showToast(`Lycée "${trimmed}" ajouté avec succès !`);
            };

            const handleCreateClass = (e) => {
                e.preventDefault();
                const trimmed = newClassInput.trim();
                if (!trimmed) return;
                if (allClasses.includes(trimmed)) {
                    alert('Cette classe figure déjà dans la liste.');
                    return;
                }
                onAddClass(trimmed);
                setNewClassInput('');
                showToast(`Classe "${trimmed}" ajoutée avec succès !`);
            };

            return (
                <div className="space-y-8 animate-in fade-in duration-300">
                    {/* Entête */}
                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div>
                            <div className="flex items-center space-x-2 text-xs font-bold text-red-600 uppercase tracking-wide mb-1">
                                <SchoolIcon className="w-4 h-4" />
                                <span>Configuration Établissements & Niveaux</span>
                            </div>
                            <h1 className="text-2xl sm:text-3xl font-black text-slate-900">Lycées & Classes</h1>
                            <p className="text-sm text-slate-500 mt-1">
                                Les établissements et classes créés ici apparaissent en temps réel dans les listes déroulantes de <strong className="text-slate-700">WorksBox (index.html)</strong> pour tous les élèves.
                            </p>
                        </div>
                        <button 
                            onClick={onGoToCourses}
                            className="self-start sm:self-auto px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold transition-all flex items-center space-x-2 shadow"
                        >
                            <Folder className="w-4 h-4 text-red-400" />
                            <span>Retour aux cours</span>
                        </button>
                    </div>

                    {/* Notification Toast */}
                    {toastMessage && (
                        <div className="bg-emerald-50 border border-emerald-300 text-emerald-800 px-4 py-3 rounded-xl text-sm font-semibold flex items-center space-x-2 shadow-sm animate-in slide-in-from-top-2">
                            <CheckCircle className="w-5 h-5 text-emerald-600 flex-shrink-0" />
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Grille 2 colonnes : Lycées et Classes */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {/* BLOC LYCÉES */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                            <div>
                                <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center">
                                            <SchoolIcon className="w-5 h-5" />
                                        </div>
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-900">Lycées enregistrés</h2>
                                            <p className="text-xs text-slate-500">{allSchools.length} établissement{allSchools.length > 1 ? 's' : ''}</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Formulaire ajout Lycée */}
                                <form onSubmit={handleCreateSchool} className="flex gap-2 mb-6">
                                    <input 
                                        type="text"
                                        value={newSchoolInput}
                                        onChange={(e) => setNewSchoolInput(e.target.value)}
                                        placeholder="Nom du lycée (ex: Lycée Polyvalent Jean Moulin)..."
                                        className="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-800 outline-none focus:border-red-500 focus:bg-white transition-all"
                                    />
                                    <button 
                                        type="submit"
                                        disabled={!newSchoolInput.trim()}
                                        className="px-4 py-2.5 bg-red-600 hover:bg-red-700 disabled:opacity-40 text-white font-bold text-xs rounded-xl shadow transition-all flex items-center space-x-1.5 flex-shrink-0"

                    content: formData.content.trim(),

                                        rows="12" 
                                        value={casioText} 
                                        onChange={(e) => setCasioText(e.target.value)} 
                                        className="w-full border border-slate-300 rounded-xl p-4 text-sm outline-none focus:border-red-500 leading-relaxed font-sans"
                                        placeholder="Détaillez les étapes pour transférer les cours sur calculatrice..."
                                    />
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        /* GESTIONNAIRE STATISTIQUES */
        function StatsManager({ courses, allSchools, allClasses }) {
            const totalCourses = courses.length;
            const totalViewsDigital = courses.reduce((acc, c) => acc + (c.viewsDigital || 0), 0);
            const totalViewsCasio = courses.reduce((acc, c) => acc + (c.viewsCasio || 0), 0);

            const topCourses = [...courses].sort((a, b) => ((b.viewsDigital || 0) + (b.viewsCasio || 0)) - ((a.viewsDigital || 0) + (a.viewsCasio || 0))).slice(0, 5);

            return (
                <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex items-center space-x-2 text-xs font-bold text-red-600 uppercase tracking-wide mb-1">
                            <BarChart className="w-4 h-4" />
                            <span>Performances de la plateforme</span>
                        </div>
                        <h1 className="text-2xl font-black text-slate-900">Statistiques Globales</h1>
                        <p className="text-sm text-slate-500 mt-1">Aperçu de la fréquentation et de l'utilisation des cours sur tous les établissements.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="text-xs font-bold text-slate-500 uppercase mb-1">Total des cours</div>
                            <div className="text-3xl font-black text-slate-900">{totalCourses}</div>
                            <div className="text-xs text-slate-400 mt-1">{allSchools.length} lycées • {allClasses.length} classes</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="text-xs font-bold text-blue-600 uppercase mb-1 flex items-center"><FileText className="w-3.5 h-3.5 mr-1" /> Vues Numériques (PDF)</div>
                            <div className="text-3xl font-black text-blue-600">{totalViewsDigital}</div>
                            <div className="text-xs text-slate-400 mt-1">Lectures en ligne</div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="text-xs font-bold text-emerald-600 uppercase mb-1 flex items-center"><Calculator className="w-3.5 h-3.5 mr-1" /> Vues Casio</div>
                            <div className="text-3xl font-black text-emerald-600">{totalViewsCasio}</div>
                            <div className="text-xs text-slate-400 mt-1">Téléchargements calculatrice</div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 className="text-base font-bold text-slate-900 mb-4 flex items-center">
                            <TrendingUp className="w-4 h-4 mr-2 text-red-600" /> Top 5 des cours les plus consultés
                        </h2>
                        {topCourses.length === 0 ? (
                            <p className="text-sm text-slate-400">Aucune vue enregistrée pour l'instant.</p>
                        ) : (
                            <div className="space-y-3">
                                {topCourses.map((c, i) => (
                                    <div key={c.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200">
                                        <div className="flex items-center space-x-3">
                                            <span className="w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs font-black flex items-center justify-center">
                                                {i + 1}
                                            </span>
                                            <div>
                                                <div className="font-bold text-sm text-slate-800">{c.title}</div>
                                                <div className="text-xs text-slate-500">{c.subject} • {c.school} ({c.classe})</div>
                                            </div>
                                        </div>
                                        <div className="flex items-center space-x-3 text-xs font-bold">
                                            <span className="text-blue-600">{c.viewsDigital || 0} PDF</span>
                                            <span className="text-emerald-600">{c.viewsCasio || 0} Casio</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
