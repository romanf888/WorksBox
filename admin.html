    <script type="text/babel" data-type="module">

        const { useState, useEffect, useMemo } = React;

        const appId = 'lycee-share'; 
        const firebaseConfig = {
          apiKey: "AIzaSyByfCCHmBsbxhXszVA7Rhoe3VBgBNeKgK8",
          authDomain: "lycee-share.firebaseapp.com",
          projectId: "lycee-share",
          storageBucket: "lycee-share.firebasestorage.app",
          messagingSenderId: "578872424130",
          appId: "1:578872424130:web:670f646b295dd4fe2dad5b",
          measurementId: "G-3Q6998C0JH"

        let db = null;
        let auth = null;

        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "VOTRE_API_KEY" && !firebaseConfig.apiKey.includes("xxxxxxxx")) {

                auth = getAuth(app);

        const Icon = ({ children, className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;

        const AlertCircle = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;

        const TrendingUp = ({className}) => <Icon className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;
        const SchoolIcon = ({className}) => <Icon className={className}><path d="m4 6 8-4 8 4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M14 22v-4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4"/><path d="M18 5v17"/><path d="M6 5v17"/><circle cx="12" cy="9" r="2"/></Icon>;
        const Newspaper = ({className}) => <Icon className={className}><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M18 10h-8"/><path d="M14 6h-4"/></Icon>;
        const VideoIcon = ({className}) => <Icon className={className}><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></Icon>;
        const ImageIcon = ({className}) => <Icon className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></Icon>;
        const MusicIcon = ({className}) => <Icon className={className}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></Icon>;
        const CheckCircle = ({className}) => <Icon className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>;
        const BoldIcon = ({className}) => <Icon className={className}><path d="M6 12h9a4 4 0 0 1 0 8H6v-8zm0-8h8a4 4 0 0 1 0 8H6V4z"/></Icon>;
        const ItalicIcon = ({className}) => <Icon className={className}><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></Icon>;

        const ListIcon = ({className}) => <Icon className={className}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>;
        const HeadingIcon = ({className}) => <Icon className={className}><path d="M6 12h12"/><path d="M6 4v16"/><path d="M18 4v16"/></Icon>;

        const DEFAULT_TERMS_TEXT = `Bienvenue sur WorksBox, la plateforme pour récupérer ses cours ou revevoir une version calculatrice. En utilisant ce site, vous acceptez les conditions suivantes :

1. Utilisation des cours sur calculatrice Casio Graph 35+EII
L'utilisation des cours sur calculatrice est autorisée lors de simples exercices en classe ou d'évaluations (seulement si l'enseignant n'exige pas le "MODE EXAMEN"), lors d'épreuves nationales comme le BAC par exemple, l'utilisation des logiciels seront interdits et le "MODE EXAMEN" est obligatoire, pour tout utilisation de programmes sur calculatrice lors d'épreuves, le site WorksBox ne sera pas tenu responsable des conséquences arrivés lors de ces épreuves.

2. Contenu des cours sur WorksBox
WorksBox ne peut pas garantir la possession de l'entièreté des cours fournis par le lycée François Bazin. Dans ce genre de cas, l'utilisation de vos cours personnelles est recommandée.

3. Demande d'hébergement d'un fichier
Il est possible que vous possédiez un fichier comme un cours ou un autre type de document que WorksBox ne possède pas, si vous souhaiteriez son hébergement sur la plateforme, veuillez nous contacter via par mail : roman.ferriere4@gmail.com

4. Utilisation de l'Intelligence Artificielle (IA)
La version des cours sur calculatrice Casio Graph 35+EII à été adaptée par l'IA Gemini 3 pro pour une compatibilité optimale des cours en mode calculatrice.`;

        const DEFAULT_CASIO_TEXT = `Comment mettre des cours sur calculatrice Casio Graph 35+EII ?

1. Le matériel pré-requis pour démarrer
Vous aurez besoin d'une calculatrice Casio Graph 35+EII, d'un câble Mini USB (Souvent fourni avec la calculatrice) et d'un ordinateur avec un port USB 2.0 ou supérieur.

2. Télécharger les fichiers adaptés pour calculatrice
Téléchargez les fichiers au format .txt ou .g1m depuis WorksBox (en cliquant sur "Version Casio"). Ces fichiers ont déjà été formatés spécifiquement pour être parfaitement lisibles sur le petit écran de votre calculatrice, sans couper les mots.

3. Mettre le fichier dans sa calculatrice
• Branchez votre calculatrice à votre ordinateur via le câble USB.
• Sur l'écran de la calculatrice, un menu apparaît. Choisissez Mode connexion : Clé USB (appuyer sur F1 pour sélectionner).
• La calculatrice va apparaître sur votre ordinateur comme une clé USB classique.
• Ouvrez ce lecteur depuis votre ordinateur, et allez dans le dossier @MainMem, une fois dedans, vous devriez voir un dossier PROGRAM (si vous ne le voyez pas, créé le vous même).
• Une fois dans le dossier PROGRAM, copiez-collez les fichiers téléchargés depuis WorksBox. Attendez que le transfert soit terminé avant de déconnecter la calculatrice.
• Une fois terminé, déconnectez proprement le câble. Sur la calculatrice, allez dans le menu et sélectionnez "PROGR" et appuyez sur F2 pour lire vos cours.`;

        const COLOR_PALETTES = {
            blue: 'bg-blue-100 text-blue-700 border-blue-200',
            purple: 'bg-purple-100 text-purple-700 border-purple-200',
            orange: 'bg-orange-100 text-orange-700 border-orange-200',
            rose: 'bg-rose-100 text-rose-700 border-rose-200',
            red: 'bg-red-100 text-red-700 border-red-200',
            green: 'bg-green-100 text-green-700 border-green-200',
            teal: 'bg-teal-100 text-teal-700 border-teal-200',
            slate: 'bg-slate-100 text-slate-700 border-slate-200'
        };

        const DEFAULT_SUBJECTS_BAZIN = ["Allemand", "Anglais", "Enseignement technologique en anglais", "Histoire Géographie", "Ingénierie et développement durable", "Mathématiques", "Philosophie", "Physique Chimie", "SIN"];
        const DEFAULT_SCHOOLS = ["Lycée François Bazin", "Lycée Gaspard Monge"];
        const DEFAULT_CLASSES = ["Terminale STI2D", "BTS SIO 1"];

        function App() {
          const [currentView, setCurrentView] = useState('home'); // home, subject, stats, articles, pages
          const [selectedSubject, setSelectedSubject] = useState(null);
          
          const [courses, setCourses] = useState([]);
          const [articles, setArticles] = useState([]);
          const [settings, setSettings] = useState({
              announcement: "",
              subjectOrder: DEFAULT_SUBJECTS_BAZIN,
              tagColors: { "Cours": "blue", "TP": "purple", "Exercice": "orange", "Interro": "rose", "DS": "red" },
              schools: DEFAULT_SCHOOLS,
              classes: DEFAULT_CLASSES,
              termsContent: DEFAULT_TERMS_TEXT,
              casioGuideContent: DEFAULT_CASIO_TEXT
          });
          const [isLoading, setIsLoading] = useState(true);
          const [user, setUser] = useState(null);
          
          // Filtre actif sélectionné dans le Dashboard
          const [adminSchool, setAdminSchool] = useState('Lycée François Bazin');
          const [adminClass, setAdminClass] = useState('Terminale STI2D');

          const [isUploadModalOpen, setIsUploadModalOpen] = useState(false);
          const [isArticleModalOpen, setIsArticleModalOpen] = useState(false);
          const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
          const [editingCourse, setEditingCourse] = useState(null); 
          const [editingArticle, setEditingArticle] = useState(null);
          const [courseToDelete, setCourseToDelete] = useState(null);
          const [articleToDelete, setArticleToDelete] = useState(null);

          const [subjectToRename, setSubjectToRename] = useState(null);
          const [subjectToDelete, setSubjectToDelete] = useState(null);

          useEffect(() => {
            if (!auth) return;
            const initAuth = async () => {
              try { await signInAnonymously(auth); } catch (e) { setIsLoading(false); }
            };
            initAuth();
            return onAuthStateChanged(auth, setUser);
          }, []);

          useEffect(() => {
            if (!auth || !user || !db) return;
            
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    setSettings(prev => ({
                        ...prev,
                        ...data,
                        schools: Array.from(new Set([...DEFAULT_SCHOOLS, ...(data.schools || [])])),
                        classes: Array.from(new Set([...DEFAULT_CLASSES, ...(data.classes || [])]))
                    }));
                }
            }, () => {});

            const coursesRef = collection(db, 'artifacts', appId, 'public', 'data', 'courses');
            const unsubCourses = onSnapshot(coursesRef, (snapshot) => {
              const loadedCourses = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  return {
                      id: docSnap.id,
                      school: data.school || 'Lycée François Bazin',
                      classe: data.classe || 'Terminale STI2D',
                      chapterOrder: typeof data.chapterOrder === 'number' ? data.chapterOrder : -new Date(data.date).getTime(),
                      courseOrder: typeof data.courseOrder === 'number' ? data.courseOrder : -new Date(data.date).getTime(),
                      viewsDigital: data.viewsDigital || 0,
                      viewsCasio: data.viewsCasio || 0,
                      isVisible: data.isVisible !== false,
                      ...data
                  };
              });
              setCourses(loadedCourses);
              setIsLoading(false);
            }, () => setIsLoading(false));

            const articlesRef = collection(db, 'artifacts', appId, 'public', 'data', 'articles');
            const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
              const loadedArticles = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  return {
                      id: docSnap.id,
                      school: data.school || 'Lycée François Bazin',
                      classe: data.classe || 'Terminale STI2D',
                      ...data
                  };
              });
              setArticles(loadedArticles);
            }, () => {});

            return () => { unsubSettings(); unsubCourses(); unsubArticles(); };
          }, [user]);

          const allSchools = useMemo(() => {
              const list = new Set([...DEFAULT_SCHOOLS, ...(settings.schools || []), ...courses.map(c => c.school)]);
              return Array.from(list).filter(Boolean);
          }, [settings.schools, courses]);

          const allClasses = useMemo(() => {
              const list = new Set([...DEFAULT_CLASSES, ...(settings.classes || []), ...courses.map(c => c.classe)]);
              return Array.from(list).filter(Boolean);
          }, [settings.classes, courses]);

          const filteredCourses = useMemo(() => {
              return courses.filter(c => (c.school || 'Lycée François Bazin') === adminSchool && (c.classe || 'Terminale STI2D') === adminClass);
          }, [courses, adminSchool, adminClass]);

          const filteredArticles = useMemo(() => {
              return articles.filter(a => (a.school || 'Lycée François Bazin') === adminSchool && (a.classe || 'Terminale STI2D') === adminClass);
          }, [articles, adminSchool, adminClass]);

          // Matières pour l'établissement et la classe actifs
          const activeSubjects = useMemo(() => {
              const isBazinSTI2D = adminSchool === 'Lycée François Bazin' && adminClass === 'Terminale STI2D';
              const baseList = isBazinSTI2D ? (settings.subjectOrder || DEFAULT_SUBJECTS_BAZIN) : [];
              const subs = new Set([...baseList, ...filteredCourses.map(c => c.subject)]);
              return Array.from(subs).filter(Boolean);
          }, [filteredCourses, settings.subjectOrder, adminSchool, adminClass]);

          const sortedSubjects = useMemo(() => {
              const ordered = settings.subjectOrder || [];
              const known = ordered.filter(s => activeSubjects.includes(s));
              const unknown = activeSubjects.filter(s => !ordered.includes(s)).sort();
              return [...known, ...unknown];
          }, [activeSubjects, settings.subjectOrder]);

          const activeTags = useMemo(() => {
              const tags = new Set(["Cours", "TP", "Exercice", "Interro", "DS", "Fiche de Révision", ...filteredCourses.map(c => c.tag).filter(Boolean)]);
              return Array.from(tags).sort();
          }, [filteredCourses]);

          const topCourses = useMemo(() => {
              const list = [...filteredCourses];
              list.sort((a, b) => ((b.viewsDigital||0) + (b.viewsCasio||0)) - ((a.viewsDigital||0) + (a.viewsCasio||0)));
              return list.slice(0, 10);
          }, [filteredCourses]);

          const chaptersData = useMemo(() => {
            if (!selectedSubject) return [];
            const filtered = filteredCourses.filter(c => c.subject === selectedSubject);
            const groups = {};
            filtered.forEach(course => {
                const chap = course.chapter || "Chapitre non classé";
                if (!groups[chap]) groups[chap] = { name: chap, courses: [] };
                groups[chap].courses.push(course);
            });
            Object.values(groups).forEach(group => {
                group.chapterOrder = Math.min(...group.courses.map(c => c.chapterOrder || 0));
                group.courses.sort((a, b) => (a.courseOrder || 0) - (b.courseOrder || 0));
            });
            return Object.values(groups).sort((a, b) => a.chapterOrder - b.chapterOrder);
          }, [filteredCourses, selectedSubject]);

          const openSubject = (s) => { setSelectedSubject(s); setCurrentView('subject'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const goHome = () => { setSelectedSubject(null); setCurrentView('home'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openStats = () => { setSelectedSubject(null); setCurrentView('stats'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openArticles = () => { setSelectedSubject(null); setCurrentView('articles'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openPagesEditor = () => { setSelectedSubject(null); setCurrentView('pages'); window.scrollTo({top: 0, behavior: 'smooth'}); };

          const applyBatchUpdates = async (updates) => {
            if (db && user) {
                try {
                    await Promise.all(updates.map(c => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'courses', c.id.toString()), c)));
                } catch(e) { console.error(e); }
            }
          };

          const saveSettings = async (newSettings) => {
              setSettings(newSettings);
              if (db && user) {
                  try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), newSettings); } 
                  catch(e) { console.error("Erreur sauvegarde", e); }
              }
          };

          const handleRenameSubject = async (oldName, newName) => {
              if (!newName || !newName.trim() || oldName === newName.trim()) return;
              const formattedName = newName.trim();

              const coursesToUpdate = filteredCourses.filter(c => c.subject === oldName).map(c => ({
                  ...c,
                  subject: formattedName
              }));
              if (coursesToUpdate.length > 0) {
                  await applyBatchUpdates(coursesToUpdate);
              }

              const currentOrder = settings.subjectOrder || DEFAULT_SUBJECTS_BAZIN;
              const newOrder = currentOrder.map(s => s === oldName ? formattedName : s);
              if (!newOrder.includes(formattedName)) newOrder.push(formattedName);
              
              await saveSettings({ ...settings, subjectOrder: newOrder });

              if (selectedSubject === oldName) setSelectedSubject(formattedName);
              setSubjectToRename(null);
          };

          const handleDeleteSubject = async (subjectName) => {
              const coursesToDelete = filteredCourses.filter(c => c.subject === subjectName);
              if (coursesToDelete.length > 0 && db && user) {
                  try {
                      await Promise.all(coursesToDelete.map(c => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'courses', c.id.toString()))));
                  } catch(e) {}
              }

              const currentOrder = settings.subjectOrder || DEFAULT_SUBJECTS_BAZIN;
              const newOrder = currentOrder.filter(s => s !== subjectName);
              await saveSettings({ ...settings, subjectOrder: newOrder });

              if (selectedSubject === subjectName) goHome();
              setSubjectToDelete(null);
          };

          const moveChapter = async (chapterName, direction) => {
            const index = chaptersData.findIndex(c => c.name === chapterName);
            if (index === -1) return;
            if (direction === 'up' && index > 0) await swapChapterOrders(chaptersData[index], chaptersData[index - 1]);
            else if (direction === 'down' && index < chaptersData.length - 1) await swapChapterOrders(chaptersData[index], chaptersData[index + 1]);
          };

          const swapChapterOrders = async (chapA, chapB) => {
            const tempOrder = chapA.chapterOrder;
            const updates = [];
            chapA.courses.forEach(c => { updates.push({ ...c, chapterOrder: chapB.chapterOrder }); });
            chapB.courses.forEach(c => { updates.push({ ...c, chapterOrder: tempOrder }); });
            await applyBatchUpdates(updates);
          };

          const moveCourse = async (course, direction) => {
            const chapterGroup = chaptersData.find(c => c.name === course.chapter);
            if (!chapterGroup) return;
            const coursesList = chapterGroup.courses;
            const index = coursesList.findIndex(c => c.id === course.id);
            if (index === -1) return;

            if (direction === 'up' && index > 0) {
                const other = coursesList[index - 1];
                await applyBatchUpdates([{ ...course, courseOrder: other.courseOrder }, { ...other, courseOrder: course.courseOrder }]);
            } else if (direction === 'down' && index < coursesList.length - 1) {
                const other = coursesList[index + 1];
                await applyBatchUpdates([{ ...course, courseOrder: other.courseOrder }, { ...other, courseOrder: course.courseOrder }]);
            }
          };

          const handleSaveCourse = async (savedCourse) => {
            savedCourse.school = adminSchool;
            savedCourse.classe = adminClass;

            if (!editingCourse) {
                const existingChapter = filteredCourses.find(c => c.subject === savedCourse.subject && c.chapter === savedCourse.chapter);
                if (existingChapter) savedCourse.chapterOrder = existingChapter.chapterOrder;
                else {
                    const subjectCourses = filteredCourses.filter(c => c.subject === savedCourse.subject);
                    savedCourse.chapterOrder = subjectCourses.length > 0 ? Math.max(...subjectCourses.map(c => c.chapterOrder)) + 1 : 1;
                }
                const chapterCourses = filteredCourses.filter(c => c.subject === savedCourse.subject && c.chapter === savedCourse.chapter);
                savedCourse.courseOrder = chapterCourses.length > 0 ? Math.max(...chapterCourses.map(c => c.courseOrder)) + 1 : 1;
            }
            await applyBatchUpdates([savedCourse]);
            setIsUploadModalOpen(false);
            setEditingCourse(null);
            if (currentView !== 'subject' || selectedSubject !== savedCourse.subject) openSubject(savedCourse.subject);
          };

          const handleSaveArticle = async (savedArticle) => {

              savedArticle.classe = adminClass;
              if (db && user) {

                      await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', savedArticle.id.toString()), savedArticle);

              }

              setEditingArticle(null);
          };

          const executeDelete = async () => {
            if (!courseToDelete) return;

            }

          };

          const executeDeleteArticle = async () => {

          const openAddModal = () => { setEditingCourse(null); setIsUploadModalOpen(true); };

                        </div>
                        
                        <div className="hidden sm:flex space-x-2 border-l border-red-800 pl-6">
                             <button onClick={goHome} className={`px-3 py-1.5 rounded text-sm font-medium transition-all duration-200 active:scale-95 ${currentView === 'home' || currentView === 'subject' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white hover:bg-red-800/50'}`}>Cours</button>
                             <button onClick={openArticles} className={`px-3 py-1.5 rounded text-sm font-medium transition-all duration-200 active:scale-95 flex items-center ${currentView === 'articles' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white hover:bg-red-800/50'}`}><Newspaper className="w-4 h-4 mr-1"/> Articles</button>
                             <button onClick={openPagesEditor} className={`px-3 py-1.5 rounded text-sm font-medium transition-all duration-200 active:scale-95 flex items-center ${currentView === 'pages' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white hover:bg-red-800/50'}`}><FileText className="w-4 h-4 mr-1"/> CGU & Tuto</button>
                             <button onClick={openStats} className={`px-3 py-1.5 rounded text-sm font-medium transition-all duration-200 active:scale-95 flex items-center ${currentView === 'stats' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white hover:bg-red-800/50'}`}><BarChart className="w-4 h-4 mr-1"/> Stats</button>
                        </div>

                    <div className="flex items-center space-x-4">
                      <a href="/" className="text-xs font-bold px-3 py-1.5 rounded bg-red-950/80 text-red-200 hover:text-white hover:bg-red-950 transition-all flex items-center border border-red-800">
                          ← Retour au site
                      </a>
                      <button onClick={() => setIsSettingsModalOpen(true)} className="text-sm font-medium px-3 py-1.5 rounded bg-red-800 text-red-100 hover:bg-red-700 border border-red-700 transition-all duration-200 active:scale-95 hover:shadow flex items-center hidden lg:flex">
                          <Settings className="w-4 h-4 mr-2"/> Paramètres & Lycées
                      </button>
                      <button onClick={currentView === 'articles' ? openAddArticleModal : openAddModal} className="flex items-center space-x-2 bg-white text-red-900 hover:bg-red-50 hover:text-red-700 px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 active:scale-95">
                        <Plus className="w-4 h-4" /><span>{currentView === 'articles' ? 'Nouvel article' : 'Nouveau cours'}</span>

                                        <div className="flex items-center justify-between mb-4">

                                            <div className="flex items-center space-x-1 opacity-60 group-hover:opacity-100 transition-opacity" onClick={e => e.stopPropagation()}>

                                                <button title="Supprimer" onClick={() => setSubjectToDelete({ name: subject, count: subjectCourses.length })} className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded active:scale-95 transition-all"><Trash2 className="w-4 h-4" /></button>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-center text-xs text-slate-500 border-t border-slate-100 pt-3 group-hover:border-red-100 transition-colors duration-300">
                                            <span className="font-bold bg-slate-100 px-2 py-1 rounded group-hover:bg-red-50 group-hover:text-red-600 transition-colors duration-300">{subjectCourses.length} fichier{subjectCourses.length > 1 ? 's' : ''}</span>
                                            <span className="flex items-center"><BarChart className="w-3.5 h-3.5 mr-1"/> {totalViews} vues</span>
                                        </div>
                                    </div>
                                    );
                                })}
                                </div>
                            )}
                        </div>
                        )}

                        {/* VUE MATIÈRE DÉTAILLÉE */}
                        {currentView === 'subject' && (
                        <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500 ease-out">
                            <div className="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex items-center space-x-4 flex-1 min-w-0 mr-4">
                                    <button onClick={goHome} className="p-2 bg-slate-50 rounded-lg text-slate-600 hover:bg-slate-200 hover:text-slate-900 active:scale-90 transition-all duration-200"><ChevronLeft className="w-5 h-5" /></button>
                                    <h1 className="text-2xl font-bold text-slate-900 truncate">{selectedSubject}</h1>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <button onClick={() => setSubjectToRename(selectedSubject)} className="flex items-center space-x-1 text-xs font-semibold px-3 py-2 bg-slate-100 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg active:scale-95 transition-all"><Edit2 className="w-3.5 h-3.5" /> <span className="hidden sm:inline">Renommer</span></button>
                                    <button onClick={() => setSubjectToDelete({ name: selectedSubject, count: filteredCourses.filter(c => c.subject === selectedSubject).length })} className="flex items-center space-x-1 text-xs font-semibold px-3 py-2 bg-slate-100 text-slate-700 hover:bg-red-50 hover:text-red-600 rounded-lg active:scale-95 transition-all"><Trash2 className="w-3.5 h-3.5" /> <span className="hidden sm:inline">Supprimer</span></button>
                                </div>
                            </div>

                            {chaptersData.length === 0 ? (
                            <div className="bg-white border border-dashed border-slate-300 rounded-2xl p-12 text-center animate-in zoom-in-95 duration-300">
                                <p className="text-slate-500">Aucun cours dans cette matière pour {adminSchool} ({adminClass}).</p>
                                <button onClick={openAddModal} className="mt-4 px-4 py-2 bg-red-600 text-white font-bold text-sm rounded-xl hover:bg-red-700 transition-all">Ajouter un cours ici</button>
                            </div>
                            ) : (
                            <div className="space-y-6">
                                {chaptersData.map((chapterGroup, index) => (
                                    <ChapterBlock key={chapterGroup.name} chapter={chapterGroup.name} chapterCourses={chapterGroup.courses} openEditModal={openEditModal} setCourseToDelete={setCourseToDelete} moveChapter={moveChapter} moveCourse={moveCourse} isFirstChapter={index === 0} isLastChapter={index === chaptersData.length - 1} tagColors={settings.tagColors} />
                                ))}

                            )}
                        </div>
                        )}

                        {currentView === 'articles' && (

                                <div className="flex justify-between items-center mb-6">
                                    <h1 className="text-3xl font-extrabold text-slate-900 flex items-center">
                                        <Newspaper className="w-8 h-8 mr-3 text-red-600"/> Gestion des Articles

                                    <button onClick={openAddArticleModal} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-all flex items-center active:scale-95">
                                        <Plus className="w-4 h-4 mr-2"/> Nouvel article
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {filteredArticles.length === 0 ? (
                                        <div className="bg-white border border-dashed rounded-2xl p-12 text-center text-slate-500">Aucun article publié pour cet établissement ({adminSchool} / {adminClass}).</div>
                                    ) : (
                                        filteredArticles.map(art => (
                                            <div key={art.id} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                                <div className="flex-1 min-w-0">

                                                        <span className="text-xs text-slate-400">{new Date(art.date).toLocaleDateString('fr-FR')}</span>

                        {currentView === 'stats' && (

        function RichTextEditorBlock({ title, subtitle, value, onChange, onReset, resetLabel }) {
            const textareaRef = React.useRef(null);
            const [viewMode, setViewMode] = useState('split'); // 'edit', 'preview', 'split'

            const applyFormat = (openTag, closeTag, defaultPlaceholder = "texte") => {
                const textarea = textareaRef.current;
                if (!textarea) return;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const text = textarea.value;
                const selectedText = text.substring(start, end);
                const insertText = selectedText || defaultPlaceholder;
                const replacement = `${openTag}${insertText}${closeTag}`;
                const newText = text.substring(0, start) + replacement + text.substring(end);
                
                onChange(newText);

                setTimeout(() => {
                    textarea.focus();
                    const newCursorStart = start + openTag.length;
                    const newCursorEnd = newCursorStart + insertText.length;
                    textarea.setSelectionRange(newCursorStart, newCursorEnd);
                }, 10);
            };

            const insertBullet = () => {
                const textarea = textareaRef.current;
                if (!textarea) return;
                const start = textarea.selectionStart;
                const text = textarea.value;
                const bullet = "\n• ";
                const newText = text.substring(0, start) + bullet + text.substring(start);
                onChange(newText);
                setTimeout(() => {
                    textarea.focus();
                    textarea.setSelectionRange(start + bullet.length, start + bullet.length);
                }, 10);
            };

            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                        <div>
                            <h3 className="font-bold text-slate-900 text-lg">{title}</h3>
                            <p className="text-xs text-slate-500">{subtitle}</p>
                        </div>
                        <div className="flex items-center space-x-2">
                            <div className="bg-slate-100 p-1 rounded-xl flex space-x-1 text-xs font-bold text-slate-600">
                                <button 
                                    type="button" 
                                    onClick={() => setViewMode('edit')} 
                                    className={`px-2.5 py-1 rounded-lg transition-all ${viewMode === 'edit' ? 'bg-white text-slate-900 shadow-sm' : 'hover:text-slate-900'}`}
                                >
                                    Éditeur
                                </button>
                                <button 
                                    type="button" 
                                    onClick={() => setViewMode('split')} 
                                    className={`px-2.5 py-1 rounded-lg transition-all hidden md:block ${viewMode === 'split' ? 'bg-white text-slate-900 shadow-sm' : 'hover:text-slate-900'}`}
                                >
                                    Côte à côte
                                </button>
                                <button 
                                    type="button" 
                                    onClick={() => setViewMode('preview')} 
                                    className={`px-2.5 py-1 rounded-lg transition-all ${viewMode === 'preview' ? 'bg-white text-slate-900 shadow-sm' : 'hover:text-slate-900'}`}
                                >
                                    Aperçu direct
                                </button>
                            </div>
                            <button onClick={onReset} type="button" className="text-xs text-slate-500 hover:text-red-600 font-bold underline ml-2">
                                {resetLabel}
                            </button>
                        </div>
                    </div>

                    {/* Barre d'outils de formatage */}
                    <div className="flex flex-wrap items-center gap-1.5 p-2 bg-slate-50 rounded-xl border border-slate-200">
                        <button 
                            type="button" 
                            title="Gras"
                            onClick={() => applyFormat('<b>', '</b>', 'texte en gras')}
                            className="p-2 hover:bg-white hover:shadow-sm text-slate-700 rounded-lg text-xs font-bold flex items-center transition-all"
                        >
                            <BoldIcon className="w-4 h-4 mr-1" /> Gras
                        </button>
                        <button 
                            type="button" 
                            title="Italique"
                            onClick={() => applyFormat('<i>', '</i>', 'texte en italique')}
                            className="p-2 hover:bg-white hover:shadow-sm text-slate-700 rounded-lg text-xs font-bold flex items-center transition-all"
                        >
                            <ItalicIcon className="w-4 h-4 mr-1" /> Italique
                        </button>
                        <button 
                            type="button" 
                            title="Souligné"
                            onClick={() => applyFormat('<u>', '</u>', 'texte souligné')}
                            className="p-2 hover:bg-white hover:shadow-sm text-slate-700 rounded-lg text-xs font-bold flex items-center transition-all"
                        >
                            <UnderlineIcon className="w-4 h-4 mr-1" /> Souligné
                        </button>
                        <button 
                            type="button" 
                            title="Barré"
                            onClick={() => applyFormat('<s>', '</s>', 'texte barré')}
                            className="p-2 hover:bg-white hover:shadow-sm text-slate-700 rounded-lg text-xs font-bold flex items-center transition-all"
                        >
                            <StrikethroughIcon className="w-4 h-4 mr-1" /> Barré
                        </button>
                        <button 
                            type="button" 
                            title="Surligner en jaune"
                            onClick={() => applyFormat('<mark class="bg-amber-200 px-1 rounded">', '</mark>', 'texte surligné')}

                        >
                            <HighlighterIcon className="w-4 h-4 mr-1 text-amber-500" /> Surligner
                        </button>
                        <span className="w-px h-5 bg-slate-300 mx-1"></span>
                        <button 
                            type="button" 
                            title="Grand Titre"
                            onClick={() => applyFormat('<h3 class="text-base font-bold text-slate-900 mt-3 mb-1">', '</h3>', 'Titre de section')}
                            className="p-2 hover:bg-white hover:shadow-sm text-slate-700 rounded-lg text-xs font-bold flex items-center transition-all"
                        >
                            <HeadingIcon className="w-4 h-4 mr-1 text-blue-600" /> Titre

                        <button

                    </div>

                    {/* Zone d'édition / Aperçu */}
                    <div className={`grid gap-4 ${viewMode === 'split' ? 'grid-cols-1 lg:grid-cols-2' : 'grid-cols-1'}`}>
                        {(viewMode === 'edit' || viewMode === 'split') && (

                                <textarea

                                    value={value} 
                                    onChange={(e) => onChange(e.target.value)} 
                                    rows="18" 
                                    className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-4 text-xs sm:text-sm font-mono text-slate-800 outline-none focus:border-red-500 focus:bg-white transition-all leading-relaxed" 
                                    placeholder="Écrivez ici vos textes. Utilisez les boutons ci-dessus pour mettre en gras, souligner..."
                                ></textarea>
                            </div>
                        )}

                        {(viewMode === 'preview' || viewMode === 'split') && (
                            <div>
                                {viewMode === 'split' && <span className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Aperçu Visuel sur le site</span>}
                                <div 
                                    className="w-full h-full min-h-[350px] max-h-[500px] overflow-y-auto bg-white border-2 border-slate-200 rounded-xl p-5 text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line shadow-inner"
                                    dangerouslySetInnerHTML={{ __html: value }}
                                />
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SettingsModal({ onClose, settings, saveSettings, activeSubjects, activeTags }) {
            const [localSettings, setLocalSettings] = useState(settings);
            const [newSchool, setNewSchool] = useState('');
            const [newClass, setNewClass] = useState('');

            const handleAddSchool = () => { 
                if(newSchool.trim()) { 
                    setLocalSettings({...localSettings, schools: Array.from(new Set([...(localSettings.schools || DEFAULT_SCHOOLS), newSchool.trim()]))}); 
                    setNewSchool(''); 
                }

            const handleRemoveSchool = (s) => { 
                setLocalSettings({...localSettings, schools: (localSettings.schools || DEFAULT_SCHOOLS).filter(item => item !== s)}); 
            };
            const handleAddClass = () => { 
                if(newClass.trim()) { 
                    setLocalSettings({...localSettings, classes: Array.from(new Set([...(localSettings.classes || DEFAULT_CLASSES), newClass.trim()]))}); 
                    setNewClass(''); 
                }

            const handleRemoveClass = (c) => {

        function UploadModal({ onClose, onSaveCourse, activeSubjects, activeTags, filteredCourses, initialSubject, initialData }) {
          const isEditing = !!initialData;
          const [formData, setFormData] = useState({
            subject: initialData ? initialData.subject : (initialSubject || ''),
            chapter: initialData ? initialData.chapter : '',
            title: initialData ? initialData.title : '',
            tag: initialData ? (initialData.tag || 'Cours') : 'Cours',
            isVisible: initialData ? initialData.isVisible : true,
            hasDigital: initialData ? !!initialData.digitalLink : true,
            digitalLink: initialData ? initialData.digitalLink : '',
            hasCasio: initialData ? !!initialData.casioLink : false,
            casioLink: initialData ? initialData.casioLink : '',
            hasVideo: initialData ? !!initialData.videoLink : false,
            videoLink: initialData ? initialData.videoLink : '',
            hasImage: initialData ? !!initialData.imageLink : false,
            imageLink: initialData ? initialData.imageLink : '',
            hasAudio: initialData ? !!initialData.audioLink : false,
            audioLink: initialData ? initialData.audioLink : ''
          });

          const subjectChapters = useMemo(() => {
              if (!filteredCourses) return [];
              const chaps = new Set(filteredCourses.filter(c => c.subject === formData.subject).map(c => c.chapter));
              return Array.from(chaps).sort();
          }, [filteredCourses, formData.subject]);

          const handleSubmit = (e) => {
            e.preventDefault();
            onSaveCourse({
              id: isEditing ? initialData.id : Date.now().toString(),
              subject: formData.subject.trim(),
              chapter: formData.chapter.trim(),
              title: formData.title.trim(),
              tag: formData.tag.trim() || 'Cours',
              isVisible: formData.isVisible,
              digitalLink: formData.hasDigital ? formData.digitalLink.trim() : "",
              casioLink: formData.hasCasio ? formData.casioLink.trim() : "",
              videoLink: formData.hasVideo ? formData.videoLink.trim() : "",
              imageLink: formData.hasImage ? formData.imageLink.trim() : "",
              audioLink: formData.hasAudio ? formData.audioLink.trim() : "",
              date: isEditing ? initialData.date : new Date().toISOString()
            });
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center px-6 py-4 border-b bg-slate-50 flex-shrink-0"><h2 className="text-xl font-bold">{isEditing ? "Modifier le cours" : "Ajouter un cours"}</h2><button onClick={onClose} className="text-slate-400"><X className="w-5 h-5"/></button></div>
                <form onSubmit={handleSubmit} className="p-6 space-y-4 overflow-y-auto">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Matière</label>
                            <input list="s-list" value={formData.subject} onChange={(e) => setFormData({...formData, subject: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" required placeholder="Ex: Mathématiques, Informatique..."/>
                            <datalist id="s-list">{activeSubjects.map(s => <option key={s} value={s}/>)}</datalist>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Type de document (Tag)</label>
                            <input list="tag-list" value={formData.tag} onChange={(e) => setFormData({...formData, tag: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500 font-semibold" placeholder="Cours, TP, Exercice, DS..."/>
                            <datalist id="tag-list">
                                {(activeTags || ["Cours", "TP", "Exercice", "Interro", "DS", "Fiche de Révision"]).map(t => <option key={t} value={t}/>)}
                            </datalist>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Chapitre</label>
                            <input list="c-list" value={formData.chapter} onChange={(e) => setFormData({...formData, chapter: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" required placeholder="Ex: 01. Réseaux et protocoles"/>
                            <datalist id="c-list">{subjectChapters.map(c => <option key={c} value={c}/>)}</datalist>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700">Titre du cours</label>
                            <input type="text" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" required placeholder="Ex: Synthèse de révision"/>
                        </div>
                    </div>

                    <div className="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl">
                        <div>
                            <span className="font-bold text-sm text-slate-800">Visibilité du document</span>
                            <p className="text-xs text-slate-500">Actif = visible sur le site public. Inactif = brouillon privé.</p>
                        </div>
                        <label className="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked={formData.isVisible} onChange={(e) => setFormData({...formData, isVisible: e.target.checked})} className="sr-only peer"/>
                            <div className="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
                        </label>
                    </div>

                    {/* Supports et Fichiers */}
                    <div className="pt-2 border-t border-slate-200 space-y-3">
                        <span className="block text-xs font-extrabold uppercase text-slate-600 tracking-wider">Fichiers & Ressources attachées</span>
                        
                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><FileText className="w-3.5 h-3.5 mr-1 text-blue-500"/> Lien PDF (Google Drive / Direct)</label>
                            <input type="url" value={formData.digitalLink} onChange={(e) => setFormData({...formData, digitalLink: e.target.value, hasDigital: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://drive.google.com/file/d/..."/>
                        </div>

                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><Calculator className="w-3.5 h-3.5 mr-1 text-emerald-500"/> Lien Casio (Google Drive / Fichier texte)</label>
                            <input type="url" value={formData.casioLink} onChange={(e) => setFormData({...formData, casioLink: e.target.value, hasCasio: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://drive.google.com/file/d/..."/>
                        </div>

                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><VideoIcon className="w-3.5 h-3.5 mr-1 text-red-500"/> Lien Vidéo (YouTube / MP4 / Google Drive)</label>
                            <input type="url" value={formData.videoLink} onChange={(e) => setFormData({...formData, videoLink: e.target.value, hasVideo: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://www.youtube.com/watch?v=... ou .mp4"/>
                        </div>

                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><ImageIcon className="w-3.5 h-3.5 mr-1 text-amber-500"/> Lien Image (JPG / PNG / WebP / Drive)</label>
                            <input type="url" value={formData.imageLink} onChange={(e) => setFormData({...formData, imageLink: e.target.value, hasImage: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://exemple.com/schema.png ou lien Drive"/>
                        </div>

                        <div>
                            <label className="block text-xs font-bold uppercase mb-1 text-slate-700 flex items-center"><MusicIcon className="w-3.5 h-3.5 mr-1 text-purple-500"/> Lien Audio (MP3 / Podcast / Drive)</label>
                            <input type="url" value={formData.audioLink} onChange={(e) => setFormData({...formData, audioLink: e.target.value, hasAudio: !!e.target.value.trim()})} className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-red-500" placeholder="https://exemple.com/enregistrement.mp3 ou lien Drive"/>
                        </div>
                    </div>

                    <div className="flex justify-end space-x-2 pt-4 border-t"><button type="button" onClick={onClose} className="px-4 py-2 text-sm bg-slate-100 rounded-xl font-semibold">Annuler</button><button type="submit" className="px-6 py-2 text-sm font-bold text-white bg-red-600 rounded-xl shadow hover:bg-red-700 transition-all">Enregistrer</button></div>
                </form>
              </div>
            </div>
          );
        }

        function ArticleModal({ onClose, onSaveArticle, initialData }) {
          const isEditing = !!initialData;
          const [formData, setFormData] = useState({
            title: initialData ? initialData.title : '',
            content: initialData ? initialData.content : '',
            imageUrl: initialData ? initialData.imageUrl : '',
            videoUrl: initialData ? initialData.videoUrl : '',
            pinned: initialData ? !!initialData.pinned : false
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            onSaveArticle({
              id: isEditing ? initialData.id : Date.now().toString(),
              title: formData.title.trim(),
              content: formData.content.trim(),
              imageUrl: formData.imageUrl.trim(),
              videoUrl: formData.videoUrl.trim(),
              pinned: formData.pinned,
              date: isEditing ? initialData.date : new Date().toISOString()
            });
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center px-6 py-4 border-b bg-slate-50 flex-shrink-0"><h2 className="text-xl font-bold">{isEditing ? "Modifier l'article" : "Nouvel article"}</h2><button onClick={onClose} className="text-slate-400"><X className="w-5 h-5"/></button></div>
                <form onSubmit={handleSubmit} className="p-6 space-y-4 overflow-y-auto">
                    <div><label className="block text-xs font-bold uppercase mb-1">Titre de l'article</label><input type="text" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full border rounded px-3 py-2" required placeholder="Ex: Devoir commun prévu le 15..."/></div>
                    <div><label className="block text-xs font-bold uppercase mb-1">Contenu texte</label><textarea rows="4" value={formData.content} onChange={(e) => setFormData({...formData, content: e.target.value})} className="w-full border rounded px-3 py-2" required placeholder="Détails de l'annonce ou du travail à faire..."></textarea></div>
                    <div><label className="block text-xs font-bold uppercase mb-1">URL Image (optionnel - lien direct)</label><input type="url" value={formData.imageUrl} onChange={(e) => setFormData({...formData, imageUrl: e.target.value})} className="w-full border rounded px-3 py-2" placeholder="https://exemple.com/image.png"/></div>
                    <div><label className="block text-xs font-bold uppercase mb-1">URL Vidéo YouTube (optionnel)</label><input type="url" value={formData.videoUrl} onChange={(e) => setFormData({...formData, videoUrl: e.target.value})} className="w-full border rounded px-3 py-2" placeholder="https://www.youtube.com/watch?v=..."/></div>
                    <label className="flex items-center space-x-2"><input type="checkbox" checked={formData.pinned} onChange={(e) => setFormData({...formData, pinned: e.target.checked})}/><span className="text-sm font-semibold">Épingler en haut des actualités</span></label>
                    <div className="flex justify-end space-x-2 pt-4 border-t"><button type="button" onClick={onClose} className="px-4 py-2 text-sm bg-slate-100 rounded">Annuler</button><button type="submit" className="px-6 py-2 text-sm font-bold text-white bg-red-600 rounded">Publier</button></div>
                </form>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
