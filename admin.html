<body class="bg-slate-50 font-sans text-slate-800 selection:bg-red-200 selection:text-red-900">
    
    <div id="root">
        <div id="root-loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; font-family: system-ui, -apple-system, sans-serif;">
            <div style="width: 50px; height: 50px; border: 4px solid #cbd5e1; border-top-color: #ef4444; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
            <h2 id="loader-title" style="font-size: 1.5rem; font-weight: bold; color: #1e293b; margin-bottom: 10px;">Chargement du Dashboard Admin...</h2>
            <div id="loader-error" style="display: none; max-width: 550px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px 16px; border-radius: 12px; font-size: 0.85rem; margin-top: 15px; text-align: left;"></div>
        </div>
    </div>

    <script>
        window.addEventListener('error', function(e) {
            console.error("Erreur Dashboard Admin:", e);
            var errDiv = document.getElementById('loader-error');
            var title = document.getElementById('loader-title');
            if (errDiv) {
                errDiv.style.display = 'block';
                errDiv.innerHTML = '<strong>Erreur rencontrée :</strong><br>' + ((e && e.message) ? e.message : 'Erreur inconnue de script.');
            }
            if (title) title.innerText = 'Problème de chargement';
        });

        setTimeout(function() {
            var loader = document.getElementById('root-loader');
            if (loader && document.getElementById('root').contains(loader)) {
                var errDiv = document.getElementById('loader-error');
                if (errDiv) {
                    errDiv.style.display = 'block';
                    errDiv.innerHTML = '<strong>Chargement prolongé :</strong><br>Si vous ouvrez ce fichier localement (<code>file:///</code>), votre navigateur bloque peut-être les modules distants (CORS). Pour un fonctionnement optimal, ouvrez l\'application via son lien web (ex: <code>https://.../admin.html</code>) ou servez-la via un serveur web local.';
                }
            }
        }, 5000);
    </script>

        const DEFAULT_TERMS_TEXT = `Bienvenue sur WorksBox, la plateforme pour récupérer ses cours ou recevoir une version calculatrice.`;

        const COLOR_PALETTES = {
            blue: 'bg-blue-100 text-blue-700 border-blue-200',

        };

        function FileTypeBadge({ fileType, mediaType, className = "" }) {
          const type = (fileType || '').toLowerCase().replace(/^\./, '');
          if (['mp4', 'mov', 'avi', 'webm', 'mkv', 'm4v'].includes(type) || mediaType === 'video') {
            return (
              <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-red-100 text-red-700 border border-red-200 ${className}`}>
                <VideoIcon className="w-2.5 h-2.5" />
                <span>{type ? type.toUpperCase() : 'VIDÉO'}</span>
              </span>
            );
          }
          if (['mp3', 'wav', 'm4a', 'ogg', 'flac', 'aac'].includes(type) || mediaType === 'audio') {
            return (
              <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-purple-100 text-purple-700 border border-purple-200 ${className}`}>
                <MusicIcon className="w-2.5 h-2.5" />
                <span>{type ? type.toUpperCase() : 'AUDIO'}</span>
              </span>
            );
          }
          if (type === 'g1m' || type === 'g2m' || mediaType === 'casio') {
            return (
              <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-emerald-100 text-emerald-700 border border-emerald-200 ${className}`}>
                <Calculator className="w-2.5 h-2.5" />
                <span>{type ? type.toUpperCase() : 'CASIO'}</span>
              </span>
            );
          }
          if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg'].includes(type) || mediaType === 'image') {
            return (
              <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-amber-100 text-amber-800 border border-amber-200 ${className}`}>
                <ImageIcon className="w-2.5 h-2.5" />
                <span>{type ? type.toUpperCase() : 'IMAGE'}</span>
              </span>
            );
          }
          if (['ppt', 'pptx', 'odp', 'key'].includes(type) || mediaType === 'presentation') {
            return (
              <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-orange-100 text-orange-800 border border-orange-200 ${className}`}>
                <FileText className="w-2.5 h-2.5" />
                <span>{type ? type.toUpperCase() : 'PPTX'}</span>
              </span>
            );
          }
          if (['xls', 'xlsx', 'ods', 'csv'].includes(type) || mediaType === 'spreadsheet') {
            return (
              <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-emerald-100 text-emerald-800 border border-emerald-200 ${className}`}>
                <FileText className="w-2.5 h-2.5" />
                <span>{type ? type.toUpperCase() : 'XLSX'}</span>
              </span>
            );
          }
          if (type === 'txt') {
            return (
              <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-slate-100 text-slate-700 border border-slate-200 ${className}`}>
                <FileText className="w-2.5 h-2.5" />
                <span>TXT</span>
              </span>
            );
          }
          if (['docx', 'doc', 'odt', 'rtf'].includes(type)) {
            return (
              <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-sky-100 text-sky-800 border border-sky-200 ${className}`}>
                <FileText className="w-2.5 h-2.5" />
                <span>{type ? type.toUpperCase() : 'DOC'}</span>
              </span>
            );
          }
          return (
            <span className={`inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase bg-blue-100 text-blue-700 border border-blue-200 ${className}`}>
              <FileText className="w-2.5 h-2.5" />
              <span>{type ? type.toUpperCase() : 'PDF'}</span>
            </span>
          );

        const DEFAULT_SUBJECTS_BAZIN = ["Allemand", "Anglais", "Enseignement technologique en anglais", "Histoire Géographie", "Ingénierie et développement durable", "Mathématiques", "Philosophie", "Physique Chimie", "SIN"];
        const DEFAULT_SCHOOLS = ["Lycée François Bazin", "Lycée Gaspard Monge"];
        const DEFAULT_CLASSES = ["Terminale STI2D", "BTS SIO 1"];

        function App() {
          const [currentView, setCurrentView] = useState('home');
          const [selectedSubject, setSelectedSubject] = useState(null);
          
          const [courses, setCourses] = useState([]);
          const [articles, setArticles] = useState([]);
          const [settings, setSettings] = useState({
              announcement: "",
              subjectOrder: DEFAULT_SUBJECTS_BAZIN,
              tagColors: { "Cours": "blue", "TP": "purple", "Exercice": "orange", "Interro": "rose", "DS": "red" },
              schools: DEFAULT_SCHOOLS,
              classes: DEFAULT_CLASSES,
              termsContent: DEFAULT_TERMS_TEXT,
              casioGuideContent: DEFAULT_CASIO_TEXT
          });
          const [isLoading, setIsLoading] = useState(true);
          const [user, setUser] = useState(null);
          
          const [adminSchool, setAdminSchool] = useState('Lycée François Bazin');
          const [adminClass, setAdminClass] = useState('Terminale STI2D');

          const [isUploadModalOpen, setIsUploadModalOpen] = useState(false);
          const [isArticleModalOpen, setIsArticleModalOpen] = useState(false);
          const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
          const [isDriveModalOpen, setIsDriveModalOpen] = useState(false);
          const [driveImportSubject, setDriveImportSubject] = useState('');

          const [editingCourse, setEditingCourse] = useState(null); 
          const [editingArticle, setEditingArticle] = useState(null);
          const [courseToDelete, setCourseToDelete] = useState(null);
          const [articleToDelete, setArticleToDelete] = useState(null);
          const [subjectToRename, setSubjectToRename] = useState(null);
          const [subjectToDelete, setSubjectToDelete] = useState(null);

          useEffect(() => {
            const fallbackTimer = setTimeout(() => {
              setIsLoading(false);
            }, 3000);

            if (!auth) {
              setIsLoading(false);
              return () => clearTimeout(fallbackTimer);
            }

            const initAuth = async () => {
              try { 
                await signInAnonymously(auth); 
              } catch (e) { 
                console.warn("Erreur auth anonyme:", e);
                setIsLoading(false); 
              }
            };
            initAuth();
            const unsub = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (!u) setIsLoading(false);
            });
            return () => {
              clearTimeout(fallbackTimer);
              unsub();
            };
          }, []);

          useEffect(() => {
            if (!auth || !user || !db) return;
            
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    setSettings(prev => ({
                        ...prev,
                        ...data,
                        schools: Array.from(new Set([...DEFAULT_SCHOOLS, ...(data.schools || [])])),
                        classes: Array.from(new Set([...DEFAULT_CLASSES, ...(data.classes || [])]))
                    }));
                }
            }, () => {});

            const coursesRef = collection(db, 'artifacts', appId, 'public', 'data', 'courses');
            const unsubCourses = onSnapshot(coursesRef, (snapshot) => {
              const loadedCourses = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  return {
                      id: docSnap.id,
                      school: data.school || 'Lycée François Bazin',
                      classe: data.classe || 'Terminale STI2D',
                      chapterOrder: typeof data.chapterOrder === 'number' ? data.chapterOrder : -new Date(data.date).getTime(),
                      courseOrder: typeof data.courseOrder === 'number' ? data.courseOrder : -new Date(data.date).getTime(),
                      viewsDigital: data.viewsDigital || 0,
                      viewsCasio: data.viewsCasio || 0,
                      isVisible: data.isVisible !== false,
                      ...data
                  };
              });
              setCourses(loadedCourses);
              setIsLoading(false);
            }, () => setIsLoading(false));

            const articlesRef = collection(db, 'artifacts', appId, 'public', 'data', 'articles');
            const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
              const loadedArticles = snapshot.docs.map(docSnap => {
                  const data = docSnap.data();
                  return {
                      id: docSnap.id,
                      school: data.school || 'Lycée François Bazin',
                      classe: data.classe || 'Terminale STI2D',
                      ...data
                  };
              });
              setArticles(loadedArticles);
            }, () => {});

            return () => { unsubSettings(); unsubCourses(); unsubArticles(); };
          }, [user]);

          const allSchools = useMemo(() => {
              const list = new Set([...DEFAULT_SCHOOLS, ...(settings.schools || []), ...courses.map(c => c.school)]);
              return Array.from(list).filter(Boolean);
          }, [settings.schools, courses]);

          const allClasses = useMemo(() => {
              const list = new Set([...DEFAULT_CLASSES, ...(settings.classes || []), ...courses.map(c => c.classe)]);
              return Array.from(list).filter(Boolean);
          }, [settings.classes, courses]);

          const filteredCourses = useMemo(() => {
              return courses.filter(c => (c.school || 'Lycée François Bazin') === adminSchool && (c.classe || 'Terminale STI2D') === adminClass);
          }, [courses, adminSchool, adminClass]);

          const filteredArticles = useMemo(() => {
              return articles.filter(a => (a.school || 'Lycée François Bazin') === adminSchool && (a.classe || 'Terminale STI2D') === adminClass);
          }, [articles, adminSchool, adminClass]);

          const activeSubjects = useMemo(() => {
              const isBazinSTI2D = adminSchool === 'Lycée François Bazin' && adminClass === 'Terminale STI2D';
              const baseList = isBazinSTI2D ? (settings.subjectOrder || DEFAULT_SUBJECTS_BAZIN) : [];
              const subs = new Set([...baseList, ...filteredCourses.map(c => c.subject)]);
              return Array.from(subs).filter(Boolean);
          }, [filteredCourses, settings.subjectOrder, adminSchool, adminClass]);

          const sortedSubjects = useMemo(() => {
              const ordered = settings.subjectOrder || [];
              const known = ordered.filter(s => activeSubjects.includes(s));
              const unknown = activeSubjects.filter(s => !ordered.includes(s)).sort();
              return [...known, ...unknown];
          }, [activeSubjects, settings.subjectOrder]);

          const activeTags = useMemo(() => {
              const tags = new Set(["Cours", "TP", "Exercice", "Interro", "DS", "Fiche", "Formulaire", ...filteredCourses.map(c => c.tag).filter(Boolean)]);
              return Array.from(tags).sort();
          }, [filteredCourses]);

          const chaptersData = useMemo(() => {
            if (!selectedSubject) return [];
            const filtered = filteredCourses.filter(c => c.subject === selectedSubject);
            const groups = {};
            filtered.forEach(course => {
                const chap = course.chapter || "Chapitre non classé";
                if (!groups[chap]) groups[chap] = { name: chap, courses: [] };
                groups[chap].courses.push(course);
            });
            Object.values(groups).forEach(group => {
                group.chapterOrder = Math.min(...group.courses.map(c => c.chapterOrder || 0));
                group.courses.sort((a, b) => (a.courseOrder || 0) - (b.courseOrder || 0));
            });
            return Object.values(groups).sort((a, b) => a.chapterOrder - b.chapterOrder);
          }, [filteredCourses, selectedSubject]);

          const openSubject = (s) => { setSelectedSubject(s); setCurrentView('subject'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const goHome = () => { setSelectedSubject(null); setCurrentView('home'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openSchools = () => { setSelectedSubject(null); setCurrentView('schools'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openStats = () => { setSelectedSubject(null); setCurrentView('stats'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openArticles = () => { setSelectedSubject(null); setCurrentView('articles'); window.scrollTo({top: 0, behavior: 'smooth'}); };
          const openPagesEditor = () => { setSelectedSubject(null); setCurrentView('pages'); window.scrollTo({top: 0, behavior: 'smooth'}); };

          const applyBatchUpdates = async (updates) => {
            if (db && user) {
                try {
                    await Promise.all(updates.map(c => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'courses', c.id.toString()), c)));
                } catch(e) { console.error(e); }
            }
          };

          const saveSettings = async (newSettings) => {
              setSettings(newSettings);
              try {
                  localStorage.setItem('wb_admin_settings', JSON.stringify(newSettings));
              } catch(e) {}
              if (db && user) {
                  try { 
                      await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), newSettings, { merge: true }); 
                  } 
                  catch(e) { console.error("Erreur sauvegarde", e); }
              }
          };

          const handleAddSchool = async (schoolName) => {
              const trimmed = (schoolName || '').trim();
              if (!trimmed || allSchools.includes(trimmed)) return;
              const updated = [...allSchools, trimmed];
              const newSettings = { ...settings, schools: updated };
              await saveSettings(newSettings);
              setAdminSchool(trimmed);
          };

          const handleRenameSchool = async (oldName, newName) => {
              const trimmed = (newName || '').trim();
              if (!trimmed || trimmed === oldName || allSchools.includes(trimmed)) return;
              const updated = allSchools.map(s => s === oldName ? trimmed : s);
              const newSettings = { ...settings, schools: updated };
              await saveSettings(newSettings);

              const coursesToUpdate = courses.filter(c => c.school === oldName);
              if (coursesToUpdate.length > 0) {
                  await applyBatchUpdates(coursesToUpdate.map(c => ({ ...c, school: trimmed })));
              }
              const articlesToUpdate = articles.filter(a => a.school === oldName);
              if (articlesToUpdate.length > 0 && db && user) {
                  try {
                      await Promise.all(articlesToUpdate.map(a => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', a.id), { ...a, school: trimmed }, { merge: true })));
                  } catch(e) { console.error(e); }
              }
              if (adminSchool === oldName) setAdminSchool(trimmed);
          };

          const handleDeleteSchool = async (schoolName) => {
              const coursesCount = courses.filter(c => c.school === schoolName).length;
              if (coursesCount > 0) {
                  const ok = window.confirm(`Ce lycée est associé à ${coursesCount} cours. Êtes-vous sûr de vouloir le retirer de la liste des lycées ?`);
                  if (!ok) return;
              }
              const updated = allSchools.filter(s => s !== schoolName);
              if (updated.length === 0) {
                  alert("Vous devez conserver au moins un lycée.");
                  return;
              }
              const newSettings = { ...settings, schools: updated };
              await saveSettings(newSettings);
              if (adminSchool === schoolName) setAdminSchool(updated[0]);
          };

          const handleAddClass = async (className) => {
              const trimmed = (className || '').trim();
              if (!trimmed || allClasses.includes(trimmed)) return;
              const updated = [...allClasses, trimmed];
              const newSettings = { ...settings, classes: updated };
              await saveSettings(newSettings);
              setAdminClass(trimmed);
          };

          const handleRenameClass = async (oldName, newName) => {
              const trimmed = (newName || '').trim();
              if (!trimmed || trimmed === oldName || allClasses.includes(trimmed)) return;
              const updated = allClasses.map(c => c === oldName ? trimmed : c);
              const newSettings = { ...settings, classes: updated };
              await saveSettings(newSettings);

              const coursesToUpdate = courses.filter(c => c.classe === oldName);
              if (coursesToUpdate.length > 0) {
                  await applyBatchUpdates(coursesToUpdate.map(c => ({ ...c, classe: trimmed })));
              }
              const articlesToUpdate = articles.filter(a => a.classe === oldName);
              if (articlesToUpdate.length > 0 && db && user) {
                  try {
                      await Promise.all(articlesToUpdate.map(a => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', a.id), { ...a, classe: trimmed }, { merge: true })));
                  } catch(e) { console.error(e); }
              }
              if (adminClass === oldName) setAdminClass(trimmed);
          };

          const handleDeleteClass = async (className) => {
              const coursesCount = courses.filter(c => c.classe === className).length;
              if (coursesCount > 0) {
                  const ok = window.confirm(`Cette classe est associée à ${coursesCount} cours. Êtes-vous sûr de vouloir la retirer de la liste des classes ?`);
                  if (!ok) return;
              }
              const updated = allClasses.filter(c => c !== className);
              if (updated.length === 0) {
                  alert("Vous devez conserver au moins une classe.");
                  return;
              }
              const newSettings = { ...settings, classes: updated };
              await saveSettings(newSettings);
              if (adminClass === className) setAdminClass(updated[0]);
          };

          const handleSaveArticle = async (savedArticle) => {
              if (db && user) {
                  try {
                      await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', savedArticle.id), savedArticle, { merge: true });
                  } catch(e) { console.error("Erreur sauvegarde article", e); }
              }
              setIsArticleModalOpen(false);
              setEditingArticle(null);
          };

          const executeDeleteArticle = async () => {
              if (!articleToDelete) return;
              if (db && user) {
                  try {
                      await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', articleToDelete));
                  } catch(e) { console.error("Erreur suppression article", e); }
              }
              setArticleToDelete(null);
          };

          const handleSaveCourse = async (savedCourse) => {
            if (!savedCourse.school) savedCourse.school = adminSchool;
            if (!savedCourse.classe) savedCourse.classe = adminClass;

            if (!editingCourse) {
                const existingChapter = filteredCourses.find(c => c.subject === savedCourse.subject && c.chapter === savedCourse.chapter);
                if (existingChapter) savedCourse.chapterOrder = existingChapter.chapterOrder;
                else {
                    const subjectCourses = filteredCourses.filter(c => c.subject === savedCourse.subject);
                    savedCourse.chapterOrder = subjectCourses.length > 0 ? Math.max(...subjectCourses.map(c => c.chapterOrder)) + 1 : 1;
                }
                const chapterCourses = filteredCourses.filter(c => c.subject === savedCourse.subject && c.chapter === savedCourse.chapter);
                savedCourse.courseOrder = chapterCourses.length > 0 ? Math.max(...chapterCourses.map(c => c.courseOrder)) + 1 : 1;
            }
            await applyBatchUpdates([savedCourse]);
            setIsUploadModalOpen(false);
            setEditingCourse(null);
            if (currentView !== 'subject' || selectedSubject !== savedCourse.subject) openSubject(savedCourse.subject);
          };

          // Importer plusieurs cours depuis l'analyseur IA Google Drive
          const handleBatchImportDriveCourses = async (importedList) => {
              if (!Array.isArray(importedList) || importedList.length === 0) return;
              
              const fullListWithMetadata = importedList.map((c, idx) => ({
                  ...c,
                  id: c.id || `drive-ai-${Date.now()}-${idx}`,
                  school: adminSchool,
                  classe: adminClass,
                  viewsDigital: 0,
                  viewsCasio: 0,
                  isVisible: true,
                  date: new Date().toISOString()
              }));

              await applyBatchUpdates(fullListWithMetadata);

              // Met à jour la liste des matières connues si nécessaire
              const newSubjects = Array.from(new Set(importedList.map(c => c.subject).filter(Boolean)));
              const currentOrder = settings.subjectOrder || DEFAULT_SUBJECTS_BAZIN;
              const updatedOrder = [...currentOrder];
              newSubjects.forEach(s => {
                  if (!updatedOrder.includes(s)) updatedOrder.push(s);
              });
              if (updatedOrder.length > currentOrder.length) {
                  await saveSettings({ ...settings, subjectOrder: updatedOrder });
              }

              setIsDriveModalOpen(false);
              // Ouvrir la première matière importée
              if (importedList[0]?.subject) {
                  openSubject(importedList[0].subject);
              }
          };

          const executeDelete = async () => {
            if (!courseToDelete) return;
            if (db && user) {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'courses', courseToDelete.toString())); } catch(e) {}
            }
            setCourseToDelete(null);
          };

          const openAddModal = () => { setEditingCourse(null); setIsUploadModalOpen(true); };
          const openEditModal = (course) => { setEditingCourse(course); setIsUploadModalOpen(true); };
          const openAddArticleModal = () => { setEditingArticle(null); setIsArticleModalOpen(true); };

          const triggerDriveImport = (subjectHint = '') => {
              setDriveImportSubject(subjectHint || selectedSubject || '');
              setIsDriveModalOpen(true);
          };

          return (
            <div className="min-h-screen bg-slate-100 font-sans text-slate-800 pb-20">
              <nav className="bg-red-900 text-white shadow-md sticky top-0 z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center h-16">
                    <div className="flex items-center space-x-6">
                        <div className="flex items-center space-x-3 cursor-pointer group" onClick={goHome}>
                            <div className="bg-red-700 p-2 rounded-lg"><Settings className="w-6 h-6 text-red-100" /></div>
                            <span className="font-bold text-xl tracking-tight hidden sm:block">Dashboard Admin</span>
                        </div>
                        
                        <div className="hidden sm:flex space-x-2 border-l border-red-800 pl-6">
                             <button onClick={goHome} className={`px-3 py-1.5 rounded text-sm font-medium ${currentView === 'home' || currentView === 'subject' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white'}`}>Cours</button>
                             <button onClick={openSchools} className={`px-3 py-1.5 rounded text-sm font-medium ${currentView === 'schools' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white'}`}>Lycées & Classes</button>
                             <button onClick={openArticles} className={`px-3 py-1.5 rounded text-sm font-medium ${currentView === 'articles' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white'}`}>Articles</button>
                             <button onClick={openPagesEditor} className={`px-3 py-1.5 rounded text-sm font-medium ${currentView === 'pages' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white'}`}>CGU & Tuto</button>
                             <button onClick={openStats} className={`px-3 py-1.5 rounded text-sm font-medium ${currentView === 'stats' ? 'bg-red-800 text-white shadow-inner' : 'text-red-300 hover:text-white'}`}>Stats</button>
                        </div>
                    </div>
                    <div className="flex items-center space-x-3">
                      <a href="/" className="text-xs font-bold px-3 py-1.5 rounded bg-red-950/80 text-red-200 hover:text-white border border-red-800">
                          ← Retour au site
                      </a>

                      {/* Bouton Import Drive IA (Option A) */}
                      <button 
                        id="admin-btn-import-drive"
                        onClick={() => triggerDriveImport()}
                        className="flex items-center space-x-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-3.5 py-2 rounded-lg text-sm font-bold shadow-sm transition-all active:scale-95 border border-blue-400/40"
                        title="Importer intelligemment un dossier Google Drive avec l'IA"
                      >
                        <DriveIcon className="w-4 h-4" />
                        <span className="hidden md:inline">Importer Drive</span>
                        <span className="bg-amber-400 text-slate-900 text-[10px] font-black px-1.5 py-0.5 rounded flex items-center">
                            <Sparkles className="w-2.5 h-2.5 mr-0.5" /> IA
                        </span>
                      </button>

                      <button onClick={openAddModal} className="flex items-center space-x-2 bg-white text-red-900 hover:bg-red-50 px-4 py-2 rounded-lg text-sm font-bold shadow-sm active:scale-95">
                        <Plus className="w-4 h-4" /><span>Nouveau cours</span>
                      </button>
                    </div>
                  </div>
                </div>
              </nav>

              <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                {isLoading ? (
                    <div className="flex flex-col items-center justify-center py-20">
                        <div className="w-12 h-12 border-4 border-red-200 border-t-red-600 rounded-full animate-spin mb-4"></div>
                        <p className="text-slate-500 font-medium">Connexion à la base de données...</p>
                    </div>
                ) : (
                    <>
                        {/* Barre de filtrage par Lycée et Classe */}
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col sm:flex-row gap-4 items-center justify-between">
                            <div className="flex items-center space-x-2 text-slate-700 font-bold text-sm">
                                <SchoolIcon className="w-5 h-5 text-red-600"/>
                                <span>Espace géré :</span>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto flex-1 max-w-2xl">
                                <select value={adminSchool} onChange={(e) => { setAdminSchool(e.target.value); if (currentView === 'subject') goHome(); }} className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold outline-none focus:border-red-500 cursor-pointer flex-1">
                                    {allSchools.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                <select value={adminClass} onChange={(e) => { setAdminClass(e.target.value); if (currentView === 'subject') goHome(); }} className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold outline-none focus:border-red-500 cursor-pointer flex-1">
                                    {allClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <button 
                                    type="button" 
                                    onClick={openSchools}
                                    className="flex items-center justify-center space-x-1.5 px-3.5 py-2 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-xl text-xs font-bold transition-all whitespace-nowrap active:scale-95"
                                    title="Gérer ou créer des lycées et classes"
                                >
                                    <Plus className="w-3.5 h-3.5 text-red-600" />
                                    <span>Gérer Lycées & Classes</span>
                                </button>
                            </div>
                        </div>

                        {/* VUE COURS / MATIÈRES */}
                        {currentView === 'home' && (
                        <div className="space-y-6">
                            <div className="flex flex-col sm:flex-row justify-between sm:items-end gap-4 mb-8">
                                <div>
                                    <h1 className="text-3xl font-extrabold text-slate-900">Gestion des Cours</h1>
                                    <p className="text-slate-500 mt-1">Matières pour {adminSchool} ({adminClass})</p>
                                </div>
                                <button 
                                    onClick={() => triggerDriveImport()}
                                    className="flex items-center space-x-2 text-xs font-bold px-3.5 py-2.5 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 transition-all self-start sm:self-auto"
                                >
                                    <DriveIcon className="w-4 h-4" />
                                    <span>Importer un dossier Drive avec l'IA</span>
                                    <Sparkles className="w-3.5 h-3.5 text-amber-500" />
                                </button>
                            </div>

                            {sortedSubjects.length === 0 ? (
                                <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center">
                                    <Folder className="w-12 h-12 text-slate-300 mx-auto mb-3"/>
                                    <h3 className="text-lg font-bold text-slate-700 mb-1">Aucune matière enregistrée</h3>
                                    <p className="text-sm text-slate-500 mb-4">Cet établissement n'a pas encore de cours.</p>
                                    <div className="flex justify-center gap-3">
                                        <button onClick={openAddModal} className="px-4 py-2 bg-red-600 text-white rounded-xl text-sm font-bold shadow hover:bg-red-700">Ajouter manuellement</button>
                                        <button onClick={() => triggerDriveImport()} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold shadow hover:bg-blue-700 flex items-center space-x-1.5"><DriveIcon className="w-4 h-4"/><span>Importer un dossier Drive</span></button>
                                    </div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                {sortedSubjects.map((subject, index) => {
                                    const subjectCourses = filteredCourses.filter(c => c.subject === subject);
                                    const totalViews = subjectCourses.reduce((sum, c) => sum + (c.viewsDigital || 0) + (c.viewsCasio || 0), 0);
                                    
                                    return (
                                    <div key={index} className="bg-white rounded-xl p-5 shadow-sm border border-slate-200 hover:border-red-400 hover:shadow-lg hover:-translate-y-1 cursor-pointer transition-all duration-300 flex flex-col group relative" onClick={() => openSubject(subject)}>
                                        <div className="flex items-center justify-between mb-4">
                                            <div className="flex items-center space-x-3 flex-1 min-w-0 pr-2">
                                                <div className="bg-slate-100 p-2.5 rounded-lg group-hover:bg-red-100 group-hover:text-red-700 text-slate-500"><Folder className="w-6 h-6" /></div>
                                                <h3 className="font-bold text-slate-800 truncate group-hover:text-red-700">{subject}</h3>
                                            </div>
                                            <div className="flex items-center space-x-1 opacity-60 group-hover:opacity-100" onClick={e => e.stopPropagation()}>
                                                <button title="Importer des fichiers Drive dans cette matière" onClick={() => triggerDriveImport(subject)} className="p-1.5 text-blue-600 hover:bg-blue-50 rounded" ><DriveIcon className="w-4 h-4" /></button>
                                                <button title="Supprimer" onClick={() => setSubjectToDelete({ name: subject, count: subjectCourses.length })} className="p-1.5 text-slate-400 hover:text-red-600 rounded"><Trash2 className="w-4 h-4" /></button>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-center text-xs text-slate-500 border-t border-slate-100 pt-3">
                                            <span className="font-bold bg-slate-100 px-2 py-1 rounded">{subjectCourses.length} fichier{subjectCourses.length > 1 ? 's' : ''}</span>
                                            <span className="flex items-center"><BarChart className="w-3.5 h-3.5 mr-1"/> {totalViews} vues</span>
                                        </div>
                                    </div>
                                    );
                                })}
                                </div>
                            )}
                        </div>
                        )}

                        {/* VUE MATIÈRE DÉTAILLÉE */}
                        {currentView === 'subject' && (
                        <div className="space-y-6">
                            <div className="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex items-center space-x-4 flex-1 min-w-0 mr-4">
                                    <button onClick={goHome} className="p-2 bg-slate-50 rounded-lg text-slate-600 hover:bg-slate-200"><ChevronLeft className="w-5 h-5" /></button>
                                    <h1 className="text-2xl font-bold text-slate-900 truncate">{selectedSubject}</h1>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <button onClick={() => triggerDriveImport(selectedSubject)} className="flex items-center space-x-1.5 text-xs font-bold px-3 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg border border-blue-200 active:scale-95 transition-all">
                                        <DriveIcon className="w-4 h-4" />
                                        <span>Importer Drive</span>
                                        <Sparkles className="w-3 h-3 text-amber-500" />
                                    </button>
                                    <button onClick={openAddModal} className="flex items-center space-x-1 text-xs font-bold px-3 py-2 bg-red-600 text-white hover:bg-red-700 rounded-lg active:scale-95 transition-all">
                                        <Plus className="w-4 h-4" /> <span>Ajouter</span>
                                    </button>
                                </div>
                            </div>

                            {chaptersData.length === 0 ? (
                            <div className="bg-white border border-dashed border-slate-300 rounded-2xl p-12 text-center">
                                <p className="text-slate-500">Aucun cours dans cette matière pour {adminSchool} ({adminClass}).</p>
                                <div className="mt-4 flex justify-center gap-3">
                                    <button onClick={openAddModal} className="px-4 py-2 bg-red-600 text-white font-bold text-sm rounded-xl hover:bg-red-700">Ajouter manuellement</button>

                                                                    {course.videoLink && <span className="flex items-center"><VideoIcon className="w-3 h-3 mr-1 text-red-500"/> Vidéo</span>}
                                                                    {course.audioLink && <span className="flex items-center"><MusicIcon className="w-3 h-3 mr-1 text-purple-500"/> Audio</span>}
                                                                    {course.casioLink && <span className="flex items-center"><Calculator className="w-3 h-3 mr-1 text-emerald-500"/> Casio</span>}
                                                                    {course.imageLink && <span className="flex items-center"><ImageIcon className="w-3 h-3 mr-1 text-amber-500"/> Image</span>}

                                                        </div>
                                                    </li>
                                                );
                                            })}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                            )}
                        </div>
                        )}

                        {/* VUE GESTION DES LYCÉES & CLASSES */}
                        {currentView === 'schools' && (
                            <SchoolsAndClassesManager 
                                allSchools={allSchools}
                                allClasses={allClasses}
                                courses={courses}
                                adminSchool={adminSchool}
                                adminClass={adminClass}
                                onSelectSchool={(s) => setAdminSchool(s)}
                                onSelectClass={(c) => setAdminClass(c)}
                                onAddSchool={handleAddSchool}
                                onRenameSchool={handleRenameSchool}
                                onDeleteSchool={handleDeleteSchool}
                                onAddClass={handleAddClass}
                                onRenameClass={handleRenameClass}
                                onDeleteClass={handleDeleteClass}
                                onGoToCourses={goHome}
                            />
                        )}

                        {/* VUE ARTICLES */}
                        {currentView === 'articles' && (
                            <ArticlesManager 
                                articles={filteredArticles}
                                adminSchool={adminSchool}
                                adminClass={adminClass}
                                onOpenAddModal={openAddArticleModal}

                        {/* VUE PAGES (CGU & TUTO CASIO) */}
                        {currentView === 'pages' && (

                        {/* VUE STATS */}

                                allClasses={allClasses}

              </main>

              {/* Modales Admin */}
              {courseToDelete && <ConfirmModal message="Supprimer définitivement ce cours ?" onConfirm={executeDelete} onCancel={() => setCourseToDelete(null)} />}
              {articleToDelete && <ConfirmModal message="Supprimer cet article ?" onConfirm={executeDeleteArticle} onCancel={() => setArticleToDelete(null)} />}
              {isUploadModalOpen && <UploadModal onClose={() => { setIsUploadModalOpen(false); setEditingCourse(null); }} onSaveCourse={handleSaveCourse} activeSubjects={activeSubjects} activeTags={activeTags} filteredCourses={filteredCourses} initialSubject={selectedSubject} initialData={editingCourse} allSchools={allSchools} allClasses={allClasses} adminSchool={adminSchool} adminClass={adminClass} />}
              {isArticleModalOpen && <ArticleModal onClose={() => { setIsArticleModalOpen(false); setEditingArticle(null); }} onSave={handleSaveArticle} adminSchool={adminSchool} adminClass={adminClass} initialData={editingArticle} allSchools={allSchools} allClasses={allClasses} />}
              
              {/* Modale d'importation intelligente Google Drive (Option A) */}
              {isDriveModalOpen && (
                <DriveAiImportModal 
                    onClose={() => setIsDriveModalOpen(false)}
                    onImportCourses={handleBatchImportDriveCourses}
                    adminSchool={adminSchool}
                    adminClass={adminClass}
