            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#172033',
                            950: '#0b0f19'
                        }
                    }
                }
            }
        };
    </script>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('worksbox_theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>

        ];

        const DEFAULT_SAMPLE_ARTICLES = [
          {
            id: "article-1",
            title: "Bienvenue sur WorksBox — Votre plateforme de révision",
            content: "Retrouvez tous vos cours numériques et versions optimisées pour votre calculatrice Casio Graph 35+EII. Pensez à vérifier le mode examen lors de vos épreuves !",
            date: "2025-09-01T08:00:00.000Z",

          }
        ];

        function AdminApp() {
            const [activeTab, setActiveTab] = useState('courses'); // courses | import | news | schools | texts | stats
            const [courses, setCourses] = useState(() => {
                try {
                    const saved = localStorage.getItem('worksbox_courses');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch(e) {}
                return DEFAULT_SAMPLE_COURSES;
            });
            const [articles, setArticles] = useState(() => {
                try {
                    const saved = localStorage.getItem('worksbox_articles');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch(e) {}
                return DEFAULT_SAMPLE_ARTICLES;
            });
            const [settings, setSettings] = useState(() => {
                try {
                    const saved = localStorage.getItem('worksbox_settings');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return {
                            schools: parsed.schools || DEFAULT_SCHOOLS,
                            classes: parsed.classes || DEFAULT_CLASSES,
                            subjectOrder: parsed.subjectOrder || DEFAULT_SUBJECTS,
                            announcement: parsed.announcement || '',
                            termsContent: parsed.termsContent || DEFAULT_TERMS_FALLBACK,
                            casioGuideContent: parsed.casioGuideContent || DEFAULT_CASIO_FALLBACK
                        };
                    }
                } catch(e) {}
                return {
                    schools: DEFAULT_SCHOOLS,
                    classes: DEFAULT_CLASSES,
                    subjects: DEFAULT_SUBJECTS,
                    subjectOrder: DEFAULT_SUBJECTS,
                    announcement: '',
                    termsContent: DEFAULT_TERMS_FALLBACK,
                    casioGuideContent: DEFAULT_CASIO_FALLBACK
                };
            });
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));

            // Course filter & form states
            const [filterSchool, setFilterSchool] = useState('');
            const [filterClass, setFilterClass] = useState('');
            const [filterSubject, setFilterSubject] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [editingCourse, setEditingCourse] = useState(null);
            const [isCourseModalOpen, setIsCourseModalOpen] = useState(false);

            // Article form states
            const [editingArticle, setEditingArticle] = useState(null);
            const [isArticleModalOpen, setIsArticleModalOpen] = useState(false);

            // Drive AI Import states
            const [driveInput, setDriveInput] = useState('');
            const [importSchool, setImportSchool] = useState('Lycée François Bazin');
            const [importClass, setImportClass] = useState('Terminale STI2D');
            const [importSubject, setImportSubject] = useState('');
            const [isClassifying, setIsClassifying] = useState(false);
            const [classifiedResults, setClassifiedResults] = useState([]);
            const [isSavingBatch, setIsSavingBatch] = useState(false);

            const activeSubjectsList = useMemo(() => {
                if (Array.isArray(settings.subjects)) return settings.subjects;
                if (Array.isArray(settings.subjectOrder)) return settings.subjectOrder;
                return DEFAULT_SUBJECTS;
            }, [settings.subjects, settings.subjectOrder]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const toggleTheme = () => {
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('worksbox_theme', 'light');
                    setIsDark(false);
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('worksbox_theme', 'dark');
                    setIsDark(true);
                }
            };

            // Firestore real-time listeners
            useEffect(() => {
                if (!dataDb) return;

                const settingsRef = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'global');
                const unsubSettings = onSnapshot(settingsRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setSettings(prev => ({
                            ...prev,
                            ...data,
                            schools: Array.isArray(data.schools) ? data.schools : prev.schools,
                            classes: Array.isArray(data.classes) ? data.classes : prev.classes,
                            subjects: Array.isArray(data.subjects) ? data.subjects : (Array.isArray(data.subjectOrder) ? data.subjectOrder : prev.subjects),
                            subjectOrder: Array.isArray(data.subjectOrder) ? data.subjectOrder : (Array.isArray(data.subjects) ? data.subjects : prev.subjectOrder)
                        }));
                    }
                }, err => console.warn('Settings err:', err));

                const coursesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses');
                const unsubCourses = onSnapshot(coursesRef, (snapshot) => {
                    const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setCourses(list);
                    setLoading(false);
                }, err => {
                    console.warn('Courses err:', err);
                    setLoading(false);
                });

                const articlesRef = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'articles');
                const unsubArticles = onSnapshot(articlesRef, (snapshot) => {
                    const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => new Date(b.date) - new Date(a.date));
                    setArticles(list);
                }, err => console.warn('Articles err:', err));

                return () => {
                    unsubSettings();
                    unsubCourses();
                    unsubArticles();
                };
            }, []);

            // Course deletion
            const handleDeleteCourse = async (id, title) => {
                if (!confirm(`Supprimer définitivement le cours « ${title} » ?`)) return;
                try {
                    await deleteDoc(doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', id));
                    showToast('Cours supprimé avec succès !');
                } catch (e) {
                    showToast('Erreur suppression : ' + e.message, 'error');
                }
            };

            // Toggle visibility
            const handleToggleVisibility = async (course) => {
                try {
                    const newVis = course.isVisible === false ? true : false;
                    await updateDoc(doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', course.id), {
                        isVisible: newVis
                    });
                    showToast(newVis ? 'Cours rendu visible' : 'Cours masqué aux élèves');
                } catch (e) {
                    showToast('Erreur mise à jour : ' + e.message, 'error');
                }
            };

            // Save course (Add or Edit)
            const handleSaveCourse = async (courseData) => {
                try {
                    const cleanData = {
                        title: (courseData.title || '').trim(),
                        subject: courseData.subject || 'Mathématiques',
                        chapter: (courseData.chapter || '').trim() || 'Chapitre 1',
                        chapterOrder: Number(courseData.chapterOrder) || 1,
                        courseOrder: Number(courseData.courseOrder) || 1,
                        school: courseData.school || 'Lycée François Bazin',
                        classe: courseData.classe || 'Terminale STI2D',
                        tag: courseData.tag || 'Cours',
                        digitalLink: (courseData.digitalLink || '').trim(),
                        casioLink: (courseData.casioLink || '').trim(),
                        videoLink: (courseData.videoLink || '').trim(),
                        audioLink: (courseData.audioLink || '').trim(),
                        imageLink: (courseData.imageLink || '').trim(),
                        fileType: courseData.fileType || 'pdf',
                        mediaType: courseData.mediaType || 'document',
                        isVisible: courseData.isVisible !== false,
                        viewsDigital: courseData.viewsDigital || 0,
                        viewsCasio: courseData.viewsCasio || 0,
                        updatedAt: new Date().toISOString()
                    };

                    if (editingCourse && editingCourse.id) {
                        await updateDoc(doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', editingCourse.id), cleanData);
                        showToast('Cours mis à jour !');
                    } else {
                        cleanData.createdAt = new Date().toISOString();
                        await addDoc(collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses'), cleanData);
                        showToast('Nouveau cours ajouté !');
                    }
                    setIsCourseModalOpen(false);
                    setEditingCourse(null);
                } catch (e) {
                    showToast('Erreur enregistrement : ' + e.message, 'error');
                }
            };

            // Article Save & Delete
            const handleDeleteArticle = async (id, title) => {
                if (!confirm(`Supprimer l'article « ${title} » ?`)) return;
                try {
                    await deleteDoc(doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'articles', id));
                    showToast('Article supprimé !');
                } catch (e) {
                    showToast('Erreur : ' + e.message, 'error');
                }
            };

            const handleSaveArticle = async (articleData) => {
                try {
                    const cleanData = {
                        title: (articleData.title || '').trim(),
                        content: (articleData.content || '').trim(),
                        date: articleData.date || new Date().toISOString().split('T')[0],
                        school: articleData.school || 'Lycée François Bazin',
                        classe: articleData.classe || 'Terminale STI2D',
                        imageUrl: (articleData.imageUrl || '').trim(),
                        videoUrl: (articleData.videoUrl || '').trim(),
                        pinned: !!articleData.pinned
                    };

                    if (editingArticle && editingArticle.id) {
                        await updateDoc(doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'articles', editingArticle.id), cleanData);
                        showToast('Article mis à jour !');
                    } else {
                        await addDoc(collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'articles'), cleanData);
                        showToast('Nouvel article publié !');
                    }
                    setIsArticleModalOpen(false);
                    setEditingArticle(null);
                } catch (e) {
                    showToast('Erreur : ' + e.message, 'error');
                }
            };

            // Update Global Settings (schools, classes, subjects, banner, texts)
            const handleUpdateSettings = async (keyOrObj, maybeVal) => {
                try {
                    const updates = typeof keyOrObj === 'string' ? { [keyOrObj]: maybeVal } : keyOrObj;
                    setSettings(prev => ({ ...prev, ...updates }));
                    try {
                        const savedLocal = JSON.parse(localStorage.getItem('worksbox_settings') || '{}');
                        Object.assign(savedLocal, updates);
                        localStorage.setItem('worksbox_settings', JSON.stringify(savedLocal));
                    } catch(e) {}

                    if (dataDb) {
                        const ref = doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'settings', 'global');
                        await setDoc(ref, updates, { merge: true });
                    }
                    showToast('Paramètres mis à jour !');
                } catch (e) {
                    showToast('Erreur : ' + e.message, 'error');
                }
            };

            // Subjects Management Handlers
            const handleAddSubject = async (rawName) => {
                const cleanName = (rawName || '').trim();
                if (!cleanName) return;
                if (activeSubjectsList.some(s => s.toLowerCase() === cleanName.toLowerCase())) {
                    showToast(`La matière « ${cleanName} » existe déjà !`, 'warning');
                    return;
                }
                const updated = [...activeSubjectsList, cleanName];
                await handleUpdateSettings({
                    subjects: updated,
                    subjectOrder: updated
                });
                showToast(`Matière « ${cleanName} » ajoutée avec succès !`);
            };

            const handleDeleteSubject = async (subjectToDelete) => {
                const attachedCourses = courses.filter(c => c.subject === subjectToDelete);
                if (attachedCourses.length > 0) {
                    const confirmDeleteAll = confirm(
                        `⚠️ Attention : La matière « ${subjectToDelete} » contient actuellement ${attachedCourses.length} cours rattaché(s).\n\n` +
                        `Si vous confirmez, la matière sera retirée et ces ${attachedCourses.length} cours associés seront DÉFINITIVEMENT SUPPRIMÉS de la plateforme.\n\n` +
                        `Voulez-vous vraiment continuer ?`
                    );
                    if (!confirmDeleteAll) return;

                    // Delete associated courses from Firestore
                    try {
                        for (const c of attachedCourses) {
                            if (dataDb) {
                                await deleteDoc(doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', c.id));
                            }
                        }
                    } catch (e) {
                        console.error('Erreur suppression cours associés :', e);
                        showToast('Erreur lors de la suppression des cours rattachés : ' + e.message, 'error');
                        return;
                    }
                } else {
                    if (!confirm(`Supprimer définitivement la matière « ${subjectToDelete} » ?`)) return;
                }

                const updated = activeSubjectsList.filter(s => s !== subjectToDelete);
                await handleUpdateSettings({
                    subjects: updated,
                    subjectOrder: updated
                });
                showToast(`Matière « ${subjectToDelete} » supprimée avec succès !`);
            };

            const handleRenameSubject = async (oldName) => {
                const newName = prompt(`Renommer la matière « ${oldName} » en :`, oldName);
                if (!newName || !newName.trim() || newName.trim() === oldName) return;
                const cleanNewName = newName.trim();

                if (activeSubjectsList.some(s => s.toLowerCase() === cleanNewName.toLowerCase() && s.toLowerCase() !== oldName.toLowerCase())) {
                    showToast(`La matière « ${cleanNewName} » existe déjà !`, 'warning');
                    return;
                }

                const updated = activeSubjectsList.map(s => s === oldName ? cleanNewName : s);
                await handleUpdateSettings({
                    subjects: updated,
                    subjectOrder: updated
                });

                // Rename in attached courses
                const attachedCourses = courses.filter(c => c.subject === oldName);
                if (attachedCourses.length > 0) {
                    try {
                        for (const c of attachedCourses) {
                            if (dataDb) {
                                await updateDoc(doc(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses', c.id), {
                                    subject: cleanNewName
                                });
                            }
                        }
                        showToast(`Matière renommée et ${attachedCourses.length} cours mis à jour !`);
                    } catch(e) {
                        showToast(`Matière renommée, mais erreur sur les cours : ${e.message}`, 'warning');
                    }
                } else {
                    showToast(`Matière renommée en « ${cleanNewName} » !`);
                }

            const handleMoveSubject = async (index, direction) => {
                const current = [...activeSubjectsList];
                const target = index + direction;
                if (target < 0 || target >= current.length) return;
                const temp = current[index];
                current[index] = current[target];
                current[target] = temp;
                await handleUpdateSettings({
                    subjects: current,
                    subjectOrder: current
                });
            };

            // AI Drive Import with /api/drive/classify
            const handleClassifyDrive = async () => {
                if (!driveInput.trim()) {
                    showToast('Veuillez coller un lien Google Drive ou une liste de fichiers.', 'error');
                    return;
                }
                setIsClassifying(true);
                try {
                    const res = await fetch('/api/drive/classify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            driveUrl: driveInput,
                            rawText: driveInput,
                            targetSchool: importSchool,
                            targetClass: importClass,
                            targetSubject: importSubject
                        })
                    });
                    const data = await res.json();
                    if (data.success && Array.isArray(data.courses)) {
                        setClassifiedResults(data.courses);
                        showToast(`${data.courses.length} cours analysés avec succès (${data.source || 'IA'}) !`);
                    } else {
                        throw new Error(data.error || 'Aucun cours détecté');
                    }
                } catch (err) {
                    showToast('Erreur classification : ' + err.message, 'error');
                } finally {
                    setIsClassifying(false);
                }
            };

            // Bulk Save AI Classified Courses
            const handleBulkSaveCourses = async () => {
                if (classifiedResults.length === 0) return;
                setIsSavingBatch(true);
                try {
                    const col = collection(dataDb, 'artifacts', lyceeShareAppId, 'public', 'data', 'courses');
                    let count = 0;
                    for (const item of classifiedResults) {
                        const { id, ...cleanItem } = item;
                        await addDoc(col, {
                            ...cleanItem,
                            school: importSchool,
                            classe: importClass,
                            isVisible: true,
                            viewsDigital: 0,
                            viewsCasio: 0,
                            createdAt: new Date().toISOString()
                        });
                        count++;
                    }
                    showToast(`${count} cours importés avec succès dans la base de données !`);
                    setClassifiedResults([]);
                    setDriveInput('');
                    setActiveTab('courses');
                } catch (err) {
                    showToast('Erreur enregistrement par lot : ' + err.message, 'error');
                } finally {
                    setIsSavingBatch(false);
                }
            };

            // Filtered courses for management table
            const filteredCourses = useMemo(() => {
                return courses.filter(c => {
                    const matchesSchool = !filterSchool || c.school === filterSchool;
                    const matchesClass = !filterClass || c.classe === filterClass;
                    const matchesSubject = !filterSubject || c.subject === filterSubject;
                    const matchesSearch = !searchQuery || (
                        (c.title || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (c.chapter || '').toLowerCase().includes(searchQuery.toLowerCase())
                    );
                    return matchesSchool && matchesClass && matchesSubject && matchesSearch;
                });
            }, [courses, filterSchool, filterClass, filterSubject, searchQuery]);

            const totalStats = useMemo(() => {
                const totalDigitalViews = courses.reduce((acc, c) => acc + (c.viewsDigital || 0), 0);
                const totalCasioViews = courses.reduce((acc, c) => acc + (c.viewsCasio || 0), 0);
                const uniqueSubjects = new Set(courses.map(c => c.subject)).size;
                return {

                    totalDigitalViews,
                    totalCasioViews,

                                    <span>← Retour au site</span>
                                </a>
                            </div>

                                                                        <div className="font-medium text-slate-500">{course.classe}</div>
                                                                    </td>
                                                                    <td className="px-4 py-3 whitespace-nowrap text-xs text-slate-500">
                                                                        <div>📄 {course.viewsDigital || 0}</div>
                                                                        <div>📟 {course.viewsCasio || 0}</div>
                                                                    </td>
                                                                    <td className="px-4 py-3 whitespace-nowrap text-right space-x-2">

                                                                            onClick={() => { setEditingCourse(course); setIsCourseModalOpen(true); }}
                                                                            className="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors"
                                                                        >
                                                                            Modifier
                                                                        </button>
                                                                        <button

                                                                        >
                                                                            Suppr.
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            ))
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'import' && (
                                    <div className="space-y-8 max-w-4xl mx-auto">
                                        <div className="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-3xl p-6 sm:p-8 text-white shadow-xl">
                                            <div className="inline-flex items-center space-x-2 bg-white/20 px-3 py-1 rounded-full text-xs font-bold mb-3">
                                                <span>✨ Moteur d'Import Automatisé avec Gemini</span>

                                                defaultValue={editingCourse?.chapter || 'Chapitre 1'}
                                                placeholder="Ex: Chapitre 1 : Continuité et Dérivation"
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Numéro Chapitre</label>
                                            <input
                                                name="chapterOrder"
                                                type="number"
                                                defaultValue={editingCourse?.chapterOrder || 1}
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Lycée *</label>
                                            <select
                                                name="school"
                                                defaultValue={editingCourse?.school || settings.schools[0]}
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                            >
                                                {settings.schools?.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Classe *</label>
                                            <select
                                                name="classe"
                                                defaultValue={editingCourse?.classe || settings.classes[0]}
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                            >
                                                {settings.classes?.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Lien Numérique (Drive / PDF / Document)</label>
                                        <input
                                            name="digitalLink"
                                            defaultValue={editingCourse?.digitalLink || ''}
                                            placeholder="https://drive.google.com/file/d/.../view"
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Lien Calculatrice Casio (.txt / .g1m)</label>
                                        <input
                                            name="casioLink"
                                            defaultValue={editingCourse?.casioLink || ''}
                                            placeholder="https://drive.google.com/file/d/.../view"
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                        />
                                    </div>

                                    <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                                        <button
                                            type="button"
                                            onClick={() => setIsCourseModalOpen(false)}
                                            className="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-100 dark:hover:bg-slate-800"
                                        >
                                            Annuler
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold shadow-md"
                                        >
                                            Enregistrer
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add/Edit Article */}
                    {isArticleModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-xl w-full p-6 border border-slate-200 dark:border-slate-800">
                                <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4">
                                    {editingArticle ? 'Modifier l\'actualité' : 'Publier une actualité'}
                                </h3>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    handleSaveArticle(Object.fromEntries(fd.entries()));
                                }} className="space-y-4 text-sm">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Titre de l'annonce *</label>
                                        <input
                                            name="title"
                                            required
                                            defaultValue={editingArticle?.title || ''}
                                            placeholder="Ex: Fiches de révision pour le bac blanc disponibles !"
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Contenu de l'article *</label>
                                        <textarea
                                            name="content"
                                            required
                                            rows="4"
                                            defaultValue={editingArticle?.content || ''}
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-slate-800 dark:text-slate-100"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Lycée</label>
                                            <select
                                                name="school"
                                                defaultValue={editingArticle?.school || settings.schools[0]}
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                            >
                                                {settings.schools?.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Classe</label>
                                            <select
                                                name="classe"
                                                defaultValue={editingArticle?.classe || settings.classes[0]}
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                            >
                                                {settings.classes?.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Lien Image d'illustration (optionnel)</label>
                                        <input
                                            name="imageUrl"
                                            defaultValue={editingArticle?.imageUrl || ''}
                                            placeholder="https://images.unsplash.com/..."
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Lien Vidéo YouTube (optionnel)</label>
                                        <input
                                            name="videoUrl"
                                            defaultValue={editingArticle?.videoUrl || ''}
                                            placeholder="https://www.youtube.com/watch?v=..."
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100"
                                        />
                                    </div>

                                    <div className="flex items-center space-x-2 pt-1">
                                        <input
                                            type="checkbox"
                                            id="pinned-checkbox"
                                            name="pinned"
                                            value="true"
                                            defaultChecked={!!editingArticle?.pinned}
                                            className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4"
                                        />
                                        <label htmlFor="pinned-checkbox" className="text-xs font-bold text-slate-700 dark:text-slate-300">
                                            Épingler cette annonce en haut de la page d'accueil
                                        </label>
                                    </div>

                                    <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                                        <button
                                            type="button"
                                            onClick={() => setIsArticleModalOpen(false)}
                                            className="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-100 dark:hover:bg-slate-800"
                                        >
                                            Annuler
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold shadow-md"
                                        >
                                            Publier
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
