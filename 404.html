<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorksBox — Redirection</title>
    <script>
        (function() {
            // Intelligent GitHub Pages / SPA Redirection Handler
            var path = window.location.pathname || '';
            var search = window.location.search || '';
            var hash = window.location.hash || '';

            if (path.indexOf('admin') !== -1) {
                // Route to admin.html in the same directory/repository level
                window.location.replace('admin.html' + search + hash);
            } else {
                // Route to index.html in the same directory/repository level
                window.location.replace('index.html' + search + hash);
            }
        })();
    </script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #60a5fa;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <p style="font-weight: 600; font-size: 0.95rem;">Chargement en cours...</p>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.5rem;">
            Si la redirection automatique ne s'effectue pas, <a href="index.html">cliquez ici pour ouvrir WorksBox</a> ou <a href="admin.html">l'Administration</a>.
        </p>
    </div>
</body>
</html>
